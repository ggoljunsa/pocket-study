 지각이 <strong>상향 처리</strong> 중심(<strong>직접 경로 모형</strong>: 통증 수용 정보가 대뇌로 직접 전달, 더 다치면 더 아파야 함)으로 설명되었으나 부상병 결과로 반박되었다.</li>\n<li><strong>가상현실 게임</strong>으로 주의를 분산하면 <strong>화상 환자</strong>의 통증 지각 감소(Hoffman et al., 2008).</li>\n<li>교수 예시: 모기 물린 걸 알아채는 순간 가려움이 시작됨, 예방접종 때 &quot;따끔해요&quot; 하며 시선을 돌리라는 이유는 주의가 쏠리면 더 아프기 때문.</li>\n</ul>\n<h2>p.14 — 맥락의 영향력 ① 문장 맥락 ⭐⭐</h2>\n<ul>\n<li>상황·문화에 따라 형성된 맥락이 지각에 영향. 문장 맥락에 따라 같은 소리가 다른 단어로 지각: &quot;eel is on the wagon&quot; → <strong>wheel</strong>, &quot;eel is on the orange&quot; → <strong>peel</strong> (Grossberg, 1995).</li>\n<li><strong>음소 복원 효과(phonemic restoration)</strong>: 문장 일부 소리를 물리적으로 누락해도 맥락에 근거해 사라진 소리를 복원해 들음.</li>\n<li>교수 추가 예시: 배구 선수 얼굴 표정 — 얼굴만 보면 모호하지만 시상식(우승 축하) 전체 장면 맥락을 보면 정서가 분명해짐.</li>\n</ul>\n<h2>p.15 — 맥락의 영향력 ② 문화 ⭐⭐</h2>\n<ul>\n<li>같은 그림에 대한 해석이 문화에 따라 다름(Gregory &amp; Gombrich, 1973): <strong>동아프리카</strong> — 여성이 금속 상자를 머리에 이고 있다 / <strong>서구권</strong> — 여성이 창문 밑에 앉아 있다.</li>\n<li>이유: 아프리카에서는 물건을 머리에 이고 다니는 경험이 흔하고 서구는 드묾.</li>\n<li>교수 보충: <strong>장면 도식(scene schema)</strong> — 특정 장면에 있어야 할 일반 지식. 강의실에 에어프라이어가 있으면 이상하게 느껴지고 시선이 몰림 → **아이트래킹(안구 추적)**으로 검증. 맥락은 세대·문화에 따라 가변적. (장면 도식은 슬라이드에 없고 수업에서만 언급)</li>\n</ul>\n<h2>p.16 — 동기의 영향력 ⭐⭐</h2>\n<ul>\n<li>과업 목표나 결핍으로 생기는 <strong>추동</strong>이 지각을 편향시킴(중립 자극 해석의 편향).</li>\n<li><strong>갈증</strong> 상태에서 물병이 더 가깝게 지각(Balcetis &amp; Dunning, 2010). <strong>무거운 배낭</strong>을 지거나 <strong>피곤할</strong> 때 지각된 거리가 더 멀게 느껴짐(Burrow et al., 2016).</li>\n<li>교수 예시: DGIST 정문에서 내려갈 때(후련) vs 올라올 때(피곤)의 거리감, 중간고사 분량이 막막하게 느껴지는 것(내적 동기 상태에 따라 지각된 양이 달라짐).</li>\n</ul>\n<h2>p.17 — 정서의 영향력 ⭐⭐</h2>\n<ul>\n<li>정서에 따라 같은 자극이 다르게 지각. <strong>슬픈 음악</strong>을 들으면 발음이 비슷한 단어를 더 부정적으로 지각 — Mourning vs Morning, Dye vs Die, Pane vs Pain (Halberstadt et al., 1995).</li>\n<li><strong>신나는 음악</strong>은 행복한 단어의 재인을 촉진(Tay &amp; Ng, 2019).</li>\n</ul>\n<h2>p.18–19 — 풍경 속 얼굴 찾기 (정답 13개) ⭐⭐</h2>\n<ul>\n<li>풍경 사진에서 <strong>얼굴처럼 보이는 자극</strong>을 찾게 하는 시연. 정답은 <strong>13개</strong>.</li>\n<li>교수: 처음에 &quot;얼굴처럼 보이는 자극을 찾아라&quot;라고 한 <strong>안내 하나가 기대치를 만들어 하향 처리</strong>가 작동한다. 처음엔 못 봤던 얼굴도 주의를 다시 기울이면 얼굴로 조직화되어 보인다. 교수 본인은 9<del>10개밖에 못 찾았고(나머지 3개는 여전히 못 찾음), 오전 인지심리학 수강생들도 다 못 찾았다고 한다. <strong>→ 하향 처리가 강력하게 영향을 미침.</strong> (9/22 55:08</del>58:49)</li>\n</ul>\n<h2>p.20 — 시각: 빛 에너지의 수용과 지각 ⭐⭐</h2>\n<ul>\n<li>물체가 반사한 빛을 시신경이 수용. <strong>파장</strong>이 색상, <strong>진폭</strong>이 강도(밝기)를 결정.</li>\n<li><strong>장파장(=저주파) → 붉은색</strong>, <strong>단파장(=고주파) → 푸른색</strong>. 진폭 크다 = 밝다, 작다 = 어둡다. 사람이 볼 수 있는 <strong>가시광선 대역</strong>은 매우 좁다.</li>\n</ul>\n<h2>p.21 — 눈의 주요 기관 ① ⭐⭐⭐</h2>\n<ul>\n<li><strong>동공</strong>: 빛이 통과하는 구멍. <strong>홍채</strong>: 동공의 크기를 조절(밝은 곳=수축, 어두운 곳=확장). 홍채는 밝고 어두운 공간을 <strong>상상</strong>하는 것만으로도 조절됨(Laeng &amp; Sulutvedt, 2014).</li>\n<li><strong>망막</strong>: 반사된 빛이 상을 형성하는 곳, 광수용기인 <strong>간상체와 원추체</strong>로 구성. <strong>중심와(fovea)</strong>: 상이 가장 선명하게 맺히는 곳(원추체 밀집). <strong>맹점</strong>: 시신경이 나가는 곳이라 상이 맺히지 않음.</li>\n<li>망막에 맺힌 상은 <strong>뒤집힌</strong> 형태(촛불 예시) → 대뇌가 재해석해 올바른 형태로 지각.</li>\n</ul>\n<h2>p.22 — 눈의 주요 기관 ② ⭐⭐</h2>\n<ul>\n<li><strong>수정체</strong>: 빛의 굴절 정도를 조절해 망막에 상이 맺히게 하는 렌즈. 굴절 수준에 따라 <strong>원시/근시</strong> 결정.</li>\n<li><strong>원시</strong>: 굴절력이 약함 → 상이 <strong>망막 뒤</strong>에 맺힘(볼록렌즈 돋보기). <strong>근시</strong>: 굴절력이 강함 → 상이 <strong>망막 앞</strong>에 맺힘(오목렌즈).</li>\n<li><strong>시신경</strong>: 망막의 빛 에너지(광수용기가 변환한 신경 신호)를 대뇌로 전달.</li>\n</ul>\n<h2>p.23 — 눈–두뇌 신경통로 ⭐⭐⭐</h2>\n<ul>\n<li><strong>원추체(cone)</strong>: <strong>색상</strong> 감지, 세부사항 탐지. 망막 <strong>중심</strong> 영역, <strong>낮</strong>에 활동. 두뇌로 이어지는 <strong>핫라인</strong>(개별 뉴런 단위 신호 전달) 존재.</li>\n<li><strong>간상체(rod)</strong>: <strong>밝기(명암)</strong> 감지. 망막 <strong>주변</strong> 영역, <strong>석양 무렵</strong>(어두울 때) 활동. 핫라인 없음(여러 뉴런의 신호를 합산해 전달). <strong>암순응</strong>과 연관(어두운 곳에 들어가면 처음엔 안 보이다가 형체가 식별되는 현상).</li>\n<li><strong>양극세포(bipolar cell)</strong>: 원추체·간상체에서 받은 신호를 시신경(신경절세포)으로 전달. 흐름: 간상체+원추체 → 양극세포 → 신경절세포 → 시신경.</li>\n</ul>\n<h2>p.24 — 원추체와 간상체 비교 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>원추체</th>\n<th>간상체</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>개체 수</td>\n<td>600만 개</td>\n<td>1억 2천만 개</td>\n</tr>\n<tr>\n<td>망막 위치</td>\n<td>중앙</td>\n<td>주변</td>\n</tr>\n<tr>\n<td>약한 빛 민감도</td>\n<td>낮다</td>\n<td>높다</td>\n</tr>\n<tr>\n<td>색채 민감도</td>\n<td>높다</td>\n<td>낮다</td>\n</tr>\n<tr>\n<td>세부사항 민감도</td>\n<td>높다</td>\n<td>낮다</td>\n</tr>\n</tbody></table>\n<h2>p.25 — 분할 시야와 좌우반구 ⭐</h2>\n<ul>\n<li>대뇌는 좌·우반구로 나뉘고 <strong>뇌량</strong>으로 연결. <strong>좌시야의 정보는 우반구로, 우시야의 정보는 좌반구로</strong> 전달된다(슬라이드 본문에 &quot;우시야→우반구&quot;라고 오타가 있으나 좌반구가 맞음). 뇌량이 끊기면 시야 간 의사소통이 원활하지 않다. 시각 정보는 <strong>후두엽의 시각 피질</strong>에서 처리.</li>\n<li>교수는 저번(3장) 분할뇌 실험을 다시 상기: 우시야(좌반구)에 제시된 단어는 말로 보고 가능, 좌시야(우반구)는 말로는 못 하고 손가락으로 가리켜 보고 → 언어 기능 편재화 때문.</li>\n</ul>\n<h2>p.26 — 자질 탐지(Feature Detection) ⭐⭐⭐</h2>\n<ul>\n<li><strong>자질 탐지기</strong>: 물리적 특성(각도, 움직임 등)에 반응하는 두뇌의 각 신경세포. 자질 탐지기의 발화 패턴을 종합해 지각을 수행. 상위 세포 군집일수록 복잡한 패턴에 반응. (고양이 시각 피질 뉴런에 전극을 꽂아 특정 기울기·방향에만 반응하는 것을 보인 결과)</li>\n<li><strong>방추상 얼굴 영역(Fusiform Face Area, FFA)</strong>: <strong>얼굴 자극의 재인</strong> 담당. 손상 시 <strong>얼굴실인증</strong>. FFA에 **경두개 자기장 자극술(TMS)**을 적용하면 얼굴 재인 능력 저하.</li>\n<li><strong>해마곁 장소 영역(parahippocampal place area, PPA)</strong>: 장소·공간 지각. FFA는 얼굴에, PPA는 장소 이미지에 강하게 반응하며, 얼굴과 장소 사진을 겹쳐 보여줄 때 <strong>주의</strong>를 기울인 쪽 영역이 활성화된다.</li>\n</ul>\n<h2>p.27 — 병렬 처리(Parallel processing) ⭐⭐⭐</h2>\n<ul>\n<li><strong>병렬 처리</strong>: 여러 작업을 <strong>동시에</strong> 수행. 시각 장면 분석 시 움직임·형태·깊이·색 등 하위 차원을 동시에 처리하고 각 영역의 결과를 통합해 지각한다. 교수: &quot;뇌 영역 차원에서 보면 <strong>조별 과제</strong>&quot; — 한 영역이 손상되면 해당 속성은 지각할 수 없음.</li>\n<li><strong>분산 표상(distributed representation)</strong>: 복합적 지각은 하나의 영역이 아니라 여러 뇌 영역의 합작이라는 개념(기능 국재화와 연결).</li>\n<li>지각 발생 과정(노트): 망막 처리(간상체+원추체 → 양극세포 → 신경절세포) → 자질 탐지 → 병렬 처리 → 재인.</li>\n</ul>\n<h2>p.28 — 게슈탈트 심리학(Gestalt Psychology) ⭐⭐⭐</h2>\n<ul>\n<li>구조주의의 영향을 일부 받았으나 결정적으로 다르다. <strong>구조주의</strong>(분트): 마음의 원자를 통합하면 곧 전체. <strong>게슈탈트</strong>: <strong>전체는 단순한 부분의 총합 그 이상</strong> — 입력을 그대로 표상하는 것이 아니라 그 이상의 해석을 가미해 지각을 구성.</li>\n<li>예시: <strong>네커 육면체(Necker cube)</strong> — 물리적으로는 선 몇 개뿐인데 정육면체를 지각. <strong>선택적 주의</strong>에 따라 해석은 한 번에 하나만 가능(Bradley et al., 1976).</li>\n<li>게슈탈트 = 독일어로 &quot;모양, 전체&quot;.</li>\n</ul>\n<h2>p.29 — 전경–배경 구분(Figure-Ground) ⭐⭐⭐</h2>\n<ul>\n<li>지각의 <strong>1차 과제</strong>는 대상(<strong>전경</strong>)을 배경으로부터 분리하는 것. 전경-배경 관계는 <strong>가역적</strong>이며 주의를 어디에 두느냐에 따라 바뀐다(예: 하얀 잔 vs 마주 보는 두 얼굴).</li>\n<li>청각에서도 적용: 배경음(소음) 속에서 상대의 말소리를 구분 — <strong>칵테일 파티 효과</strong>(교수가 앞서 소개).</li>\n</ul>\n<h2>p.30 — 집단화(Grouping)의 세 원리 ⭐⭐⭐</h2>\n<ul>\n<li><strong>집단화</strong>: 배경에서 분리된 전경을 의미 있는 형태로 조직화. 색깔·움직임 같은 기본 요소는 즉각적·자동적으로 처리(Treisman, 1987)되고, 이 기본 감각에 질서와 형태를 부여하는 것이 집단화.</li>\n<li><strong>근접성(proximity)</strong>: 가까이 있는 사물을 묶어서 지각(6개의 선 → 3쌍).</li>\n<li><strong>연속성(continuity)</strong>: 부드럽게 연속된 패턴을 하나로 지각(직선+곡선, 올림픽 오륜기를 다섯 개의 원으로 봄).</li>\n<li><strong>폐쇄(closure)</strong>: 끊어진 부분을 메워 완전한 형태로 지각(C 모양 3개 → 흰 삼각형이 원을 가림).</li>\n<li>집단화 원리는 <strong>유아도 사용</strong>(Gallace &amp; Spence, 2011). 게슈탈트 원리는 <strong>내재된·타고난 것</strong>(Wertheimer, 1912).</li>\n<li>⭐⭐⭐ 교수가 &quot;많이 헷갈리는 부분&quot;이라고 길게 설명: <strong>게슈탈트 이론은 하향이 아니라 상향 처리를 더 강조하는 입장</strong>이다. 집단화 원리가 경험에 의해 형성되는 것이 아니라 타고난 것이고, 하위(부분) → 전체로 진행되기 때문(현대 심리학자들은 경험의 영향을 주장하기도 함).</li>\n</ul>\n<h2>p.31 — 집단화 사진 (이상한 사진 찾기) ⭐</h2>\n<ul>\n<li>겉보기엔 자연스러운 사진인데 기둥이 가려져야 할 곳에서 안 가려지는 등 부자연스러운 점이 많다. 처음에 이상함을 못 느끼는 이유는 **집단화·조직화 과정이 자동으로 &quot;보정&quot;**을 하기 때문. 지각은 주관적 요소가 많이 개입한다는 점과 연결.</li>\n</ul>\n<h2>p.32 — 3차원 정보의 지각, 역투사 문제 ⭐⭐⭐</h2>\n<ul>\n<li>망막에 맺힌 상은 <strong>2차원</strong>. 3차원 물체가 망막에 투영되는 <strong>투사</strong> 과정에서 정보가 2차원으로 축소되고, 이를 다시 3차원으로 추론하는 것을 <strong>역투사</strong>라 한다.</li>\n<li><strong>역투사의 문제(inverse projection problem)</strong>: 하나의 2차원 상을 만들 수 있는 근원 물체가 여러 가지일 수 있음(삼각형 그림자 → 삼각기둥, 원뿔, 삼각뿔 모두 가능). 시각 자극은 본질적으로 <strong>모호</strong>하고, 컴퓨터 인식 시스템이 오류가 잦은 이유이기도 하다.</li>\n</ul>\n<h2>p.33 — 깊이 지각(Depth perception)과 시각 절벽 ⭐⭐⭐</h2>\n<ul>\n<li>깊이 지각은 <strong>선천적</strong>인 경향이 있다. <strong>시각 절벽(visual cliff)</strong> 실험(<strong>깁슨 &amp; 워크, 1960</strong>): 기어 다니기 시작한 <strong>6~14개월</strong> 유아가 유리로 덮인 낭떠러지를 건너려 하지 않음(엄마가 불러도 안 옴).</li>\n<li>시기와 무관하게 기어 다니기 시작한 유아는 높이를 조심(Adolph et al., 2014). 대부분의 동물 새끼도 시각 절벽을 건너려 하지 않음 → <strong>생존과 관련된 기제</strong>. (피아제 <strong>감각운동기</strong>와 연결)</li>\n<li>교수: 미성년(영아) 대상 실험이라 연구 승인이 매우 어려웠을 것.</li>\n</ul>\n<h2>p.34 — 깊이 지각: 양안 단서(Binocular cue) ⭐⭐⭐</h2>\n<ul>\n<li><strong>양안 단서</strong>: 두 눈을 모두 사용해야 하는 깊이 단서. 좌·우 망막의 상이 달라서 생김.</li>\n<li><strong>망막 부등(retinal disparity)</strong>: 두 망막 이미지의 <strong>차이</strong>를 계산해 깊이를 지각. <strong>차이가 클수록 가까이</strong> 있는 사물.</li>\n<li><strong>수렴(convergence)</strong>: 가까운 사물에 초점을 맞출 때 두 눈의 <strong>내각</strong>. 물체가 가까울수록 눈이 많이 모이고 내각이 커진다.</li>\n<li>예시: 볼펜 끝 맞추기 — 한 눈을 감으면 어렵다(양안 단서 사용 불가).</li>\n</ul>\n<h2>p.35–36 — 깊이 지각: 단안 단서(Monocular cue) 5가지 ⭐⭐⭐</h2>\n<p>한 눈만으로도 사용 가능한 단서.</p>\n<table>\n<thead>\n<tr>\n<th>단서</th>\n<th>내용</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>중첩(interposition)</strong></td>\n<td>한 대상이 다른 대상을 가리면 가리는 쪽이 <strong>더 가깝다</strong></td>\n</tr>\n<tr>\n<td><strong>상대적 운동(relative motion)</strong></td>\n<td>우리가 움직일 때 정지 물체도 움직이는 것처럼 보이며, <strong>가까울수록 더 빠르게</strong> 움직임(버스에서 본 멀리 있는 산은 느림, 가드레일은 빠름)</td>\n</tr>\n<tr>\n<td><strong>상대적 높이(relative height)</strong></td>\n<td>더 높은 물체를 <strong>더 멀리</strong> 있다고 지각</td>\n</tr>\n<tr>\n<td><strong>선형 조망(linear perspective)</strong></td>\n<td>평행선이 멀어질수록 한 점으로 수렴. <strong>수렴 정도가 클수록</strong> 지각된 거리도 증가</td>\n</tr>\n<tr>\n<td><strong>상대적 크기(relative size)</strong></td>\n<td>두 대상이 비슷한 크기일 때 <strong>더 작은 망막 상</strong>을 멀리 있는 것으로 지각</td>\n</tr>\n</tbody></table>\n<ul>\n<li>교수: <strong>양안 단서와 단안 단서의 유형을 잘 구분해 둘 것.</strong> 양안 = 망막 부등·수렴(2개), 단안 = 위 5개. 거리감 지각에서 가장 핵심적인 것은 양안 단서(망막 부등).</li>\n</ul>\n<h2>p.37 — 움직임 지각, 달 착시 ⭐⭐</h2>\n<ul>\n<li>사물이 작아지면 멀어지고 커지면 다가온다고 지각. <strong>동일 속도</strong>로 움직여도 큰 사물(코끼리)이 더 느리게 지각됨. <strong>지각한 크기와 지각한 거리의 상호작용</strong>이 착시를 설명.</li>\n<li><strong>달 착시(moon illusion)</strong>: 달이 <strong>수평선(지평선)</strong> 근처에 있을 때 더 크게 보이는 현상.</li>\n</ul>\n<h2>p.38 — 모양 항등성(Shape constancy) ⭐⭐⭐</h2>\n<ul>\n<li><strong>모양 항등성</strong>: 움직임에 따라 투영되는 모양이 바뀌어도 동일한 사물로 지각하는 특성. 움직임 → 관점 변화 → 망막 상 변화에도 사람은 같은 사물로 지각.</li>\n<li><strong>컴퓨터</strong>는 각도 변화에 따른 동일 대상 판단 능력이 매우 떨어진다(O&#39;Toole et al., 2007; Simonyan et al., 2013). 교수: 안면 인식(출국 심사, 은행 앱)은 정면 사진에선 잘 되지만 <strong>45도만 돌려도 동일 인물로 판단 못 함</strong>. 그래서 카메라를 정면으로 보라고 함. 사람은 이런 보정 능력을 선천적·경험적으로 갖췄다.</li>\n<li>시사점: 지각 과정은 단순한 사물의 투영이 아니라 <strong>감각 정보의 재조직화</strong>.</li>\n</ul>\n<h2>p.39 — 감각 상호작용(Sensory interaction) ⭐⭐⭐</h2>\n<ul>\n<li>감각 간에 서로 영향을 준다.</li>\n<li><strong>미각–후각</strong>: 코막힘이 있으면 맛이 덜함. (와인 소믈리에가 시음 전에 향부터 맡는 이유)</li>\n<li><strong>시각–청각</strong>: <strong>맥거크 효과(McGurk effect)</strong> — 입 모양(예: 「가」)과 소리(예: 「바」)가 다를 때 전혀 다른 **제3의 소리(「다」)**를 지각(McGurk &amp; MacDonald, 1976). 입술 모양이 청각 정보 처리에 영향. <strong>독순술</strong>도 하나의 듣기 형태.</li>\n</ul>\n<h2>p.40 — 체화 인지(Embodied cognition)와 공감각 ⭐⭐⭐</h2>\n<ul>\n<li><strong>체화 인지</strong>: 신체 감각의 두뇌 회로와 인지 두뇌 회로의 상호작용. 예: <strong>신체적 따뜻함이 사회적 따뜻함</strong>으로(Fetterman et al., 2018) — 따뜻한 커피를 잠깐 들고 있던 사람이 더 우호적으로 평가(엘리베이터 실험 예시). <strong>단단한 의자</strong>에 앉은 사람이 더 <strong>엄정한</strong> 평가(Schaefer et al., 2018). 교수 농담: 면접 합격률을 높이려면 히터+푹신한 의자?</li>\n<li><strong>공감각(synesthesia) 경험</strong>: 하나의 감각을 경험할 때 다른 감각 경험을 함(Ranzini &amp; Girelli, 2019). 예: 숫자 4는 빨간색, 7은 노란색으로 지각. (문학의 &quot;푸른 소리&quot; 같은 공감각적 표현과 비슷하나 실제 지각 연구 대상)</li>\n</ul>\n<h2>p.41 — 초감각지각(Extrasensory perception, ESP) ⭐⭐</h2>\n<ul>\n<li><strong>ESP</strong>: <strong>감각 입력 없이</strong> 지각이 일어날 수 있다는 주장. <strong>텔레파시, 천리안, 예지</strong> 등. 기억 회상을 통한 감각 경험(과거 경험 필요)과는 구분되고, 예측(과거 경험에 기반)과도 다름.</li>\n<li>미국인의 <strong>절반</strong>은 ESP가 가능하다고 믿고 심령술을 믿음(Gecewicz, 2018; Kim et al., 2015). 교수: 지각은 감각 입력이 있어야 성립한다는 심리학의 기본 전제를 뒤집는 주장이지만 의외로 <strong>과학적 검증이 시도되는 영역</strong>(Cardeña, 2018).</li>\n</ul>\n<h2>p.42 — 예지몽과 린드버그 유괴사건 ⭐⭐</h2>\n<ul>\n<li><strong>린드버그 유괴사건</strong>: 유괴된 아이의 꿈을 꾸었다고 제보한 사람이 <strong>1300명</strong>(Murray &amp; Wheeler, 1937). 이 중 아이의 죽음과 관련된 꿈을 꾼 사람 <strong>5%</strong>, 위치까지 맞춘 사람은 <strong>단 4명</strong>. → 수많은 표본 중에 <strong>우연의 일치</strong>는 발생할 수밖에 없다.</li>\n<li>교수: 첫 수업에서 &quot;심리학자는 독심술사?&quot;라는 질문이 왜 불쾌한 질문인지 언급.</li>\n<li>이 슬라이드 끝의 &quot;독심술을 과학적·실험적으로 검증해볼 방법은?&quot;은 열린 질문.</li>\n</ul>\n<hr>\n<h2>🎙 실제 수업 기록 (9/22 화, 녹음본 기준)</h2>\n<p>녹음: <code>심리학 여행 0922.txt</code>(134분 47초). 지각 전반부 약 59분, 휴식 후 시각 후반부(1:00~), 시험 공지 2:09:48부터.</p>\n<p><strong>교수가 강조·보충한 내용</strong></p>\n<ul>\n<li><strong>[00:36~07:22] 감각/지각 구분과 상향·하향.</strong> 지각은 &quot;경험&quot;이고 인지심리학적으로 주관적. 두 처리 모두가 지각에 개입.</li>\n<li><strong>[12:07] 역치는 낮은 게 무조건 좋지 않다.</strong> 슬라이드(&quot;낮은 것이 유리&quot;)와 다르게 정신적 자원 한계를 설명.</li>\n<li><strong>[13:32~18:14] 점화·역치하 자극.</strong> 사과–배 예시, 43~50ms 제시, 짧게 제시하는 것을 권장하는 이유(리뷰어가 지적).</li>\n<li><strong>[18:14~22:45] 신호 탐지 이론.</strong> 그래프에서 두 피크 사이 거리 = 민감도, 판단선이 오른쪽=엄격/왼쪽=관대. 청력 검사에 활용.</li>\n<li><strong>[23:16~24:23] 베버의 법칙.</strong> 100kg → 110 → 121kg 예시(일정 비율).</li>\n<li><strong>[25:27~28:20] 감각 순응.</strong> 후각이 가장 빠름, 활동전위 크기는 고정이고 <strong>발화율</strong>로 강도 표상.</li>\n<li><strong>[29:03~34:59] 지각 갖춤새.</strong> &quot;지금까지는 상향 처리, 지금부터는 하향 처리&quot; 전환. 가로/세로 B·13, 귀부인·할머니 중의적 그림 3장.</li>\n<li><strong>[34:59~39:45] 미각·청각 예시.</strong> 프랜차이즈 감자튀김 봉투, 블라인드 테스트, 원효대사 해골물, 말 분절(러시아어).</li>\n<li><strong>[39:45~43:43] 통증 = 하향 처리를 가장 극적으로 보여주는 예.</strong> 플라시보 조건과 연결, 2차 대전 부상병, 직접 경로 모형, 모기·예방접종 예시.</li>\n<li><strong>[43:43~51:03] 맥락.</strong> 배구 선수 표정 사진, <strong>음소 복원 효과</strong>, 동아프리카 vs 서구 그림 해석(금속 상자를 머리에 이고 있다 vs 창문 밑에 앉아 있다), <strong>장면 도식</strong>+아이트래킹.</li>\n<li><strong>[51:03~55:08] 동기·정서.</strong> 갈증-물병, 무거운 배낭·피곤 → 거리 멀게, 학교 정문 거리, 중간고사 분량 막막함, 슬픈 음악 → 부정적 단어(Mourning/Morning 등).</li>\n<li><strong>[55:08~58:49] 하향 처리 시연: 풍경 사진 속 얼굴 13개 찾기.</strong> 교수 자신은 9개 정도, 인지심리학 수강생도 다 못 찾음. &quot;얼굴을 찾아라&quot;는 안내 하나가 기대를 만들어 하향 처리를 작동시킴.</li>\n<li><strong>[1:00:52] 홍채는 상상만으로 조절된다</strong>(밝은/어두운 공간 상상 → 동공 변화, 지각 영역과 기억 영역 간 연관).</li>\n<li><strong>[1:02:51~1:03:46] 상은 뒤집혀 맺히지만 대뇌가 보정</strong>해 바로 선 형태로 지각(지각이 상향+하향 모두의 영향).</li>\n<li><strong>[1:03:46~1:05:40] 원시/근시.</strong> 근시=굴절력 강함=망막 앞, 오목렌즈로 빛을 퍼지게 함 / 원시=굴절력 약함=망막 뒤, 볼록렌즈(돋보기).</li>\n<li><strong>[1:05:40~1:09:28] 원추체/간상체.</strong> 원추체는 개수 적어서 핫라인 필요. 간상체는 합산 전달, 암순응 담당. 양극세포가 시신경으로 전달하는 시점부터 전기·화학 신호.</li>\n<li><strong>[1:10:18] 분할 시야 실험 재소개</strong>(3장).</li>\n<li><strong>[1:12:22~1:16:21] 자질 탐지기·FFA·PPA.</strong> 고양이 단일 뉴런 실험. 얼굴/장소 사진을 겹쳐 보여줄 때 주의에 따라 FFA/PPA가 다르게 활성화.</li>\n<li><strong>[1:16:35~1:18:07] 병렬 처리·분산 표상.</strong> &quot;뇌 영역 차원에서 조별 과제&quot;.</li>\n<li><strong>[1:18:07~1:20:08] 게슈탈트 vs 구조주의.</strong> 분트는 &quot;부분의 통합=전체&quot;, 게슈탈트는 &quot;부분의 통합 이상&quot;. <strong>네커 육면체</strong>(교수 발음 &quot;데커 육면체&quot;) 예시.</li>\n<li><strong>[1:21:07~1:23:04] 전경–배경.</strong> 하얀 잔/두 얼굴, 칵테일 파티 효과.</li>\n<li><strong>[1:24:10~1:26:56] 집단화 3원리.</strong> 근접성(젓가락 3세트), 연속성(올림픽 오륜기), 폐쇄(흰 삼각형).</li>\n<li><strong>[1:26:56~1:28:47] 게슈탈트는 상향 처리 중심이라는 점을 &quot;많이 헷갈리는 부분이라 깊게 설명&quot;했다고 직접 언급.</strong> 집단화 원리는 타고난 것.</li>\n<li><strong>[1:31:46~1:34:38] 역투사 문제.</strong> 삼각형 그림자 → 삼각기둥·원뿔·삼각뿔.</li>\n<li><strong>[1:34:38~1:39:20] 시각 절벽 영상 시청</strong>, 동물 새끼도 회피(생존).</li>\n<li><strong>[1:39:20~1:42:12] 양안 단서</strong>(망막 부등, 수렴), 볼펜 끝 맞추기 실험.</li>\n<li><strong>[1:42:33~1:47:42] 단안 단서 5가지.</strong> 특히 &quot;<strong>양안 단서와 단안 단서의 유형을 잘 구분해 두는 게 좋다</strong>&quot;([1:47:42]).</li>\n<li><strong>[1:47:42~1:50:28] 움직임 지각·달 착시</strong>(코끼리와 작은 동물이 같은 속도로 이동하면 큰 코끼리가 더 느려 보임).</li>\n<li><strong>[1:50:28~1:56:04] 모양 항등성·컴퓨터 안면 인식</strong>(45도만 돌려도 동일 인물 판단 실패).</li>\n<li><strong>[1:56:04~1:58:05] 감각 상호작용.</strong> 미각-후각(소믈리에), 맥거크 효과(&quot;가&quot;+&quot;바&quot;→&quot;다&quot;), 독순술.</li>\n<li><strong>[1:58:05~2:02:54] 체화 인지.</strong> 따뜻한 커피 → 우호적 평가, 단단한 의자 → 엄정한 평가. 공감각(4=빨강, 7=노랑).</li>\n<li><strong>[2:02:54~2:07:36] ESP.</strong> 감각 입력 없는 지각. 기억·예측과의 차이, 미국인 절반, 린드버그 사건(1300명/5%/4명) → 우연의 일치.</li>\n<li><strong>[2:08:33] 마무리.</strong> 지각은 입력값을 만들어내는 과정이고, 기억·학습·계획 같은 고차 기능의 출발점.</li>\n</ul>\n<p><strong>📢 시험 공지 (2:09:48–2:13:47) ⭐⭐⭐</strong></p>\n<ul>\n<li><strong>일시</strong>: 10월 13일(화) 오후 2시 30분 ~ 4시, <strong>90분</strong>.</li>\n<li><strong>장소</strong>: <strong>E1-101 컨벤션홀 A구역</strong>(녹음은 &quot;b1 101 / 21 101&quot;로 오인식되었으나 공지 원문 기준 E1-101 컨벤션홀 A구역. 강의실이 좁아 변경 요청).</li>\n<li><strong>문항</strong>: <strong>객관식 25 + 단답형(주관식) 5 = 총 30문항</strong> ([2:10:21]).</li>\n<li><strong>범위</strong>: 1주차<del>7주차, 즉 **서막</del>6장**. <strong>1장 실험설계·연구 관련 통계 부분은 제외.</strong> &quot;<strong>30번 슬라이드부터 배제, 29번 슬라이드까지만 포함</strong>(연구 승인 절차 파트까지)&quot;([2:12:52]). 통계는 학기 말 연구설계·통계 주차 내용과 통합하여 <strong>기말고사</strong>에 포함.</li>\n<li><strong>변동 사항</strong>은 LMS에도 올리고 수업 시간·LMS 공지로 알리니 매주 확인.</li>\n<li><strong>필기구</strong>: <strong>빨간 펜, 샤프, 연필 사용 자제</strong>(빨간 펜은 채점용, 샤프·연필은 지워져 교차 검증이 어려움) → <strong>검은 펜이나 빨간색이 아닌 볼펜</strong> 사용.</li>\n</ul>\n<hr>\n<h2>명칭 암기표</h2>\n<table>\n<thead>\n<tr>\n<th>명칭 (영문)</th>\n<th>한 줄 정의/단서</th>\n<th>슬라이드</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>감각 (sensation)</td>\n<td>외부 정보를 감각 기관이 수용·표상</td>\n<td>2</td>\n</tr>\n<tr>\n<td>지각 (perception)</td>\n<td>감각 정보를 체제화·해석</td>\n<td>2</td>\n</tr>\n<tr>\n<td>상향 처리 (bottom-up)</td>\n<td>감각 수용기→고차 인지</td>\n<td>2</td>\n</tr>\n<tr>\n<td>하향 처리 (top-down)</td>\n<td>경험·기대로 감각 입력을 체계화</td>\n<td>2</td>\n</tr>\n<tr>\n<td>에너지의 변환 (transduction)</td>\n<td>감각 에너지를 신경 신호로 변환</td>\n<td>3</td>\n</tr>\n<tr>\n<td>역치 (threshold)</td>\n<td>반응을 일으키는 최소 자극 강도</td>\n<td>4</td>\n</tr>\n<tr>\n<td>절대 역치 (absolute threshold)</td>\n<td>탐지 비율 0.5인 지점</td>\n<td>4</td>\n</tr>\n<tr>\n<td>역치하 자극 (subliminal stimulus)</td>\n<td>탐지율 0.5 미만 자극</td>\n<td>4</td>\n</tr>\n<tr>\n<td>점화 (priming)</td>\n<td>자극으로 관련 개념 미리 활성화</td>\n<td>5</td>\n</tr>\n<tr>\n<td>차폐 자극 (mask)</td>\n<td>점화 자극을 의식 못 하게 가림</td>\n<td>5</td>\n</tr>\n<tr>\n<td>자극 개시 비동기 (SOA)</td>\n<td>점화 자극과 표적 사이 시간 간격</td>\n<td>5</td>\n</tr>\n<tr>\n<td>신호 탐지 이론 (signal detection theory)</td>\n<td>신호/노이즈 구별 능력·판단 기준 계산</td>\n<td>6</td>\n</tr>\n<tr>\n<td>적중 (hit) / 놓침 (miss)</td>\n<td>신호 있음: &quot;있다&quot;/&quot;없다&quot; 반응</td>\n<td>6</td>\n</tr>\n<tr>\n<td>오경보 (false alarm) / 정기각 (correct rejection)</td>\n<td>신호 없음: &quot;있다&quot;/&quot;없다&quot; 반응</td>\n<td>6</td>\n</tr>\n<tr>\n<td>민감도 (d′)</td>\n<td>신호와 노이즈를 구별하는 능력</td>\n<td>6</td>\n</tr>\n<tr>\n<td>편향성 (response bias)</td>\n<td>신호 판단 기준선(엄격/관대)</td>\n<td>6</td>\n</tr>\n<tr>\n<td>차이 역치 / 최소식별차이 (difference threshold, JND)</td>\n<td>두 자극 차이 탐지 확률 0.5인 최소 차이</td>\n<td>7</td>\n</tr>\n<tr>\n<td>베버의 법칙 (Weber&#39;s law)</td>\n<td>차이 지각은 일정 비율 변화 필요</td>\n<td>7</td>\n</tr>\n<tr>\n<td>감각 순응 (sensory adaptation)</td>\n<td>반복 자극에 민감도 감소, 후각이 가장 빠름</td>\n<td>8</td>\n</tr>\n<tr>\n<td>발화율 (firing rate)</td>\n<td>뉴런이 자극 강도를 표상하는 방식</td>\n<td>8</td>\n</tr>\n<tr>\n<td>지각 갖춤새 (perceptual set)</td>\n<td>경험에 근거한 지각 기대</td>\n<td>9, 11</td>\n</tr>\n<tr>\n<td>말 분절 (speech segmentation)</td>\n<td>연속 말소리에서 단어 경계 구분</td>\n<td>11</td>\n</tr>\n<tr>\n<td>가짜약 조건 / 플라시보 효과 (placebo)</td>\n<td>처치 받았다는 기대로 생기는 효과</td>\n<td>12</td>\n</tr>\n<tr>\n<td>직접 경로 모형 (direct pathway model)</td>\n<td>통증을 상향 처리 중심으로 보던 모형</td>\n<td>13</td>\n</tr>\n<tr>\n<td>음소 복원 효과 (phonemic restoration)</td>\n<td>누락된 소리를 맥락으로 복원해 지각</td>\n<td>14</td>\n</tr>\n<tr>\n<td>장면 도식 (scene schema)</td>\n<td>장면에 있어야 할 일반 지식(수업 언급)</td>\n<td>15</td>\n</tr>\n<tr>\n<td>동공 (pupil) / 홍채 (iris)</td>\n<td>빛이 통과하는 구멍 / 동공 크기 조절</td>\n<td>21</td>\n</tr>\n<tr>\n<td>망막 (retina)</td>\n<td>상이 맺히는 곳, 간상체·원추체 위치</td>\n<td>21</td>\n</tr>\n<tr>\n<td>중심와 (fovea)</td>\n<td>상이 가장 선명하게 맺히는 곳</td>\n<td>21</td>\n</tr>\n<tr>\n<td>맹점 (blind spot)</td>\n<td>시신경 위치, 상이 안 맺힘</td>\n<td>21</td>\n</tr>\n<tr>\n<td>수정체 (lens)</td>\n<td>빛 굴절 조절 렌즈</td>\n<td>22</td>\n</tr>\n<tr>\n<td>원시 (hyperopia) / 근시 (myopia)</td>\n<td>굴절력 약함(망막 뒤) / 강함(망막 앞)</td>\n<td>22</td>\n</tr>\n<tr>\n<td>시신경 (optic nerve)</td>\n<td>신경 신호를 대뇌로 전달</td>\n<td>22</td>\n</tr>\n<tr>\n<td>원추체 (cone)</td>\n<td>색·세부사항, 중심, 낮, 핫라인</td>\n<td>23, 24</td>\n</tr>\n<tr>\n<td>간상체 (rod)</td>\n<td>밝기, 주변, 어두울 때, 암순응</td>\n<td>23, 24</td>\n</tr>\n<tr>\n<td>암순응 (dark adaptation)</td>\n<td>어둠에 적응해 형체 식별</td>\n<td>23</td>\n</tr>\n<tr>\n<td>양극세포 (bipolar cell)</td>\n<td>광수용기 신호를 시신경으로 전달</td>\n<td>23</td>\n</tr>\n<tr>\n<td>뇌량 (corpus callosum)</td>\n<td>좌우 반구 연결</td>\n<td>25</td>\n</tr>\n<tr>\n<td>시각 피질 (visual cortex)</td>\n<td>후두엽, 시각 정보 처리</td>\n<td>25</td>\n</tr>\n<tr>\n<td>자질 탐지기 (feature detector)</td>\n<td>각도·움직임 등에 반응하는 뉴런</td>\n<td>26</td>\n</tr>\n<tr>\n<td>방추상 얼굴 영역 (FFA)</td>\n<td>얼굴 재인, 손상 시 얼굴실인증</td>\n<td>26</td>\n</tr>\n<tr>\n<td>얼굴실인증 (prosopagnosia)</td>\n<td>얼굴을 인식 못 하는 증상</td>\n<td>26</td>\n</tr>\n<tr>\n<td>경두개 자기장 자극술 (TMS)</td>\n<td>FFA에 적용 시 얼굴 재인 저하</td>\n<td>26</td>\n</tr>\n<tr>\n<td>해마곁 장소 영역 (PPA)</td>\n<td>장소·공간 지각</td>\n<td>26</td>\n</tr>\n<tr>\n<td>병렬 처리 (parallel processing)</td>\n<td>여러 하위 차원을 동시 처리</td>\n<td>27</td>\n</tr>\n<tr>\n<td>분산 표상 (distributed representation)</td>\n<td>여러 영역이 합작해 표상</td>\n<td>27</td>\n</tr>\n<tr>\n<td>게슈탈트 심리학 (Gestalt psychology)</td>\n<td>전체는 부분의 합 이상</td>\n<td>28</td>\n</tr>\n<tr>\n<td>네커 육면체 (Necker cube)</td>\n<td>지각 조직화 예시</td>\n<td>28</td>\n</tr>\n<tr>\n<td>전경–배경 구분 (figure-ground)</td>\n<td>대상을 배경에서 분리, 가역적</td>\n<td>29</td>\n</tr>\n<tr>\n<td>칵테일 파티 효과 (cocktail party effect)</td>\n<td>소음 속에서 특정 목소리 분리</td>\n<td>29</td>\n</tr>\n<tr>\n<td>집단화 (grouping)</td>\n<td>전경을 의미 있는 형태로 조직화</td>\n<td>30</td>\n</tr>\n<tr>\n<td>근접성 (proximity)</td>\n<td>가까운 것끼리 묶음</td>\n<td>30</td>\n</tr>\n<tr>\n<td>연속성 (continuity)</td>\n<td>부드러운 연속 패턴을 하나로</td>\n<td>30</td>\n</tr>\n<tr>\n<td>폐쇄 (closure)</td>\n<td>끊어진 부분을 메워 완전한 형태로</td>\n<td>30</td>\n</tr>\n<tr>\n<td>역투사의 문제 (inverse projection problem)</td>\n<td>2차원 상의 근원 물체가 여럿 가능</td>\n<td>32</td>\n</tr>\n<tr>\n<td>깊이 지각 (depth perception)</td>\n<td>3차원 거리 정보 지각</td>\n<td>33</td>\n</tr>\n<tr>\n<td>시각 절벽 (visual cliff)</td>\n<td>유아 깊이 지각 선천성 실험(깁슨&amp;워크)</td>\n<td>33</td>\n</tr>\n<tr>\n<td>양안 단서 (binocular cue)</td>\n<td>두 눈 필요: 망막 부등·수렴</td>\n<td>34</td>\n</tr>\n<tr>\n<td>망막 부등 (retinal disparity)</td>\n<td>두 망막 상의 차이, 클수록 가까움</td>\n<td>34</td>\n</tr>\n<tr>\n<td>수렴 (convergence)</td>\n<td>가까운 물체를 볼 때 두 눈의 내각</td>\n<td>34</td>\n</tr>\n<tr>\n<td>단안 단서 (monocular cue)</td>\n<td>한 눈으로 가능한 단서</td>\n<td>35, 36</td>\n</tr>\n<tr>\n<td>중첩 (interposition)</td>\n<td>가리는 쪽이 더 가까움</td>\n<td>35</td>\n</tr>\n<tr>\n<td>상대적 운동 (relative motion)</td>\n<td>가까울수록 빨리 움직임</td>\n<td>35</td>\n</tr>\n<tr>\n<td>상대적 높이 (relative height)</td>\n<td>높은 것이 더 멀리</td>\n<td>35</td>\n</tr>\n<tr>\n<td>선형 조망 (linear perspective)</td>\n<td>평행선이 한 점으로 수렴</td>\n<td>36</td>\n</tr>\n<tr>\n<td>상대적 크기 (relative size)</td>\n<td>작은 상이 멀리</td>\n<td>36</td>\n</tr>\n<tr>\n<td>달 착시 (moon illusion)</td>\n<td>수평선 근처의 달이 더 크게 보임</td>\n<td>37</td>\n</tr>\n<tr>\n<td>모양 항등성 (shape constancy)</td>\n<td>투영 모양이 변해도 동일 사물로 지각</td>\n<td>38</td>\n</tr>\n<tr>\n<td>감각 상호작용 (sensory interaction)</td>\n<td>감각 간 상호 영향</td>\n<td>39</td>\n</tr>\n<tr>\n<td>맥거크 효과 (McGurk effect)</td>\n<td>입모양과 소리 불일치 시 제3의 소리 지각</td>\n<td>39</td>\n</tr>\n<tr>\n<td>체화 인지 (embodied cognition)</td>\n<td>신체 감각과 인지 회로의 상호작용</td>\n<td>40</td>\n</tr>\n<tr>\n<td>공감각 (synesthesia)</td>\n<td>한 감각이 다른 감각 경험을 유발</td>\n<td>40</td>\n</tr>\n<tr>\n<td>초감각지각 (ESP)</td>\n<td>감각 입력 없는 지각 주장</td>\n<td>41</td>\n</tr>\n<tr>\n<td>텔레파시 / 천리안 / 예지 (telepathy, clairvoyance, precognition)</td>\n<td>ESP의 종류</td>\n<td>41</td>\n</tr>\n<tr>\n<td>린드버그 유괴사건</td>\n<td>예지몽 1300명·5%·4명 → 우연의 일치</td>\n<td>42</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>시험 대비 핵심 요약</h2>\n<ol>\n<li><strong>감각 = 수용·표상, 지각 = 체제화·해석.</strong> <strong>상향</strong>(감각→고차) vs <strong>하향</strong>(경험·기대→감각). 지각은 둘 다의 영향을 받는다.</li>\n<li><strong>절대 역치</strong> = 탐지율 0.5인 지점, <strong>역치하 자극</strong> = 0.5 미만이지만 영향을 줄 수 있음(<strong>점화</strong>로 확인). 역치가 낮다고 항상 좋은 것은 아님(교수 강조).</li>\n<li><strong>신호 탐지 이론</strong>: 적중/놓침/오경보/정기각 4가지 → <strong>민감도(d′)</strong>(구별 능력)와 <strong>편향성</strong>(기준선; 우측=엄격, 좌측=관대). 민감도와 편향은 다른 개념.</li>\n<li><strong>차이 역치(JND) vs 절대 역치</strong>: 전자는 두 자극의 차이 탐지, 후자는 자극 유무 탐지. <strong>베버의 법칙</strong> = 일정 <strong>비율</strong> 변화.</li>\n<li><strong>감각 순응</strong>: 반복 자극에 민감도 감소, 후각이 가장 빠름, 뉴런은 <strong>발화율</strong>로 강도 표상(활동전위 크기는 불변).</li>\n<li><strong>지각 갖춤새 = 기대 = 하향 처리의 대표 예시.</strong> 예: 감자튀김 봉투(미각), 말 분절(청각), 플라시보·통증(직접 경로 모형 반박, 부상병), 맥락(문화, 음소 복원), 동기(갈증·배낭), 정서(슬픈 음악).</li>\n<li>헷갈리는 쌍: <strong>점화(자극 후 처리 촉진) vs 플라시보(기대에 의한 효과)</strong> / <strong>절대 역치 vs 차이 역치</strong> / <strong>민감도 vs 편향성</strong> / <strong>감각 순응 vs 암순응</strong>.</li>\n<li><strong>시각 구조</strong>: 홍채(동공 조절), 수정체(굴절: 근시=망막 앞, 원시=망막 뒤), 중심와(선명), 맹점, 뒤집힌 상. <strong>원추체</strong>(600만, 중앙, 색·세부, 핫라인) vs <strong>간상체</strong>(1.2억, 주변, 밝기·약한 빛, 암순응).</li>\n<li>경로: 광수용기 → <strong>양극세포</strong> → 시신경 → 후두엽 시각 피질. 좌시야→우반구, 우시야→좌반구.</li>\n<li><strong>자질 탐지기</strong>, <strong>FFA</strong>(얼굴, 얼굴실인증), <strong>PPA</strong>(장소), <strong>병렬 처리</strong>(동시 처리 후 통합), <strong>분산 표상</strong>.</li>\n<li><strong>게슈탈트</strong>: 전체 ≥ 부분의 합(구조주의와 대비), 전경–배경(가역적), 집단화(<strong>근접성·연속성·폐쇄</strong>). ⭐ <strong>게슈탈트는 타고난 상향 처리 중심</strong>이지 하향이 아님(교수가 헷갈리기 좋다고 강조).</li>\n<li><strong>역투사 문제</strong>: 2차원 상 → 3차원 근원이 여러 개. <strong>시각 절벽</strong>(깁슨&amp;워크, 6~14개월)으로 깊이 지각의 선천성.</li>\n<li><strong>양안 단서 2개</strong>(망막 부등, 수렴) vs <strong>단안 단서 5개</strong>(중첩, 상대적 운동, 상대적 높이, 선형 조망, 상대적 크기). 교수가 &quot;구분해 둘 것&quot;이라고 강조.</li>\n<li><strong>모양 항등성</strong>(관점이 바뀌어도 동일 사물, 컴퓨터는 약함), <strong>달 착시</strong>(수평선 근처가 더 커 보임).</li>\n<li><strong>감각 상호작용</strong>: 맥거크 효과, 미각–후각. <strong>체화 인지</strong>(따뜻함, 딱딱한 의자), <strong>공감각</strong>, <strong>ESP</strong>(텔레파시·천리안·예지; 린드버그 사건은 우연의 일치).</li>\n<li><strong>시험</strong>: 10/13(화) 14:30–16:00, E1-101 컨벤션홀 A구역, 객관식 25 + 단답형 5, 서막–6장(1장은 29번 슬라이드까지), 검은 펜 사용.</li>\n</ol>\n","len":22383},{"id":"w6_ch5","title":"6주차 — 5장 학습 정리","desc":"고전적/조작적 조건형성, 강화와 처벌, 강화 계획, 관찰 학습","ch":"ch5","min":25,"html":"<h1>5장 — 학습 페이지별 해설</h1>\n<p>심리학으로의 여행 (Prof. 이소영) · 마이어스 심리학 개론 13판</p>\n<p>이 장의 핵심 질문은 &quot;경험은 어떻게 행동을 영속적으로 바꾸는가?&quot;이다. **학습(learning)**은 경험에 따른 유기체 행동의 영속적 변화이며 목표는 외부 환경에 대한 적응이다. 학습은 <strong>비연합 학습</strong>(민감화·둔감화), <strong>연합 학습</strong>(<strong>고전적 조건형성</strong>, <strong>조작적 조건형성</strong>), <strong>인지 학습</strong>(<strong>관찰 학습</strong>)의 세 양상으로 나뉜다. 교수는 &quot;학습&quot;이 공부법이 아니라 습관·행동 패턴의 형성이라는 점을 먼저 짚었고, 공부와 관련된 정보 유지는 다음 주 기억 장(6장)에서 다룬다고 했다.</p>\n<p>페이지 번호 = 슬라이드 번호(총 38장). 슬라이드에는 &quot;Operational Conditioning&quot;으로 적혀 있으나 표준 용어는 <strong>operant conditioning</strong>(조작적 조건형성)이다. <strong>9/29 녹음은 슬라이드 1~19번(강화의 유형, 약물 중독의 부적 강화)까지만 다루었고</strong>, 20~38번은 녹음이 없어 슬라이드 기준으로 정리했다(해당 페이지에 표시).</p>\n<hr>\n<h2>p.1 — 5장 학습 (표지)</h2>\n<h2>p.2 — 학습이란? 비연합 학습, 신경 가소성 ⭐⭐⭐</h2>\n<ul>\n<li><strong>학습(learning)</strong>: <strong>경험에 따른 유기체 행동의 영속적 변화</strong>. 주 목표는 <strong>외부 환경에 대한 적응</strong>(기존 지식으로 안 되는 새로운 패턴에는 새로운 대응 기반을 학습이 마련).</li>\n<li>학습의 세 양상: <strong>비연합 학습 / 연합 학습 / 관찰(인지) 학습</strong>. (슬라이드 그림은 관찰 학습으로 표기, 교수는 &quot;더 큰 범주로 보면 인지 학습 계열, 그 하위가 관찰 학습&quot;이라고 설명)</li>\n<li><strong>비연합 학습</strong>(연합을 활용하지 않는 학습):<ul>\n<li><strong>민감화(Sensitization)</strong>: 자극에 대한 행동 반응 <strong>빈도가 증대</strong>되는 현상 (소음에 오히려 더 예민해짐).</li>\n<li><strong>둔감화(Habituation)</strong>: 자극에 대한 행동 반응 <strong>빈도가 낮아지는</strong> 현상 (소음에 점차 적응). 3장 신생아 습관화와 같은 개념.</li>\n<li>행동뿐 아니라 신경학적으로도 나타난다(뉴런 발화율 변화).</li>\n</ul>\n</li>\n<li><strong>신경 가소성(Neural Plasticity)</strong>: 경험·학습에 따라 신경 회로가 유연하게 변하는 특성. 습관 형성도 두뇌 회로 변화를 동반.</li>\n</ul>\n<h2>p.3 — 연합과 습관 ⭐⭐</h2>\n<ul>\n<li><strong>연합(Association)</strong>: 두 사건 혹은 자극을 서로 연결하는 것(서로 무관해도 가능). 교수 예: 까마귀가 날자 배가 떨어지는 것을 보면 우연이라도 연관성을 느끼고 묶어서 생각 → 연합 발생.</li>\n<li>연합이 반복되면 <strong>습관</strong>(Wood et al., 2014). 유익한 습관은 자기제어력·실행력을 높임(Galla &amp; Duckworth, 2015), 두뇌 회로에도 표상(Graybiel &amp; Smith, 2014).</li>\n<li>습관 형성에는 통상 <strong>약 2달</strong> 소요(Lally et al., 2010). 교수: 정확히는 <strong>66일</strong>. (운동을 꾸준히 못 하는 이유가 두 달을 못 채워서라는 농담)</li>\n<li>인간뿐 아니라 동물도 연합으로 학습 가능.</li>\n</ul>\n<h2>p.4 — 연합 학습의 예시: 조건화 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>고전적 조건화 (classical)</th>\n<th>조작적 조건화 (operant)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>연합 대상</td>\n<td><strong>무관한 두 자극</strong>을 연합, 미래 사건 예측</td>\n<td><strong>반응(행동)을 그 결과</strong>와 연합</td>\n</tr>\n<tr>\n<td>반응</td>\n<td>조건 자극에 대한 반응이 <strong>자동적</strong>으로 생성</td>\n<td>보상·처벌 조작으로 행동 <strong>빈도</strong>를 조절</td>\n</tr>\n</tbody></table>\n<ul>\n<li>교수 예: 번개(섬광) 뒤에 곧 천둥소리가 온다는 것을 학습하면 섬광만 봐도 몸을 움츠림(다음 사건을 <strong>예측</strong>). 조작적 예: 아이가 예의 바르게 부탁하면 과자를 더 받음 → 행동을 결과와 연합해 빈도가 바뀜. 환경 조작은 <strong>보상</strong>과 <strong>처벌</strong> 두 가지.</li>\n</ul>\n<h2>p.5 — 인지 학습(Cognitive learning) ⭐⭐</h2>\n<ul>\n<li><strong>인지 학습</strong>: 사건·사람을 <strong>관찰</strong>하거나 <strong>언어</strong>를 기반으로 <strong>경험하지 못한 것</strong>을 학습. 관찰·언어라는 인지 기능에 기반하므로 인지 학습이라 부른다.</li>\n<li>인간에게는 타인의 시점을 이해하고 공감하는 심리·생물학적 기제가 있다: <strong>마음 이론</strong>, <strong>거울 뉴런</strong>. 타인의 경험을 보는 것만으로 자신의 것으로 흡수 가능. 동물도 가능(맹수의 사냥 방법 전수, 침팬지의 사회적 행동).</li>\n<li>예시: <strong>관찰 학습</strong>.</li>\n</ul>\n<h2>p.6 — 행동주의의 대두 ⭐⭐</h2>\n<ul>\n<li><strong>행동주의</strong>: 심리과학은 과학적이어야 하므로 관찰 가능한 **유기체의 환경·자극에 대한 반응(=행동)**만 연구. <strong>심성 개념(내면 과정)을 폐기</strong>. 20세기 전반 미국 심리학의 주류(<strong>인지 혁명</strong> 전까지). 1주차 서막의 구조주의 비판 흐름과 연결.</li>\n<li>교수: 고전적·조작적 조건화는 <strong>행동주의를 대표하는 이론</strong>이다. 학습은 행동 변화로 관찰·기록할 수 있어 행동주의와 잘 맞는다. (행동주의 입장에서 연합은 결국 행동 변화의 연장선)</li>\n</ul>\n<h2>p.7 — 고전적 조건화의 과정 ⭐⭐⭐</h2>\n<p><strong>기본 절차</strong></p>\n<ol>\n<li><strong>무조건 자극(US)</strong> 제시 → <strong>무조건 반응(UR)</strong> 확인 (개에게 먹이 → 침).</li>\n<li><strong>중립 자극(NS)</strong>(종소리)을 먼저 제시하고 이어서 <strong>US</strong> 제시, 이를 반복.</li>\n<li>NS가 US와 연합되어 **조건 자극(CS)**으로 발전 → CS만으로 반응(<strong>조건 반응, CR</strong>) 유발.</li>\n</ol>\n<ul>\n<li>유기체의 자극 간 <strong>연합 형성</strong>이 학습의 핵심. **파블로프(Pavlov)**의 실험 패러다임.</li>\n</ul>\n<h2>p.8–9 — 고전적 조건화의 구성 요소 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>구성 요소</th>\n<th>정의</th>\n<th>예 (파블로프)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>중성 자극(NS, neutral stimulus)</strong></td>\n<td>조건 형성 전에는 조건 반응을 유발하지 않는 자극</td>\n<td>종소리(처음)</td>\n</tr>\n<tr>\n<td><strong>무조건자극(US, unconditioned stimulus)</strong></td>\n<td>자연스럽고 <strong>자동적인 반응</strong>을 촉발하는 자극 (생득적)</td>\n<td>먹이</td>\n</tr>\n<tr>\n<td><strong>조건자극(CS, conditioned stimulus)</strong></td>\n<td>NS가 US와 반복 제시되어 연합된 결과 형성된 자극</td>\n<td>종소리(학습 후)</td>\n</tr>\n<tr>\n<td><strong>무조건반응(UR)</strong></td>\n<td>US에 대해 자연스럽게 나타나는 반응, 학습과 무관</td>\n<td>먹이를 보고 침 흘리기</td>\n</tr>\n<tr>\n<td><strong>조건반응(CR)</strong></td>\n<td>CS에 대해 연합 학습을 통해 발현되는 반응</td>\n<td>소리를 듣고 침 흘리기</td>\n</tr>\n</tbody></table>\n<ul>\n<li>교수: UR과 CR은 <strong>겉으로는 같은 행동</strong>이지만 어떤 자극에 대해 나타나느냐가 다르다. 관건은 &quot;어떤 자극에 반응을 보이는가&quot;(중성 자극이 조건 자극으로 발전하듯 UR이 CR로 변화).</li>\n</ul>\n<h2>p.10 — 자극 제시 순서와 고차 조건형성 ⭐⭐⭐</h2>\n<ul>\n<li><strong>제시 순서가 중요</strong>: NS가 <strong>먼저</strong>, US가 <strong>나중</strong>에 나와야 조건형성이 일어난다. <strong>US가 NS보다 먼저 제시되면 조건형성은 거의 발생하지 않는다.</strong> (9/29 28:08~29:08 교수 강조)</li>\n<li><strong>고차 조건형성(higher-order conditioning)</strong>: 이미 형성된 <strong>CS를 다른 중성 자극과 연합</strong>해 새로운 CS로 만드는 것(종소리를 나팔 소리와 연합). <strong>1차 조건형성보다 약하게</strong> 형성되나 일생에 영향을 줄 수 있다.</li>\n<li>노트 예: 개에게 물린 적이 있는 사람이 개를 보기만 해도 무섭고, 짖는 소리만 들어도 유사 반응.</li>\n</ul>\n<h2>p.11 — 소거와 자발적 회복 ⭐⭐⭐</h2>\n<ul>\n<li><strong>소거(extinction)</strong>: 조건 형성 후 CS를 US 없이 반복 제시하면 CR이 <strong>점차 감소</strong>. (CS 뒤에 US가 오지 않는다고 예측되면서 조건화가 약해짐; 소거 유지에는 US 없이 계속 제시)</li>\n<li><strong>자발적 회복(spontaneous recovery)</strong>: 일정한 <strong>휴지 기간</strong> 후 CS를 다시 제시하면 소거되었던 CR이 <strong>부분적으로 회복</strong>.</li>\n<li>⭐ 소거는 CR을 <strong>제거</strong>하는 것이 아니라 <strong>일시적으로 억압</strong>하는 쪽에 가깝다(자발적 회복이 그 증거). 이때 US를 다시 짝지어 주면 조건화가 강화·유지되고, 계속 US 없이 두면 결국 완전히 사라진다(교수 설명).</li>\n</ul>\n<h2>p.12 — 일반화와 변별 ⭐⭐⭐</h2>\n<ul>\n<li><strong>일반화(generalization)</strong>: CS와 <strong>유사한 속성</strong>의 자극에도 CR을 보이는 현상(Pavlov, 1927). 예: 종소리에 조건형성 → 트라이앵글·실로폰 소리에도 반응. 혐오 자극과 유사한 자극에도 혐오감 형성(Rozin et al., 1986). <strong>일반화된 공포는 쉽게 사라지지 않음</strong>(Stout et al., 2018). 속담: 「자라 보고 놀란 가슴 솥뚜껑 보고 놀란다」.</li>\n<li><strong>변별(discrimination)</strong>: <strong>CS와 무관련 자극을 구분</strong>하는 능력. 일반화와 더불어 대상 간 연관성을 학습하는 한 축.</li>\n<li>교수: 유사 속성이 많이 다르면 고차 조건형성이 필요하고, 속성이 유사하면 별도 절차 없이 일반화가 일어난다. 실생활에서는 혐오·공포 반응에서 일반화가 빈번(냄새가 비슷한 음식들을 모두 기피).</li>\n</ul>\n<h2>p.13 — 고전적 조건화의 의의 ⭐⭐</h2>\n<ol>\n<li>대부분의 심리학자가 고전적 조건화를 <strong>학습의 기본 형식</strong>이라 동의 (연합 관점).</li>\n<li><strong>학습 과정을 객관적으로 연구</strong>할 방법 제공(행동 변화 유무를 관찰·기록해 처치 효과 비교 → 심리학의 과학성 정립에 기여).</li>\n<li><strong>다양한 자극에 대한 다양한 반응</strong>이 여러 유기체에서 형성될 수 있음을 보임.</li>\n<li><strong>진화적 관점</strong>: 혐오·공포 자극에 대한 연합 학습이 <strong>생존률</strong>을 높였다.</li>\n<li>신경과학: CS–US 연결을 담당하는 신경회로 보고(Harnett et al., 2016; Yau &amp; McNally, 2018).</li>\n</ol>\n<ul>\n<li>행동주의는 비판을 많이 받았지만 이렇게 &quot;무의미하다고 할 수 없는 아이러니한 포지션&quot;이라고 교수가 표현.</li>\n</ul>\n<h2>p.14 — 연합 개념의 확장: 점화 효과 ⭐</h2>\n<ul>\n<li>연합은 학습뿐 아니라 이후 <strong>지식 구조</strong>에서도 적용된다. 4장의 <strong>점화 효과</strong> 중 <strong>의미 점화</strong>는 두 대상의 관계성에 기반(「병원」-「약국」, 「럭키」-「세븐」).</li>\n<li>교수: 학습→기억→지식이 누적되며 <strong>의미 네트워크</strong>를 이루고, 종과 먹이처럼 원래 연관 없던 것이 조건형성으로 <strong>새로운 연결 회로</strong>를 완성한다(신경 가소성 병행).</li>\n</ul>\n<h2>p.15 — 고전적 조건화의 응용 ①: 갈망 치료 ⭐⭐⭐</h2>\n<ul>\n<li><strong>향정신성 약물</strong>을 남용했던 사람은 약물을 사용했던 **상황·맥락(단서 자극)**을 접하면 강하게 갈망. 과체중인 사람도 주 원인 음식에 강력한 조건 반응(Hill, 2007).</li>\n<li>치료: 조건형성이 된 <strong>상황·대상(단서)을 제거</strong>하거나 다른 것과 재연합시켜 중독·갈망 치료를 시작(Siegel, 2005).</li>\n<li>교수 예시(마운자로·위고비): 포만감을 오래 유지시키는 약효 때문에 음식을 먹으면 메스꺼움·소화 불편이 오래 가고, 그 <strong>불쾌한 신체 감각이 음식과 연합</strong>되어 섭식량이 줄어든다. 처음엔 약학적 효과지만 나중엔 심리적 연합 요인이 작용. 교수 본인이 맞고 있다며 &quot;너무 힘드니 여러분도 관리하라&quot;고 언급. 약물 사용 맥락 단서는 기억 장에서 다시 다룬다고 예고.</li>\n</ul>\n<h2>p.16 — 응용 ②: 면역 반응, 공포 치료 ⭐⭐</h2>\n<ul>\n<li><strong>면역 반응</strong>: 면역 약물에 특정한 <strong>맛</strong>을 첨가하면 나중에 맛만으로도 면역 반응 생성(Ader &amp; Cohen, 1985). 교수: &quot;플라시보 효과가 다른 의미로 발현된 것&quot;.</li>\n<li><strong>공포 치료</strong>: 홀로 엘리베이터 타기를 두려워하는 사람을 반복적으로 엘리베이터에 탑승시켜 공포 완화(Ellis &amp; Becker, 1982). 공포 반응을 낼 만한 상황이 실제로는 일어나지 않는다는 것을 새로 연합·학습시킴 = <strong>반복 노출 치료법</strong>(소거 기제 활용). 교수는 일반화된 공포가 지우기 어렵기 때문에 노출로 치료한다고 설명.</li>\n</ul>\n<h2>p.17 — 조작적 조건화의 기본 개념, 효과의 법칙 ⭐⭐⭐</h2>\n<ul>\n<li><strong>조작적 조건형성</strong>: 유기체가 자신의 <strong>행위를 결과와 연합</strong>해 행동 빈도를 조절하는 학습. (두 자극이 아니라 행동+결과)</li>\n<li><strong>효과의 법칙(Law of effect)</strong>: <strong>보상이 뒤따르는 행동은 증가(강화)</strong>, <strong>처벌 자극이 뒤따르는 행동은 감소(처벌)</strong>. 시행이 반복될수록 효율성이 증대.</li>\n<li><strong>손다이크(Thorndike, 1898)의 고양이 문제상자(puzzle box)</strong> 실험: 고양이가 상자의 레버를 조작해야 탈출 → 시행을 반복할수록 <strong>탈출 소요 시간이 감소</strong>. 실험을 먼저 제안한 것은 손다이크, 이를 발전시킨 것은 <strong>스키너</strong>.</li>\n</ul>\n<h2>p.18 — 강화, 행동 조성, 계기적 근사법 ⭐⭐⭐</h2>\n<ul>\n<li><strong>강화(reinforcement)</strong>: 조작적 조건형성에서 행동을 <strong>강력하게 만드는(빈도 증가)</strong> 사건/자극. 상황에 따라 보상은 달라질 수 있다.</li>\n<li><strong>스키너 상자(Skinner box)</strong>: 쥐가 레버를 누르면 먹이가 나옴 → 레버 누르는 횟수 증가(강화).</li>\n<li><strong>행동 조성(shaping)</strong>: 보상이나 처벌을 통해 행동을 <strong>원하는 방향으로 유도</strong>. 스키너가 손다이크의 효과의 법칙을 <strong>행동 공학</strong>으로 발전.</li>\n<li><strong>계기적 근사법(method of successive approximations)</strong>: 최종 목표 행동을 학습시키기 위해 <strong>이전 단계의 행동에 적절한 보상</strong>을 주며 단계별로 목표에 다가가게 하는 방법(중간 목표와 보상 설정).</li>\n<li>언어를 사용하지 못하는 동물의 지각·학습 양상을 탐구하는 데도 활용 가능.</li>\n</ul>\n<h2>p.19 — 강화의 유형 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>유형</th>\n<th>정의</th>\n<th>예</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>정적 강화(positive reinforcement)</strong></td>\n<td><strong>보상을 제공</strong>하여 행동 증가</td>\n<td>시험 잘 보면 용돈 올려줌, 과자 줌</td>\n</tr>\n<tr>\n<td><strong>부적 강화(negative reinforcement)</strong></td>\n<td><strong>혐오 자극을 제거</strong>하여 행동 빈도 증가</td>\n<td>가위바위보에서 지면 저녁값을 내는 부담을 없애 주어 내기에 응하게 함, 청소 면제</td>\n</tr>\n</tbody></table>\n<ul>\n<li>⭐ <strong>부적 강화는 처벌이 아니다.</strong> 행동 빈도가 <strong>증가</strong>하면 강화, <strong>감소</strong>하면 처벌. 정적 = 무언가를 <strong>더하는</strong> 것, 부적 = 무언가를 <strong>빼는</strong> 것. (정적/부적 강화 + 정적/부적 처벌 = 4가지)</li>\n<li><strong>약물 중독자는 부적 강화의 강력한 예</strong>(Baker et al., 2004): 도파민 같은 보상 기제도 있지만, 실질적으로 끊지 못하는 이유는 <strong>금단 증상의 고통을 제거</strong>하기 위해 약물 사용이 늘어나기 때문.</li>\n<li><strong>두 강화는 동시에 발생할 수 있다</strong>: 시험을 망쳐 불안한 학생이 불안을 떨치려고(부적 강화) 공부 시간을 늘렸더니 성적이 올라 보상을 받음(정적 강화).</li>\n<li>〔녹음은 여기서 종료 — 이후 슬라이드는 슬라이드 기준〕</li>\n</ul>\n<h2>p.20 — 강화물의 종류: 직접성 ⭐⭐⭐  (녹음 없음, 슬라이드 기준)</h2>\n<ul>\n<li><strong>1차 강화물(primary reinforcer)</strong>: <strong>생물학적 욕구</strong>를 만족시키는 강화 자극. <strong>학습된 것이 아니라 생득적</strong>으로 강화 속성을 지님(예: 고전적 조건화에서의 먹이).</li>\n<li><strong>조건 강화물(conditioned reinforcer, 2차 강화물)</strong>: <strong>1차 강화물과 연합</strong>되어 강화의 힘을 획득한 자극. 고전적 조건화에서 고차 조건형성을 거친 자극들이 포함될 수 있음(행동 빈도를 증가시킨다는 전제).</li>\n</ul>\n<h2>p.21 — 강화물의 종류: 제시 간격 ⭐⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>즉시 강화물</strong>: 행동 수행 후 바로 제공. <strong>지연이 발생하면 학습이 감소</strong>(Austen &amp; Sanderson, 2019). 즉각 피드백 퀴즈가 학습에 유리(Healy et al., 2017). 스키너 상자에서는 보상이 몇 초 이상 지연되면 학습 불가(노트).</li>\n<li><strong>지연 강화물</strong>: 행동 후 일정 시간 뒤 제공. 예: <strong>마시멜로 실험</strong>(<strong>Mischel</strong>) — 만족 지연이 가능한 아동이 추후 사회적으로 높은 성취. 충동 제어 학습 능력은 범죄 행위에도 영향(Akerlund et al., 2016).</li>\n</ul>\n<h2>p.22 — 강화 계획(reinforcement schedule) ⭐⭐⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>강화 계획</strong>: 원하는 반응을 얼마나 자주 강화할지 정의하는 패턴.</li>\n<li><strong>연속 강화계획</strong>: 원하는 반응이 나타날 <strong>때마다</strong> 강화.</li>\n<li><strong>부분(간헐적) 강화계획</strong>: 반응의 <strong>일부에만</strong> 강화. 연속 계획에 비해 <strong>학습은 느리지만 소거 저항도가 높다</strong>.</li>\n<li>반응 수(비율)/제시 간격 × 고정/변동으로 부분 강화계획을 세분화.</li>\n</ul>\n<h2>p.23 — 부분 강화계획의 4유형 ⭐⭐⭐  (녹음 없음)</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>고정 (fixed)</th>\n<th>변동 (variable)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>비율 (ratio)</strong></td>\n<td><strong>고정비율</strong>: 고정된 수의 반응 후 강화 (커피 쿠폰: 10회 1잔 무료)</td>\n<td><strong>변동비율</strong>: 랜덤한 반응 수 후 강화. <strong>소거가 잘 안 됨</strong> (슬롯머신, 낚시꾼)</td>\n</tr>\n<tr>\n<td><strong>간격 (interval)</strong></td>\n<td><strong>고정간격</strong>: 고정된 시간 경과 후 강화. 보상 시점이 가까워질수록 빠른 반응, <strong>급격한 증가 패턴</strong> (정기 할인 행사)</td>\n<td><strong>변동간격</strong>: 가변적 시간 경과 후 강화. <strong>느리지만 매우 꾸준한</strong> 반응 (SNS 좋아요 알림 확인)</td>\n</tr>\n</tbody></table>\n<ul>\n<li>일반적으로 <strong>간격 계획보다 비율 계획</strong>의 반응률이 높고, <strong>고정 계획보다 변동 계획</strong>이 반응이 더 지속적이다(노트).</li>\n</ul>\n<h2>p.24 — 처벌(Punishment) ⭐⭐⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>처벌</strong>: 행동을 <strong>감소</strong>시키는 기제.<ul>\n<li><strong>정적 처벌(제1유형 처벌)</strong>: <strong>혐오 자극을 가하여</strong> 행동 감소.</li>\n<li><strong>부적 처벌(제2유형 처벌)</strong>: <strong>보상 자극을 철회</strong>하여 행동 감소.</li>\n</ul>\n</li>\n<li>노트: 행동을 <strong>증가</strong>시키면 보상 계열, <strong>감소</strong>시키면 처벌 계열. 자극을 <strong>제공</strong>하면 정적, **제거(철회)**하면 부적.</li>\n<li>효과: 범죄율 감소에 실질적 영향을 주는 것은 중형의 위협이 아니라 <strong>신속하고 확실한 처벌</strong>(Darley &amp; Alter, 2013). 엄벌주의보다 <strong>검거율</strong>이 더 효과적.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>자극 제공 (정적)</th>\n<th>자극 제거 (부적)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>행동 증가 (강화)</strong></td>\n<td>정적 강화 (보상 제공)</td>\n<td>부적 강화 (혐오 자극 제거)</td>\n</tr>\n<tr>\n<td><strong>행동 감소 (처벌)</strong></td>\n<td>정적 처벌 (혐오 자극 제공)</td>\n<td>부적 처벌 (보상 철회)</td>\n</tr>\n</tbody></table>\n<h2>p.25–26 — 처벌과 교육 (APA, 2019) ⭐⭐  (녹음 없음)</h2>\n<ul>\n<li>처벌받은 행동은 <strong>망각되는 것이 아니라 억제</strong>될 뿐이며, 이 일시적 억제가 부모의 처벌 행위를 <strong>부적으로 강화</strong>한다(아이가 조용해지면 부모의 처벌이 강화됨).</li>\n<li>체벌은 <strong>적절한 행동의 방향을 제공하지 않고</strong>, 상황 <strong>변별력</strong>만 줄 뿐 행동의 효과적 감소로 이어지지 않는다.</li>\n<li>처벌은 <strong>공포</strong>와 연관: 교사에 대한 공포를 학습하여 학교를 기피(Gershoff et al., 2010). 유럽 대부분 국가·미국 일부 주는 학교·아동보호기관 체벌 금지.</li>\n<li>체벌은 공격을 시범 보임으로써 <strong>공격성 증대</strong>와 연계(MacKenzie et al., 2013), <strong>관찰을 통한 폭력의 학습</strong>(Straus et al., 1997).</li>\n</ul>\n<h2>p.27 — 보상과 처벌의 자녀 교육 활용 ⭐⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>타임아웃(time-out)</strong>: 잘못된 행동에 대한 <strong>부모의 관심이 일종의 강화물</strong>로 작용 → 보상 자극을 배제(<strong>부적 처벌</strong>)하여 긍정적 행동으로 대치(Dadds &amp; Tully, 2019).</li>\n<li><strong>보상 중심의 피드백</strong>: 바람직한 행동 방향을 전달하고 반대 행동을 자연스럽게 감소시킴. 격한 관심보다 담담한 피드백이 교육적으로 효과적(노트).</li>\n</ul>\n<h2>p.28–29 — 조작적 조건형성의 응용과 자기 적용 ⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>응용 분야</strong>: 학교(즉각 피드백, 맞춤형 피드백)·스포츠(단계적 목표, 점진적 성장)·컴퓨터 프로그램(<strong>강화 원리 기반 알고리즘</strong>)·직장(조직심리학, 동기)·가정교육·자기 행동 수정.</li>\n<li><strong>스스로에게 적용하는 법</strong>: 현실적 목표를 측정 가능한 기간으로 설정 → 언제·어디서·어떻게 달성할지 명시 → 행동 빈도 확인 → 바람직한 행동 강화(중간의 즉각적 보상이 동력, Woolley &amp; Fishbach, 2017, 「스스로를 위한 선물」) → <strong>보상을 점진적으로 축소</strong>하여 내적 동기로 행동 변화를 추구.</li>\n</ul>\n<h2>p.30 — 고전적 조건화 VS 조작적 조건화 ⭐⭐⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>공통점</strong>: 연합 학습이며 <strong>획득, 소거, 자발적 회복, 일반화, 변별</strong>을 수반.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>고전적 조건화</th>\n<th>조작적 조건화</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>기본 아이디어</td>\n<td>유기체가 <strong>제어할 수 없는 사건 간</strong> 연합 학습</td>\n<td>유기체가 <strong>행동과 결과 간</strong> 연합 학습</td>\n</tr>\n<tr>\n<td>반응</td>\n<td><strong>비자발적, 자동적</strong></td>\n<td><strong>자발적</strong>, 환경에 조작을 가함</td>\n</tr>\n<tr>\n<td>획득</td>\n<td>중립 자극과 무조건 자극이 연합</td>\n<td>반응을 결과(강화물/처벌)와 연합</td>\n</tr>\n<tr>\n<td>소거</td>\n<td>CS만 제시되면 반응 감소</td>\n<td>강화가 차단되면 반응 감소</td>\n</tr>\n<tr>\n<td>자발적 회복</td>\n<td>휴지기간 후 소거된 CR 재출현</td>\n<td>휴지기간 후 소거된 반응 재출현</td>\n</tr>\n<tr>\n<td>일반화</td>\n<td>CS와 유사한 자극에 반응</td>\n<td>한 상황에서 학습한 반응이 유사 상황에서 발현</td>\n</tr>\n<tr>\n<td>변별</td>\n<td>CS와 다른 자극 구분</td>\n<td>특정 반응만 강화되고 다른 반응은 강화되지 않는 학습</td>\n</tr>\n</tbody></table>\n<h2>p.31 — 관찰 학습(=사회학습): 관찰과 모방 ⭐⭐⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>관찰 학습</strong>: 타 개체의 행동을 **관찰하고 모방(모델링)**하여 학습. 인지 기능이 지원하므로 <strong>인지 학습의 일환</strong>. 관찰 대상에 따라 아동 행동이 영향받음(Bandura, 2017).</li>\n<li><strong>대리 강화와 대리 처벌</strong>: 관찰 대상이 겪는 강화·처벌도 모델링. 보상받는 사람을 볼 때 관찰자의 <strong>보상 시스템 활성화</strong>(Mobbs et al., 2009). 타인이 위험 상황을 안전하게 통과하는 것을 관찰하면 학습된 <strong>공포가 사라짐</strong>(Golkar et al., 2013).</li>\n<li><strong>Bandura et al.(1961)의 오뚝이(보보 인형) 실험</strong>: 성인 모델의 공격 행동을 본 아동이 그대로 모방.</li>\n</ul>\n<h2>p.32–33 — 동물의 관찰 학습과 거울 뉴런의 발견 ⭐⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>동물의 관찰 학습</strong>: 혹등고래의 <strong>꼬리치기 미끼몰이</strong>(Allen et al., 2013), 버빗원숭이의 부모–자녀 먹이 학습(Van de Waal et al., 2013), 맹수(범고래, 치타, 사자)의 사냥법을 어미가 새끼에게 시연.</li>\n<li><strong>거울 뉴런의 발견(리졸라티, 2002, 2006)</strong>: 원숭이 전두엽에 전극을 삽입해 땅콩을 먹으면 버저가 울리도록 설정 → <strong>다른 개체가 땅콩을 먹을 때도</strong> 버저가 울림. 인간 연구자가 아이스크림을 먹는 것을 관찰할 때도 유사한 결과(Blakeslee, 2006).</li>\n</ul>\n<h2>p.34 — 인간의 모방과 학습 ⭐⭐  (녹음 없음)</h2>\n<ul>\n<li>생후 <strong>8~16개월</strong> 아동도 모방을 통한 행동 조성 가능(Marshall &amp; Meltzoff, 2014). 부모뿐 아니라 <strong>TV 모델</strong>도 모방(Meltzoff &amp; Moore, 1997).</li>\n<li><strong>과잉 모방(over-imitation)</strong>: 어른의 <strong>부적절한 행동</strong>조차 모방(Lyons et al., 2007). 모방 학습에 <strong>생득적 요인</strong>이 강하게 작용함을 시사. fMRI로 공감·모방의 신경 탐구.</li>\n</ul>\n<h2>p.35 — 두뇌의 거울 뉴런과 모방, 마음 이론 ⭐⭐⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>거울 뉴런(mirror neuron)</strong>: 특정 행동을 <strong>수행하거나 타인이 그 행동을 관찰할 때</strong> 활성화되는 <strong>전두엽 뉴런</strong>. 모방·관찰 학습의 <strong>신경 토대</strong>, 언어 행동·공감에 영향. 소설을 읽는 것만으로 두뇌 활동 유발(Speer et al., 2009).</li>\n<li><strong>마음 이론(Theory of Mind)</strong>: 타인에게 공감하고 <strong>타인의 심적 상태를 추론</strong>하는 능력. 거울 뉴런에 의한 공감 기제에 기반. (3장 발달 참고)</li>\n<li>실제 통증을 느낄 때와 고통을 상상·관찰할 때 뇌 활성화 영역이 겹침(측두엽 등) → 거울 뉴런의 존재 시사.</li>\n</ul>\n<h2>p.36 — 관찰 학습의 응용: 친사회적 영향 ⭐⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>친사회적 영향(prosocial influence)</strong>: 친사회적 행동의 모방 → 친사회적 컨텐츠 노출이 이타적 행동 증진(Coyne et al., 2018). 기업의 <strong>행동 모델링</strong>을 통한 신입사원 교육(Taylor et al., 2005). 아동은 <strong>부모를 가장 강력한 모델</strong>로 삼아 도덕성 학습(3장 도덕성 발달 참고).</li>\n</ul>\n<h2>p.37 — 관찰 학습의 응용: 반사회적 영향 ⭐⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>반사회적 영향(antisocial influence)</strong>: 가정 폭력에 노출된 아동은 성장 후 공격성(Hays &amp; Carver, 2014). 증오 발언의 반복 노출은 <strong>편견</strong> 형성(Soral et al., 2018). 매체 폭력 → <strong>폭력 시청 효과</strong>(Anderson et al., 2017), <strong>모방 범죄</strong>.</li>\n</ul>\n<h2>p.38 — 번외: 폭력적 게임은 폭력성을 증대시키는가? ⭐  (녹음 없음)</h2>\n<ul>\n<li><strong>대중매체</strong>(TV, 영화)는 관찰 학습의 가장 강력한 원천. 영화 「분노의 질주」 출시 주간 딱지 뗀 운전자 급증(Jena et al., 2018). 폭력적 게임은 <strong>둔감화</strong>를 통해 공격성 증대(Allen &amp; Anderson, 2017).</li>\n<li>그러나 <strong>메타 분석</strong>에서 <strong>출간 편향</strong>을 교정하면 폭력적 게임과 공격 행동의 상관은 <strong>낮다</strong>(Ferguson, 2007a, 2007b, 2015).</li>\n</ul>\n<hr>\n<h2>🎙 실제 수업 기록 (9/29 화, 녹음본 기준)</h2>\n<p>녹음: <code>심리학-1 260929_143411.txt</code>(62분 43초). <strong>슬라이드 1번~19번(강화의 유형 – 정적/부적 강화, 약물 중독의 부적 강화, 두 강화의 동시 발생)까지 진행</strong>하고 &quot;조금 애매한 부분이 있으니 잠깐 쉬었다가 후반 수업 진행&quot;([1:02:36])에서 녹음이 끝난다. 후반(슬라이드 20번 이후)은 녹음 없음.</p>\n<p><strong>📢 시험 안내 (00:00–02:56) ⭐⭐⭐</strong></p>\n<ul>\n<li><strong>문항 유형은 객관식과 단답형 두 가지.</strong> 단답형은 <strong>심리 기제 명칭, 접근법 이름, 모델 이름</strong> 등 <strong>명칭을 쓰는 문제</strong>만 나온다. <strong>개념을 제시하고 특성을 서술하는 장문형 문제는 나오지 않는다.</strong> (&quot;질문이 많이 와서 다시 안내&quot;) ([00:00])</li>\n<li><strong>통계 부분은 범위에서 제외</strong>(공지에도 게시).</li>\n<li><strong>필기구</strong>: <strong>빨간 펜, 연필, 샤프 사용 제한.</strong> 빨간 펜은 교수 채점용, 연필·샤프는 지워지면 무슨 답을 썼는지 증명할 방법이 없기 때문. ([00:56])</li>\n<li>매번 슬라이드가 35장이 넘어 양이 많으므로 <strong>이번 주 수업 후 중요 포인트를 1차로 안내</strong>하고, <strong>다음 주(7주차, 6장)에 나머지 3개 챕터 분량을 정리하는 시간을</strong> 수업 끝나고 갖겠다고 함(녹음 오인식으로 범위 표현이 불명확). ([01:36])</li>\n<li><strong>시험 장소는 이 강의실이 아님.</strong> 컨벤션홀 A구역(E1-101)에서 진행하니 중간고사 주간에 장소를 착각하지 말 것. ([02:36])</li>\n</ul>\n<p><strong>수업 내용 (교수 강조·추가 예시)</strong></p>\n<ul>\n<li><strong>[02:56] 이 장의 &quot;학습&quot;은 공부법이 아니다.</strong> 정보를 장기 유지하는 공부 관련 내용은 다음 주 <strong>기억 챕터</strong>에서 다루고, 오늘의 학습은 습관·경험·행동 패턴이 바뀌는 것.</li>\n<li><strong>[03:59~05:57] 학습 정의</strong>: 경험에 따른 유기체 행동의 변화, 목표는 환경에 대한 적응. <strong>세 양상: 비연합/연합/관찰(인지)</strong>. 오늘은 연합과 관찰 중심.</li>\n<li><strong>[05:57~09:50] 민감화·둔감화</strong>: 소음에 적응하면 둔감화, 더 예민해지면 민감화. 신생아 습관화(3장)와 연결, <strong>신경 가소성</strong>과 뉴런 발화율(4장) 연결.</li>\n<li><strong>[09:50~12:06] 연합 = 두 사건을 묶는 것.</strong> 까마귀 날자 배 떨어지는 우연도 연합. <strong>습관 형성 약 66일(두 달)</strong>.</li>\n<li><strong>[12:06~15:44] 고전 vs 조작.</strong> 번개(섬광)와 천둥소리 예로 &quot;다음 사건 예측&quot;, 조작은 아이가 예의 있게 말하면 과자를 받는 예로 &quot;행동을 결과와 연합&quot;. 환경 조작은 보상과 처벌.</li>\n<li><strong>[15:44~18:00] 인지 학습</strong>: 관찰·언어로 경험하지 못한 것을 학습, 마음 이론·<strong>거울 뉴런</strong>(뒤 슬라이드에서 자세히). 사람만이 아니라 동물에서도 일반적.</li>\n<li><strong>[18:00~21:07] 행동주의</strong>: 내면 과정은 과학적이지 않다는 전제로 심성 개념 폐기, 인지 혁명 전까지 주류. 고전·조작 조건화가 <strong>행동주의를 대표하는 이론</strong>.</li>\n<li><strong>[21:07~26:17] 고전적 조건화 절차·구성요소</strong>: 개에게 먹이(US) → 반응(UR) 확인 → 중립 자극(종소리)을 먼저 제시하고 US를 이어서 제시 반복 → 종소리가 CS. <strong>UR과 CR은 겉으로 같은 행동</strong>(침, 꼬리 흔들기)이나 무엇에 반응하느냐가 다르다.</li>\n<li><strong>[28:08~29:08] ⭐ 제시 순서 중요</strong>: <strong>중립 자극이 먼저, 무조건 자극이 나중.</strong></li>\n<li><strong>[29:08~30:15] 고차 조건형성</strong>: 종소리(CS)를 나팔 소리와 연합, 1차보다 강도가 낮을 수 있음.</li>\n<li><strong>[30:15~33:50] 소거와 자발적 회복</strong>: 소거는 제거가 아니라 <strong>일시적 억압</strong>에 가깝고, 자발적 회복이 증거.</li>\n<li><strong>[33:50~36:53] 일반화·변별</strong>: 종소리 → 트라이앵글·실로폰, 냄새가 비슷한 음식 기피, 「자라 보고 놀란 가슴 솥뚜껑 보고 놀란다」. 변별은 관련 없는 자극에는 반응하지 않는 분별 능력.</li>\n<li><strong>[36:53~43:36] 고전적 조건화의 의의 3가지</strong>(객관적 연구 방법 / 다양한 자극-반응 / 진화적 관점: 혐오·공포), 연합은 학습의 기본 형식, 신경과학적 근거, 의미 네트워크에서 새로운 연결 회로 형성.</li>\n<li><strong>[44:17~48:01] 갈망 치료.</strong> 약물 사용 맥락 단서, 과체중 음식 조건반응, <strong>마운자로·위고비</strong>(교수 본인 사용 경험): 약학적 효과(포만감 유지) + 불쾌한 신체 감각과 음식의 연합으로 섭식량 감소.</li>\n<li><strong>[48:01~48:58] 면역 반응</strong>: 약에 맛을 첨가하면 약효 없이 맛만으로 면역 반응 → 「플라시보 효과가 다른 의미로 발현」.</li>\n<li><strong>[48:58~51:04] 공포 치료 = 노출 치료</strong>: 엘리베이터 공포를 일부러 노출시켜 「공포 반응이 반드시 일어나는 것은 아니다」를 재학습, 일반화된 공포가 지우기 어렵기 때문.</li>\n<li><strong>[51:04~53:42] 조작적 조건화</strong>: 손다이크의 <strong>고양이 탈출 상자</strong>(레버 조작 → 탈출 시간이 줄어듦), <strong>효과의 법칙</strong>. 조작(보상/처벌 조작)이라 조작적 조건화라는 이름이 붙음.</li>\n<li><strong>[53:42~56:43] 강화·스키너 상자·행동 조성·계기적 근사법.</strong> 쥐가 레버를 누르면 먹이. 한 번에 바뀌기 어려운 행동은 여러 단계로 나눠 단계별로 보상.</li>\n<li><strong>[56:43~59:45] 정적 vs 부적 강화.</strong> 스키너는 손다이크의 효과의 법칙을 <strong>행동 공학</strong>으로 발전. 부적 강화(negative reinforcement)가 <strong>처벌과 헷갈리기 쉬우니 주의</strong>: &quot;어디까지나 강화는 강화고 처벌은 처벌&quot;, 행동 빈도가 <strong>증가</strong>하면 강화, <strong>감소</strong>하면 처벌, 더하면 정적/빼면 부적.</li>\n<li><strong>[59:45~1:02:36] ⭐ 약물 중독 = 부적 강화의 강력한 예</strong>(금단 증상 제거), 정적 강화와 부적 강화는 <strong>동시에 가능</strong>(시험을 망쳐 불안한 학생의 공부량 증가 예).</li>\n</ul>\n<hr>\n<h2>명칭 암기표</h2>\n<table>\n<thead>\n<tr>\n<th>명칭 (영문)</th>\n<th>한 줄 정의/단서</th>\n<th>슬라이드</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>학습 (learning)</td>\n<td>경험에 따른 유기체 행동의 영속적 변화</td>\n<td>2</td>\n</tr>\n<tr>\n<td>비연합 학습 (non-associative learning)</td>\n<td>연합을 쓰지 않는 학습: 민감화·둔감화</td>\n<td>2</td>\n</tr>\n<tr>\n<td>민감화 (sensitization)</td>\n<td>자극에 대한 반응 빈도 증대</td>\n<td>2</td>\n</tr>\n<tr>\n<td>둔감화 (habituation)</td>\n<td>자극에 대한 반응 빈도 감소</td>\n<td>2</td>\n</tr>\n<tr>\n<td>신경 가소성 (neural plasticity)</td>\n<td>경험·학습에 따라 신경 회로가 변하는 특성</td>\n<td>2</td>\n</tr>\n<tr>\n<td>연합 (association)</td>\n<td>두 사건·자극을 서로 연결</td>\n<td>3</td>\n</tr>\n<tr>\n<td>고전적 조건화 (classical conditioning)</td>\n<td>무관한 두 자극을 연합해 미래 사건 예측</td>\n<td>4, 7</td>\n</tr>\n<tr>\n<td>조작적 조건화 (operant conditioning)</td>\n<td>반응을 결과와 연합</td>\n<td>4, 17</td>\n</tr>\n<tr>\n<td>인지 학습 (cognitive learning)</td>\n<td>관찰·언어로 경험하지 못한 것을 학습</td>\n<td>5</td>\n</tr>\n<tr>\n<td>행동주의 (behaviorism)</td>\n<td>관찰 가능한 행동만 연구, 심성 개념 폐기</td>\n<td>6</td>\n</tr>\n<tr>\n<td>파블로프 (Pavlov)</td>\n<td>고전적 조건화의 개(먹이–종소리) 실험</td>\n<td>7</td>\n</tr>\n<tr>\n<td>중성 자극 (NS)</td>\n<td>조건형성 전 반응을 유발하지 않는 자극</td>\n<td>8</td>\n</tr>\n<tr>\n<td>무조건자극 (US)</td>\n<td>자동적 반응을 촉발하는 자극</td>\n<td>8</td>\n</tr>\n<tr>\n<td>조건자극 (CS)</td>\n<td>NS가 US와 연합되어 형성된 자극</td>\n<td>8</td>\n</tr>\n<tr>\n<td>무조건반응 (UR)</td>\n<td>US에 대한 자연스러운 반응</td>\n<td>9</td>\n</tr>\n<tr>\n<td>조건반응 (CR)</td>\n<td>CS에 대해 학습으로 나타나는 반응</td>\n<td>9</td>\n</tr>\n<tr>\n<td>고차 조건형성 (higher-order conditioning)</td>\n<td>기존 CS를 새로운 중성 자극과 연합</td>\n<td>10</td>\n</tr>\n<tr>\n<td>소거 (extinction)</td>\n<td>US 없이 CS만 반복 제시 → CR 감소</td>\n<td>11</td>\n</tr>\n<tr>\n<td>자발적 회복 (spontaneous recovery)</td>\n<td>휴지기 후 소거된 CR이 부분 회복</td>\n<td>11</td>\n</tr>\n<tr>\n<td>일반화 (generalization)</td>\n<td>CS와 유사한 자극에도 CR</td>\n<td>12</td>\n</tr>\n<tr>\n<td>변별 (discrimination)</td>\n<td>CS와 무관련 자극을 구분</td>\n<td>12</td>\n</tr>\n<tr>\n<td>의미 점화 (semantic priming)</td>\n<td>두 대상의 관계성 기반 점화</td>\n<td>14</td>\n</tr>\n<tr>\n<td>갈망 치료 (craving treatment)</td>\n<td>단서·맥락 제거/재연합으로 중독·갈망 치료</td>\n<td>15</td>\n</tr>\n<tr>\n<td>반복 노출 치료법 (exposure therapy)</td>\n<td>공포 상황에 반복 노출, 소거 기제 활용</td>\n<td>16</td>\n</tr>\n<tr>\n<td>효과의 법칙 (law of effect)</td>\n<td>보상 뒤 행동 증가, 처벌 뒤 행동 감소</td>\n<td>17</td>\n</tr>\n<tr>\n<td>손다이크 (Thorndike) / 고양이 문제상자</td>\n<td>탈출 시간 감소 실험(1898)</td>\n<td>17</td>\n</tr>\n<tr>\n<td>스키너 상자 (Skinner box)</td>\n<td>쥐가 레버를 누르면 먹이</td>\n<td>18</td>\n</tr>\n<tr>\n<td>강화 (reinforcement)</td>\n<td>행동을 강력하게 만드는 사건/자극</td>\n<td>18</td>\n</tr>\n<tr>\n<td>행동 조성 (shaping)</td>\n<td>보상·처벌로 행동을 원하는 방향으로 유도</td>\n<td>18</td>\n</tr>\n<tr>\n<td>계기적 근사법 (successive approximations)</td>\n<td>단계별 근사 행동에 보상하며 목표에 접근</td>\n<td>18</td>\n</tr>\n<tr>\n<td>정적 강화 (positive reinforcement)</td>\n<td>보상 제공 → 행동 증가</td>\n<td>19</td>\n</tr>\n<tr>\n<td>부적 강화 (negative reinforcement)</td>\n<td>혐오 자극 제거 → 행동 증가 (처벌 아님)</td>\n<td>19</td>\n</tr>\n<tr>\n<td>1차 강화물 (primary reinforcer)</td>\n<td>생물학적 욕구 충족, 생득적</td>\n<td>20</td>\n</tr>\n<tr>\n<td>조건 강화물 / 2차 강화물 (conditioned reinforcer)</td>\n<td>1차 강화물과 연합되어 강화력 획득</td>\n<td>20</td>\n</tr>\n<tr>\n<td>즉시 강화물 / 지연 강화물</td>\n<td>행동 직후 제공 / 일정 시간 뒤 제공</td>\n<td>21</td>\n</tr>\n<tr>\n<td>마시멜로 실험 (marshmallow test)</td>\n<td>만족 지연 능력과 추후 성취 (Mischel)</td>\n<td>21</td>\n</tr>\n<tr>\n<td>연속 강화계획 (continuous)</td>\n<td>반응할 때마다 강화</td>\n<td>22</td>\n</tr>\n<tr>\n<td>부분(간헐적) 강화계획 (partial)</td>\n<td>일부 반응만 강화, 소거 저항도 높음</td>\n<td>22</td>\n</tr>\n<tr>\n<td>고정비율 계획 (fixed-ratio)</td>\n<td>고정된 수의 반응 후 강화 (커피 쿠폰)</td>\n<td>23</td>\n</tr>\n<tr>\n<td>변동비율 계획 (variable-ratio)</td>\n<td>랜덤 반응 수 후 강화 (슬롯머신)</td>\n<td>23</td>\n</tr>\n<tr>\n<td>고정간격 계획 (fixed-interval)</td>\n<td>고정 시간 후 강화 (정기 할인)</td>\n<td>23</td>\n</tr>\n<tr>\n<td>변동간격 계획 (variable-interval)</td>\n<td>가변 시간 후 강화 (SNS 알림)</td>\n<td>23</td>\n</tr>\n<tr>\n<td>처벌 (punishment)</td>\n<td>행동을 감소시키는 기제</td>\n<td>24</td>\n</tr>\n<tr>\n<td>정적 처벌 (제1유형)</td>\n<td>혐오 자극을 가해 행동 감소</td>\n<td>24</td>\n</tr>\n<tr>\n<td>부적 처벌 (제2유형)</td>\n<td>보상을 철회해 행동 감소</td>\n<td>24, 27</td>\n</tr>\n<tr>\n<td>타임아웃 (time-out)</td>\n<td>관심(강화물) 배제로 문제 행동 감소</td>\n<td>27</td>\n</tr>\n<tr>\n<td>관찰 학습 (observational learning) / 사회학습</td>\n<td>타 개체의 행동을 관찰·모방 (모델링)</td>\n<td>31</td>\n</tr>\n<tr>\n<td>대리 강화 / 대리 처벌 (vicarious reinforcement/punishment)</td>\n<td>관찰 대상이 받는 강화·처벌을 모델링</td>\n<td>31</td>\n</tr>\n<tr>\n<td>오뚝이(보보 인형) 실험 (Bandura et al., 1961)</td>\n<td>성인 모델의 공격 행동을 아동이 모방</td>\n<td>31</td>\n</tr>\n<tr>\n<td>거울 뉴런 (mirror neuron)</td>\n<td>행동 수행·관찰 시 모두 활성화되는 전두엽 뉴런 (리졸라티)</td>\n<td>33, 35</td>\n</tr>\n<tr>\n<td>과잉 모방 (over-imitation)</td>\n<td>어른의 부적절한 행동까지 모방</td>\n<td>34</td>\n</tr>\n<tr>\n<td>마음 이론 (theory of mind)</td>\n<td>타인의 심적 상태를 추론하는 능력</td>\n<td>35</td>\n</tr>\n<tr>\n<td>친사회적 영향 / 반사회적 영향</td>\n<td>친/반사회적 행동의 모방</td>\n<td>36, 37</td>\n</tr>\n<tr>\n<td>폭력 시청 효과 (media violence effect)</td>\n<td>매체 폭력 노출의 영향</td>\n<td>37</td>\n</tr>\n<tr>\n<td>출간 편향 (publication bias)</td>\n<td>메타분석에서 교정하면 게임-폭력 상관 낮음</td>\n<td>38</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>시험 대비 핵심 요약</h2>\n<ol>\n<li><strong>학습</strong> = 경험에 따른 행동의 영속적 변화, 목표는 환경 적응. 세 양상: <strong>비연합</strong>(민감화·둔감화) / <strong>연합</strong>(고전적·조작적) / <strong>인지·관찰</strong>. 교수가 이 세 양상을 첫 정의 직후 강조.</li>\n<li><strong>민감화 vs 둔감화</strong>: 반응 빈도 증대 vs 감소. 4장 <strong>감각 순응</strong>·3장 <strong>습관화</strong>와 같은 계열. <strong>신경 가소성</strong>이 바탕.</li>\n<li><strong>고전적 조건화 5요소</strong>: NS → CS, US, UR, CR. <strong>UR과 CR은 겉보기 같은 행동</strong>이지만 자극이 다르다. <strong>NS가 먼저, US가 나중</strong>(순서 역전 시 조건형성 거의 안 됨).</li>\n<li><strong>고차 조건형성</strong>(CS를 새 NS와 연합, 1차보다 약함), <strong>소거</strong>(제거가 아니라 <strong>억압</strong>) vs <strong>자발적 회복</strong>(휴지기 후 부분 회복), <strong>일반화</strong>(유사 자극에 반응, 공포 일반화는 지우기 어려움) vs <strong>변별</strong>(무관련 자극 구분).</li>\n<li><strong>고전적 조건화의 의의</strong>: 객관적 연구 방법, 다양한 자극-반응, 진화적 관점(혐오·공포와 생존). <strong>응용</strong>: 갈망 치료(단서 제거, 마운자로·위고비 예), 면역 반응, 공포 치료(반복 노출, 소거 기제).</li>\n<li><strong>조작적 조건화</strong>: 행동–결과 연합, <strong>효과의 법칙</strong>(손다이크 고양이 문제상자, 탈출 시간 감소) → <strong>스키너</strong>의 <strong>행동 조성</strong>, <strong>계기적 근사법</strong>, 스키너 상자.</li>\n<li><strong>강화 = 행동 증가, 처벌 = 행동 감소.</strong> <strong>정적</strong> = 더한다, <strong>부적</strong> = 뺀다. <strong>부적 강화는 처벌이 아니다</strong>(교수 강조). 정적/부적 강화 + 정적/부적 처벌 4가지. <strong>약물 중독 = 부적 강화</strong>(금단 증상 제거), 두 강화는 <strong>동시에</strong> 가능.</li>\n<li><strong>1차 강화물</strong>(생득적) vs <strong>조건 강화물</strong>(학습된, 1차와 연합). <strong>즉시 vs 지연 강화물</strong>(마시멜로 실험).</li>\n<li><strong>강화 계획</strong>: <strong>연속 vs 부분(간헐)</strong>. 부분은 학습은 느리지만 <strong>소거 저항도 높음</strong>. <strong>고정/변동 × 비율/간격</strong>(커피 쿠폰, 슬롯머신, 정기 할인, SNS 알림). 비율 &gt; 간격 반응률, 변동 &gt; 고정 지속성.</li>\n<li><strong>처벌</strong>: <strong>정적 처벌</strong>(혐오 자극 부여) vs <strong>부적 처벌</strong>(보상 철회, 타임아웃). 효과적 처벌은 <strong>신속·확실</strong>, 체벌의 부작용(공포, 공격성 모델링, 처벌은 억제일 뿐).</li>\n<li><strong>고전적 vs 조작적 비교</strong>: 제어할 수 없는 자극 간 연합(비자발적) vs 행동–결과 연합(자발적). 공통: 획득·소거·자발적 회복·일반화·변별.</li>\n<li><strong>관찰 학습</strong>: 모델링, <strong>대리 강화/처벌</strong>, <strong>오뚝이 실험</strong>(Bandura 1961), 동물의 관찰 학습, <strong>거울 뉴런</strong>(리졸라티, 전두엽), <strong>마음 이론</strong>, <strong>과잉 모방</strong>, 친사회적/반사회적 영향, 폭력적 게임의 영향은 메타분석에서 낮음(출간 편향).</li>\n<li>시험 공지(9/29 재확인): 단답형은 <strong>명칭 쓰기만</strong>, 통계 제외, 빨간 펜·샤프·연필 금지, 시험 장소는 컨벤션홀 A구역.</li>\n</ol>\n","len":20083},{"id":"w7_ch6","title":"7주차 — 6장 기억 정리","desc":"다중 저장고 모형, 작업 기억, 부호화 전략, 망각과 기억 왜곡","ch":"ch6","min":20,"html":"<h1>6장 — 기억 페이지별 해설</h1>\n<p>심리학으로의 여행 (Prof. 이소영) · 마이어스 심리학 개론 13판</p>\n<p>6장의 핵심 질문은 &quot;정보는 어떻게 뇌에 들어가(부호화), 머물고(저장), 다시 나오는가(인출), 그리고 왜 사라지거나 왜곡되는가(망각·기억 구성 오류)&quot;이다. 기억의 측정법 → 모형(다중 저장고·작업 기억·이중 처리) → 각 저장고의 용량/시간 실험 → 부호화 전략 → 뇌 구조 → 인출 단서 → 망각·오류 → 기억 증진법 순으로 진행된다. 5장 수업(9/29) 도입부에서 교수가 &quot;공부 잘하는 방법은 다음 주 기억 챕터에 더 연결된다&quot;고 했으므로, <strong>p.19–25(청크·기억술·위계·간격두기·검증 효과·처리 수준)와 p.41(기억 증진법)</strong> 은 ⭐ 가중.</p>\n<p>페이지 번호 = 슬라이드 번호 (총 41장, 숨김 슬라이드 없음). 슬라이드 18의 &quot;72개&quot;는 &quot;7±2개&quot;의 오타로 보임(조지 밀러 매직 넘버 7).</p>\n<p>시험은 객관식 25 + 단답형 5(명칭 쓰기)이므로 이 장의 명칭 암기표를 특히 챙길 것.</p>\n<hr>\n<h2>p.1 — 표지</h2>\n<p>6장. 기억.</p>\n<h2>p.2 — 기억의 기본 개념: 기억의 정의, 기억과 두뇌 ⭐</h2>\n<ul>\n<li><strong>기억(memory)</strong>: 시간이 경과하여도 지속되는 <strong>학습 · 저장 · 인출</strong>이 가능한 정보. 여러 유형이 있고 유형마다 역할이 다르다.</li>\n<li><strong>알츠하이머(Alzheimer)</strong> 환자는 정상인에 비해 뇌의 밀도·부피가 줄어든다. 기억 문제는 <strong>양방향</strong>: 새 정보를 저장 못 함(<strong>부호화</strong> 문제) / 있는 정보를 못 꺼냄(<strong>인출</strong> 문제).</li>\n<li>연결: 3장(9/15 녹음)에서 교수는 <strong>인지노화</strong>, 알츠하이머(<strong>신경성 치매</strong>, 뉴런의 단백질 조각 잔여물, fMRI 활성 저하), <strong>경도 인지 장애</strong>, 심신 활동·인지 치료로 발현 지연 가능을 언급했고 &quot;기억 챕터에서 다시 다룬다&quot;고 했다.</li>\n</ul>\n<h2>p.3 — 기억을 측정하는 법 (1) ⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>측정법</th>\n<th>내용</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>회상(recall)</strong></td>\n<td>이전에 학습한 내용을 인출하여 그 항목을 <strong>직접 생성</strong></td>\n</tr>\n<tr>\n<td><strong>재인(recognition)</strong></td>\n<td>이전에 학습한 항목을 <strong>확인</strong>하는 절차</td>\n</tr>\n<tr>\n<td><strong>재학습(relearning)</strong></td>\n<td>같은 내용을 다시 학습할 때 습득이 <strong>더 신속</strong>한지 측정 (절약 점수)</td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>에빙하우스의 파지(망각) 곡선</strong>은 재학습 시간의 변화(절약)로 기억을 측정한 것. 되뇌기가 없으면 초반에 절약이 급격히 감소.</li>\n<li>3장 녹음 연결: 노인은 <strong>회상</strong> 과제에서 수행이 떨어지지만 <strong>재인</strong> 과제에서는 노화에 따른 저하가 거의 없다. 혀끝에서 맴도는 현상(설단 현상)도 인출(생성) 문제.</li>\n</ul>\n<h2>p.4 — 기억을 측정하는 법 (2) ⭐</h2>\n<ul>\n<li>회상: <strong>자유 회상 과제</strong>(단서 없이 떠올리기) / <strong>단서 회상 과제</strong>(단서 제공).</li>\n<li>재인: <strong>단어 재인 과제</strong> — 이전에 본 단어면 예, 아니면 아니오. <strong>신/구(New/Old) 반응</strong> 정답률로 측정.</li>\n<li>회상은 생성해야 해서 어렵고, 재인은 확인만 하면 되어 쉽다(객관식이 주관식보다 쉬운 이유).</li>\n</ul>\n<h2>p.5 — 기억 모형: 정보처리 모형 ⭐⭐⭐</h2>\n<ul>\n<li><strong>정보처리 모형(앳킨슨 &amp; 시프린, 1968)</strong> = <strong>다중 저장고 모형</strong>: 감각 기억 → 단기/작업 기억 → 장기 기억의 세 단계.</li>\n<li>세 과정: <strong>부호화</strong>(정보를 뇌에 넣기; 감각→단기/작업, 단기/작업→장기), <strong>저장</strong>(오래 파지), <strong>인출</strong>(장기→단기/작업으로 불러오기).</li>\n<li>[NOTES] 감각 기억의 일부는 무의식적 처리를 거쳐 장기 기억으로 바로 들어갈 수 있다(→ p.11 이중 처리).</li>\n</ul>\n<h2>p.6 — 감각·단기/작업·장기 기억 ⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>기억</th>\n<th>정의</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>감각 기억</strong></td>\n<td>감각 정보를 매우 짧은 시간 기록</td>\n</tr>\n<tr>\n<td><strong>단기 기억</strong></td>\n<td>감각 기억에서 부호화된 정보가 짧게 유지</td>\n</tr>\n<tr>\n<td><strong>작업 기억</strong></td>\n<td>단기 기억을 확장(Baddeley 등, 2002). 입력 정보 + 장기 기억에서 인출한 정보를 <strong>적극적으로 처리</strong></td>\n</tr>\n<tr>\n<td><strong>장기 기억</strong></td>\n<td>의미·사건·지식 등을 <strong>반영속적</strong>으로 저장</td>\n</tr>\n</tbody></table>\n<ul>\n<li>인출을 통해 장기 기억 정보의 일부가 단기/작업 기억으로 소환된다.</li>\n</ul>\n<h2>p.7 — 작업 기억 모형: 단기 기억 vs 작업 기억 ⭐⭐</h2>\n<ul>\n<li>단기 기억 = 정보 <strong>저장</strong>에 주안점. 그러나 저장만으로는 인간 활동을 설명하기 어려워, 출력을 만들어내는 <strong>적극적 기제</strong>로 확장 → <strong>Baddeley</strong>가 <strong>작업 기억</strong> 제안.</li>\n</ul>\n<h2>p.8 — 작업 기억의 구조·구성 요소 ⭐⭐⭐</h2>\n<p><strong>Baddeley &amp; Hitch (1974)</strong> 모델</p>\n<table>\n<thead>\n<tr>\n<th>구성 요소</th>\n<th>역할</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>중앙 집행기(Central Executive)</strong></td>\n<td>장기 기억에서 정보 인출, 과제 집중·<strong>주의 분배</strong>, 나머지 두 하위 시스템 <strong>조정</strong></td>\n</tr>\n<tr>\n<td><strong>시공간 잡기장(Visuospatial sketch pad)</strong></td>\n<td><strong>시각 심상</strong> 기반 정보 유지</td>\n</tr>\n<tr>\n<td><strong>음운 루프(Phonological loop)</strong></td>\n<td><strong>음운 저장소</strong>(정보 유지) + <strong>조음 되뇌기 처리</strong>(정보 쇠잔 방지)</td>\n</tr>\n</tbody></table>\n<h2>p.9 — 작업 기억의 특성</h2>\n<ul>\n<li>선천성 + 후천성: 유전이 약 절반 설명(Knowles 등, 2014). 환경 영향도 있어 스트레스에 노출된 아동은 후에 작업 기억이 저하(Goodman 등, 2019). <strong>일시적 심리적 피로</strong>로도 감소(Garrison 등, 2019).</li>\n</ul>\n<h2>p.10 — 번외: N-Back 과제 (작업 기억 측정)</h2>\n<ul>\n<li><strong>N-Back 과제</strong>: 현재 자극이 <strong>N회 이전</strong> 자극과 같은지 판단. 1~3 Back. 정보의 <strong>유지와 조작(비교)</strong> 을 모두 요구하므로 작업 기억 측정에 적합.</li>\n</ul>\n<h2>p.11 — 이중 궤적 기억: 자동/통제 처리 ⭐⭐</h2>\n<ul>\n<li>다중 저장고 모형은 <strong>외현 기억</strong>의 처리에 초점. 그러나 일부는 무의식적으로 직접 장기 기억에 부호화된다.<table>\n<thead>\n<tr>\n<th></th>\n<th>자동 처리(automatic processing)</th>\n<th>통제 처리(controlled processing)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>의식적 자각</td>\n<td>없이 발생</td>\n<td>주의·자각 필요</td>\n</tr>\n<tr>\n<td>연관</td>\n<td><strong>암묵 기억</strong> 형성</td>\n<td><strong>외현 기억</strong> 형성</td>\n</tr>\n</tbody></table>\n</li>\n</ul>\n<h2>p.12 — 암묵 기억 ⭐⭐</h2>\n<ul>\n<li><strong>암묵 기억(implicit memory)</strong>: 의식적 노력 없이 처리되거나 기술하기 어려운 정보. 하위: <strong>절차 기억</strong>(행동 수행 과정), <strong>고전적 조건화</strong>(사건 간 연합). 공간·시간·사건 빈도는 자동 처리 → 다른 부분에 의식적 노력을 쓸 수 있음.</li>\n</ul>\n<h2>p.13 — 외현 기억 ⭐⭐</h2>\n<ul>\n<li><strong>외현 기억(explicit memory)</strong>: 의식적 자각으로 서술 가능. <strong>일화 기억</strong>(경험·사건) / <strong>의미 기억</strong>(지식). 어떤 처리가 자동화되기 전에는 외현 기억 단계를 먼저 거친다.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>헷갈리는 쌍</th>\n<th>일화 기억</th>\n<th>의미 기억</th>\n<th>절차 기억</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>분류</td>\n<td>외현</td>\n<td>외현</td>\n<td>암묵</td>\n</tr>\n<tr>\n<td>예</td>\n<td>어제 점심에 뭘 먹었는지</td>\n<td>프랑스의 수도는 파리</td>\n<td>자전거 타기</td>\n</tr>\n</tbody></table>\n<h2>p.14–15 — 감각 기억의 유지 시간과 용량: Sperling(1960) ⭐⭐⭐</h2>\n<ul>\n<li>50ms 동안 9개 글자(3×3) 제시.<ul>\n<li><strong>전체 보고법</strong>: 다 보고 → 약 4개만 회상.</li>\n<li><strong>부분 보고법</strong>: 한 줄만(소리 단서) 보고 → 3개 전부 회상, 어느 줄이든 가능 → 순간적으로는 더 많이 저장돼 있음.</li>\n<li><strong>지연 보고법</strong>: 단서 소리를 0.5–1초 지연 → 수행 저하.</li>\n</ul>\n</li>\n<li>결론: 감각 기억 용량 <strong>3~4개 상한</strong>, 유지 시간 <strong>0.5~1초</strong>. 청각(<strong>반향 기억</strong>)도 유사(Cowan, 1988).</li>\n</ul>\n<h2>p.16–17 — 단기 기억의 유지 시간: Peterson &amp; Peterson(1959) ⭐⭐⭐</h2>\n<ul>\n<li>철자 3개 제시 → 3씩 빼는 암산(되뇌기 방지) → 3~18초 뒤 회상.</li>\n<li>시간이 길수록 회상률 감소, <strong>약 12초</strong>면 10% 미만. 되뇌기가 없으면 단기 기억 유지 시간은 <strong>약 12초</strong>. 암산은 <strong>통제 처리(되뇌기)를 막기 위한 것</strong>.</li>\n</ul>\n<h2>p.18 — 매직 넘버 7 (조지 밀러, 1956) ⭐⭐⭐</h2>\n<ul>\n<li>단기 기억 용량 <strong>7±2개</strong>(슬라이드 표기 &quot;72개&quot;는 오타). 철자·단어는 보통 5~6개(Baddeley 등, 1985). 정보 유형에 따라 차이. <strong>숫자 폭 과제</strong>로 측정.</li>\n<li>작업 기억 용량은 <strong>젊은 성인 &gt; 아동·노인</strong>. 과제를 번갈아 하면 전환 비용으로 효율 감소.</li>\n</ul>\n<h2>p.19 — 통제 처리 전략: 청크 만들기 ⭐⭐⭐</h2>\n<ul>\n<li><strong>청크(chunk)</strong>: 전체 정보에서 뽑은 의미 있는 부분 집합/단위. <strong>청크화(chunking)</strong> 하면 기존 단기 기억 용량보다 더 많은 정보 저장 가능. 예: 전화번호, 계좌번호. 낱자→글자 묶음→단어→문장→구.</li>\n</ul>\n<h2>p.20 — 기억술(Mnemonics) ⭐⭐</h2>\n<ul>\n<li>보조 수단(<strong>기억술</strong>)이 유지를 돕고, <strong>단서</strong> 제공이 인출을 촉진. <strong>단어의 구체성 효과(word concreteness effect)</strong>: 추상어(사랑)보다 구체어(사과)가 기억하기 쉽다. 예: &quot;My Very Educated Mother Just Served Us Noodles&quot;(행성 순서).</li>\n</ul>\n<h2>p.21 — 위계 구성 ⭐⭐</h2>\n<ul>\n<li><strong>위계 구성(hierarchies)</strong>: 정보를 층위별로(광의 개념→협의 개념) 분류해 기억. 지식 구조 형성·<strong>인출 효율</strong> 향상. 예: 단어 범주, 교재의 대제목/소제목. 범주가 인출 단서로 작용.</li>\n</ul>\n<h2>p.22 — 분산 훈련: 간격두기 효과 ⭐⭐⭐</h2>\n<ul>\n<li><strong>간격두기 효과(spacing effect)</strong>: 학습 시점 사이에 간격을 두면 기억이 오래 간다. 벼락치기가 비효율적인 이유. <strong>응고화(consolidation)</strong>(학습 내용을 더 강건한 형태로 변환)와 관련. 심리학에서 가장 신뢰할 수 있는 결과 중 하나(Stafford &amp; Dewar, 2014).</li>\n</ul>\n<h2>p.23 — 검증 효과 ⭐⭐⭐</h2>\n<ul>\n<li><strong>검증 효과(testing effect)</strong>: 인출 연습(퀴즈·모의고사)이 단순 반복보다 기억을 더 오래 유지. 적극적 처리가 수반되기 때문. [NOTES] 모의고사는 시험 <strong>맥락 정보</strong>까지 같이 학습되어 실전 인출이 쉬워지는 부가 효과.</li>\n</ul>\n<h2>p.24 — 정보의 처리 수준 ⭐⭐⭐</h2>\n<ul>\n<li><strong>얕은 처리(shallow)</strong>: 글자·형태 등 기초 수준. <strong>깊은 처리(deep)</strong>: <strong>의미</strong> 기반. 깊을수록 파지 우수(<strong>Craik &amp; Tulving, 1975</strong>).</li>\n<li>예시 단어 &#39;다과&#39;: 1) 형태(고딕체인가?) 2) 소리(운율) 3) 의미(문장에 적합한가?) → 의미 처리 시 회상 최고.</li>\n<li>[NOTES] 비판: 무엇이 깊은 처리인지 독립적 정의가 없어 <strong>순환적 추론</strong>의 위험.</li>\n</ul>\n<h2>p.25 — 개인적으로 의미 있게: 자기참조 효과 ⭐⭐</h2>\n<ul>\n<li><strong>자기참조 효과(self-reference effect)</strong>: 정보를 자신과 연관시키면 회상 상승(Taylor &amp; Garry, 2019). 개인주의 문화권은 자신 관련 정보에 국한, <strong>집단주의 문화권</strong>은 자기 + 가족 관련 정보를 동일하게 잘 기억(Sparks 등, 2016). <strong>칵테일 파티 효과</strong>와 유사(자기 관련 정보에 주의 집중).</li>\n</ul>\n<h2>p.26 — 기억의 신경학 ⭐⭐</h2>\n<ul>\n<li><strong>래슐리(1950)</strong>: 쥐의 뇌 특정 영역이 손상돼도 기억이 부분 유지 → 기억은 여러 영역에 <strong>분산 표상</strong>(분산 표상의 원리). 기억 유형마다 관여 영역이 다르다.</li>\n</ul>\n<h2>p.27 — 외현 기억 시스템: 전두엽과 해마 ⭐⭐⭐</h2>\n<ul>\n<li><strong>해마</strong>: 외현 기억의 <strong>저장(형성)</strong> 담당, 과정 = <strong>기억 응고화</strong>. <strong>수면</strong>이 응고화를 지원(간격두기 효과와 연결). 인출된 일화/의미 기억이 작업 기억으로 가면 <strong>전전두엽</strong>이 작업 기억 유지 담당.</li>\n<li>[NOTES] 해마는 형성에 핵심이지만 장기 저장 자체는 아님(&quot;저장 버튼을 눌러 하드디스크로 보내는 역할&quot;). 전두엽은 엄밀히 작업 기억 유지 영역.</li>\n</ul>\n<h2>p.28 — 암묵 기억 체계: 소뇌와 기저 신경절 ⭐⭐⭐</h2>\n<ul>\n<li>해마·전두엽이 손상돼도 암묵 기억은 정상 작동. <strong>소뇌</strong>: 파블로프 조건형성. <strong>기저 신경절</strong>: 기술·행동의 <strong>절차 기억</strong> 형성.</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>영역</th>\n<th>담당</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>해마</td>\n<td>외현 기억 형성·응고화</td>\n</tr>\n<tr>\n<td>전(前)전두엽</td>\n<td>작업 기억 유지</td>\n</tr>\n<tr>\n<td>소뇌</td>\n<td>고전적 조건형성</td>\n</tr>\n<tr>\n<td>기저 신경절</td>\n<td>절차 기억</td>\n</tr>\n<tr>\n<td>편도체</td>\n<td>정서 기억</td>\n</tr>\n</tbody></table>\n<h2>p.29 — 정서 관련 기억 ⭐⭐⭐</h2>\n<ul>\n<li><strong>편도체(amygdala)</strong>: 정서 → 스트레스 호르몬 분비 → 편도체가 전두엽·기저신경절의 기억 흔적을 활성화 → 더 강력하고 신뢰할 수 있는 기억.</li>\n<li><strong>섬광 기억(flashbulb memory)</strong>: 정서적으로 중대한 사건의 선명한 기억. 확신도가 높은 이유는 부분적으로 <strong>되뇌기</strong> 때문(Hirst &amp; Phelps, 2016). [NOTES] 편도체의 대표 기능은 공포 형성과 회피 반응.</li>\n</ul>\n<h2>p.30 — 인출 단서와 점화 ⭐⭐⭐</h2>\n<ul>\n<li><strong>인출 단서(retrieval cue)</strong>: 인출을 돕는 추가 자극. 지식이 <strong>네트워크</strong> 형태로 연결되어 있음을 시사. <strong>최선의 인출 단서는 부호화 때 형성된 연합</strong>(환경·맥락·정서).</li>\n<li><strong>점화(priming)</strong>: 무의식적·자각 불가능한 연합 활성화(<strong>암묵 기억</strong>의 한 종류). 예: 병원 → 약국(의미 관련) vs 학원.</li>\n</ul>\n<h2>p.31 — 맥락/상태 의존 기억 ⭐⭐⭐</h2>\n<ul>\n<li><strong>맥락 의존 기억</strong> / <strong>상태 의존 기억(기분 부합 기억)</strong>: 형성될 때와 유사한 조건에서 더 잘 인출. 좋은/나쁜 기분과 <strong>일관된</strong> 기억을 회상하는 경향(Gaddy &amp; Ingram, 2014).</li>\n<li><strong>부호화 명세성 원리(encoding specificity principle)</strong>: 특정 기억에 국한된 단서·맥락이 회상에 가장 효과적(Godden &amp; Baddely, 슬라이드 표기).</li>\n<li>5장 연결: 9/29 수업에서 교수가 학습 상황과 기억이 연합된다는 내용을 &quot;다음 주 기억 챕터에서 한 번 더 다룰 것&quot;이라고 예고.</li>\n</ul>\n<h2>p.32 — 계열 위치 효과 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>초두 효과(primacy)</th>\n<th>최신 효과(recency)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>내용</td>\n<td>목록의 <strong>초반</strong>을 잘 기억</td>\n<td>목록의 <strong>마지막</strong>을 잘 기억</td>\n</tr>\n<tr>\n<td>이유</td>\n<td>되뇌기 여유가 많음, 다른 내용의 간섭 적음</td>\n<td>단기/작업 기억에 남아 있어서, 시간이 지나면 <strong>쇠퇴해 사라짐</strong></td>\n</tr>\n<tr>\n<td>관련 저장고</td>\n<td>장기 기억</td>\n<td>단기/작업 기억</td>\n</tr>\n</tbody></table>\n<h2>p.33 — 망각의 발생 시점, 기억 상실증 ⭐⭐⭐</h2>\n<ul>\n<li>망각은 <strong>부호화와 인출 모두</strong>에서 발생.</li>\n<li><strong>순행성 기억상실증(anterograde)</strong>: 새로운 의식적 기억 형성 불가. <strong>환자 H.M.</strong>: 간질 발작 치료로 <strong>해마 제거</strong>.</li>\n<li><strong>역행성 기억상실증(retrograde)</strong>: 장기 기억에 저장된 옛 정보 인출 불가.</li>\n<li>외현 기억을 못 만들어도 절차 기억 같은 <strong>암묵 기억</strong>은 형성 가능(Xu &amp; Corkin, 2001).</li>\n</ul>\n<h2>p.34 — 부호화 실패 / 재응고화와 망각 ⭐⭐</h2>\n<ul>\n<li><strong>부호화 실패</strong>: 주의를 못 받아 유실되거나 장기 기억 부호화 실패. 망각한 과정을 기억할 수 없음. 노령층의 기억 저하는 부호화 실패와 연관(Grady 등, 1995).</li>\n<li>인출 직후의 기억은 취약 → 재부호화로 다시 저장.</li>\n</ul>\n<h2>p.35 — 저장 소멸 ⭐⭐</h2>\n<ul>\n<li>이미 저장된 정보도 잊는다. <strong>에빙하우스(1885) 망각 곡선</strong>: 학습 직후 급락 후 점차 안정. <strong>Bahrick(1984)</strong> 스페인어 망각 곡선도 유사. 물리적 <strong>기억 흔적</strong>이 서서히 소멸.</li>\n</ul>\n<h2>p.36 — 인출 실패: 순행 간섭과 역행 간섭 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>순행 간섭(proactive)</th>\n<th>역행 간섭(retroactive)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>방향</td>\n<td><strong>옛</strong> 학습 → <strong>새</strong> 정보 회상 방해</td>\n<td><strong>새</strong> 학습 → <strong>옛</strong> 정보 회상 방해</td>\n</tr>\n<tr>\n<td>예</td>\n<td>옛 전화번호 때문에 새 번호가 안 외워짐</td>\n<td>새 번호를 외운 뒤 옛 번호가 생각 안 남</td>\n</tr>\n</tbody></table>\n<ul>\n<li>간섭은 정보를 정리하는 과정에서의 옛 정보-새 정보 상호작용.</li>\n</ul>\n<h2>p.37 — Jenkins &amp; Dallenbach(1924) ⭐⭐⭐</h2>\n<ul>\n<li>학습 직후 <strong>수면</strong>을 취한 집단이 깨어 있던 집단보다 회상률이 유의하게 높음 → 수면 중에는 새 정보 유입이 없어 <strong>역행 간섭</strong> 감소. 망각은 소멸뿐 아니라 새 정보에 의한 간섭·억제의 결과.</li>\n</ul>\n<h2>p.38 — 재응고화 ⭐⭐⭐</h2>\n<ul>\n<li><strong>재응고화(reconsolidation)</strong>: 저장된 기억이 인출된 후 다시 저장되는 과정. 인출 직후 취약·변형 쉬움. 인출할 때마다 원래 기억이 조금씩 수정된 기억으로 대치될 가능성 → &quot;소문이 와전되는 이유&quot;, 목격자 진술 신빙성 문제.</li>\n</ul>\n<h2>p.39 — 오정보 효과 ⭐⭐⭐</h2>\n<ul>\n<li><strong>오정보 효과(misinformation effect)</strong>: 잘못된 정보를 주면 자신이 본 것과 달라도 맞다고 보고(Anglada-Tort 등, 2019). <strong>Loftus &amp; Palmer(1974)</strong>: 질문 방식(접촉 사고 vs 충돌 사고)에 따라 속도 추정 변화. 절반쯤이 취약(Brewin &amp; Andrews, 2017). 거짓 암시는 이후 행동에도 영향(Geraerts 등, 2008). [NOTES] 목격자 진술이 물적 증거보다 증명력이 약한 이유.</li>\n</ul>\n<h2>p.40 — 상상력 효과, 출처 기억상실 ⭐⭐⭐</h2>\n<ul>\n<li><strong>상상력 효과(imagination inflation)</strong>: 잘못된 정보를 반복 상상하면 실제 일어났다고 믿음. 상상하는 뇌 영역과 실제 지각하는 영역이 <strong>중첩</strong>되기 때문(Wade 등, 2018).</li>\n<li><strong>출처 기억상실(source amnesia)</strong>: 정보를 획득한 시점·출처를 잘못 기억(<strong>오귀인</strong>).</li>\n</ul>\n<h2>p.41 — 기억 증진법 ⭐⭐⭐</h2>\n<ol>\n<li>반복과 테스트: <strong>간격두기 효과 + 검증 효과</strong> 병행.</li>\n<li>의미 있는 내용으로 <strong>조직화</strong>: 연합을 만들어 인출 단서망 구성.</li>\n<li><strong>기억술</strong> 도구: 선명한 이미지 + <strong>청크화</strong>.</li>\n<li><strong>순행/역행 간섭 최소화</strong>: 비슷한 주제를 병행 학습하지 말기.</li>\n<li><strong>충분한 수면</strong>: 수면 부족은 장기 기억 응고화 방해(Lo 등, 2016).</li>\n</ol>\n<hr>\n<h2>🎙 실제 수업 기록 (10/6 화, 녹음본 기준)</h2>\n<p>10/6 수업 예정 — 녹음 도착 시 추가. (참고: 9/29 수업에서 교수는 &quot;공부 잘하는 방법은 학습 장보다 다음 주 기억 챕터에 더 연결&quot;된다고 예고, 수업 후 서막~6장 중요 포인트 정리 시간을 갖겠다고 함. 9/15 녹음에서는 회상 vs 재인의 노화 효과, 알츠하이머·경도 인지 장애를 다룸.)</p>\n<hr>\n<h2>명칭 암기표</h2>\n<table>\n<thead>\n<tr>\n<th>명칭 (영문)</th>\n<th>한 줄 정의/단서</th>\n<th>슬라이드</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>기억 (memory)</td>\n<td>시간이 지나도 지속되는 학습·저장·인출 정보</td>\n<td>2</td>\n</tr>\n<tr>\n<td>알츠하이머</td>\n<td>뇌 밀도·부피 감소, 부호화·인출 양방향 문제</td>\n<td>2</td>\n</tr>\n<tr>\n<td>회상 (recall)</td>\n<td>학습한 항목을 직접 생성</td>\n<td>3, 4</td>\n</tr>\n<tr>\n<td>자유 회상 / 단서 회상</td>\n<td>단서 없이 / 단서를 주고 떠올리기</td>\n<td>4</td>\n</tr>\n<tr>\n<td>재인 (recognition)</td>\n<td>학습한 항목인지 확인</td>\n<td>3, 4</td>\n</tr>\n<tr>\n<td>신/구(New/Old) 반응</td>\n<td>단어 재인 과제의 응답</td>\n<td>4</td>\n</tr>\n<tr>\n<td>재학습 (relearning)</td>\n<td>재학습 시 습득이 빨라진 정도(절약)</td>\n<td>3</td>\n</tr>\n<tr>\n<td>파지(망각) 곡선 / 에빙하우스</td>\n<td>재학습 시간 기반 기억 측정</td>\n<td>3, 35</td>\n</tr>\n<tr>\n<td>정보처리 모형 = 다중 저장고 모형 (앳킨슨 &amp; 시프린, 1968)</td>\n<td>감각→단기/작업→장기 3단계</td>\n<td>5</td>\n</tr>\n<tr>\n<td>부호화 / 저장 / 인출 (encoding/storage/retrieval)</td>\n<td>넣기 / 유지 / 꺼내기</td>\n<td>5</td>\n</tr>\n<tr>\n<td>감각 기억 (sensory memory)</td>\n<td>매우 짧은 감각 기록 (0.5<del>1초, 3</del>4개)</td>\n<td>6, 15</td>\n</tr>\n<tr>\n<td>단기 기억 (short-term memory)</td>\n<td>짧게 유지 (약 12초, 7±2)</td>\n<td>6, 17, 18</td>\n</tr>\n<tr>\n<td>작업 기억 (working memory, Baddeley)</td>\n<td>정보를 적극 처리하는 확장된 단기 기억</td>\n<td>6, 7</td>\n</tr>\n<tr>\n<td>장기 기억 (long-term memory)</td>\n<td>반영속 저장</td>\n<td>6</td>\n</tr>\n<tr>\n<td>중앙 집행기 (central executive)</td>\n<td>주의 분배, 하위 시스템 조정</td>\n<td>8</td>\n</tr>\n<tr>\n<td>시공간 잡기장 (visuospatial sketch pad)</td>\n<td>시각 심상 유지</td>\n<td>8</td>\n</tr>\n<tr>\n<td>음운 루프 (phonological loop)</td>\n<td>음운 저장소 + 조음 되뇌기</td>\n<td>8</td>\n</tr>\n<tr>\n<td>음운 저장소 / 조음 되뇌기 처리</td>\n<td>정보 유지 / 쇠잔 방지</td>\n<td>8</td>\n</tr>\n<tr>\n<td>N-Back 과제</td>\n<td>N회 전 자극과 동일한지 판단, 작업 기억 측정</td>\n<td>10</td>\n</tr>\n<tr>\n<td>자동 처리 (automatic processing)</td>\n<td>무의식적 부호화, 암묵 기억과 연관</td>\n<td>11</td>\n</tr>\n<tr>\n<td>통제 처리 (controlled processing)</td>\n<td>주의·자각 필요, 외현 기억과 연관</td>\n<td>11</td>\n</tr>\n<tr>\n<td>암묵 기억 (implicit memory)</td>\n<td>의식 없이 처리, 기술 어려움</td>\n<td>12</td>\n</tr>\n<tr>\n<td>절차 기억 (procedural memory)</td>\n<td>행동 수행 과정</td>\n<td>12</td>\n</tr>\n<tr>\n<td>고전적 조건화 (classical conditioning)</td>\n<td>사건 간 연합, 암묵 기억</td>\n<td>12</td>\n</tr>\n<tr>\n<td>외현 기억 (explicit memory)</td>\n<td>의식적 자각으로 서술 가능</td>\n<td>13</td>\n</tr>\n<tr>\n<td>일화 기억 (episodic memory)</td>\n<td>경험·사건 기억</td>\n<td>13</td>\n</tr>\n<tr>\n<td>의미 기억 (semantic memory)</td>\n<td>지식 정보</td>\n<td>13</td>\n</tr>\n<tr>\n<td>Sperling(1960) 실험</td>\n<td>감각 기억의 용량·시간</td>\n<td>14, 15</td>\n</tr>\n<tr>\n<td>전체 보고법 / 부분 보고법 / 지연 보고법</td>\n<td>9개 다 / 한 줄(소리 단서) / 단서 지연</td>\n<td>14, 15</td>\n</tr>\n<tr>\n<td>반향 기억 (echoic memory)</td>\n<td>청각 감각 기억 (Cowan, 1988)</td>\n<td>15</td>\n</tr>\n<tr>\n<td>Peterson &amp; Peterson(1959)</td>\n<td>단기 기억 유지 시간 약 12초</td>\n<td>16, 17</td>\n</tr>\n<tr>\n<td>매직 넘버 7 (조지 밀러, 1956)</td>\n<td>단기 기억 용량 7±2</td>\n<td>18</td>\n</tr>\n<tr>\n<td>숫자 폭 과제 (digit span)</td>\n<td>단기 기억 용량 측정</td>\n<td>18</td>\n</tr>\n<tr>\n<td>청크 (chunk) / 청크화 (chunking)</td>\n<td>의미 있는 단위로 묶기</td>\n<td>19</td>\n</tr>\n<tr>\n<td>기억술 (mnemonics)</td>\n<td>보조 수단 활용 (예: My Very Educated Mother…)</td>\n<td>20</td>\n</tr>\n<tr>\n<td>단어의 구체성 효과 (word concreteness effect)</td>\n<td>구체어 &gt; 추상어</td>\n<td>20</td>\n</tr>\n<tr>\n<td>위계 구성 (hierarchies)</td>\n<td>층위별 분류</td>\n<td>21</td>\n</tr>\n<tr>\n<td>간격두기 효과 (spacing effect) / 분산 훈련</td>\n<td>학습 시점 분산</td>\n<td>22</td>\n</tr>\n<tr>\n<td>응고화 (consolidation)</td>\n<td>학습 내용을 강건한 형태로 변환</td>\n<td>22, 27</td>\n</tr>\n<tr>\n<td>검증 효과 (testing effect)</td>\n<td>인출 연습이 단순 반복보다 효과적</td>\n<td>23</td>\n</tr>\n<tr>\n<td>얕은 처리 / 깊은 처리 (shallow/deep processing)</td>\n<td>형태·소리 / 의미 (Craik &amp; Tulving, 1975)</td>\n<td>24</td>\n</tr>\n<tr>\n<td>자기참조 효과 (self-reference effect)</td>\n<td>자신과 연관 지으면 회상 상승</td>\n<td>25</td>\n</tr>\n<tr>\n<td>칵테일 파티 효과</td>\n<td>자기 관련 정보에 주의 집중</td>\n<td>25</td>\n</tr>\n<tr>\n<td>래슐리 (Lashley, 1950) / 분산 표상</td>\n<td>기억은 여러 영역에 분산</td>\n<td>26, 27</td>\n</tr>\n<tr>\n<td>해마 (hippocampus)</td>\n<td>외현 기억 형성·응고화</td>\n<td>27</td>\n</tr>\n<tr>\n<td>전전두엽</td>\n<td>작업 기억 유지</td>\n<td>27</td>\n</tr>\n<tr>\n<td>소뇌 (cerebellum)</td>\n<td>파블로프 조건형성</td>\n<td>28</td>\n</tr>\n<tr>\n<td>기저 신경절 (basal ganglia)</td>\n<td>절차 기억</td>\n<td>28</td>\n</tr>\n<tr>\n<td>편도체 (amygdala)</td>\n<td>정서 기억, 공포</td>\n<td>29</td>\n</tr>\n<tr>\n<td>섬광 기억 (flashbulb memory)</td>\n<td>정서적으로 중대한 사건의 선명한 기억</td>\n<td>29</td>\n</tr>\n<tr>\n<td>인출 단서 (retrieval cue)</td>\n<td>인출을 돕는 추가 자극</td>\n<td>30</td>\n</tr>\n<tr>\n<td>점화 (priming)</td>\n<td>무의식적 연합 활성화</td>\n<td>30</td>\n</tr>\n<tr>\n<td>맥락 의존 기억 (context-dependent)</td>\n<td>부호화 때와 유사한 환경에서 잘 인출</td>\n<td>31</td>\n</tr>\n<tr>\n<td>상태 의존 기억 = 기분 부합 기억 (state-dependent / mood-congruent)</td>\n<td>현재 기분과 일치하는 기억 회상</td>\n<td>31</td>\n</tr>\n<tr>\n<td>부호화 명세성 원리 (encoding specificity principle)</td>\n<td>기억에 특정한 단서가 가장 효과적</td>\n<td>31</td>\n</tr>\n<tr>\n<td>초두 효과 (primacy effect)</td>\n<td>목록 초반을 잘 기억</td>\n<td>32</td>\n</tr>\n<tr>\n<td>최신 효과 (recency effect)</td>\n<td>목록 마지막을 잘 기억</td>\n<td>32</td>\n</tr>\n<tr>\n<td>순행성 기억상실증 (anterograde amnesia)</td>\n<td>새 기억 형성 불가</td>\n<td>33</td>\n</tr>\n<tr>\n<td>역행성 기억상실증 (retrograde amnesia)</td>\n<td>옛 기억 인출 불가</td>\n<td>33</td>\n</tr>\n<tr>\n<td>환자 H.M.</td>\n<td>해마 제거 → 순행성 기억상실</td>\n<td>33</td>\n</tr>\n<tr>\n<td>부호화 실패 (encoding failure)</td>\n<td>주의 부족·부호화 실패로 인한 망각</td>\n<td>34</td>\n</tr>\n<tr>\n<td>저장 소멸 (storage decay)</td>\n<td>기억 흔적이 서서히 소멸</td>\n<td>35</td>\n</tr>\n<tr>\n<td>순행 간섭 (proactive interference)</td>\n<td>옛 것이 새 것 방해</td>\n<td>36</td>\n</tr>\n<tr>\n<td>역행 간섭 (retroactive interference)</td>\n<td>새 것이 옛 것 방해</td>\n<td>36</td>\n</tr>\n<tr>\n<td>Jenkins &amp; Dallenbach(1924)</td>\n<td>학습 직후 수면 → 역행 간섭 감소</td>\n<td>37</td>\n</tr>\n<tr>\n<td>재응고화 (reconsolidation)</td>\n<td>인출 후 재저장 시 변형</td>\n<td>34, 38</td>\n</tr>\n<tr>\n<td>오정보 효과 (misinformation effect) / Loftus &amp; Palmer(1974)</td>\n<td>질문 방식이 회상을 바꿈</td>\n<td>39</td>\n</tr>\n<tr>\n<td>상상력 효과 (imagination inflation)</td>\n<td>반복 상상 → 실제라고 믿음</td>\n<td>40</td>\n</tr>\n<tr>\n<td>출처 기억상실 (source amnesia)</td>\n<td>정보 출처의 오귀인</td>\n<td>40</td>\n</tr>\n<tr>\n<td>기억 증진법</td>\n<td>간격+테스트, 조직화, 기억술, 간섭 최소화, 수면</td>\n<td>41</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>시험 대비 핵심 요약</h2>\n<ol>\n<li>기억 측정: <strong>회상</strong>(생성) &gt; 어려움, <strong>재인</strong>(확인) &gt; 쉬움, <strong>재학습</strong>(절약). 파지 곡선 = 재학습 기반(에빙하우스).</li>\n<li><strong>다중 저장고 모형</strong>(앳킨슨 &amp; 시프린): 감각→단기/작업→장기. 부호화·저장·인출.</li>\n<li>감각 기억(Sperling): 3<del>4개, 0.5</del>1초. 단기 기억: 약 12초(Peterson &amp; Peterson), 7±2(밀러). 청크로 확장.</li>\n<li><strong>작업 기억</strong>(Baddeley &amp; Hitch): 중앙 집행기 + 시공간 잡기장 + 음운 루프(저장소·조음 되뇌기). 측정은 N-Back.</li>\n<li><strong>자동 처리 → 암묵 기억(절차 기억, 조건화, 점화)</strong> vs <strong>통제 처리 → 외현 기억(일화·의미)</strong>.</li>\n<li>공부법: <strong>청크, 기억술, 위계 구성, 간격두기 효과(응고화), 검증 효과, 깊은 처리(Craik &amp; Tulving), 자기참조 효과</strong>.</li>\n<li>뇌: 해마=외현 형성/응고화(수면 지원), 전전두엽=작업 기억, 소뇌=조건형성, 기저 신경절=절차 기억, 편도체=정서·섬광 기억. 래슐리=분산 표상.</li>\n<li>인출 단서: 최선은 부호화 때의 연합. 맥락/상태 의존 기억, 부호화 명세성 원리, 점화(암묵).</li>\n<li>계열 위치: 초두(장기·되뇌기), 최신(단기, 금방 사라짐).</li>\n<li>망각: 부호화 실패 / 저장 소멸(에빙하우스·Bahrick) / 인출 실패(순행·역행 간섭). 수면은 역행 간섭 방어(Jenkins &amp; Dallenbach).</li>\n<li>기억 구성 오류: <strong>재응고화</strong>, <strong>오정보 효과</strong>(Loftus &amp; Palmer), <strong>상상력 효과</strong>, <strong>출처 기억상실</strong>.</li>\n<li>헷갈리는 쌍<ul>\n<li>순행 간섭(옛→새) vs 역행 간섭(새→옛)</li>\n<li>순행성 기억상실(새 기억 못 만듦, H.M.) vs 역행성(옛 기억 인출 못 함)</li>\n<li>간격두기 효과(시점 분산) vs 검증 효과(인출 연습)</li>\n<li>맥락 의존(환경) vs 상태 의존(기분)</li>\n<li>재응고화(인출 후 재저장) vs 응고화(최초 저장)</li>\n<li>단기 기억(저장 중심) vs 작업 기억(처리 중심)</li>\n<li>오정보 효과(외부 정보 주입) vs 상상력 효과(자기 상상 반복)</li>\n</ul>\n</li>\n</ol>\n","len":14341}],"cards":[{"id":"c_ch0_001","ch":"ch0","tag":"명칭","front":"<p>1879년 라이프치히에 최초의 심리학 실험실을 세운 학자는?</p>\n","back":"<p>빌헬름 분트(Wilhelm Wundt) — 공이치기 실험으로 심적 과정을 계량화함</p>\n","src":"서막 p.7-9 · 통합요약"},{"id":"c_ch0_002","ch":"ch0","tag":"명칭","front":"<p>마음을 더 이상 나눌 수 없는 감각 요소의 복합체로 보고, 내성법으로 그 요소를 분석하려 한 학파는?</p>\n","back":"<p>구조주의(Structuralism) — 분트·티치너, 내성법(introspection) 사용</p>\n","src":"서막 p.9"},{"id":"c_ch0_003","ch":"ch0","tag":"명칭","front":"<p>참가자가 지정된 지침에 따라 자신의 경험을 스스로 보고하게 하는 방법은?</p>\n","back":"<p>내성법(introspection) — 구조주의의 연구 방법, 자유 기술이 아니라 훈련된 엄격한 보고</p>\n","src":"서막 p.9"},{"id":"c_ch0_004","ch":"ch0","tag":"명칭","front":"<p>마음과 의식이 생존에 어떤 적응적 기능을 하는가를 물으며, 다윈 진화론의 영향을 받은 학파는?</p>\n","back":"<p>기능주의(Functionalism) — 윌리엄 제임스, 과거 회상·현재 적응·미래 계획</p>\n","src":"서막 p.10"},{"id":"c_ch0_005","ch":"ch0","tag":"명칭","front":"<p>관찰 가능한 행동만을 연구 대상으로 삼아야 한다는 관점은?</p>\n","back":"<p>행동주의(Behaviorism) — 왓슨·스키너</p>\n","src":"서막 p.11-12"},{"id":"c_ch0_006","ch":"ch0","tag":"명칭","front":"<p>중립 자극이 무조건 자극과 반복적으로 짝지어져 조건 자극이 되는 학습은?</p>\n","back":"<p>고전적 조건화(classical conditioning) — 파블로프의 개(종소리)가 대표 사례</p>\n","src":"서막 p.11"},{"id":"c_ch0_007","ch":"ch0","tag":"명칭","front":"<p>강화와 처벌로 행동의 빈도를 조절하는 학습은?</p>\n","back":"<p>조작적 조건화(operant conditioning) — 스키너</p>\n","src":"서막 p.12"},{"id":"c_ch0_008","ch":"ch0","tag":"명칭","front":"<p>인간을 자아실현을 추구하는 주체적 존재로 보고, 정신분석·행동주의가 인간을 제한적으로 본다고 비판한 관점은?</p>\n","back":"<p>인본주의 심리학(Humanistic psychology) — 로저스·매슬로우</p>\n","src":"서막 p.10"},{"id":"c_ch0_009","ch":"ch0","tag":"명칭","front":"<p>컴퓨터의 작동 방식이 마음의 작동 방식과 유사하다는 비유로, 입력=감각 기관·CPU=뇌·SSD=장기 기억·RAM=작업 기억에 대응시키는 것은?</p>\n","back":"<p>컴퓨터 메타포(computer metaphor) — 인지혁명 이후 정보 처리 접근의 산물</p>\n","src":"서막 p.13"},{"id":"c_ch0_010","ch":"ch0","tag":"명칭","front":"<p>1960년대에 행동주의가 배제했던 심적 과정을 다시 연구 대상으로 되돌리고 과학적 연구 방법의 적용을 주장한 패러다임 전환은?</p>\n","back":"<p>인지혁명(cognitive revolution) — &#39;마음으로의 회귀&#39;라고도 불림</p>\n","src":"서막 p.13"},{"id":"c_ch0_011","ch":"ch0","tag":"명칭","front":"<p>인지심리학과 뇌과학이 융합되어 EEG·fMRI 등으로 신경 활동과 심적 과정을 함께 연구하는 분야는?</p>\n","back":"<p>인지신경과학(cognitive neuroscience)</p>\n","src":"서막 p.14"},{"id":"c_ch0_012","ch":"ch0","tag":"명칭","front":"<p>심리적 특성이 타고난 것인지 학습된 것인지를 묻는 논쟁으로, 결론은 &#39;둘 다 중요하다&#39;인 것은?</p>\n","back":"<p>선천성-후천성 논제(nature-nurture issue)</p>\n","src":"서막 p.15-20"},{"id":"c_ch0_013","ch":"ch0","tag":"명칭","front":"<p>문화와 무관하게 기쁨·슬픔·분노·공포·혐오·놀람 6가지 감정이 보편적으로 나타난다고 제안한 이론은?</p>\n","back":"<p>에크만의 기본 감정(Ekman&#39;s basic emotions) — 단서는 눈 표정</p>\n","src":"서막 p.21"},{"id":"c_ch0_014","ch":"ch0","tag":"명칭","front":"<p>생물학적·심리적·사회문화적 세 수준의 통합으로 인간의 마음과 행동을 설명하는 접근법은?</p>\n","back":"<p>생물심리사회적 접근법(biopsychosocial approach) — 하나의 요인만으로는 설명하지 않는다는 것이 핵심</p>\n","src":"서막 p.22-23"},{"id":"c_ch0_015","ch":"ch0","tag":"명칭","front":"<p>심적 위기 상황에 처한 개인의 대처를 지원하는 심리학의 응용 분야는?</p>\n","back":"<p>상담심리학(counseling psychology)</p>\n","src":"서막 p.27"},{"id":"c_ch0_016","ch":"ch0","tag":"개념","front":"<p>구조주의와 기능주의는 각각 무엇을 핵심 질문으로 삼았나?</p>\n","back":"<p>구조주의=마음은 무엇으로 이루어졌나(분트·티치너, 내성법) / 기능주의=마음은 무슨 일을 하나(제임스, 진화론)</p>\n","src":"서막 p.9-10"},{"id":"c_ch0_017","ch":"ch0","tag":"개념","front":"<p>진화심리학과 행동유전학은 둘 다 유전을 다루지만 초점이 다르다. 어떻게 다른가?</p>\n","back":"<p>진화심리학=인간
