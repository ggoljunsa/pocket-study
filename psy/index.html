uot;아이폰&quot;이라고 답한 뒤 마지막 사람에게 묻는 방식. 객관적 사실이 명백해도 동조. (교수 학부 팀플: 다섯 명 중 네 명이 A4 용지를 가져가자 나머지도 따라 함.)</li>\n</ul>\n<h2>p.14 — 취약성 요인 ③: 강력한 사례의 가용성 ⭐⭐⭐</h2>\n<ul>\n<li>자극적이고 강력한 예시를 보면 정확한 판단이 흐려지고 <strong>위험성을 과대 추정</strong>(사고, 범죄 등). **가용성 어림법(availability heuristic)**과 직접 관련 — 떠올리기 쉬운 사례 중심으로 판단하는 직관적 사고.</li>\n<li>그림: 교통사고 비율 자동차 vs 지하철 — 실제로는 자동차 사고가 더 많지만 지하철 사고를 겪은 교수(2014)는 지하철 위험도를 더 높게 평가할 수 있음.</li>\n<li>노트: <strong>인지적 구두쇠(cognitive miser)</strong> — 인간의 심리 체계는 <strong>에너지(정신 자원) 소모를 최소화</strong>하는 방향으로 작동한다는 입장. 진화(생존)의 결과이며, 가용성 어림법은 정확도는 낮지만 소모가 적어 널리 쓰임(꼭 나쁜 것은 아님). 5장(사고) 등에서 다시.</li>\n</ul>\n<h2>p.15 — 취약성 요인 ④: 집단 정체성 ⭐⭐</h2>\n<ul>\n<li><strong>집단 정체성(내집단/외집단 편향)</strong>: 소셜 미디어에서 자신과 같은 생각의 사람들과 어울리는 경향 → 자신에게 유리한 정보만 선택적으로 취득 → <strong>확증 편향</strong>으로 이어질 수 있음. 내집단/외집단 간 갈등.</li>\n<li>노트: 타인에 대한 악마화, 이민자 혐오 등이 집단 정체성에 의해 발생하는 경우가 많음. 교수: 언론사도 각자 관점이 있으므로 다양한 입장을 직접 비교해야 함.</li>\n<li>네 요인(가짜뉴스, 반복, 강력한 사례의 가용성, 집단 정체성)은 서로 맞물려 작동(가짜뉴스는 자극적 → 기억에 남고 → 반복 재생산 → 자기 성향에 맞는 정보로 수용).</li>\n</ul>\n<h2>p.16 — 과학적 방법: 심리과학의 연구 과정 ⭐⭐⭐</h2>\n<ul>\n<li>순서: <strong>현상/문제 인식 → 이론 제시 → 가설 수립 → 연구 설계 및 집행 → 데이터 분석 및 해석</strong>(교수: 교재는 3단계지만 세부적으로는 5단계).<ul>\n<li><strong>이론(theory)</strong> = 관찰을 체제화하고 행동/사건을 예측하는 원리의 <strong>통합적 설명</strong>.</li>\n<li><strong>가설(hypothesis)</strong> = 이론을 기반으로 도출한 <strong>검증 가능한 예측</strong>(&quot;~하면 ~할 것이다&quot; 형태).</li>\n<li><strong>조작적 정의(operational definition)</strong> = 연구에서 차용된 개념·연구 절차에 대한 <strong>정확한 진술</strong>. 측정할 수 없는 심리 기제를 구체적이고 계량화할 수 있는 형태로 재정의.</li>\n<li>연구 설계 및 집행: 주제와 가설을 검증할 적절한 연구 방법 구성.</li>\n<li>데이터 분석 및 해석: 기존 이론의 <strong>지지, 반박, 확장</strong>.</li>\n</ul>\n</li>\n<li>교수 예시(수면과 기억): 이론 &#39;수면이 기억을 증진시킨다&#39; → 가설 &#39;수면을 박탈하면 기억이 더 떨어질 것이다&#39; → <strong>조작적 정의</strong>: 수면 박탈 = 최근 24시간 동안 수면 1시간 미만, 기억 = 기억력 검사의 정답 항목 수. 조작적 정의의 기준은 연구자 임의가 아니라 <strong>선행 문헌</strong>을 근거로 함. 결과는 이론을 지지/기각/수정하며 반복.</li>\n<li>노트: 요즘은 **사전 등록(preregistration)**으로 사전에 피드백을 받으며 연구를 보완.</li>\n</ul>\n<h2>p.17 — 연구 방법 ①: 기술적 방법 ⭐⭐⭐</h2>\n<ul>\n<li><strong>기술적 방법(descriptive methods)</strong> = 현상에 대한 **기술(description)**을 중점으로 하는 방법. 어떤 행동·패턴·사회 현상이 실제로 발생하고 있음을 제시하는 것이 목표. 연구 초기에 어떤 **현상(phenomenon)**에 접근할 때 유용.</li>\n<li>종류 3가지: <strong>사례 연구(case study)</strong>, <strong>자연 관찰(natural observation)</strong>, <strong>사회조사와 인터뷰(survey)</strong>.</li>\n<li>교수: 이 세 가지는 왜 일어나는지 <strong>설명은 불가</strong>하며 현상이 일어남을 보여줄 뿐. 처치나 통제가 없음.</li>\n</ul>\n<h2>p.18 — 사례 연구(Case Study) ⭐⭐⭐</h2>\n<ul>\n<li><strong>소수의 개인이나 집단을 집중적으로 관찰하고 심층 분석</strong>하는 기법. 실제로 참인 원리를 (일부나마) 밝혀낼 것이라는 기대 하에 수행. 후속 연구의 방향성을 설정하는 기반이 될 수 있음.</li>\n<li><strong>약점</strong>: 대표적이지 않은 개별 사례는 결과를 <strong>오도</strong>할 수 있고, 소수 사례로 얻은 결과는 <strong>일반화하기 어려움</strong>. 노트: 극적인 이야기·경험이 일반화에 자주 오용됨(→ 강력한 사례의 가용성).</li>\n<li>교수: 처음부터 다수를 대상으로 하기 어려울 때 소수 심층 분석으로 시작.</li>\n</ul>\n<h2>p.19 — 자연 관찰(Natural Observation) ⭐⭐⭐</h2>\n<ul>\n<li><strong>자연 활동에서의 행동을 기록</strong>하는 방법(예: 아동 행동 관찰). 사례 연구와 유사하게 현상에 대한 <strong>설명은 어려우나 현상 자체는 명확히 제시</strong>.</li>\n<li>본래 소규모 집단·개인 대상(Provine, 2012)이나 현재는 <strong>빅데이터</strong>(SNS, 리뷰 등) 기반의 대규모 연구가 가능 → 자연 관찰을 하나의 거대 과학으로 변모. <strong>행동에 영향을 미칠 수 있는 요인은 통제하지 않고 진행</strong>.</li>\n<li>그림: 시간대에 따른 트위터 용어 사용 추세(Golder &amp; Macy, 2011) — 긍정 단어 비율이 늦은 밤·주말 상승, 오후 하락. 왜 그런지는 이것만으로 알 수 없음.</li>\n</ul>\n<h2>p.20 — 사회조사(Survey)와 말표현 효과 ⭐⭐⭐</h2>\n<ul>\n<li><strong>사회조사(survey)</strong>: 설문지·인터뷰 등을 통한 <strong>자기보고식</strong> 연구 방법. 많은 사례를 간편하게 수집.</li>\n<li><strong>약점 ①</strong>: 응답자가 자신의 응답을 <strong>사회적으로 바람직한 방향으로 위장</strong>할 수 있음(예: 흡연량·음주량). 교수: 탐지 문항 등을 넣어 대응. 구조주의의 내성법과 유사한 자기보고 한계.</li>\n<li><strong>약점 ②: 말표현 효과(wording effect)</strong> — 문항을 구성하는 어휘에 따라 응답이 달라지는 효과. 슬라이드 표: 극빈자 지원(찬성 유도) vs 복지(반대 유도), 차별 철폐 조치 vs 우선적 조치, 허가증이 없는 노동자 vs 불법 체류자, 총기 안전법 vs 총기 통제법, 예산 증가 vs 세금, 선전적 심문 vs 고문.<ul>\n<li>슬라이드 표에서 앞 어휘는 <strong>찬성을 유도</strong>, 뒤 어휘는 <strong>반대를 유도</strong>하는 표현. 같은 내용도 어휘가 프레임을 만들어 응답이 달라진다는 것이 핵심.</li>\n</ul>\n</li>\n</ul>\n<h2>p.21 — 무선 표집의 원칙 ⭐⭐⭐</h2>\n<ul>\n<li><strong>무선 표집(random sampling)</strong>: <strong>모집단</strong>의 구성원이 동등하게 참여할 기회를 갖도록 표집. <strong>표본 수가 많아도 대표성이 없으면 바람직한 표본이 아님.</strong></li>\n<li>사회조사뿐 아니라 실험 모집에서도 동일하게 적용. 교수: 「<strong>표본 수가 큰 것보다 대표성을 띠는 표본이 더 중요</strong>」(사회조사의 중요한 원칙).</li>\n</ul>\n<h2>p.22 — 상관(Correlation)과 인과 ⭐⭐⭐</h2>\n<ul>\n<li><strong>상관(correlation)</strong>: 두 변인이 <strong>함께 변하는 정도</strong>의 측정치(<strong>-1~1</strong>). 한 변인이 다른 변인을 얼마나 잘 예측하는지를 시사. <strong>정적 상관</strong>(한쪽↑ 다른 쪽↑), <strong>부적 상관</strong>(한쪽↑ 다른 쪽↓), <strong>상관 없음</strong>.</li>\n<li><strong>착각 상관(illusory correlation)</strong>: 실제로는 관계가 없는데 <strong>관계가 있다고 강하게 지각</strong>하는 현상.</li>\n<li><strong>평균으로의 회귀(regression toward the mean)</strong>: 극단적이거나 이례적인 사건은 <strong>평균 방향으로 되돌아오는 경향성</strong>. 노트 예: 야구를 못하는 팀에게 비난을 하면 다음 경기는 좀 더 잘하더라(실제로는 평균으로 회귀한 것).</li>\n<li><strong>상관 ≠ 인과</strong>: 두 변인의 연관성은 보여줄 수 있으나 인과성을 입증하지 않음. <strong>예측은 할 수 있지만 설명은 할 수 없음.</strong> 이유: 두 변인에 영향을 줄 수 있는 <strong>제3의 변인</strong>이 존재할 수 있기 때문. 노트 예: <strong>식중독 발병률과 아이스크림 소비율</strong>(제3의 변인 = 날씨·기온).</li>\n<li>교수: 「인과적으로 해석하면 안 된다 — 굉장히 중요한 사안」.</li>\n</ul>\n<h2>p.23 — 실험법(Experiment) ⭐⭐⭐</h2>\n<ul>\n<li><strong>실험법</strong>: 관심 변인에 <strong>처치</strong>를 가하고 **다른 변인을 일정하게 유지(통제)**하여 처치 변인의 효과를 <strong>인과적으로 검증</strong>하는 방법. 변인에 조작을 가한 후 통제 조건과 비교.</li>\n<li><strong>실험 조건(집단)</strong> = 실제 처치를 가하는 조건/집단, <strong>통제 조건(집단)</strong> = 처치를 받지 않는 조건/집단.</li>\n<li><strong>무선 할당(random assignment)</strong> = 모집된 참가자를 실험 조건과 통제 조건에 <strong>확률 기반으로 무작위 배정</strong>하여 <strong>기존 개인차의 영향을 최소화</strong>하는 기법.</li>\n<li>교수 예시: 새 토익 학습법의 효과 — 새 학습법 집단 vs 기존 방식 집단. 원래 토익 점수가 높은 학생들이 우연히 한 집단에 몰리면 결과를 신뢰할 수 없음. 개인차를 일부러 변수로 지정해 비교하는 연구도 있음.</li>\n<li><strong>무선 표집</strong>(모집단에서 참가자를 뽑는 것)과 <strong>무선 할당</strong>(뽑힌 참가자를 조건에 배정하는 것)을 구별.</li>\n</ul>\n<h2>p.24 — 가짜약 조건(Placebo)과 이중 은폐 ⭐⭐⭐</h2>\n<ul>\n<li><strong>가짜약(위약, placebo) 조건</strong>: 의약·심리치료법 개발에 활용. 특정 처치를 받았다고 <strong>참가자가 착각</strong>하게 만드는 조건 → 처치를 받았다는 <strong>&#39;인지&#39;의 효과</strong>인지 정말 <strong>&#39;처치&#39;의 효과</strong>인지 비교.</li>\n<li><strong>이중 은폐 절차(double-blind)</strong>: <strong>참가자뿐 아니라 실험자도</strong> 어떤 집단이 가짜약 조건인지 모르는 것.</li>\n<li>신경 조절 연구에서 이와 같은 조건 사용(교수: 경두개 교류 자극 tACS의 가짜 자극 등). 가짜약 효과 사례: <strong>디카페인 커피</strong>에 대한 위약 효과(Dawkins et al., 2011), 우울·불안으로 인한 청각적 환각 완화 연구(Dolfus et al., 2016; Kirsch, 2010).</li>\n<li>교수의 3조건 논리: 무투여 / 위약 투여 / 신약 투여 — 신약 &gt; 위약 &gt; 무투여라면 신약의 실제 효과가 있는 것.</li>\n</ul>\n<h2>p.25 — 연구 방법 간 비교 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>방법</th>\n<th>기본 목적</th>\n<th>수행 방법</th>\n<th>처치</th>\n<th>약점</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>기술적 방법</strong></td>\n<td>행동을 관찰 및 기록</td>\n<td>사례 연구, 자연관찰, 사회조사</td>\n<td>없음</td>\n<td>변인 통제 불가, 개별 사례가 결과 오도 가능</td>\n</tr>\n<tr>\n<td><strong>상관 연구</strong></td>\n<td>한 변인이 다른 변인을 예측하는 정도 평가</td>\n<td>둘 이상의 변인 데이터 수집 후 상관 분석</td>\n<td>없음</td>\n<td>원인과 결과를 명세하지 못함</td>\n</tr>\n<tr>\n<td><strong>실험</strong></td>\n<td>원인과 결과 탐색</td>\n<td>하나 이상의 변인에 처치, 무선 할당 활용</td>\n<td>하나 이상의 <strong>독립변인</strong></td>\n<td>결과를 다른 상황에 <strong>일반화하지 못할 수 있음</strong>, 주제에 따라 사용 불가, 윤리적 문제로 처치 불가할 수 있음</td>\n</tr>\n</tbody></table>\n<ul>\n<li>교수: 실험법은 통제된 인위적 상황이라 일반화에 한계. 뇌 손상 환자 연구처럼 특정 뇌 영역을 일부러 손상시키는 실험은 윤리적으로 불가. 실험은 <strong>인과성을 검증하는 유일한 방법</strong>(이 수업 소개 범위에서 조작·통제를 가하는 방법은 실험법 하나). 독립변인이 여러 개인 요인 설계는 학기 말에.</li>\n</ul>\n<h2>p.26 — 연구 윤리 ⭐⭐</h2>\n<ul>\n<li>심리학은 인간·동물 대상 실험을 집행(예: 쥐를 활용한 <strong>편도체</strong> 실험, <strong>뇌 손상 환자</strong> 연구, 정상인 대상 사회적 상황 의사결정 탐구). 세계 각국은 윤리 지침을 마련하고 준수를 요구 — <strong>뉘른베르크 강령, 헬싱키 선언, 벨몬트 보고서</strong>의 취지.</li>\n<li>교수: 뉘른베르크 강령·헬싱키 선언은 나치 독일의 T4 프로그램(장애인 말살)·인체 실험, 벨몬트 보고서는 <strong>1970년대</strong> 미국의 <strong>터스키기 매독 실험</strong>(매독 환자를 고지 없이 방치)이 계기.</li>\n</ul>\n<h2>p.27 — 연구 윤리 준수의 필요성 ⭐⭐⭐</h2>\n<ul>\n<li>연구 시작 전 참가자로부터 **고지된 동의(informed consent)**를 받아야 하며, 연구로 인한 모든 불편함과 상해로부터 보호받아야 함. 교수: 피로도 같은 사소한 것도 포함, 참가자가 그만두고 싶다고 하면 <strong>이유 불문 즉시 중단</strong>해야 함.</li>\n<li>참가자 <strong>개인 정보는 비밀 보장</strong>, 실험 종료 후 <strong>상세한 설명(debriefing)</strong> 전달. 교수: 의도를 숨기기 위한 <strong>기만</strong>(속임)을 썼다면 끝난 후 반드시 디브리핑.</li>\n<li>각 연구 기관의 **기관 생명 윤리 위원회(Institutional Review Board, IRB)**에서 <strong>사전 연구 승인</strong> 필요 — 대학 등에서 인간·동물 대상 연구의 <strong>윤리적 적합성을 검토</strong>.</li>\n<li>교수: 승인 전에 참가자를 모집하거나 실험을 진행하면 연구 윤리 위반. IRB는 보건복지부의 통제를 받아 감사를 받음.</li>\n</ul>\n<h2>p.28 — 번외: IRB를 통한 연구 승인 절차 (1) ⭐⭐</h2>\n<ul>\n<li>주요 심의 내용: <strong>연구 내용 및 실험 방법</strong>(과제 상세, 실험 도구, 데이터 분석안), <strong>모집 표본 수</strong>(참가자 인원 수 — 매우 객관적인 근거 요구, <strong>승인받은 인원을 초과하여 모집하면 안 됨</strong>, 증원 필요 시 변경 심의).</li>\n<li>교수: 붉은 글씨로 표시한 항목은 IRB가 굉장히 중시하는 사안(인원수의 근거로 선행 논문이나 통계 검정력 계산 프로그램 결과). 동의서를 전부 스캔해 제출하므로 초과 모집은 바로 드러남. 서류 → 양식 검토 → 보완 → 본 심의(학교마다 한 달~두 달에 한 번) → 승인 통보 후에야 모집.</li>\n</ul>\n<h2>p.29 — 번외: IRB를 통한 연구 승인 절차 (2) ⭐⭐</h2>\n<ul>\n<li>주요 심의 내용: <strong>참가자 보상</strong>(구체적 금액 및 재원 — 지출을 실제로 수행할 수 있는 예산·과제가 있는지 철저히 확인), <strong>개인 정보 수집 범위 및 보호 방안</strong>(참가자 식별·논문 보고를 위한 정보 외 수집 금지, 구체적 보호 방안 요구), <strong>실험 참여 시 참가자에게 발생할 수 있는 위험 요소</strong>.</li>\n<li><strong>여기까지가 시험 범위.</strong></li>\n</ul>\n<h2>p.30–34 — 통계적 추리 (시험 범위 제외)</h2>\n<ul>\n<li>기술통계(최빈값·평균·중앙값, 범위·표준편차, 정규분포·중심극한정리)와 추론통계(영가설·대안가설·p-value 0.05). 기말에서 연구 설계 주차와 함께 출제 예정이므로 <strong>중간고사에는 나오지 않는다.</strong></li>\n</ul>\n<h2>🎙 실제 수업 기록 (9/1 화, 녹음본 기준)</h2>\n<ul>\n<li>0901 녹음(약 137분): 도입(00:00–03:31) 지난 수업의 생물심리사회적 접근 복습 → 오늘은 (1) 심리학이 왜 과학성을 추구하는가 (2) 어떤 방식으로 연구하는가. 심리학의 목표 = 사람의 마음이 어떻게·왜 작동하는지에 대한 <strong>객관적·과학적 설명</strong>, 원인과 결과의 <strong>인과성 탐구</strong>(02:27).</li>\n<li>초킹(쇼킹) 실험(04:38–05:39): 추가 고지로 압박을 준 집단의 정답률이 낮았다.</li>\n<li>상식적 사고의 세 가지 보편 현상(08:04): <strong>후견 편향</strong>(콜럼버스의 달걀 09:03, 월드컵 10:59–12:18: &quot;역시 이렇게 될 줄 알았어를 한 번이라도 했다면 후견 편향에 잡힌 것&quot;), <strong>과신</strong>(14:08, 테틀록 15:12: 80% 확신 사건의 적중률 40% 미만, 슈퍼 예측자 약 2% 16:06, 단어 완성 과제 17:02–20:48), <strong>무선적 사건에서 질서 지각</strong>(25:11–30:39: 동전 던지기, 근접성 원리, 첫 수업일의 우연). 메타인지(20:48–25:11)는 교재에 없는 추가 내용.</li>\n<li>탈진실(30:39–39:37): 2017 옥스퍼드 올해의 단어. 범죄율 70% 인식 vs 실제 감소, 이민자 투옥 가능성 44% 낮음(33:53), 정당 편향성 = 진영 논리·확증 편향(34:55), 국내 범죄율 큰 변동 없음(37:11), 자료를 찾는 데 30초도 안 걸렸다는 언급(37:11).</li>\n<li><strong>취약성 요인 4가지</strong>(39:37): 가짜뉴스(6%, 진실은 기어가고 거짓은 날아간다 40:45), 반복(삼인성호·사회적 동조 실험 43:49–46:53), 강력한 사례의 가용성(가용성 어림법, 인지적 구두쇠 47:55–54:11), 집단 정체성(54:11). 「이 네 요인이 결국 하나로 맞물려 작동」(55:10).</li>\n<li><strong>연구 과정 5단계</strong>(1:00:09): 현상 인식 → 이론 → 가설 → 연구 설계·집행 → 분석. 조작적 정의(1:02:13–1:05:21): 수면 박탈 = 24시간 수면 1시간 미만, 기억 = 정답 항목 수. 「가설은 측정할 수 있는 형태로 재정립해야 한다」(1:03:28).</li>\n<li>기술적 방법(1:09:48): 사례 연구·자연 관찰·사회조사 모두 <strong>설명은 불가</strong>, 통제 없음. 「이 소개에서 직접적인 통제나 조작을 가하는 방법은 실험법 딱 하나」(1:17:18). 사회조사의 두 리스크(응답 위장, 말표현 효과 1:18:18–1:19:57), <strong>무선 표집</strong>: 「표본 수가 큰 것보다 대표성을 띠는 표본이 더 중요」(1:23:51).</li>\n<li>상관(1:24:51): 정적/부적/무상관, <strong>착각 상관</strong>, <strong>평균으로의 회귀</strong>(야구팀 감독 비난 예 1:26:12). 「<strong>상관은 인과성을 입증하는 지표가 아니다 — 굉장히 중요한 사안</strong>」(1:29:10), 식중독-아이스크림-날씨(제3의 변인).</li>\n<li>실험법(1:31:48): 실험 조건 vs 통제 조건, <strong>무선 할당</strong>(개인차 최소화, 1:34:42), <strong>플라시보 조건</strong>(1:36:38), tACS(경두개 교류 자극)의 가짜 자극 경험, 디카페인 커피 연구. 연구 방법 비교(1:44:22): 기술적 = 관찰·기록(약점 변인 통제 불가), 상관 = 예측 가능·인과 해석 불가, 실험 = 인과성 탐구 유일 방법, 약점 = 일반화·윤리(1:46:01–1:49:44).</li>\n<li>연구 윤리(1:49:44–2:02:13): 쥐 편도체 절제·뇌 손상 환자 연구, 뉘른베르크 강령·헬싱키 선언(나치 T4, 일본 731부대)·벨몬트 보고서(터스키기 매독 실험, 1970년대) (1:50:29–1:53:30). 고지된 동의·중단 권리·비밀 보장·기만 후 디브리핑(1:53:30–1:56:08). IRB(1:56:08): 보건복지부 감독, 승인 전 모집은 위반(1:58:04). 심의에서 <strong>모집 인원수와 그 객관적 근거</strong>, <strong>참가자 보상 재원</strong>을 특히 중시(1:59:03–2:01:20).</li>\n<li>마무리(2:15:34): 오늘 내용 정리. 시험 힌트 직접 언급 없음. 통계(2:02:13 이후)는 시험 범위 제외 — 0922 공지: 1장 29번 슬라이드까지.</li>\n</ul>\n<h2>명칭 암기표</h2>\n<table>\n<thead>\n<tr>\n<th>명칭 (영문)</th>\n<th>한 줄 정의/단서</th>\n<th>슬라이드</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>심리과학의 목표</td>\n<td>과학적·재현 가능한 설명, 견해와 검증된 결론 구분, 인과성 탐구</td>\n<td>2</td>\n</tr>\n<tr>\n<td>초킹 현상 (choking)</td>\n<td>압박감으로 수행이 떨어지는 현상</td>\n<td>3(노트)</td>\n</tr>\n<tr>\n<td>후견 편향 (hindsight bias)</td>\n<td>결과를 알고 난 후 예측할 수 있었다고 믿는 경향</td>\n<td>5</td>\n</tr>\n<tr>\n<td>콜럼버스의 달걀</td>\n<td>후견 편향의 예</td>\n<td>5(노트)</td>\n</tr>\n<tr>\n<td>과신 (overconfidence)</td>\n<td>실제보다 더 많이 안다고 믿는 경향</td>\n<td>6</td>\n</tr>\n<tr>\n<td>테틀록 (Tetlock)</td>\n<td>전문가 예측 연구, 80% 확신 → 40% 이하 적중</td>\n<td>6</td>\n</tr>\n<tr>\n<td>슈퍼 예측자 (superforecaster)</td>\n<td>정확히 예측하는 극소수</td>\n<td>6</td>\n</tr>\n<tr>\n<td>단어 완성하기 과제 (Goranson, 1978)</td>\n<td>과신을 보여주는 철자 재배열 과제</td>\n<td>6</td>\n</tr>\n<tr>\n<td>메타인지 (metacognition)</td>\n<td>인지에 대한 인지 (Flavell, 1979)</td>\n<td>7</td>\n</tr>\n<tr>\n<td>무선적 사건에서 질서 지각하기</td>\n<td>무선 배열을 무선적이지 않게 인식</td>\n<td>8</td>\n</tr>\n<tr>\n<td>지각의 체제화(집단화) 원리</td>\n<td>자극을 원리에 따라 묶어 의미 부여</td>\n<td>8(노트)</td>\n</tr>\n<tr>\n<td>탈진실 (post-truth)</td>\n<td>신념이 객관적 사실을 압도, 2017 옥스퍼드 올해의 단어</td>\n<td>9(노트)</td>\n</tr>\n<tr>\n<td>정당 편향성 (partisan bias)</td>\n<td>정치 성향 무관, 사실과 반대 인식</td>\n<td>10</td>\n</tr>\n<tr>\n<td>거짓뉴스(가짜뉴스)</td>\n<td>진실보다 더 멀리·빠르게 확산</td>\n<td>12</td>\n</tr>\n<tr>\n<td>반복 / 삼인성호</td>\n<td>반복될수록 진실이라 믿음</td>\n<td>13</td>\n</tr>\n<tr>\n<td>사회적 동조 실험</td>\n<td>다수의 반복된 답에 동조</td>\n<td>13(노트)</td>\n</tr>\n<tr>\n<td>강력한 사례의 가용성</td>\n<td>자극적 사례 → 위험 과대 추정</td>\n<td>14</td>\n</tr>\n<tr>\n<td>가용성 어림법 (availability heuristic)</td>\n<td>떠올리기 쉬운 사례로 판단</td>\n<td>14</td>\n</tr>\n<tr>\n<td>인지적 구두쇠 (cognitive miser)</td>\n<td>정신 자원 소모 최소화 경향</td>\n<td>14(노트)</td>\n</tr>\n<tr>\n<td>집단 정체성 (내집단/외집단 편향)</td>\n<td>같은 생각끼리 어울림</td>\n<td>15</td>\n</tr>\n<tr>\n<td>확증 편향 (confirmation bias)</td>\n<td>유리한 정보만 선택적으로 취득</td>\n<td>15</td>\n</tr>\n<tr>\n<td>이론 (theory)</td>\n<td>관찰을 체제화하고 예측하는 통합적 설명</td>\n<td>16</td>\n</tr>\n<tr>\n<td>가설 (hypothesis)</td>\n<td>이론에서 도출한 검증 가능한 예측</td>\n<td>16</td>\n</tr>\n<tr>\n<td>조작적 정의 (operational definition)</td>\n<td>개념·절차에 대한 정확한 진술</td>\n<td>16</td>\n</tr>\n<tr>\n<td>사전 등록 (preregistration)</td>\n<td>사전에 연구를 등록·피드백</td>\n<td>16(노트)</td>\n</tr>\n<tr>\n<td>기술적 방법 (descriptive methods)</td>\n<td>현상 기술, 사례 연구·자연 관찰·사회조사</td>\n<td>17</td>\n</tr>\n<tr>\n<td>사례 연구 (case study)</td>\n<td>소수 심층 분석, 일반화 어려움</td>\n<td>18</td>\n</tr>\n<tr>\n<td>자연 관찰 (natural observation)</td>\n<td>자연 상태 행동 기록, 빅데이터로 확장</td>\n<td>19</td>\n</tr>\n<tr>\n<td>사회조사 (survey)</td>\n<td>설문·인터뷰 자기보고식</td>\n<td>20</td>\n</tr>\n<tr>\n<td>말표현 효과 (wording effect)</td>\n<td>어휘에 따라 응답이 달라짐</td>\n<td>20</td>\n</tr>\n<tr>\n<td>무선 표집 (random sampling)</td>\n<td>모집단 구성원이 동등한 기회, 대표성</td>\n<td>21</td>\n</tr>\n<tr>\n<td>모집단 / 표본</td>\n<td>전체 / 실제 데이터 수집 대상</td>\n<td>21</td>\n</tr>\n<tr>\n<td>상관 (correlation)</td>\n<td>두 변인의 공변 정도, -1~1</td>\n<td>22</td>\n</tr>\n<tr>\n<td>착각 상관 (illusory correlation)</td>\n<td>없는 관계를 있다고 지각</td>\n<td>22</td>\n</tr>\n<tr>\n<td>평균으로의 회귀 (regression toward the mean)</td>\n<td>극단값이 평균 쪽으로 돌아옴</td>\n<td>22</td>\n</tr>\n<tr>\n<td>제3의 변인</td>\n<td>두 변인 모두에 영향(예: 날씨)</td>\n<td>22(노트)</td>\n</tr>\n<tr>\n<td>실험법 (experiment)</td>\n<td>처치 + 통제 → 인과 검증</td>\n<td>23</td>\n</tr>\n<tr>\n<td>실험 조건 / 통제 조건</td>\n<td>처치를 받는 / 받지 않는 집단</td>\n<td>23</td>\n</tr>\n<tr>\n<td>무선 할당 (random assignment)</td>\n<td>확률 기반 배정, 개인차 최소화</td>\n<td>23</td>\n</tr>\n<tr>\n<td>가짜약(위약) 조건 (placebo)</td>\n<td>처치를 받았다는 인지의 효과 확인</td>\n<td>24</td>\n</tr>\n<tr>\n<td>이중 은폐 (double-blind)</td>\n<td>참가자와 실험자 모두 모름</td>\n<td>24</td>\n</tr>\n<tr>\n<td>독립변인</td>\n<td>실험에서 처치되는 변인</td>\n<td>25</td>\n</tr>\n<tr>\n<td>뉘른베르크 강령 / 헬싱키 선언 / 벨몬트 보고서</td>\n<td>연구 윤리 지침</td>\n<td>26</td>\n</tr>\n<tr>\n<td>고지된 동의 (informed consent)</td>\n<td>참가 전 충분한 설명 후 동의</td>\n<td>27</td>\n</tr>\n<tr>\n<td>디브리핑 (debriefing)</td>\n<td>실험 종료 후 상세 설명</td>\n<td>27</td>\n</tr>\n<tr>\n<td>기관 생명 윤리 위원회 (IRB)</td>\n<td>연구 윤리적 적합성 사전 검토</td>\n<td>27</td>\n</tr>\n</tbody></table>\n<h2>시험 대비 핵심 요약</h2>\n<ol>\n<li>심리과학의 목표 = 과학적·재현 가능한 설명, <strong>인과성 탐구</strong>(원인 → 결과).</li>\n<li>상식적 사고의 세 현상: <strong>후견 편향</strong>(그럴 줄 알았어), <strong>과신</strong>(테틀록 80% vs 40%), <strong>무선적 사건에서 질서 지각</strong>(착각 상관·평균으로의 회귀와 연결). 메타인지 = 인지에 대한 인지, 이들을 줄이는 능력.</li>\n<li>탈진실 취약성 <strong>4요인</strong>: 가짜뉴스, 반복(삼인성호·사회적 동조), 강력한 사례의 가용성(가용성 어림법·인지적 구두쇠), 집단 정체성(확증 편향).</li>\n<li>연구 과정: 현상 인식 → <strong>이론</strong> → <strong>가설</strong>(조작적 정의) → 설계·집행 → 분석·해석. 이론 = 통합적 설명, 가설 = 검증 가능한 예측.</li>\n<li>세 연구 방법 대비: <strong>기술적 방법</strong>(설명 불가, 통제 없음) / <strong>상관</strong>(예측 가능, 인과 불가) / <strong>실험</strong>(인과 탐구, 일반화 한계).</li>\n<li>기술적 방법 3종: 사례 연구(일반화 곤란), 자연 관찰(통제 없음, 빅데이터), 사회조사(응답 위장, 말표현 효과). 무선 표집: 표본 크기보다 <strong>대표성</strong>.</li>\n<li>헷갈리는 쌍: <strong>무선 표집</strong>(모집단 → 표본) vs <strong>무선 할당</strong>(표본 → 실험/통제 조건); 착각 상관(없는 관계를 봄) vs 평균으로의 회귀(극단 후 평균으로); 위약 조건 vs 이중 은폐.</li>\n<li><strong>상관 ≠ 인과</strong>, 제3의 변인(식중독-아이스크림-날씨).</li>\n<li>연구 윤리: 고지된 동의, 상해로부터 보호, 비밀 보장, 디브리핑, <strong>IRB 사전 승인</strong>. 승인받은 인원 초과 모집 금지. 심의 내용: 연구 방법, 모집 인원(객관적 근거), 보상(금액·재원), 개인 정보 범위·보호, 위험 요소.</li>\n<li><strong>p.30 이후(통계)는 시험 범위 제외.</strong></li>\n</ol>\n","len":16768},{"id":"w3_ch2","title":"3주차 — 2장 마음의 생물학과 의식 정리","desc":"뉴런·신경전달물질, 뇌 연구법, 뇌 구조, 분할 뇌, 의식과 수면","ch":"ch2","min":25,"html":"<h1>2장 — 마음의 생물학과 의식 페이지별 해설</h1>\n<p>심리학으로의 여행 (Prof. 이소영) · 마이어스 심리학 개론 13판</p>\n<p>이 장의 핵심 질문은 &quot;마음은 몸의 어디에서, 어떤 물리적 과정으로 일어나는가?&quot;이다. 뉴런의 전기·화학 신호(신경 소통) → 신경계의 구성 → 뇌를 연구하는 방법(손상법·EEG·MEG·ERP·PET·MRI·fMRI·DSI) → 뇌의 세부 구조(뇌간·시상·소뇌·변연계·대뇌 피질) → 분할 뇌 → 의식(선택적 주의, 이중 처리) → 수면과 꿈 순서로 진행된다. 시험은 <strong>&quot;설명을 보고 정확한 명칭을 쓰는&quot;</strong> 형태이므로 각 기법·구조·현상의 이름과 그 정의를 짝지어 외워야 한다.</p>\n<blockquote>\n<p>페이지 번호 = 슬라이드 번호. 슬라이드 20번(제목만 있는 그림 슬라이드), 25번(뇌 심부 구조·변연계·대뇌 피질 그림)은 텍스트가 없다.</p>\n</blockquote>\n<hr>\n<h2>p.2 — 신경계와 내분비계: ‘머리’에 대한 접근</h2>\n<ul>\n<li>심리가 머리(뇌)와 관련 있다는 생각은 고대부터 있었다.</li>\n<li><strong>프란츠 갈(Franz Gall)의 골상학(phrenology)</strong>: 두개골의 돌출부가 심적 능력·성격 특질과 연관된다고 가정. 한때 영국에서 크게 유행.</li>\n<li>골상학은 과학적으로 틀렸지만, **기능 국재화(localization of function)**를 가정한 점은 현대 인지신경과학과 닮았다. ⭐</li>\n</ul>\n<h2>p.3 — 인간의 심적 과정과 두뇌</h2>\n<ul>\n<li>심리는 생물적 기제, 특히 뇌 활동과 밀접하다. 대뇌 영역별로 외부 정보를 인지·처리하고 반응을 산출.</li>\n<li>뉴런의 <strong>전기적 + 화학적 신호</strong>로 정보를 전달. 각 뇌 영역은 특정 기능을 담당(<strong>기능의 국재화</strong>)하고, 여러 영역이 상호작용해 정보를 통합한다.</li>\n<li>🎙 교수: 마음은 어느 한 곳이 단독으로 작동해서 나오는 결과물이 아니라 <strong>&quot;조별 과제의 합산 결과물&quot;</strong>.</li>\n</ul>\n<h2>p.4 — 신경 가소성 ⭐⭐</h2>\n<ul>\n<li><strong>신경 가소성(neuroplasticity)</strong>: 손상 후 신경망이 재조직되거나, 경험을 통해 새로운 신경 통로가 구축되어 뇌가 변하는 능력.</li>\n<li><strong>영국 택시 운전사 vs 버스 운전사</strong>: 택시 운전사의 <strong>해마</strong>가 더 큼 (Maguire et al., 2006). 길을 스스로 탐색하는 경험이 뇌 구조를 바꾼다는 증거.</li>\n<li>훈련에 따라 감각 영역 변화 (Brodt et al., 2018).</li>\n</ul>\n<h2>p.5 — 뉴런(Neuron)</h2>\n<ul>\n<li>신경정보 시스템의 근간이 되는 세포. 새로 생성되거나 사라질 수 있다. 정보의 수용·전달 담당.</li>\n<li><strong>한 뉴런 내부는 전기 신호</strong>, <strong>뉴런 사이(타 뉴런)에는 신경 화학 물질</strong>로 전달. ⭐</li>\n<li>구조: <strong>세포체</strong>(생명 유지), <strong>수상돌기</strong>(=수용 돌기, 수신), <strong>축색</strong>(전기 신호 이동 경로), <strong>수초</strong>(축색을 감싸 전달 효율 유지), <strong>축색 종말</strong>(신호 발신).</li>\n<li><strong>다발성 경화증(multiple sclerosis)</strong>: 수초의 퇴화·손상으로 생기는 신경성 질병 → 근육 제어·인지 능력 저하.</li>\n</ul>\n<h2>p.6 — 활동 전위(Action Potential) ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>용어</th>\n<th>설명</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>안정 전위</strong></td>\n<td>뉴런 외부가 (+), 내부가 (−)인 상태</td>\n</tr>\n<tr>\n<td><strong>탈분극화(depolarization)</strong></td>\n<td>신경 흥분으로 양전하가 뉴런 안으로 들어와 내외부 전하 차이가 사라지는 현상</td>\n</tr>\n<tr>\n<td><strong>역치(threshold)</strong></td>\n<td>활동 전위가 촉발되기 위한 최소 강도</td>\n</tr>\n<tr>\n<td><strong>불응기(refractory period)</strong></td>\n<td>활동 전위 발생 후의 휴지기. 안정 전위로 돌아가기 전까지 활동 전위가 다시 발생하지 않음</td>\n</tr>\n<tr>\n<td><strong>실무율 반응(all-or-none)</strong></td>\n<td>활동 전위는 역치를 넘으면 완전히 발생하고, 넘지 못하면 전혀 발생하지 않음</td>\n</tr>\n</tbody></table>\n<ul>\n<li>🎙 교수: 축색 외부의 양이온이 안으로 들어오면서 내외부 전위차가 사라지고(탈분극화), 일정 수준을 넘으면 본격적으로 활동 전위가 발생한다.</li>\n<li>활동 전위 연구는 <strong>인공 신경망</strong> 구축 연구의 발전으로도 이어졌다.</li>\n</ul>\n<h2>p.7 — 자극 강도를 뇌가 판단하는 법 ⭐⭐</h2>\n<ul>\n<li>활동 전위의 <strong>크기는 항상 동일</strong>(실무율). 대신 자극이 강할수록 **발화율(firing rate)**이 올라간다.</li>\n<li>뇌는 뉴런의 <strong>발화 횟수</strong>로 자극이 강한지 약한지를 표상한다.</li>\n</ul>\n<h2>p.8 — 신경전달물질(Neurotransmitter) ⭐⭐</h2>\n<ul>\n<li>뉴런 사이의 <strong>시냅스</strong>에서 작용하는 화학 물질. 활동 전위가 축색을 따라 오면 <strong>축색 종말</strong>에서 방출 → 이웃 뉴런의 <strong>수용 돌기</strong>로 들어가 신호 전달.</li>\n<li>과도한 신경전달물질은 **재흡수(reuptake)**되어 방출한 뉴런으로 되돌아간다.</li>\n<li>[노트] 재흡수를 차단하면 시냅스에 신경전달물질이 더 오래 머물러 <strong>우울증 증세가 호전</strong>되는 약이 있다 (🎙 세로토닌 재흡수 방해 → 활용되는 양 증가).</li>\n</ul>\n<h2>p.9 — 주요 신경전달물질 ⭐⭐⭐ (표로 암기)</h2>\n<table>\n<thead>\n<tr>\n<th>신경전달물질</th>\n<th>기능</th>\n<th>오기능</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>아세틸콜린(ACh)</strong></td>\n<td>근육 운동, 학습, 기억</td>\n<td><strong>알츠하이머</strong>: ACh 생성 뉴런 퇴화</td>\n</tr>\n<tr>\n<td><strong>도파민(dopamine)</strong></td>\n<td>움직임, 학습, 주의, 정서</td>\n<td>과잉 → <strong>조현병</strong>, 부족 → <strong>파킨슨병</strong>(떨림·동작 감소)</td>\n</tr>\n<tr>\n<td><strong>세로토닌(serotonin)</strong></td>\n<td>기분, 배고픔, 수면, 각성</td>\n<td>부족 → <strong>우울증</strong></td>\n</tr>\n<tr>\n<td><strong>노르에피네프린</strong></td>\n<td>각성의 제어</td>\n<td>부족 → 기분 저하</td>\n</tr>\n<tr>\n<td><strong>글루타메이트</strong></td>\n<td>기억에 관여하는 1차 <strong>흥분성</strong> 전달 물질</td>\n<td>과잉 → 과자극(편두통·경련)</td>\n</tr>\n<tr>\n<td><strong>GABA(가바)</strong></td>\n<td>대표적 <strong>억제성</strong> 전달 물질</td>\n<td>부족 → 경련·떨림·불면증</td>\n</tr>\n<tr>\n<td><strong>엔도르핀(endorphin)</strong></td>\n<td>통증·쾌감의 지각</td>\n<td>마약 복용이 자연 엔도르핀 공급을 방해</td>\n</tr>\n</tbody></table>\n<h2>p.10 — 신경계의 구성 ⭐⭐⭐</h2>\n<pre><code>신경계\n├─ 중추 신경계(CNS): 신체 전반의 의사결정\n│    ├─ 두뇌: 학습 등 고차원 기능\n│    └─ 척수: 말초 신경계와 두뇌의 연결, 반사(reflex)\n└─ 말초 신경계(PNS): 정보 수집 + 중추 신경계 신호 전달\n     ├─ 체신경계: 감각 수용 + 골격근의 자발적 제어\n     └─ 자율 신경계: 분비선·내장 근육 제어\n          ├─ 교감신경: 각성\n          └─ 부교감신경: 이완\n</code></pre>\n<ul>\n<li>[노트] <strong>교감</strong>: 심장 박동 증가, 소화 억제, 포도당 방출, 노르에피네프린/에피네프린 촉진. <strong>부교감</strong>: 심장 박동 완화, 소화 촉진, 담즙 분비 촉진.</li>\n</ul>\n<h2>p.11 — 뉴런의 세 유형 ⭐⭐</h2>\n<ul>\n<li><strong>감각 뉴런</strong>: 감각 수용기 → 중추 신경계.</li>\n<li><strong>운동 뉴런</strong>: 중추 신경계 명령 → 근육·내분비선.</li>\n<li><strong>간뉴런(interneuron)</strong>: 감각 입력과 운동 출력 사이의 소통.</li>\n<li>반사 반응은 척수 수준에서 처리된다(감각 → 간뉴런 → 운동).</li>\n</ul>\n<h2>p.12 — 손상법(Lesion) ⭐⭐</h2>\n<ul>\n<li>뇌 기능을 탐구하는 <strong>가장 초기의 연구법</strong>. 특정 뇌 영역·뉴런을 손상시켜 기능 변화를 관찰(침습적). 동물 대상(예: 쥐의 시상하부 제거 → 섭식량 감소).</li>\n<li>🎙 교수: 가장 초기에 쓰였고 <strong>인과적인 설명</strong>을 내놓을 수 있는 방법. 이후 일시적·비침습적 기법으로 발전.</li>\n</ul>\n<h2>p.13 — 뇌전도(EEG)와 뇌자도(MEG) ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>뇌전도 EEG (Electroencephalogram)</strong></th>\n<th><strong>뇌자도 MEG (Magnetoencephalography)</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>측정 대상</td>\n<td>뉴런의 전기 신호를 증폭</td>\n<td>뇌 전기 신호가 만드는 <strong>자기장</strong></td>\n</tr>\n<tr>\n<td>시간 해상도</td>\n<td>높음</td>\n<td>높음</td>\n</tr>\n<tr>\n<td>공간 해상도</td>\n<td><strong>낮음</strong></td>\n<td><strong>상당히 높음</strong>(뇌 심부까지 좌표 추적)</td>\n</tr>\n</tbody></table>\n<ul>\n<li>🎙 EEG는 두피에 전극을 붙이는 반면 MEG는 코일 형태로 자기장을 측정한다. 장비가 매우 비싸다.</li>\n</ul>\n<h2>p.14–16 — (번외) 사건 관련 전위 ERP ⭐⭐</h2>\n<ul>\n<li><strong>사건 관련 전위(Event-Related Potential, ERP)</strong>: 특정 자극·사건으로 촉발되는 <strong>두피 전위 변화의 평균량</strong>. 자극 제시 시점 기준으로 반복 측정한 뇌파를 평균해 산출.</li>\n<li><strong>컴포넌트(component)</strong>: 특정 시점에 나타나는 ERP 성분. 각각 알려진 기능이 있다. <strong>N400 = 의미 정보 처리, P600 = 문법 정보 처리.</strong></li>\n<li><strong>밀리초(ms)</strong> 단위의 뇌 활동 추적 → 시간 해상도 우수, 공간 해상도 저조.</li>\n<li>단일 뉴런의 활동 전위와는 다른 개념이다.</li>\n<li>p.16: 실험 제시용 컴퓨터 / 뇌파 기록용 컴퓨터 / 증폭기로 구성. 🎙 외부 전자기파에 민감해 차폐 공간을 만들고, 두 컴퓨터를 케이블로 동기화한다.</li>\n</ul>\n<h2>p.17 — 양전자 방출 단층촬영법(PET) ⭐⭐</h2>\n<ul>\n<li>방사성 동위원소가 섞인 <strong>포도당</strong>을 주사 → 과제 수행 시 포도당이 몰리는 곳(핫스팟)에서 나오는 <strong>감마선</strong>을 탐지해 촬영.</li>\n</ul>\n<h2>p.18 — MRI와 fMRI ⭐⭐⭐</h2>\n<ul>\n<li><strong>MRI(자기공명 영상)</strong>: 강한 자기장을 쬐어 원자가 재정렬할 때 나오는 신호로 뇌 <strong>구조</strong>를 촬영. 신경 활동 관찰은 어렵다.</li>\n<li><strong>fMRI(기능적 자기공명 영상)</strong>: <strong>BOLD(혈중 산소 농도 의존) 신호</strong>를 추적해 뇌의 <strong>기능적 활동</strong>을 촬영. 공간 해상도가 매우 높아 심리 기능의 담당 영역 탐구에 적합.</li>\n</ul>\n<h2>p.19 — 확산 스펙트럼 영상(Diffusion Spectrum Imaging, DSI) ⭐⭐</h2>\n<ul>\n<li>fMRI는 <strong>회질</strong>의 BOLD 신호를 측정. DSI는 <strong>백질</strong> 신경 섬유 주변 <strong>물 분자의 확산</strong>을 토대로 신경 섬유의 연결 구조(신경 통로 지도)를 촬영.</li>\n</ul>\n<h3>뇌 연구법 비교 (p.12–19 종합) ⭐⭐⭐</h3>\n<table>\n<thead>\n<tr>\n<th>기법</th>\n<th>측정</th>\n<th>시간 해상도</th>\n<th>공간 해상도</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>손상법</td>\n<td>손상 후 기능 변화(인과)</td>\n<td>–</td>\n<td>–</td>\n</tr>\n<tr>\n<td>EEG / ERP</td>\n<td>두피 전기 신호</td>\n<td>높음</td>\n<td>낮음</td>\n</tr>\n<tr>\n<td>MEG</td>\n<td>자기장</td>\n<td>높음</td>\n<td>높음</td>\n</tr>\n<tr>\n<td>PET</td>\n<td>방사성 포도당 → 감마선</td>\n<td>(낮음)</td>\n<td>중간</td>\n</tr>\n<tr>\n<td>MRI</td>\n<td>구조</td>\n<td>–</td>\n<td>높음</td>\n</tr>\n<tr>\n<td>fMRI</td>\n<td>BOLD (혈중 산소)</td>\n<td>–</td>\n<td>매우 높음</td>\n</tr>\n<tr>\n<td>DSI</td>\n<td>백질 물 분자 확산 → 연결 구조</td>\n<td>–</td>\n<td>–</td>\n</tr>\n</tbody></table>\n<h2>p.20 — (그림 슬라이드, 제목만: 두뇌를 탐구하는 방법)</h2>\n<p>텍스트 없음. 🎙 교수는 뇌 영상 기법을 <strong>시간 해상도 / 공간 해상도</strong>로 분류해 볼 수 있다고 정리.</p>\n<h2>p.21 — 뇌 심부 구조 1: 뇌간·시상·망상체 ⭐⭐⭐</h2>\n<ul>\n<li><strong>뇌간(brainstem)</strong>: <strong>연수 + 뇌교</strong>로 이루어진 가장 오래된 부분. <strong>연수</strong>: 심장 활동·호흡 조절. <strong>뇌교</strong>: 움직임 조절·수면 제어.</li>\n<li><strong>시상(thalamus)</strong>: 감각 제어 중추. <strong>후각을 제외한</strong> 모든 감각을 받아 대뇌 각 감각 피질로 전달(<strong>감각 정보의 관문</strong>). 🎙 후각은 시상을 거치지 않는다.</li>\n<li><strong>망상체(reticular formation)</strong>: 유입 자극 중 중요한 정보를 <strong>필터링</strong>, <strong>각성(arousal)</strong> 제어.</li>\n</ul>\n<h2>p.22 — 소뇌(Cerebellum) ⭐⭐</h2>\n<ul>\n<li>신체 운동(정교한 움직임 포함), <strong>비언어적 학습·기억</strong>, 여러 활동 간 <strong>협응</strong>. 정서·사회 운동 제어, 시간 판별, 소리·질감 구분에도 기여.</li>\n<li>[노트] 뇌의 오래된 영역의 기능은 대체로 <strong>의식적 노력 없이</strong> 일어난다.</li>\n</ul>\n<h2>p.23 — 변연계(Limbic System) ⭐⭐⭐</h2>\n<ul>\n<li><strong>정서와 추동(drive)</strong> 담당. <strong>추동</strong>: 결핍 상황을 해결하려고 행동하게 하는 동기적 힘.</li>\n<li><strong>시상하부 + 뇌하수체 + 편도체 + 해마</strong>가 하나의 시스템을 이룬다. (🎙 뇌하수체는 호르몬 분비 관련 — 슬라이드 목록에 빠지기 쉬우니 주의)</li>\n</ul>\n<h2>p.24 — 편도체·시상하부·해마 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>구조</th>\n<th>기능</th>\n<th>단서</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>편도체(Amygdala)</strong></td>\n<td>공격·공포·분노에 대한 인지, 부정적 사건 기억 유지</td>\n<td>환자 <strong>S.M</strong>: 위협 상황에서 공포를 못 느낌</td>\n</tr>\n<tr>\n<td><strong>시상하부(Hypothalamus)</strong></td>\n<td><strong>항상성(homeostasis)</strong> 유지를 위한 섭식, 보상 쾌감 정서</td>\n<td>Olds(1975), 쥐 시상하부 제거 → 섭식량 감소</td>\n</tr>\n<tr>\n<td><strong>해마(Hippocampus)</strong></td>\n<td>의식적·<strong>명시적 기억</strong> 처리</td>\n<td>손상 시 새로운 정보 기억 곤란 (Jayakar et al., 2015)</td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>항상성</strong>: 인간의 내적 상태를 일정하게 유지하려는 것.</li>\n<li>🎙 해마 손상 → 기억 상실 두 유형: <strong>역행성 기억 상실</strong>(손상·충격 <strong>이전</strong> 기억을 못 떠올림, 영화 「제이슨 본」) / <strong>순행성 기억 상실</strong>(손상 <strong>이후</strong> 새 기억 형성 불가, 영화 「메멘토」, 빈도상 순행성이 더 일반적).</li>\n</ul>\n<h2>p.25 — (그림) 뇌 심부 구조, 변연계 + 대뇌 피질</h2>\n<p>텍스트 없음.</p>\n<h2>p.26 — 대뇌 피질(Cerebrum) ⭐⭐</h2>\n<ul>\n<li>대뇌 피질(cerebral cortex) 기반으로 신체 통제·정보 처리. <strong>뇌량</strong>을 기준으로 <strong>좌/우 반구</strong>. <strong>전두엽·후두엽·두정엽·측두엽</strong> 4영역.</li>\n</ul>\n<h2>p.27 — 대뇌 피질의 주요 기능 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>기능</th>\n<th>위치</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>운동 기능</td>\n<td><strong>운동 피질</strong>: 전두엽의 가장 뒷부분</td>\n</tr>\n<tr>\n<td>시각</td>\n<td><strong>후두엽</strong>의 시각 피질</td>\n</tr>\n<tr>\n<td>청각</td>\n<td><strong>측두엽</strong>의 청각 피질</td>\n</tr>\n<tr>\n<td>체감각</td>\n<td><strong>두정엽</strong>의 체감각 피질</td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>호문쿨루스(homunculus)</strong>: 운동·체감각 피질의 담당 영역 크기에 비례해 그린 신체 부위 지도. (🎙 대뇌와 신체 감각 기관의 관계를 표준적으로 보여 주는 그림)</li>\n</ul>\n<h2>p.28 — 연합 영역(Association area) ⭐⭐⭐</h2>\n<ul>\n<li>감각 영역·운동 영역을 제외한 <strong>나머지 광범위한 영역</strong>. 뇌 전 영역에 존재.</li>\n<li>🎙 <strong>가장 중요한 특징: 연합 영역의 활동은 관찰 가능한 반응을 산출하지 않는다.</strong> → 그래서 신경과학 기법이 필요하다(반응이 없어도 심적 과정은 벌어지고 있기 때문).</li>\n<li><strong>전전두엽(prefrontal lobe)</strong>: 판단·계획·억제·사회적 상호작용. (슬라이드에 전전두엽 손상 예시 그림이 있음)</li>\n<li><strong>측두엽</strong>: 얼굴 재인 — <strong>FFA(Fusiform Face Area, 방추상 얼굴 영역)</strong>.</li>\n<li><strong>두정엽</strong>: 수학·공간 추리, 자극 시 <strong>환상 운동 감각</strong> 유발.</li>\n<li>🎙 <strong>생물심리사회적 접근법</strong>: 행동은 여러 기제가 조합된 최종 결과물이다.</li>\n</ul>\n<h2>p.29 — 분할 뇌 1: 뇌량 ⭐⭐</h2>\n<ul>\n<li><strong>뇌량(corpus callosum)</strong>: 좌·우반구를 연결하는 다리. 손상되면 반구 간 정보 공유 불가.</li>\n<li><strong>좌시야 → 우뇌, 우시야 → 좌뇌</strong>로 전달된다.</li>\n</ul>\n<h2>p.30 — 분할 뇌 2: Gazzaniga의 분할 뇌 실험 ⭐⭐⭐</h2>\n<ul>\n<li>뇌량이 끊어진 사람에게 단어를 잘라 좌·우 시야에 나눠 제시.</li>\n<li>&quot;무엇을 보았는가?&quot;(말로 보고) → <strong>우시야</strong>(좌뇌)에 제시된 단어만 보고. 손으로 가리키라고 하면 → <strong>좌시야</strong>(우뇌)에 나타난 텍스트를 가리킴.</li>\n<li>뇌량의 중요성과 함께 **기능의 편재화(lateralization)**를 보여준다.</li>\n<li><strong>좌반구</strong>: 언어 정보 처리, 수학 계산. <strong>우반구</strong>: 추론, 자기 자각, 의미 전달을 위한 말하기 조율.</li>\n<li>🎙 우반구는 언어를 직접적으로 1차 처리하지 않아 말로 보고는 못 하지만, 본 것은 맞으므로 이미지로 가리킬 수 있다.</li>\n</ul>\n<h2>p.31 — 의식의 정의와 인지신경과학 ⭐⭐</h2>\n<ul>\n<li><strong>의식</strong>: 자기 자신과 환경에 대한 <strong>주관적 자각</strong>(Feinberg &amp; Mallatt, 2016). 감각·정서·선택을 아우르고, 목표 설정·달성을 돕고, 학습 시 주의를 집중시키며, 변화를 자각하게 한다.</li>\n<li><strong>인지신경과학</strong>: 특정 <strong>두뇌 상태를 의식 경험과 연관</strong>짓는다. 예: 월드컵을 회상하면 특정 부위(해마 등)의 혈중 산소 농도가 올라간다.</li>\n</ul>\n<h2>p.32 — 선택적 주의 ⭐⭐⭐</h2>\n<ul>\n<li><strong>선택적 주의(selective attention)</strong>: 경험하는 모든 것 중 일부에만 초점을 맞추는 기제. 의식적 자각은 선택적 주의로 성립.</li>\n<li><strong>칵테일 파티 효과(cocktail party effect)</strong>: 여러 말소리 중 하나에만 주의를 기울이는 현상. 자신과 관련된 의미 있는 정보만 필터링.</li>\n<li><strong>부주의적 맹시(inattentional blindness)</strong>: 주의를 기울이지 않은 시각 자극을 인지하지 못하는 현상. (Neisser &amp; Cervone 1983 실험, 슬라이드에 참고 영상 링크)</li>\n</ul>\n<h2>p.33 — 변화맹(Change Blindness) ⭐⭐⭐</h2>\n<ul>\n<li>장면에서 변화가 생겨도 눈치채지 못하는 현상(<strong>부주의적 맹시의 한 유형</strong>). 예: 영화의 ‘옥의 티’ (Simons &amp; Levin, 1998).</li>\n</ul>\n<h2>p.34 — 이중 처리 과정(dual processing) ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>의식적 경로</th>\n<th>무의식적 경로</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>특징</td>\n<td>회고적, 매우 신중</td>\n<td>자동적, 신속</td>\n</tr>\n<tr>\n<td>처리 방식</td>\n<td><strong>계열 처리</strong>(하나씩)</td>\n<td><strong>병렬 처리</strong>(동시에)</td>\n</tr>\n<tr>\n<td>다른 이름</td>\n<td>의식적/책략적 처리</td>\n<td>무의식적/자동적 처리</td>\n</tr>\n</tbody></table>\n<ul>\n<li>두 경로가 <strong>동시에</strong> 개입한다는 원리. 기억·사고·언어에 모두 적용.</li>\n</ul>\n<h2>p.35 — 수면과 뇌파 ⭐⭐⭐</h2>\n<ul>\n<li><strong>일주기 리듬(circadian rhythm)</strong>: 24시간 주기의 규칙적 신체 리듬.<table>\n<thead>\n<tr>\n<th>상태</th>\n<th>뇌파/특징</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>각성</td>\n<td><strong>베타파</strong></td>\n</tr>\n<tr>\n<td>이완(깨어 있음)</td>\n<td><strong>알파파</strong></td>\n</tr>\n<tr>\n<td><strong>N1</strong></td>\n<td>REM이 아닌 수면 초입</td>\n</tr>\n<tr>\n<td><strong>N2</strong></td>\n<td>N1 다음, 더 깊은 수면 (성인은 수면의 대부분이 N2)</td>\n</tr>\n<tr>\n<td><strong>N3</strong></td>\n<td><strong>델타파</strong>, 매우 깊은 수면</td>\n</tr>\n<tr>\n<td><strong>REM</strong></td>\n<td>빠른 안구 운동, <strong>선명한 꿈</strong></td>\n</tr>\n</tbody></table>\n</li>\n</ul>\n<h2>p.36 — 수면 주기와 REM 수면 ⭐⭐⭐</h2>\n<ul>\n<li>수면 상태는 주기적으로 반복된다(각성 → N1 → N2 → N3 → … → REM).</li>\n<li><strong>REM 수면</strong>: 뇌간이 근육으로 가는 신호를 차단해 <strong>겉으로는 이완</strong>되어 있으나 <strong>내적으로는 각성</strong>. 파형은 N1과 비슷하나 <strong>심장 박동·호흡이 빨라진다</strong>.</li>\n<li>🎙 젊은 사람은 N3까지 잘 들어가고 대체로 N2에서 유지. 노인은 N2·N1을 왔다 갔다 하고 수면 주기가 짧아진다.</li>\n</ul>\n<h2>p.37 — 수면의 목적 ⭐⭐</h2>\n<ul>\n<li><strong>보호 기능</strong>(야간 수면이 생존에 유리, 종마다 수면 양상 다양)</li>\n<li>감염 치료·<strong>면역계 회복</strong></li>\n<li>알츠하이머 유발 단백질 제거</li>\n<li><strong>기억의 복원·재생(공고화)</strong>: 수면 후 과제 수행이 더 우수</li>\n<li><strong>창의적 사고의 배양</strong>: 수면 후 정보 간 연계점을 더 잘 찾음</li>\n<li><strong>신체 성장 호르몬 분비</strong></li>\n</ul>\n<h2>p.38 — 꿈에 대한 이론 ⭐⭐⭐ (이름 ↔ 설명 매칭)</h2>\n<table>\n<thead>\n<tr>\n<th>이론</th>\n<th>핵심</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>프로이트의 소망충족</strong></td>\n<td>꿈은 표출(기억된) 내용과 깊은 곳의 <strong>잠재 내용</strong>(숨겨진 의미)</td>\n</tr>\n<tr>\n<td><strong>정보 처리</strong></td>\n<td>그날의 사건을 분류하고 기억을 공고하게 함 (성적 우수 학생의 수면 시간이 더 김)</td>\n</tr>\n<tr>\n<td><strong>생물학적 기능</strong></td>\n<td>REM의 규칙적 뇌 자극으로 신경 통로 발달·유지 (유아의 긴 수면과 연관)</td>\n</tr>\n<tr>\n<td><strong>활성화-종합(activation-synthesis)</strong></td>\n<td>REM이 무작위 시각 기억 신경활동을 촉발 → 뇌가 하나의 이야기로 엮음 (Hobson)</td>\n</tr>\n<tr>\n<td><strong>인지 발달</strong></td>\n<td>꿈은 꿈꾸는 사람의 지식·이해를 반영, 실제 시뮬레이션</td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>REM 반동(REM rebound)</strong>: REM 수면을 인위적으로 박탈하면 더 빠르게 REM 수면으로 되돌아감.</li>\n</ul>\n<hr>\n<h2>🎙 실제 수업 기록 (9/8 화, 녹음본 기준)</h2>\n<p>※ 이 회차는 전문이 아니라 Clova AI 타임스탬프 요약 메모(1부 62분, 2부 63분)만 있으므로 아래는 요약 메모 기준이다.</p>\n<p><strong>1부 (14:34~)</strong></p>\n<ul>\n<li>00:11–13:47: 뇌 중심 접근은 최근 것이 아님(골상학). 현대 인지신경과학의 기본 전제 = 뇌의 특정 영역이 특정 심리 기제를 맡는다. 신경망 = &quot;조별 과제의 합산 결과물&quot;. 신경 가소성 연구 = 영국 택시/버스 운전사.</li>\n<li>14:00–22:44: 세포체(생명 기전), 수상돌기(수신), 축색(전기 신호 경로), 축색 종말(발신), <strong>수초 손상 → 다발성 경화증</strong>, 수초 = 전달 효율 유지. 활동 전위: 안정 전위 → 양이온 유입 → 탈분극화 → 역치 초과 시 발생.</li>\n<li>23:38–31:15: 활동 전위 크기는 일정, <strong>발화 횟수로 자극 강도 표상</strong>. 세로토닌 재흡수 방해 → 우울 완화. 도파민 과잉 → 조현병, 세로토닌 부족 → 우울, GABA 부족 → 불면·경련, 아세틸콜린이 잘 작동하길 바람.</li>\n<li>32:22–36:24: 중추(두뇌+척수)/말초(체신경계+자율신경계), 뉴런 세 유형. <strong>손상법 = 가장 초기 방법이자 인과적 설명 가능</strong>.</li>\n<li>37:35–39:48: 편도체 = 공포 정서, 손상 환자는 위협 장면에서도 공포감이 산출되지 않음.</li>\n<li>40:19–46:00: 뇌 연구는 <strong>시간적 접근</strong>(작동 순서·단계)과 <strong>공간적 접근</strong>(어느 영역이 빨리 일하는가). <strong>EEG/ERP = 시간적 흐름을 보는 방법(시간 해상도 높음)</strong>. ERP 컴포넌트 <strong>N400/P600</strong>.</li>\n<li>50:31–55:04: EEG는 채널 수가 많을수록 정보가 많아 근원 추적 분석 가능, 전자기파에 민감해 <strong>차폐 공간</strong>, 컴퓨터 2대 동기화.</li>\n<li>58:50–60:59: <strong>뇌자도(MEG)</strong>: 코일 형태로 자기장을 형성해 측정, 뇌 심부 좌표 추적 가능, 비쌈.</li>\n<li>메모 1:02:06 「양전자 방출 단층 촬영법」 — 후반부 시작.</li>\n</ul>\n<p><strong>2부 (16:04~)</strong></p>\n<ul>\n<li>00:00–02:44: <strong>DSI</strong>: 백질 축색 신경 섬유 주변 물 분자 확산을 기록 → 정보 흐름의 <strong>신경 통로 지도</strong>. 뇌 영상 기법은 시간/공간 해상도로 분류.</li>\n<li>03:46–08:29: 뇌 심부 구조 = 오래된 영역, 생명 활동 담당. <strong>시상 = 감각 정보의 중추, 후각만 시상을 거치지 않음.</strong> 변연계 = 4영역으로 이루어진 시스템.</li>\n<li>09:34–19:00: 편도체(공격·공포·분노), 시상하부(항상성·섭식), 해마(의식적·명시적 기억). 해마 손상 → 기억 상실 유형: <strong>역행성</strong>(제이슨 본) / <strong>순행성</strong>(메멘토). 심부 구조의 활동 상당수는 의식적 노력 없이 일어남.</li>\n<li>19:52–28:45: 호문쿨루스. <strong>연합 영역의 가장 중요한 특징 = 관찰 가능한 반응을 산출하지 않음</strong>. <strong>생물심리사회적 접근법</strong>. <strong>FFA</strong>(얼굴), 두정엽(수학·공간 추리).</li>\n<li>29:33–32:21: 뇌량이 끊어지면 반구 간 정보 공유 불가. 좌반구 언어 처리 기반.</li>\n<li>37:10–47:07: 인지신경과학은 특정 두뇌 상태를 의식 경험으로 간주(해마 발화 연구). <strong>칵테일 파티 효과</strong>, <strong>부주의적 맹시</strong>, <strong>변화맹</strong>(장면에 집중하느라 다른 세부를 놓침).</li>\n<li>48:03–53:13: 이중 처리(병렬 vs 계열), 수면 단계별 뇌파, 수면 주기는 반복, <strong>젊은이는 N3 잘 진입 / 노인은 N1·N2 왕복, 주기 짧아짐</strong>.</li>\n<li>54:16–62:30: 수면 기능(생존·보호, 감염·면역, 문제 해결·기억 공고화), 꿈 이론(프로이트, 정보 처리, 생물학적 기능, 인지 발달) 소개.</li>\n<li>메모 00:18 「확산 스펙트럼 / 확산 텐서」 (DSI의 다른 표기).</li>\n<li>교수는 특정 슬라이드를 「시험에 나온다」고 말한 기록이 요약 메모에는 없다(전문 없음).</li>\n</ul>\n<hr>\n<h2>명칭 암기표</h2>\n<table>\n<thead>\n<tr>\n<th>명칭 (영문)</th>\n<th>한 줄 정의/단서</th>\n<th>슬라이드</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>골상학 (phrenology)</strong></td>\n<td>프란츠 갈, 두개골 돌출부 = 심적 능력·성격</td>\n<td>2</td>\n</tr>\n<tr>\n<td><strong>기능의 국재화 (localization of function)</strong></td>\n<td>각 뇌 영역이 특정 기능 담당</td>\n<td>2, 3</td>\n</tr>\n<tr>\n<td><strong>신경 가소성 (neuroplasticity)</strong></td>\n<td>손상 후 재조직·경험으로 뇌가 변하는 능력</td>\n<td>4</td>\n</tr>\n<tr>\n<td><strong>뉴런 (neuron)</strong></td>\n<td>신경정보 시스템의 근간 세포</td>\n<td>5</td>\n</tr>\n<tr>\n<td><strong>세포체 / 수상돌기 / 축색 / 축색 종말</strong></td>\n<td>생명 기전 / 수신 / 전기 신호 경로 / 발신</td>\n<td>5</td>\n</tr>\n<tr>\n<td><strong>수초 (myelin sheath)</strong></td>\n<td>축색을 감싸 전달 효율 유지</td>\n<td>5</td>\n</tr>\n<tr>\n<td><strong>다발성 경화증 (multiple sclerosis)</strong></td>\n<td>수초 퇴화·손상 질병</td>\n<td>5</td>\n</tr>\n<tr>\n<td><strong>활동 전위 (action potential)</strong></td>\n<td>뉴런 내 전기 신호</td>\n<td>6</td>\n</tr>\n<tr>\n<td><strong>안정 전위 (resting potential)</strong></td>\n<td>외부 +, 내부 −</td>\n<td>6</td>\n</tr>\n<tr>\n<td><strong>탈분극화 (depolarization)</strong></td>\n<td>양전하 유입으로 전위차 소실</td>\n<td>6</td>\n</tr>\n<tr>\n<td><strong>역치 (threshold)</strong></td>\n<td>활동 전위 촉발 최소 강도</td>\n<td>6</td>\n</tr>\n<tr>\n<td><strong>불응기 (refractory period)</strong></td>\n<td>활동 전위 후 재발생 불가 휴지기</td>\n<td>6</td>\n</tr>\n<tr>\n<td><strong>실무율 반응 (all-or-none)</strong></td>\n<td>넘으면 완전 발생, 아니면 없음</td>\n<td>6</td>\n</tr>\n<tr>\n<td><strong>발화율 (firing rate)</strong></td>\n<td>자극이 강할수록 증가</td>\n<td>7</td>\n</tr>\n<tr>\n<td><strong>신경전달물질 (neurotransmitter)</strong></td>\n<td>시냅스에서 작용하는 화학 물질</td>\n<td>8</td>\n</tr>\n<tr>\n<td><strong>시냅스 (synapse)</strong></td>\n<td>뉴런 사이 간극</td>\n<td>8</td>\n</tr>\n<tr>\n<td><strong>재흡수 (reuptake)</strong></td>\n<td>과도한 전달물질이 방출 뉴런으로 회수</td>\n<td>8</td>\n</tr>\n<tr>\n<td><strong>아세틸콜린 (ACh)</strong></td>\n<td>근육·학습·기억, 알츠하이머</td>\n<td>9</td>\n</tr>\n<tr>\n<td><strong>도파민 (dopamine)</strong></td>\n<td>과잉=조현병, 부족=파킨슨병</td>\n<td>9</td>\n</tr>\n<tr>\n<td><strong>세로토닌 (serotonin)</strong></td>\n<td>기분·수면·배고픔, 부족=우울증</td>\n<td>9</td>\n</tr>\n<tr>\n<td><strong>노르에피네프린 (norepinephrine)</strong></td>\n<td>각성 제어</td>\n<td>9</td>\n</tr>\n<tr>\n<td><strong>글루타메이트 (glutamate)</strong></td>\n<td>1차 흥분성 전달물질</td>\n<td>9</td>\n</tr>\n<tr>\n<td><strong>GABA</strong></td>\n<td>대표적 억제성 전달물질</td>\n<td>9</td>\n</tr>\n<tr>\n<td><strong>엔도르핀 (endorphin)</strong></td>\n<td>통증·쾌감 지각</td>\n<td>9</td>\n</tr>\n<tr>\n<td><strong>중추 신경계 / 말초 신경계</strong></td>\n<td>두뇌+척수 / 체신경계+자율신경계</td>\n<td>10</td>\n</tr>\n<tr>\n<td><strong>체신경계 (somatic)</strong></td>\n<td>감각 수용, 골격근 자발 제어</td>\n<td>10</td>\n</tr>\n<tr>\n<td><strong>자율 신경계 (autonomic)</strong></td>\n<td>분비선·내장 근육 제어</td>\n<td>10</td>\n</tr>\n<tr>\n<td><strong>교감 / 부교감 신경계</strong></td>\n<td>각성 / 이완</td>\n<td>10</td>\n</tr>\n<tr>\n<td><strong>반사 (reflex)</strong></td>\n<td>척수가 담당</td>\n<td>10, 11</td>\n</tr>\n<tr>\n<td><strong>감각 뉴런 / 운동 뉴런 / 간뉴런</strong></td>\n<td>세 유형의 뉴런</td>\n<td>11</td>\n</tr>\n<tr>\n<td><strong>손상법 (lesion)</strong></td>\n<td>초기 연구법, 인과 설명</td>\n<td>12</td>\n</tr>\n<tr>\n<td><strong>뇌전도 (EEG)</strong></td>\n<td>전기 신호, 시간 해상도 높음/공간 낮음</td>\n<td>13</td>\n</tr>\n<tr>\n<td><strong>뇌자도 (MEG)</strong></td>\n<td>자기장, 시간·공간 해상도 모두 높음</td>\n<td>13</td>\n</tr>\n<tr>\n<td><strong>사건 관련 전위 (ERP)</strong></td>\n<td>자극 시점 기준 두피 전위 변화 평균</td>\n<td>14</td>\n</tr>\n<tr>\n<td><strong>컴포넌트 (component)</strong></td>\n<td>특정 시점의 ERP 성분</td>\n<td>14</td>\n</tr>\n<tr>\n<td><strong>N400 / P600</strong></td>\n<td>의미 처리 / 문법 처리</td>\n<td>14</td>\n</tr>\n<tr>\n<td><strong>양전자 방출 단층촬영법 (PET)</strong></td>\n<td>방사성 포도당, 감마선, 핫스팟</td>\n<td>17</td>\n</tr>\n<tr>\n<td><strong>자기공명 영상 (MRI)</strong></td>\n<td>강한 자기장, 뇌 구조</td>\n<td>18</td>\n</tr>\n<tr>\n<td><strong>기능적 자기공명 영상 (fMRI)</strong></td>\n<td>BOLD 신호, 기능적 활동</td>\n<td>18</td>\n</tr>\n<tr>\n<td><strong>BOLD 신호</strong></td>\n<td>혈중 산소 농도 의존 신호</td>\n<td>18</td>\n</tr>\n<tr>\n<td><strong>확산 스펙트럼 영상 (DSI)</strong></td>\n<td>백질 물 분자 확산, 신경 섬유 연결</td>\n<td>19</td>\n</tr>\n<tr>\n<td><strong>뇌간 (brainstem)</strong></td>\n<td>연수+뇌교, 가장 오래된 부분</td>\n<td>21</td>\n</tr>\n<tr>\n<td><strong>연수 (medulla)</strong></td>\n<td>심장·호흡 조절</td>\n<td>21</td>\n</tr>\n<tr>\n<td><strong>뇌교 (pons)</strong></td>\n<td>움직임 조절·수면 제어</td>\n<td>21</td>\n</tr>\n<tr>\n<td><strong>시상 (thalamus)</strong></td>\n<td>후각 제외 감각의 관문</td>\n<td>21</td>\n</tr>\n<tr>\n<td><strong>망상체 (reticular formation)</strong></td>\n<td>자극 필터링, 각성 제어</td>\n<td>21</td>\n</tr>\n<tr>\n<td><strong>소뇌 (cerebellum)</strong></td>\n<td>정교한 운동, 비언어적 학습·기억, 협응</td>\n<td>22</td>\n</tr>\n<tr>\n<td><strong>변연계 (limbic system)</strong></td>\n<td>정서·추동 담당</td>\n<td>23</td>\n</tr>\n<tr>\n<td><strong>추동 (drive)</strong></td>\n<td>결핍 해결을 위한 동기적 힘</td>\n<td>23</td>\n</tr>\n<tr>\n<td><strong>편도체 (amygdala)</strong></td>\n<td>공격·공포·분노, 환자 S.M</td>\n<td>24</td>\n</tr>\n<tr>\n<td><strong>시상하부 (hypothalamus)</strong></td>\n<td>항상성·섭식</td>\n<td>24</td>\n</tr>\n<tr>\n<td><strong>항상성 (homeostasis)</strong></td>\n<td>내적 상태 일정 유지</td>\n<td>24</td>\n</tr>\n<tr>\n<td><strong>해마 (hippocampus)</strong></td>\n<td>의식적·명시적 기억</td>\n<td>24</td>\n</tr>\n<tr>\n<td><strong>뇌하수체 (pituitary)</strong></td>\n<td>호르몬 분비, 변연계 구성</td>\n<td>23</td>\n</tr>\n<tr>\n<td><strong>역행성 / 순행성 기억 상실</strong></td>\n<td>손상 이전 / 이후 기억 문제</td>\n<td>24 (🎙)</td>\n</tr>\n<tr>\n<td><strong>대뇌 피질 (cerebral cortex)</strong></td>\n<td>대뇌 표면, 4엽</td>\n<td>26</td>\n</tr>\n<tr>\n<td><strong>전두엽 / 두정엽 / 측두엽 / 후두엽</strong></td>\n<td>운동·전전두 / 체감각·수학 / 청각·얼굴 / 시각</td>\n<td>26–28</td>\n</tr>\n<tr>\n<td><strong>운동 피질 / 체감각 피질</strong></td>\n<td>전두엽 뒷부분 / 두정엽</td>\n<td>27</td>\n</tr>\n<tr>\n<td><strong>호문쿨루스 (homunculus)</strong></td>\n<td>피질 담당 영역에 따른 신체 지도</td>\n<td>27</td>\n</tr>\n<tr>\n<td><strong>연합 영역 (association area)</strong></td>\n<td>감각·운동 제외, 관찰 가능한 반응 없음</td>\n<td>28</td>\n</tr>\n<tr>\n<td><strong>전전두엽 (prefrontal lobe)</strong></td>\n<td>판단·계획·억제·사회성</td>\n<td>28</td>\n</tr>\n<tr>\n<td><strong>방추상 얼굴 영역 (FFA)</strong></td>\n<td>얼굴 재인</td>\n<td>28</td>\n</tr>\n<tr>\n<td><strong>분할 뇌 (split brain)</strong></td>\n<td>뇌량 절단</td>\n<td>29</td>\n</tr>\n<tr>\n<td><strong>뇌량 (corpus callosum)</strong></td>\n<td>좌우반구 연결</td>\n<td>29</td>\n</tr>\n<tr>\n<td><strong>기능의 편재화 (lateralization)</strong></td>\n<td>좌우반구 기능 차이</td>\n<td>30</td>\n</tr>\n<tr>\n<td><strong>의식 (consciousness)</strong></td>\n<td>자기 자신과 환경에 대한 주관적 자각</td>\n<td>31</td>\n</tr>\n<tr>\n<td><strong>선택적 주의 (selective attention)</strong></td>\n<td>일부에만 초점</td>\n<td>32</td>\n</tr>\n<tr>\n<td><strong>칵테일 파티 효과 (cocktail party effect)</strong></td>\n<td>여러 소리 중 하나에 주의</td>\n<td>32</td>\n</tr>\n<tr>\n<td><strong>부주의적 맹시 (inattentional blindness)</strong></td>\n<td>주의 안 준 시각 자극 미지각</td>\n<td>32</td>\n</tr>\n<tr>\n<td><strong>변화맹 (change blindness)</strong></td>\n<td>변화를 눈치 못 챔</td>\n<td>33</td>\n</tr>\n<tr>\n<td><strong>이중 처리 (dual processing)</strong></td>\n<td>의식적(계열)+무의식적(병렬) 경로</td>\n<td>34</td>\n</tr>\n<tr>\n<td><strong>계열 처리 / 병렬 처리</strong></td>\n<td>하나씩 / 동시에</td>\n<td>34</td>\n</tr>\n<tr>\n<td><strong>일주기 리듬 (circadian rhythm)</strong></td>\n<td>24시간 신체 리듬</td>\n<td>35</td>\n</tr>\n<tr>\n<td><strong>베타파 / 알파파 / 델타파</strong></td>\n<td>각성 / 이완 / N3 깊은 수면</td>\n<td>35</td>\n</tr>\n<tr>\n<td><strong>N1 / N2 / N3 수면</strong></td>\n<td>수면 단계</td>\n<td>35</td>\n</tr>\n<tr>\n<td><strong>REM 수면</strong></td>\n<td>빠른 안구 운동, 선명한 꿈</td>\n<td>35, 36</td>\n</tr>\n<tr>\n<td><strong>프로이트의 소망충족</strong></td>\n<td>표출 내용 vs 잠재 내용</td>\n<td>38</td>\n</tr>\n<tr>\n<td><strong>정보 처리 / 생물학적 기능 / 활성화-종합 / 인지 발달</strong></td>\n<td>꿈 이론</td>\n<td>38</td>\n</tr>\n<tr>\n<td><strong>REM 반동 (REM rebound)</strong></td>\n<td>REM 박탈 후 빠른 REM 복귀</td>\n<td>38</td>\n</tr>\n</tbody></table>\n<h2>시험 대비 핵심 요약</h2>\n<ol>\n<li><strong>활동 전위</strong>: 안정 전위 → 탈분극화 → 역치 초과 → 발생 → 불응기. <strong>실무율</strong>이라 크기는 일정하고 <strong>발화율</strong>로 강도를 표상. 뉴런 안 = 전기, 뉴런 사이 = 화학.</li>\n<li><strong>신경전달물질 매칭</strong>: 도파민(과잉 조현병/부족 파킨슨), 세로토닌(우울), 아세틸콜린(알츠하이머), GABA(억제성, 불면), 글루타메이트(흥분성), 엔도르핀(통증·쾌감).</li>\n<li><strong>신경계 계층</strong>: 중추(두뇌+척수) / 말초(체신경+자율신경(교감=각성, 부교감=이완)). 뉴런 세 유형은 감각·운동·간뉴런.</li>\n<li><strong>뇌 연구법 대비</strong>: EEG·ERP(시간 ↑ 공간 ↓) vs MEG(둘 다 ↑) vs fMRI(공간 매우 ↑, BOLD) vs PET(방사성 포도당) vs DSI(백질 연결). MRI는 구조, fMRI는 기능.</li>\n<li><strong>헷갈리는 쌍</strong>: 전기(EEG) vs 자기장(MEG) / MRI(구조) vs fMRI(기능) / fMRI(회질 BOLD) vs DSI(백질 확산) / 역행성 vs 순행성 기억 상실 / 부주의적 맹시 vs 변화맹(변화맹은 그 한 유형).</li>\n<li><strong>뇌 구조 매칭</strong>: 연수(호흡·심장) / 뇌교(움직임·수면) / 시상(후각 제외 감각 관문) / 망상체(필터링·각성) / 소뇌(정교한 운동·비언어적 기억) / 편도체(공포) / 시상하부(항상성·섭식) / 해마(명시적 기억).</li>\n<li><strong>변연계 = 시상하부 + 뇌하수체 + 편도체 + 해마</strong>. 시상은 변연계가 아니다.</li>\n<li><strong>연합 영역</strong>: 관찰 가능한 반응 없음(교수 강조). 전전두엽(판단·계획), 측두엽 FFA(얼굴), 두정엽(수학·공간).</li>\n<li><strong>분할 뇌(Gazzaniga)</strong>: 우시야 → 좌뇌 → 말로 보고 가능 / 좌시야 → 우뇌 → 말로는 못 하지만 가리킬 수 있음. 기능의 편재화.</li>\n<li><strong>이중 처리</strong>: 의식적=계열, 무의식적=병렬. 선택적 주의 → 칵테일 파티 효과 / 부주의적 맹시 / 변화맹.</li>\n<li><strong>수면 단계</strong>: 각성=베타, 이완=알파, N3=델타, REM=빠른 안구운동+선명한 꿈, 근육 신호 차단, 심박·호흡 증가. 노인은 N3 진입이 어렵고 주기가 짧다.</li>\n<li><strong>꿈 이론 5개</strong>: 소망충족(프로이트) / 정보 처리 / 생물학적 기능 / <strong>활성화-종합</strong> / 인지 발달. REM 박탈 → <strong>REM 반동</strong>.</li>\n</ol>\n","len":17022},{"id":"w4_ch3","title":"4주차 — 3장 일생에 걸친 발달 정리","desc":"피아제·비고츠키, 애착, 양육 유형, 콜버그, 에릭슨, 성인기 발달","ch":"ch3","min":25,"html":"<h1>3장 — 일생에 걸친 발달 페이지별 해설</h1>\n<p>심리학으로의 여행 (Prof. 이소영) · 마이어스 심리학 개론 13판</p>\n<p>이 장의 핵심 질문은 &quot;사람의 신체·인지·사회성은 태아기부터 노년기까지 어떻게 변하는가?&quot;이다. 발달심리학의 세 논제(선천성/후천성, 연속성/단계, 안정성/변화)와 연구 방법(횡단/종단)을 출발점으로, 출생 이전 → 신생아 → 유아·아동기(<strong>피아제</strong>, 비고츠키, 마음 이론, 애착, 양육 방식, 자기 개념) → 청소년기(인지, <strong>콜버그</strong> 도덕성, <strong>에릭슨</strong> 정체성) → 성인기(인지 기능, 알츠하이머, 사회적 시계, 친밀감·생산성, 노년기 웰빙) 순으로 진행한다. 시험은 명칭을 쓰는 형태이므로 <strong>단계 이름과 연령, 학자–이론 짝, 비슷한 용어(권위적/권위주의적, 재인/회상 등)의 구분</strong>이 핵심이다.</p>\n<blockquote>\n<p>페이지 번호 = 슬라이드 번호. 슬라이드 16번(피아제 요약표), 29번(콜버그 표), 34·39번(에릭슨 표)은 표 슬라이드이다.</p>\n</blockquote>\n<hr>\n<h2>p.2 — 발달심리학의 목표 ⭐⭐⭐</h2>\n<ul>\n<li><strong>발달심리학(developmental psychology)</strong>: 일생에 걸친 <strong>신체·인지·사회성</strong> 발달을 탐구. (🎙 생물심리사회적 접근법의 세 수준 각각의 변화를 다룸)</li>\n<li><strong>세 가지 논제</strong><ul>\n<li><strong>선천성과 후천성(nature vs nurture)</strong>: 유전과 경험의 상호작용이 발달에 미치는 영향.</li>\n<li><strong>연속성과 단계(continuity vs stages)</strong>: 발달이 점진적인가, 계단식인가.</li>\n<li><strong>안정성과 변화(stability vs change)</strong>: 일생 유지되는 성격 특질은? 나이에 따라 변하는 것은?</li>\n</ul>\n</li>\n<li>[노트] 신경 가소성의 변화도 발달과 관련(<strong>결정적 시기, Critical Period</strong>).</li>\n</ul>\n<h2>p.3 — 횡단 연구 vs 종단 연구 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>횡단 연구 (cross-sectional)</strong></th>\n<th><strong>종단 연구 (longitudinal)</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>방식</td>\n<td>동일 시간대의 <strong>상이한 집단</strong> 비교</td>\n<td><strong>동일한 집단</strong>을 시간 경과에 따라 추적</td>\n</tr>\n<tr>\n<td>장점</td>\n<td>다량의 데이터 수집 용이</td>\n<td>개인·집단의 <strong>변화 양상</strong> 추적 용이</td>\n</tr>\n<tr>\n<td>단점</td>\n<td>한 집단의 변화 양상 추적 어려움(집단 간 동질성 문제)</td>\n<td><strong>중도 이탈</strong> 가능성 높음</td>\n</tr>\n</tbody></table>\n<ul>\n<li>🎙 교수: <strong>종단 연구의 기간은 꼭 몇 년 단위가 아니라 짧은 기간(며칠~몇 주)에도 적용 가능</strong>. 예) 학습이 이루어졌는지 며칠 간격으로 테스트. 흡연이 향후 건강에 미치는 영향 = 종단 연구.</li>\n</ul>\n<h2>p.4 — 출생 이전의 발달 ⭐</h2>\n<ul>\n<li><strong>접합자(수정란) → 배아 → 태아</strong>. 배아 단계부터 생물적 발달 시작.</li>\n<li><strong>6개월</strong>: 태아가 소리, 특히 <strong>어머니의 목소리</strong>에 반응 (Hepper, 2005). 신생아 울음소리에 <strong>모국어 억양</strong>이 반영 (Mampe et al., 2009).</li>\n<li>🎙 외부 환경에 대한 지각은 태아 시절부터 발달한다. 생물적 발달 → 인지적·사회적 발달로 확장.</li>\n</ul>\n<h2>p.5 — 테라토겐 ⭐⭐</h2>\n<ul>\n<li><strong>테라토겐(teratogen)</strong>: 태아에게 해를 끼칠 수 있는 모든 물질의 총칭(알코올, 니코틴, 바이러스 등).</li>\n<li>후생유전적 특징을 남긴다 (Liu et al., 2009). [노트] 후생유전 = 태어난 뒤 유전자 상에 남는 특성. 예) <strong>태아 알코올 증후군</strong>.</li>\n</ul>\n<h2>p.6 — 신생아의 능력과 습관화 ⭐⭐</h2>\n<ul>\n<li>신생아 반사: 뺨에 촉각 → 자극 쪽으로 고개 돌림입 근처에 닿으면 물려고 함, 손에 닿으면 쥐려고 함.</li>\n<li><strong>습관화(habituation)</strong>: 자극이 반복되면 반응이 줄어드는 현상. 유아가 <strong>무엇을 보고 기억하는지</strong> 알 수 있는 창.</li>\n<li>🎙 습관화가 일어난다는 것은 신생아에게도 자극을 이전에 경험했는지 판별하는 기초 기억 능력이 있다는 의미.</li>\n</ul>\n<h2>p.7 — 신생아의 선호 반응 ⭐</h2>\n<ul>\n<li>어머니 관련 자극을 태생적으로 선호(MacFarlane, 1978). 사람의 말소리·얼굴 그림에 더 반응(Reid et al., 2018). 친숙한 자극 선호.</li>\n<li>🎙 음악·풍경보다 사람 관련 자극에 더 오래 반응.</li>\n</ul>\n<h2>p.8 — 피아제 인지 발달 단계: 개요 ⭐⭐⭐</h2>\n<ul>\n<li><strong>장 피아제(Jean Piaget)</strong>: 특정 연령 아동이 만드는 <strong>오류의 유사성</strong>에 주목. 아동의 추론은 어른과 다르며 비논리적(Brainerd, 1996). 단순 반사에서 시작해 추상적 추리 능력에 도달.</li>\n<li><strong>4단계</strong>: <strong>감각 운동 → 전조작 → 구체적 조작 → 형식적 조작</strong>.</li>\n</ul>\n<h2>p.9 — 스키마·동화·조절 ⭐⭐⭐</h2>\n<ul>\n<li>경험을 이해하려는 노력이 인지 발달의 원동력.</li>\n<li><strong>스키마(schema)</strong>: 정보를 체제화·해석하는 틀.</li>\n<li><strong>동화(assimilation)</strong>: 새로운 경험을 <strong>기존 스키마</strong>로 해석.</li>\n<li><strong>조절(accommodation)</strong>: 새 정보를 수용하기 위해 <strong>스키마를 변화/적응</strong>시킴.</li>\n<li>🎙 피아제 이론의 골자 = 스키마를 형성하고, 그 스키마를 변화시키는 방향으로 발달이 이루어진다. 또한 <strong>외부 물리적 환경과의 상호작용</strong>을 강조.</li>\n</ul>\n<h2>p.10 — 감각 운동 단계 ⭐⭐⭐</h2>\n<ul>\n<li><strong>출생~만 2세</strong>. 신체 감각·운동으로 세상을 수용.</li>\n<li><strong>대상영속성(object permanence)</strong>: 대상이 지각되지 않아도 존재함을 아는 것. 6개월 이전엔 없고 이후 형성. 현대 연구: 단계적이라기보다 <strong>점진적·연속적</strong>(Wang et al., 2004).</li>\n<li>🎙 &quot;보이지 않는 부분 너머가 존재한다&quot;는 이해는 지각 체계에서 매우 중요. <strong>낯가림</strong>도 이 시기에 발달 → 익숙한 자극/익숙하지 않은 자극 구분 → 부모와의 <strong>애착 형성</strong>의 시작.</li>\n</ul>\n<h2>p.11 — 유아의 검증·인과 추론: 유아 물리학·유아 수학 ⭐⭐</h2>\n<ul>\n<li><strong>유아 물리학</strong>: 유아는 <strong>대상영속성을 위배한 사물</strong>(갑자기 사라지는 물체 등)을 더 오래 응시 (Shuarwairi &amp; Johnson, 2013).</li>\n<li><strong>유아 수학</strong>: 직전에 본 공의 개수와 나중에 본 개수가 <strong>불일치</strong>하면 더 오래 응시 (캐런 윈, 2008). 개수 불일치 감각은 다양한 영역에 적용 (Libertus &amp; Brannon, 2009).</li>\n<li>[노트] 두 내용은 <strong>피아제 이론이 간과한 부분</strong>을 보충 → 추론 능력이 예상보다 일찍 발달.</li>\n</ul>\n<h2>p.12 — 전조작 단계 ⭐⭐⭐</h2>\n<ul>\n<li><strong>2~6세</strong>. 대상을 <strong>단어·이미지로 표상</strong>할 수 있으나 <strong>심적 조작</strong>(행동 과정을 상상하거나 역전)은 불가.</li>\n<li><strong>보존 개념 결여</strong>: 시각(눈에 보이는 것)에 초점. 🎙 예) 같은 양의 우유를 폭이 좁고 긴 컵에 옮기면 수면 높이가 높은 쪽이 더 많다고 답함.</li>\n<li><strong>자기중심성(egocentrism)</strong>: 타인의 상황·시점을 이해하지 못하고 자신과 같을 것이라 여김. 🎙 예) 숨바꼭질에서 자기 눈을 가리면 안 보인다고 생각; 장난감이 칸막이에 가려져도 상대도 볼 것이라 생각.</li>\n</ul>\n<h2>p.13 — 가상 놀이 ⭐⭐</h2>\n<ul>\n<li><strong>가상 놀이(pretend play)</strong>: 3세 이후 (주디 들로치, 1987). 실제 방을 본뜬 <strong>모형</strong>에 인형을 숨긴 뒤 실제 방에서도 같은 방식으로 찾음 → 모형이 방을 <strong>상징</strong>함을 이해 → 상징적 사고가 일찍 발달함을 보여줌. <strong>피아제 이론이 간과한 부분</strong>.</li>\n</ul>\n<h2>p.14 — 구체적 조작 단계 ⭐⭐</h2>\n<ul>\n<li><strong>만 7~11세</strong>. 구체적 물질에 대한 <strong>보존</strong>을 이해하기 시작, 심적 조작·수학적 변형 가능.</li>\n</ul>\n<h2>p.15 — 형식적 조작 단계 ⭐⭐</h2>\n<ul>\n<li><strong>12세 이후~</strong>. 추상적 사고 확장(상상·상징). 사고가 <strong>과학자처럼</strong> 진행: <strong>가설적 명제와 결론 도출, 체계적 추리</strong>. 7세 아동은 명제 추론 불가 (Suppes, 1982).</li>\n</ul>\n<h2>p.16 — 피아제 발달단계 요약표 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>연령</th>\n<th>단계</th>\n<th>특징</th>\n<th>발달 현상</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>출생~2세</td>\n<td><strong>감각운동 단계</strong></td>\n<td>감각 행위를 통한 경험</td>\n<td><strong>대상영속성, 낯가림</strong></td>\n</tr>\n<tr>\n<td>2~6세</td>\n<td><strong>전조작 단계</strong></td>\n<td>단어·이미지 표상, 논리보다 <strong>직관</strong></td>\n<td><strong>자기중심성, 가상놀이</strong></td>\n</tr>\n<tr>\n<td>7~11세</td>\n<td><strong>구체적 조작 단계</strong></td>\n<td>구체적 사건에 대한 논리적 사고·수리 연산</td>\n<td><strong>보존 개념, 수학적 변환</strong></td>\n</tr>\n<tr>\n<td>12세~성인</td>\n<td><strong>형식적 조작 단계</strong></td>\n<td>추상적 추리</td>\n<td><strong>성숙한 도덕 추리 잠재성</strong></td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>의의</strong>: 아동 발달의 **인지적 이정표(milestone)**를 제공, 아동이 수동적 수용자가 아닌 <strong>적극적 상호작용</strong>을 추구하는 존재임을 함의 (🎙 이 두 가지가 피아제 이론의 중요한 공헌).</li>\n<li><strong>재고찰할 점</strong>: 발달 단계는 훨씬 더 <strong>연속적</strong>이고, 각 유형의 사고가 <strong>더 이른 시기에 발현</strong>되기도 함.</li>\n</ul>\n<h2>p.17 — 대안적 견해: 비고츠키의 사회적 아동 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>피아제</strong></th>\n<th><strong>비고츠키(Vygotsky)</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>마음의 성장</td>\n<td><strong>물리적 환경</strong>과의 상호작용</td>\n<td><strong>사회적 환경</strong>과의 상호작용</td>\n</tr>\n<tr>\n<td>핵심</td>\n<td>물리적 대상/환경 변화에 대한 심적 조작</td>\n<td>부모·교사가 새 어휘를 제공해 <strong>성장의 도약대(scaffolding)</strong> 제공</td>\n</tr>\n<tr>\n<td>언어</td>\n<td>–</td>\n<td>언어가 사고의 토대, 내면화하여 **속내말(inner speech)**로 문제 해결</td>\n</tr>\n</tbody></table>\n<ul>\n<li>[노트] 도약대 = 아동이 더 높은 사고 수준으로 발달할 때 일시적으로 제공하는 지지틀.</li>\n</ul>\n<h2>p.18 — 마음 이론(Theory of Mind) ⭐⭐⭐</h2>\n<ul>\n<li><strong>마음 이론</strong>: 감정·지각·사고·행동 등 <strong>타인과 자신의 심적 상태에 대한 생각</strong>. 타인의 심적 상태를 추론하는 능력.</li>\n<li><strong>4~5세</strong>에 급격히 발달. <strong>타인이 잘못된 인식을 지닐 수 있음</strong>을 이해 → 타인에 대한 이해와 공감의 시작점.</li>\n<li>소통 기회가 부족한 아동(예: 청각 문제)은 마음 이론의 미숙 (Peterson &amp; Siegal, 1999).</li>\n<li><strong>젠킨스 &amp; 애스팅턴(1996)</strong> 실험: 반창고 상자를 열어 보니 연필이 들어 있었다. &quot;다른 아이가 이 상자 안에 뭐가 있다고 할까?&quot; → <strong>3세: 연필</strong>(자기가 아는 대로), <strong>4~5세: 반창고</strong>.</li>\n<li>🎙 마음 이론이 발전해야만 사회성(공감)이 시작된다.</li>\n</ul>\n<h2>p.19 — 애착의 형성 ⭐⭐⭐</h2>\n<ul>\n<li><strong>애착(attachment)</strong>: 타인과의 <strong>정서적 유대</strong>. <strong>낯가림</strong>의 발달 = 부모와의 애착 형성의 시작.</li>\n<li><strong>애착의 원천</strong><ul>\n<li><strong>신체 접촉(온기·부드러움)</strong>: <strong>할로우의 대리모 실험(1971)</strong> — 새끼 원숭이는 우유가 나오는 철사 대리모보다 <strong>천으로 만든 부드러운 대리모</strong>에서 대부분의 시간을 보내고, 배고플 때만 철사 모에게 감. (🎙)</li>\n<li><strong>친숙성</strong>: 오리의 <strong>각인(imprinting)</strong> = 친숙성 기반 애착.</li>\n<li>애착도 인지 기능처럼 **결정적 시기(critical period)**에 형성.</li>\n</ul>\n</li>\n</ul>\n<h2>p.20 — 애착을 통한 인지 발달 ⭐</h2>\n<ul>\n<li>접촉을 통한 애정 표현이 애착 형성에 기여 (Mesman et al., 2015), 부모의 애정이 두뇌 발달·인지 능력 증폭 (Davis et al., 2017). 성숙하면 애착이 부모 외 다른 사람으로 이동 (Schmidt et al., 2019).</li>\n</ul>\n<h2>p.21 — 애착의 유형 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>안정 애착</strong></th>\n<th><strong>불안정 애착</strong></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>특징</td>\n<td>부모와 있으면 편안, 사라지면 불안해하다가 다시 만나면 <strong>신체 접촉을 시도</strong></td>\n<td>애착 자체를 <strong>회피</strong>하거나 신뢰할 만한 관계를 회피</td>\n</tr>\n</tbody></table>\n<ul>\n<li>안정/불안정의 차이는 <strong>아이의 행동에 대한 부모의 적절한 반응</strong>에 따라 결정 (De Wolff &amp; Van IJzendoorn, 1997). (🎙 아이가 어떤 행동을 하면 부모의 적절한 리액션이 수반되어야 안정 애착 형성)</li>\n</ul>\n<h2>p.22 — 애착 형성의 요인 ⭐⭐</h2>\n<ul>\n<li><strong>선천적 기질 + 양육 방식</strong> 둘 다 영향. 부모의 긍정적 양육 개입이 안정성을 높임 (Van Zeijl et al., 2006).</li>\n<li><strong>감수성 훈련</strong> 여부에 따라 기질적 변동성이 높은 아동의 안정 애착 비율이 변화 (판덴붐, 1994). 🎙 타고난 회피 성향이 있어도 감수성 훈련에 따라 달라짐 → 좋은 부모가 되기 위한 교육의 필요성.</li>\n</ul>\n<h2>p.23 — 애착의 중요성 ⭐⭐⭐</h2>\n<ul>\n<li>안정 애착 → <strong>기본 신뢰감</strong>(세상은 예측할 수 있고 믿을 만하다는 느낌, 후천적으로 형성). 성인기 대인 관계·사회/학업 성공에도 영향.</li>\n<li><strong>불안정 애착의 두 유형</strong><ul>\n<li><strong>불안 애착</strong>: 끊임없이 인정을 갈망, 배척 신호에 예민.</li>\n<li><strong>회피 애착</strong>: 긴밀한 관계가 형성되면 불편, 거리 유지 전략.</li>\n</ul>\n</li>\n<li>다만 불안·회피 경향은 <strong>위험 탐지·회피에 도움</strong>이 될 수 있음 (Ein-Dor et al., 2010). 🎙 관계가 끊어질 때 충격을 덜 받는 측면.</li>\n</ul>\n<h2>p.24 — 애착의 박탈 ⭐⭐</h2>\n<ul>\n<li><strong>애착 박탈</strong>: 지능·두뇌 발달 저하, 비정상적 스트레스 반응, <strong>ADHD</strong> 보고. <strong>루마니아 아동 연구</strong>(차우셰스쿠의 아이들; Bick et al., 2015; Kennedy et al., 2016).</li>\n<li>극단적 아동기 외상(가정 폭력 등)은 두뇌에 영향: 화난 얼굴에 대한 <strong>위협 탐지 영역(🎙 편도체) 과활성화</strong> (Graham et al., 2013).</li>\n<li>그러나 <strong>적절한 수준의 역경</strong>은 **회복 탄력성(resilience)**을 높임 (Ellis et al., 2017).</li>\n<li>🎙 불안정 애착보다 진짜 위험한 것은 <strong>애착이 박탈</strong>된 경우.</li>\n</ul>\n<h2>p.25 — 양육 방식의 유형 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>유형</th>\n<th>특징</th>\n<th>자녀 영향</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>권위주의적(authoritarian)</strong></td>\n<td>강압적, <strong>복종 요구</strong></td>\n<td>사회적 기술·자존감 저하 위험, 실수에 두뇌 과민 반응</td>\n</tr>\n<tr>\n<td><strong>허용적(permissive)</strong></td>\n<td>제약 없이 모든 행동 <strong>무조건 허용</strong></td>\n<td>공격적·미숙</td>\n</tr>\n<tr>\n<td><strong>방임적(neglectful)</strong></td>\n<td><strong>어떤 주의도 기울이지 않음</strong>(관계 형성 포함)</td>\n<td>학업·사회적 관계 매우 낮음</td>\n</tr>\n<tr>\n<td><strong>권위적(authoritative)</strong></td>\n<td>요구하되 <strong>타협</strong>으로 자녀 요구도 수용</td>\n<td>높은 자존감·자기신뢰감·자율성</td>\n</tr>\n</tbody></table>\n<ul>\n<li>🎙 <strong>권위주의적/권위적은 번역 용어가 겹쳐 헷갈리므로 「~주의」가 붙느냐로 구분</strong>. 권위적 부모는 요구와 함께 협상 조건을 제시하거나 자녀의 수정안을 허용.</li>\n<li>⭐ <strong>양육 방식과 자기개념 발달은 상관관계이지 인과관계가 아님</strong> (교수 강조, 「견보호자」 사례: 부모와 자식 성향이 반대일 수도 있음).</li>\n</ul>\n<h2>p.26 — 자기 개념의 발달 ⭐⭐⭐</h2>\n<ul>\n<li>아동기의 가장 중요한 사회적 성취. <strong>15~18개월</strong>부터 형성.</li>\n<li><strong>거울 실험(코에 빨간 점, Courage &amp; Howe, 2002)</strong>: 6개월 아동은 거울에 비친 상의 코에 손을 뻗고, <strong>15개월 이후</strong> 아동은 <strong>자기 코를 만짐</strong>.</li>\n<li>학령기: 소속 집단·심리적 특질·타인과의 유사성/차별성으로 구체화 (Stipek, 1992) → 이상적 자기개념 형성.</li>\n<li>🎙 거울 실험은 마음 이론과도 연결. (거울 뉴런 언급)</li>\n</ul>\n<h2>p.27 — 청소년기의 인지 발달 ⭐⭐</h2>\n<ul>\n<li>10대 초기: <strong>자기중심성이 지속</strong>되어 추리가 자신에게 집중, 「대부분에게 일어나는 일이 나에게는 일어나지 않을 것」이라는 믿음.</li>\n<li><strong>형식적 조작 단계와 겹침</strong>: 추상적 사고, 이상 vs 불완전한 현실 비교, 타인 추리의 <strong>모순·위선</strong>을 밝혀냄(도덕성 발달과 연관). 예) 총기 개혁 시위.</li>\n</ul>\n<h2>p.28 — 도덕 추리 ⭐⭐</h2>\n<ul>\n<li><strong>도덕 추리(moral reasoning)</strong>: 옳고 그름을 따질 때의 사고 과정. **콜버그(Kohlberg)**의 도덕성 발달 단계는 이를 기반으로 하며, <strong>도덕적 딜레마</strong>(트롤리 딜레마)에 대한 사고 변화를 추적. 도덕 판단은 <strong>인지 발달</strong>(피아제)에 기초. 🎙 선악·진실/거짓 같은 추상 개념 이해가 선행 → 형식적 조작 단계의 능력이 도덕 추리 잠재성의 기반.</li>\n</ul>\n<h2>p.29 — 콜버그의 도덕성 발달 단계 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>수준</th>\n<th>시기</th>\n<th>핵심 기제</th>\n<th>사례 (약을 훔쳐도 되는가?)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>전인습적(preconventional)</strong></td>\n<td>9세 이전</td>\n<td><strong>처벌 회피·구체적 보상</strong></td>\n<td>「훔치면 교도소 가니까 안 돼」/「안 잡히면 훔쳐도 돼」</td>\n</tr>\n<tr>\n<td><strong>인습적(conventional)</strong></td>\n<td>청소년 초기</td>\n<td><strong>사회적 인정, 사회 질서 유지</strong></td>\n<td>「아픈 딸을 위해 훔칠 수 있다」(역할 기대)/「법을 어기면 나쁜 사람이니 안 돼」</td>\n</tr>\n<tr>\n<td><strong>후인습적(postconventional)</strong></td>\n<td>청소년기와 그 이후</td>\n<td><strong>보편적 권리·스스로 규정한 윤리 원칙</strong></td>\n<td>「누구나 생명권이 있으므로 훔친다」</td>\n</tr>\n</tbody></table>\n<ul>\n<li>[노트] 후인습 단계는 <strong>집단 목표보다 개인 목표를 우선시하는 문화권</strong>에서 발현되기 쉬움.</li>\n</ul>\n<h2>p.30 — 도덕 직관과 도덕 행위 ⭐⭐⭐</h2>\n<ul>\n<li><strong>도덕 직관(moral intuition)</strong>: 도덕성의 상당 부분은 <strong>이성보다 직관·정서</strong>에 기반 (하이트, 2012). 판단이 자동적·신속. 혐오·기쁨 같은 정서가 도덕 추리 촉발(Chester &amp; DeWall, 2016). <strong>트롤리 딜레마</strong>(레버 돌리기 vs 직접 사람 밀치기).</li>\n<li><strong>도덕 행위</strong>: 도덕적 사고·감정 → 언행이 일반적이나, <strong>도덕적 행동을 통해 도덕적 태도를 함양</strong>하는 것도 가능 (Heller, 2014; Piliavin, 2003).</li>\n<li>🎙 엄벌주의도 정서·직관(응보) 요소와 관련. 법원의 <strong>행동 프로그램(치료) 이수 명령</strong>은 <strong>행동 → 태도 형성</strong>을 인정하기 때문.</li>\n</ul>\n<h2>p.31 — 청소년기의 정체성 확립 ⭐⭐⭐</h2>\n<ul>\n<li><strong>에릭슨(Erikson, 1963)</strong>: 삶의 각 단계는 **심리사회적 과제(위기)**를 수반.</li>\n<li>청소년기 = <strong>정체성(identity) 확립</strong>. 집·학교·온라인 등 다양한 상황의 「자기」를 시도하고 <strong>통합</strong>하여 사회적 정체성 수립.</li>\n<li>🎙 정체성 수립의 가장 중요한 요소는 <strong>차별성</strong>(남들과 다른 나). 대부분은 타인에게 휘둘리지 않는 자신만의 삶의 방식을 선호(Lyons, 2004), 개인적 성취 욕망 발달.</li>\n<li>[노트] 정체성 형성 방식은 다양(부모 기대 수용, 또래 집단 정체성 수용).</li>\n</ul>\n<h2>p.32 — 청소년기: 친밀감과 소속감 ⭐</h2>\n<ul>\n<li>가족·친구와의 긴밀한 관계로 즐거움. 문화권에 따라 차이 — <strong>개인주의 문화권</strong>에서 또래 간 낭만적 관계(Li et al., 2010). 🎙 <strong>집단주의 vs 개인주의 문화권</strong>의 차이는 <strong>자기소개 방식</strong>에서 잘 드러남.</li>\n</ul>\n<h2>p.33 — 부모-또래 관계 ⭐</h2>\n<ul>\n<li>청소년기에 <strong>또래의 영향력 증가</strong>, 그러나 부모와의 관계가 또래 관계에도 영향 (Gold &amp; Yanof, 1985). SNS에서 「좋아요」가 많은 또래 사진을 보면 <strong>보상 처리 두뇌 영역 활성화</strong> (Sherman et al., 2016). 부모와의 긍정적 관계 → 또래와의 긍정적 관계 (Resnick et al., 1997).</li>\n</ul>\n<h2>p.34 — 에릭슨의 심리사회적 발달 단계 (유아~청소년기) ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>단계</th>\n<th>심리사회적 위기</th>\n<th>과제</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>유아기(0~1세)</td>\n<td><strong>신뢰감 vs 불신감</strong></td>\n<td>욕구가 충족되면 <strong>기본 신뢰감</strong></td>\n</tr>\n<tr>\n<td>걸음마기(1~2세)</td>\n<td><strong>자율성 vs 수치감·자기의심</strong></td>\n<td>스스로 행하는 방식 학습, 아니면 능력 의심</td>\n</tr>\n<tr>\n<td>학령 전기(3~6세)</td>\n<td><strong>선도성(주도성) vs 죄책감</strong></td>\n<td>과제를 스스로 하고 계획 실행 학습</td>\n</tr>\n<tr>\n<td>청소년기(10~20대)</td>\n<td><strong>정체성 vs 역할 혼미</strong></td>\n<td>역할을 검증해 자기감 정교화</td>\n</tr>\n</tbody></table>\n<ul>\n<li>🎙 아이는 생존을 위해 생물학적 욕구·안전 욕구를 부모가 충족해 줘야 하며, 안정 애착 → <strong>기본 신뢰감</strong>. 인생 각 단계마다 극복할 위기가 존재.</li>\n</ul>\n<h2>p.35 — 성인기의 인지 기능: 기억과 노화 ⭐⭐⭐</h2>\n<ul>\n<li>노년층은 기억 문제 최소화를 위해 <strong>단서 활용</strong>. <strong>기억력의 개인차는 나이 들수록 커짐</strong>.</li>\n<li><strong>재인(recognition)</strong> 능력은 **회상(recall)**과 달리 노화에 따른 변화가 적음 (Schonfield &amp; Robertson, 1966).</li>\n<li>🎙 회상 과제(직접 단어 산출)는 나이에 따라 하락하지만 <strong>재인 과제</strong>(본 적 있는가 판단)는 변화가 거의 없음. 노인이 단어를 못 말하는 것은 기억이 지워진 것이 아니라 <strong>직접 산출(생성)의 문제</strong>.</li>\n<li><strong>설단 현상(tip-of-the-tongue)</strong> 망각: 단어가 혀끝에서 맴도는 현상, 노년층이 더 자주 경험 (Ossher et al., 2012).</li>\n</ul>\n<h2>p.36 — 신경인지장애와 알츠하이머 ⭐⭐</h2>\n<ul>\n<li>뇌졸중·알코올 등에 의한 뇌 손상 → <strong>신경인지장애(neurocognitive disorder)</strong>. <strong>아세틸콜린 생산 저하</strong>와 밀접(알츠하이머).</li>\n<li>알츠하이머 환자 뉴런에 <strong>단백질 조각 잔여물</strong>이 남음 (De Meyer et al., 2010).</li>\n<li>심신 활동을 지속 유지하면 <strong>치매 발현 지연</strong> 가능 (Horder et al., 2018). 🎙 예방·치료는 어렵더라도 증상 악화를 완화.</li>\n</ul>\n<h2>p.37 — 성인기의 사회성: 사회적 시계·중년기 전환 ⭐⭐⭐</h2>\n<ul>\n<li><strong>사회적 시계(social clock)</strong>: 결혼·은퇴 등 사회적 사건에 대해 <strong>문화적으로 선호하는 타이밍</strong>. 문화·시대에 따라 변화(옛날 평균 결혼 20대 후반 → 요즘 30대 초반도 늦지 않음).</li>\n<li><strong>중년기로의 전환(40대)</strong>: 통념은 심리적 위기·좌절이라 주장하나, 40대에 그만한 사건은 자주 발생하지 않음 (Hunter &amp; Sundel, 1989).</li>\n</ul>\n<h2>p.38 — 성인기의 두 측면: 친밀감(사랑)과 생산성(직업) ⭐⭐⭐</h2>\n<ul>\n<li><strong>친밀감</strong>: 관심사·가치관·정서적 지원 공유. 결혼은 행복감·신체/심리 건강을 예측. <strong>혼전 동거는 더 높은 이혼율</strong> (Jose et al., 2010). <strong>긍정:부정 상호작용 비율 5:1</strong>이 성공적 결혼 유지 (고트만 &amp; 고트만, 2018).</li>\n<li><strong>생산성</strong>: 흥미에 맞고 유능감·성취감을 주는 직업이 행복과 연관. 높은 직무 만족 = 삶의 만족. 🎙 <strong>조직 심리학</strong>은 직무 만족을 높게 유지하는 방법(업무 특성, 관리자의 대우, 스트레스, 인사 평가)을 연구.</li>\n<li>[노트] 혼전 동거 파경 원인 해석: 처음부터 지속적 결혼에 덜 충실한 경향, 동거 중 결혼을 덜 지지, 헤어지기 곤란해 결혼(기회 비용). (🎙 교수는 두 번째·세 번째 해석 위주로 소개)</li>\n</ul>\n<h2>p.39 — 에릭슨의 심리사회적 발달 단계 (성인~노년기) ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>단계</th>\n<th>위기</th>\n<th>과제</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>성인 초기(20~40대 초)</td>\n<td><strong>친밀감 vs 소외감</strong></td>\n<td>밀접한 관계·사랑, 아니면 고립감</td>\n</tr>\n<tr>\n<td>중년기(40~60대)</td>\n<td><strong>생산성 vs 침체감</strong></td>\n<td>가족·일을 통한 자신감·사회 공헌감, 아니면 목표감 상실</td>\n</tr>\n<tr>\n<td>노년기(60대 후반~)</td>\n<td><strong>통합감 vs 절망감</strong></td>\n<td>삶을 되돌아볼 때 만족감 vs 실패감</td>\n</tr>\n</tbody></table>\n<h2>p.40 — 평생에 걸친 웰빙 ⭐⭐</h2>\n<ul>\n<li>노년층은 <strong>애착 불안·스트레스·분노 감소</strong> (Chopik et al., 2013), 젊은 성인과 달리 <strong>삶의 좋은 일을 더 잘 기억</strong> (Addis et al., 2010), 대인 관계 문제 적게 보고 → 삶 만족 (Crabtree, 2011).</li>\n<li>[노트] **이순(60세)**이라는 말이 존재하는 이유(남의 말이 귀에 거슬리지 않음). 🎙 <strong>성공적 노화</strong>는 세 가지 요인(<strong>낙관적 관점, 지속적인 대인 관계, 생물학적 영향</strong>)이 모두 갖춰져야 가능. 75세까지 건강은 노력으로, 그 이상은 타고나야 한다는 긍정심리학 교수의 말 소개.</li>\n</ul>\n<hr>\n<h2>🎙 실제 수업 기록 (9/15 화, 녹음본 기준)</h2>\n<p>전체 134분. 「시험에 나온다」는 직접적 발언은 전문 검색에서 확인되지 않았다(아래는 강조·추가 설명).</p>\n<ul>\n<li><strong>00:14–01:09</strong> 발달심리학 = 생물심리사회적 세 수준 전부의 변화를 탐구. 세 논제: 선천성/후천성, 연속성/단계, 안정성/변화.</li>\n<li><strong>04:06–07:22 / 메모 05:12–07:34</strong> 횡단·종단 연구. 흡연의 영향 = 종단. <strong>종단은 며칠 단위 짧은 기간에도 가능</strong>. 횡단 = 다량 데이터 수집 쉬우나 변화 추적 어려움 / 종단 = 지속 모니터링, <strong>중도 이탈</strong> 위험.</li>\n<li><strong>11:13–14:17</strong> 6개월 태아 소리 반응, 모국어 억양 울음, <strong>테라토겐</strong>.</li>\n<li><strong>15:16–19:34</strong> 신생아 반사, <strong>습관화</strong> = 지루함(반복 자극에 반응 감소), 자주 들은 소리·어머니 관련 자극·사람 자극 선호.</li>\n<li><strong>19:59–25:33</strong> 피아제: 스키마를 형성하고 변화시키며 발달. <strong>외부 물리적 환경과의 상호작용이 핵심</strong>. 감각운동 단계의 가장 큰 능력 = <strong>대상영속성</strong>(보이지 않아도 존재).</li>\n<li><strong>28:25–31:33 / 메모 30:30–30:47</strong> 피아제는 단계적 발달을 보지만 <strong>추상적 추론은 나중, 인과 추론은 감각운동기부터</strong>. 유아 물리학·유아 수학(응시 시간).</li>\n<li><strong>32:36–35:29 / 메모 34:08–34:58</strong> 전조작: <strong>보존 개념 결여</strong>(우유 수면 높이), <strong>자기중심성</strong>(타인의 시점 이해 못함, 숨바꼭질에서 자기 눈만 가림).</li>\n<li><strong>35:57–38:43</strong> 가상 놀이는 전조작기부터. 구체적 조작 = 구체적 물질·사건의 보존, 형식적 조작 = 가설·명제에서 결론 도출.</li>\n<li><strong>39:52–43:47</strong> 피아제 단계 요약. 감각운동기에 <strong>대상영속성 + 낯가림</strong>(익숙/비익숙 구분 → 애착의 시작점). 도덕 추리는 형식적 조작 기반. <strong>피아제 이론의 두 가지 공헌</strong>: (1) 발달 마일스톤(이정표) 제공, (2) <strong>아동의 능동성</strong>을 보여줌.</li>\n<li><strong>44:42–48:32 / 메모 47:02</strong> 피아제의 한계: 계단식(0과 1)이 아니라 점진적 변화. <strong>비고츠키의 사회적 아동</strong>: 물리적 환경보다 <strong>사회적 환경</strong> 중시.</li>\n<li><strong>49:02–52:27 / 메모 52:48</strong> <strong>마음 이론</strong>: 타인이 잘못된 인식을 가질 수 있음을 이해. 청각 문제 아동의 미숙. <strong>마음 이론이 발전해야 사회성(공감)이 시작</strong>.</li>\n<li><strong>53:13–59:09</strong> 애착 = 정서적 유대, 낯가림 이후 친숙/비친숙 구별. <strong>할로우 대리모</strong>(배고플 때만 철사 모에게), <strong>각인</strong>(오리).</li>\n<li><strong>1:00:07–1:08:25</strong> 안정/불안정 애착, 부모의 <strong>적절한 리액션</strong>, <strong>감수성 훈련</strong>, 좋은 부모 교육 필요, 회피·불안 애착.</li>\n<li><strong>1:09:28–1:17:54 / 메모 1:11:42</strong> 불안정 애착도 위험 탐지에 도움, <strong>진짜 위험은 애착 박탈</strong>(루마니아), 극단적 외상은 위협 탐지(편도체) 과활성화, 역경과 <strong>회복 탄력성</strong>.</li>\n<li><strong>1:17:54–1:19:59</strong> 양육 방식 네 유형. <strong>권위적/권위주의적 용어 구분 주의</strong>, <strong>상관이지 인과 아님</strong>(견보호자/호부견자).</li>\n<li><strong>1:20:46–1:22:53 / 메모 1:20:53</strong> <strong>자기 개념</strong>: 15~18개월, 코에 빨간 점 거울 실험(6개월은 거울 속 상에 손, 15개월은 자기 코), 거울 뉴런 언급.</li>\n<li><strong>1:22:53–1:26:55</strong> 청소년기 = 형식적 조작 진입, 자기중심성, 이상적 자기 구축, 인지 발달 → 도덕성 발달.</li>\n<li><strong>1:27:59–1:32:23</strong> 콜버그 3수준(전인습/인습/후인습) 사례 설명. 인습적 = 사회적 인정·역할 기대·질서 유지. 후인습 = 개인 신념·기본권.</li>\n<li><strong>1:32:23–1:37:17</strong> 도덕 추리 형성에는 <strong>정서가 상당 부분 개입</strong>, 엄벌주의의 응보적 성격, <strong>도덕 직관</strong>, <strong>행동 → 태도</strong>(행동 치료 프로그램 이수 명령).</li>\n<li><strong>1:37:59–1:40:33</strong> 정체성 확립에서 <strong>가장 중요한 요소는 차별성</strong>. <strong>개인주의/집단주의 문화권의 자기소개 방식 차이</strong>.</li>\n<li><strong>1:40:33–1:46:31</strong> 부모와의 관계, 또래 영향, SNS 좋아요 → 보상 영역 활성화.</li>\n<li><strong>1:46:31–1:51:23</strong> <strong>에릭슨</strong>: 유아는 생존 욕구·안전 욕구 → 부모가 충족 → <strong>기본 신뢰감</strong>. 단계마다 극복할 위기.</li>\n<li><strong>1:52:33–1:54:06 / 메모 1:54:30</strong> <strong>회상 과제는 노화에 따라 하락, 재인 과제는 변화 없음</strong>. <strong>설단 현상</strong>.</li>\n<li><strong>1:55:07–1:59:00 / 메모 1:58:00</strong> 알츠하이머(뇌졸중·알코올, 단백질 조각), <strong>심신 활동으로 증상 악화 완화</strong>.</li>\n<li><strong>1:59:00–2:02:19</strong> <strong>사회적 시계</strong>(입시 → 취업 → 결혼 → 이직·은퇴), 시대·문화에 따라 변함. <strong>중년기 전환 위기론은 연구상 지지되지 않음</strong>.</li>\n<li><strong>2:02:19–2:06:31 / 메모 2:03:14</strong> 친밀감(결혼과 건강·행복, <strong>5:1</strong> 비율, 혼전 동거 파경 해석 세 가지).</li>\n<li><strong>2:06:31–2:08:30</strong> 생산성(직업), <strong>조직 심리학</strong>, 에릭슨 후반부(친밀감 vs 소외감 → 생산성 → 통합감 vs 절망감).</li>\n<li><strong>2:08:30–2:14:13 / 메모 2:09:59</strong> <strong>노년기 행복감이 높다</strong>. 이순(60세), 성공적 노화 <strong>세 요인</strong>, 75세 건강 = 노력. 총정리: 아동기~청소년기 내용이 많은 이유는 연속적 발달이 아동기에 많기 때문. 이론 접근 = 피아제 + 비고츠키, 사회성 = 에릭슨, 도덕성 = 콜버그.</li>\n</ul>\n<hr>\n<h2>명칭 암기표</h2>\n<table>\n<thead>\n<tr>\n<th>명칭 (영문)</th>\n<th>한 줄 정의/단서</th>\n<th>슬라이드</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>발달심리학 (developmental psychology)</strong></td>\n<td>일생에 걸친 신체·인지·사회성 발달 탐구</td>\n<td>2</td>\n</tr>\n<tr>\n<td><strong>선천성과 후천성 (nature vs nurture)</strong></td>\n<td>유전과 경험의 상호작용</td>\n<td>2</td>\n</tr>\n<tr>\n<td><strong>연속성과 단계</strong></td>\n<td>점진적 vs 계단식</td>\n<td>2</td>\n</tr>\n<tr>\n<td><strong>안정성과 변화</strong></td>\n<td>유지되는 특질 vs 변하는 것</td>\n<td>2</td>\n</tr>\n<tr>\n<td><strong>결정적 시기 (critical period)</strong></td>\n<td>신경 가소성·애착 형성의 민감한 시기</td>\n<td>2, 19</td>\n</tr>\n<tr>\n<td><strong>횡단 연구 (cross-sectional)</strong></td>\n<td>동일 시간대의 상이한 집단</td>\n<td>3</td>\n</tr>\n<tr>\n<td><strong>종단 연구 (longitudinal)</strong></td>\n<td>동일 집단을 시간에 따라 추적</td>\n<td>3</td>\n</tr>\n<tr>\n<td><strong>접합자 → 배아 → 태아</strong></td>\n<td>출생 이전 발달 순서</td>\n<td>4</td>\n</tr>\n<tr>\n<td><strong>테라토겐 (teratogen)</strong></td>\n<td>태아에게 해로운 모든 물질</td>\n<td>5</td>\n</tr>\n<tr>\n<td><strong>후생유전 (epigenetic)</strong></td>\n<td>출생 후 유전자에 남는 특성</td>\n<td>5</td>\n</tr>\n<tr>\n<td><strong>태아 알코올 증후군</strong></td>\n<td>알코올 노출 결과</td>\n<td>5</td>\n</tr>\n<tr>\n<td><strong>습관화 (habituation)</strong></td>\n<td>반복 자극에 반응 감소</td>\n<td>6</td>\n</tr>\n<tr>\n<td><strong>피아제의 인지 발달 단계 (Piaget)</strong></td>\n<td>4단계 이론</td>\n<td>8</td>\n</tr>\n<tr>\n<td><strong>스키마 (schema)</strong></td>\n<td>정보를 체제화·해석하는 틀</td>\n<td>9</td>\n</tr>\n<tr>\n<td><strong>동화 (assimilation)</strong></td>\n<td>기존 스키마로 새 경험 해석</td>\n<td>9</td>\n</tr>\n<tr>\n<td><strong>조절 (accommodation)</strong></td>\n<td>스키마를 변화시켜 새 정보 수용</td>\n<td>9</td>\n</tr>\n<tr>\n<td><strong>감각 운동 단계 (sensorimotor)</strong></td>\n<td>출생~2세</td>\n<td>10</td>\n</tr>\n<tr>\n<td><strong>대상영속성 (object permanence)</strong></td>\n<td>지각되지 않아도 존재함을 앎</td>\n<td>10</td>\n</tr>\n<tr>\n<td><strong>낯가림</strong></td>\n<td>익숙/비익숙 자극 구분, 애착의 시작</td>\n<td>16 (🎙)</td>\n</tr>\n<tr>\n<td><strong>유아 물리학 / 유아 수학</strong></td>\n<td>위배 사건·개수 불일치에 더 오래 응시</td>\n<td>11</td>\n</tr>\n<tr>\n<td><strong>전조작 단계 (preoperational)</strong></td>\n<td>2~6세</td>\n<td>12</td>\n</tr>\n<tr>\n<td><strong>심적 조작 (mental operation)</strong></td>\n<td>행동 과정을 상상·역전</td>\n<td>12</td>\n</tr>\n<tr>\n<td><strong>보존 개념 (conservation)</strong></td>\n<td>형태가 바뀌어도 양은 같음</td>\n<td>12, 14</td>\n</tr>\n<tr>\n<td><strong>자기중심성 (egocentrism)</strong></td>\n<td>타인도 나와 같으리라 여김</td>\n<td>12</td>\n</tr>\n<tr>\n<td><strong>가상 놀이 (pretend play)</strong></td>\n<td>모형으로 상징적 사고</td>\n<td>13</td>\n</tr>\n<tr>\n<td><strong>구체적 조작 단계 (concrete operational)</strong></td>\n<td>7~11세</td>\n<td>14</td>\n</tr>\n<tr>\n<td><strong>형식적 조작 단계 (formal operational)</strong></td>\n<td>12세~, 추상적 추리</td>\n<td>15</td>\n</tr>\n<tr>\n<td><strong>비고츠키의 사회적 아동 (Vygotsky)</strong></td>\n<td>사회적 환경과의 상호작용</td>\n<td>17</td>\n</tr>\n<tr>\n<td><strong>도약대 (scaffolding)</strong></td>\n<td>일시적 지지틀</td>\n<td>17</td>\n</tr>\n<tr>\n<td><strong>속내말 (inner speech)</strong></td>\n<td>언어를 내면화해 문제 해결</td>\n<td>17</td>\n</tr>\n<tr>\n<td><strong>마음 이론 (theory of mind)</strong></td>\n<td>타인·자신의 심적 상태 추론, 4~5세</td>\n<td>18</td>\n</tr>\n<tr>\n<td><strong>애착 (attachment)</strong></td>\n<td>타인과의 정서적 유대</td>\n<td>19</td>\n</tr>\n<tr>\n<td><strong>할로우의 대리모 실험 (Harlow)</strong></td>\n<td>신체 접촉(온기·부드러움)</td>\n<td>19</td>\n</tr>\n<tr>\n<td><strong>각인 (imprinting)</strong></td>\n<td>오리, 친숙성 기반 애착</td>\n<td>19</td>\n</tr>\n<tr>\n<td><strong>안정 애착 / 불안정 애착</strong></td>\n<td>편안·접촉 시도 / 회피</td>\n<td>21</td>\n</tr>\n<tr>\n<td><strong>감수성 훈련</strong></td>\n<td>부모 훈련으로 안정 애착 비율 상승</td>\n<td>22</td>\n</tr>\n<tr>\n<td><strong>기본 신뢰감 (basic trust)</strong></td>\n<td>세상은 예측 가능·믿을 만함</td>\n<td>23</td>\n</tr>\n<tr>\n<td><strong>불안 애착 / 회피 애착</strong></td>\n<td>인정 갈망 / 거리 유지</td>\n<td>23</td>\n</tr>\n<tr>\n<td><strong>애착 박탈</strong></td>\n<td>루마니아 아동, ADHD</td>\n<td>24</td>\n</tr>\n<tr>\n<td><strong>회복 탄력성 (resilience)</strong></td>\n<td>적절한 역경 경험 후 높아짐</td>\n<td>24</td>\n</tr>\n<tr>\n<td><strong>권위주의적 부모 (authoritarian)</strong></td>\n<td>강압·복종</td>\n<td>25</td>\n</tr>\n<tr>\n<td><strong>허용적 부모 (permissive)</strong></td>\n<td>무조건 허용</td>\n<td>25</td>\n</tr>\n<tr>\n<td><strong>방임적 부모 (neglectful)</strong></td>\n<td>무관심</td>\n<td>25</td>\n</tr>\n<tr>\n<td><strong>권위적 부모 (authoritative)</strong></td>\n<td>요구 + 타협</td>\n<td>25</td>\n</tr>\n<tr>\n<td><strong>자기 개념 (self-concept)</strong></td>\n<td>15~18개월, 거울 실험</td>\n<td>26</td>\n</tr>\n<tr>\n<td><strong>콜버그의 도덕성 발달 단계 (Kohlberg)</strong></td>\n<td>도덕 추리 3수준</td>\n<td>28, 29</td>\n</tr>\n<tr>\n<td><strong>도덕 추리 (moral reasoning)</strong></td>\n<td>옳고 그름을 따지는 사고</td>\n<td>28</td>\n</tr>\n<tr>\n<td><strong>트롤리 딜레마 (trolley dilemma)</strong></td>\n<td>도덕 딜레마 사례</td>\n<td>28, 30</td>\n</tr>\n<tr>\n<td><strong>전인습적 / 인습적 / 후인습적 단계</strong></td>\n<td>처벌·보상 / 인정·질서 / 보편 원리</td>\n<td>29</td>\n</tr>\n<tr>\n<td><strong>도덕 직관 (moral intuition)</strong></td>\n<td>이성보다 직관·정서, 하이트</td>\n<td>30</td>\n</tr>\n<tr>\n<td><strong>도덕 행위 (moral action)</strong></td>\n<td>행동으로 태도 함양 가능</td>\n<td>30</td>\n</tr>\n<tr>\n<td><strong>에릭슨의 심리사회적 발달 단계 (Erikson)</strong></td>\n<td>단계마다 위기</td>\n<td>31, 34, 39</td>\n</tr>\n<tr>\n<td><strong>정체성 (identity)</strong></td>\n<td>청소년기의 자기 통합</td>\n<td>31</td>\n</tr>\n<tr>\n<td><strong>신뢰감 vs 불신감</strong></td>\n<td>유아기 위기</td>\n<td>34</td>\n</tr>\n<tr>\n<td><strong>자율성 vs 수치감·자기의심</strong></td>\n<td>걸음마기</td>\n<td>34</td>\n</tr>\n<tr>\n<td><strong>선도성 vs 죄책감</strong></td>\n<td>학령 전기</td>\n<td>34</td>\n</tr>\n<tr>\n<td><strong>정체성 vs 역할 혼미</strong></td>\n<td>청소년기</td>\n<td>34</td>\n</tr>\n<tr>\n<td><strong>재인 (recognition) / 회상 (recall)</strong></td>\n<td>본 적 있는가 판단 / 직접 산출</td>\n<td>35</td>\n</tr>\n<tr>\n<td><strong>설단 현상 (tip-of-the-tongue)</strong></td>\n<td>혀끝에서 맴도는 망각</td>\n<td>35</td>\n</tr>\n<tr>\n<td><strong>신경인지장애 (neurocognitive disorder)</strong></td>\n<td>뇌 손상으로 발생, 알츠하이머</td>\n<td>36</td>\n</tr>\n<tr>\n<td><strong>사회적 시계 (social clock)</strong></td>\n<td>사회적 사건의 문화적 타이밍</td>\n<td>37</td>\n</tr>\n<tr>\n<td><strong>중년기로의 전환</strong></td>\n<td>40대 위기론(지지되지 않음)</td>\n<td>37</td>\n</tr>\n<tr>\n<td><strong>친밀감(사랑) / 생산성(직업)</strong></td>\n<td>성인기의 두 측면</td>\n<td>38</td>\n</tr>\n<tr>\n<td><strong>5:1 비율</strong></td>\n<td>긍정:부정 상호작용, 고트만</td>\n<td>38</td>\n</tr>\n<tr>\n<td><strong>친밀감 vs 소외감</strong></td>\n<td>성인 초기</td>\n<td>39</td>\n</tr>\n<tr>\n<td><strong>생산성 vs 침체감</strong></td>\n<td>중년기</td>\n<td>39</td>\n</tr>\n<tr>\n<td><strong>통합감 vs 절망감</strong></td>\n<td>노년기</td>\n<td>39</td>\n</tr>\n<tr>\n<td><strong>성공적 노화</strong></td>\n<td>낙관·대인 관계·생물학적 요인 (🎙)</td>\n<td>40</td>\n</tr>\n</tbody></table>\n<h2>시험 대비 핵심 요약</h2>\n<ol>\n<li><strong>발달의 세 논제</strong>: 선천성/후천성, 연속성/단계, 안정성/변화. <strong>횡단</strong>(다량 데이터, 변화 추적 어려움) vs <strong>종단</strong>(변화 추적, 중도 이탈).</li>\n<li><strong>피아제 4단계 연령·핵심어</strong>: 감각운동(<del>2세, 대상영속성·낯가림) / 전조작(2</del>6세, 보존 결여·자기중심성·가상 놀이) / 구체적 조작(7<del>11세, 보존) / 형식적 조작(12세</del>, 추상·가설 추리). <strong>동화 vs 조절</strong>.</li>\n<li><strong>피아제의 한계</strong>: 발달은 더 연속적, 사고가 더 일찍 발현(유아 물리학·수학, 가상 놀이). <strong>비고츠키</strong>는 사회적 환경·도약대·속내말.</li>\n<li><strong>마음 이론</strong>: 4<del>5세, 타인의 잘못된 인식 이해 (젠킨스 &amp; 애스팅턴: 3세 연필 / 4</del>5세 반창고).</li>\n<li><strong>애착</strong>: 신체 접촉(할로우)·친숙성(각인). 안정(적절한 반응) vs 불안정(불안/회피). 진짜 위험은 <strong>박탈</strong>. 안정 애착 → 기본 신뢰감.</li>\n<li><strong>양육 4유형</strong>: 권위주의적(복종) / 허용적(무조건 허용) / 방임적(무관심) / 권위적(요구+타협). <strong>상관 ≠ 인과</strong>.</li>\n<li><strong>자기 개념</strong>: 15~18개월 거울 실험(코의 빨간 점).</li>\n<li><strong>콜버그</strong>: 전인습(처벌·보상) → 인습(인정·질서) → 후인습(보편 원리). <strong>도덕 직관</strong>: 이성보다 정서·직관, 행동 → 태도.</li>\n<li><strong>에릭슨 표 암기</strong>: 신뢰/불신 → 자율/수치 → 선도/죄책 → 정체성/역할 혼미 → 친밀/소외 → 생산/침체 → 통합/절망.</li>\n<li><strong>헷갈리는 쌍</strong>: 권위주의적/권위적 · 동화/조절 · 재인/회상 · 불안/회피 애착 · 횡단/종단 · 친밀감/생산성 · 정체성 위기 vs 통합감 위기.</li>\n<li><strong>노화</strong>: 회상은 하락, 재인은 유지, 설단 현상 증가. 알츠하이머 = 단백질 조각, 아세틸콜린 저하, 심신 활동으로 지연. 노년기 행복감·스트레스·분노 감소.</li>\n<li><strong>성인기</strong>: 사회적 시계(시대·문화에 따라 변동), 중년 위기론 미지지, 결혼 5:1, 성공적 노화 세 요인.</li>\n</ol>\n","len":19161},{"id":"w5_ch4","title":"5주차 — 4장 감각과 지각 정리","desc":"상향/하향 처리, 신호탐지이론, 시각 경로, 게슈탈트, 깊이 단서, 감각 상호작용","ch":"ch4","min":25,"html":"<h1>4장 — 감각과 지각 페이지별 해설</h1>\n<p>심리학으로의 여행 (Prof. 이소영) · 마이어스 심리학 개론 13판</p>\n<p>이 장의 핵심 질문은 &quot;우리가 본 것은 세상 그대로인가?&quot;이다. <strong>감각</strong>은 외부 정보를 수용·표상하는 과정이고 <strong>지각</strong>은 그것을 체제화·해석하는 과정인데, 지각에는 <strong>상향 처리</strong>(감각 입력에서 출발)와 <strong>하향 처리</strong>(경험·기대·맥락·동기·정서)가 모두 개입한다. 그래서 같은 자극도 사람과 상황에 따라 다르게 지각된다. 장의 전반부는 역치·신호탐지·순응·지각 갖춤새(하향 처리), 후반부는 시각의 신경 과정, 게슈탈트 조직화, 깊이·움직임 지각, 감각 상호작용과 ESP를 다룬다.</p>\n<p>페이지 번호 = 슬라이드 번호(총 42장). 18번 슬라이드는 이미지만 있는 &quot;풍경 속 얼굴 찾기&quot; 그림이고 19번이 정답(13개)이다. 10번(중의적 그림)·31번(집단화 사진)도 이미지 위주라 텍스트가 거의 없다.</p>\n<hr>\n<h2>p.1 — 감각과 지각 (표지)</h2>\n<p>4장 감각과 지각. 수업(9/22)은 &quot;지각은 감각 정보를 기반으로 하지만 몇 가지가 더 개입하는 다채로운 인지 프로세스&quot;라는 말로 시작했다.</p>\n<h2>p.2 — 감각 VS 지각, 상향 VS 하향 처리 ⭐⭐⭐</h2>\n<table>\n<thead>\n<tr>\n<th>구분</th>\n<th>정의</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>감각(Sensation)</strong></td>\n<td>외부 환경에서 입력된 정보를 감각 기관이 <strong>수용하고 표상</strong>하는 과정</td>\n</tr>\n<tr>\n<td><strong>지각(Perception)</strong></td>\n<td>감각 정보를 <strong>체제화하고 해석</strong>하는 과정 (=경험)</td>\n</tr>\n<tr>\n<td><strong>상향 처리(Bottom-up)</strong></td>\n<td>감각 수용기에서 고차 인지 기능으로 이어지는 처리 (감각·물리적 속성 중심)</td>\n</tr>\n<tr>\n<td><strong>하향 처리(Top-down)</strong></td>\n<td>경험과 기대에 기반하여 감각 입력을 체계화 (주의·기억·계획 등 고차 기능이 감각에 영향)</td>\n</tr>\n</tbody></table>\n<ul>\n<li>지각은 두 처리 <strong>모두</strong>의 영향을 받는다. 상향 처리는 반드시 일어나야 하지만(입력이 대뇌까지 올라와야 함), 해석 과정에서 관심사·기대·맥락이 경험을 바꾼다.</li>\n<li>상향/하향은 지각뿐 아니라 다른 인지 기능에도 적용되는 일반적 기전이다.</li>\n<li>노트의 격언: &quot;우리가 보는 세상은 객관적인 사실 그대로의 세상이 아니다.&quot; 교수는 검은 글씨를 검은색이라고 &quot;합의&quot;할 뿐 실제로 어떻게 전달됐는지는 아무도 모른다고 예를 들었다.</li>\n</ul>\n<h2>p.3 — 감각 정보의 변환 ⭐⭐</h2>\n<ul>\n<li><strong>에너지의 변환(Transduction)</strong>: 각 감각은 특정 에너지(시각=빛, 청각=공기 진동)로 구성되며 두뇌가 이해할 수 있는 신경 신호로 변환되어야 한다.</li>\n<li>세 단계: ① 전문화된 <strong>수용기</strong>가 자극 수용 → ② 신경 활동(전기/화학)으로 전환 → ③ 신경 정보가 두뇌로 전달.</li>\n<li>시각: 망막의 <strong>광수용기 세포</strong>가 빛을 전기·화학 신호로 바꿔 시신경으로 전달 → 후두엽 시각 피질에 도달해야 &quot;봤다&quot;고 할 수 있다.</li>\n</ul>\n<h2>p.4 — 역치(Threshold) ⭐⭐⭐</h2>\n<ul>\n<li><strong>역치</strong>: 생물체가 반응을 일으키는 데 필요한 자극의 최소 강도.</li>\n<li><strong>절대 역치(Absolute Threshold)</strong>: 특정 자극의 <strong>탐지 비율이 0.5가 되는 지점</strong>. 자극 강도뿐 아니라 개인의 심리 상태(주의, 과제 상태)에도 영향을 받는다. (청력 검사에서 온 신경을 기울이면 역치가 낮아짐)</li>\n<li>슬라이드는 &quot;효율적 기능을 위해서는 절대 역치가 낮은 것이 유리&quot;라고 적었지만, 교수는 **&quot;낮은 게 언제나 좋은 건 아니다&quot;**라고 보충했다. 모든 정보를 받아들이면 정신적 자원(mental resource)에 하중이 걸려 정작 중요한 정보를 처리 못 할 수 있다.</li>\n<li><strong>역치하(subliminal) 자극</strong>: 탐지율 0.5 <strong>미만</strong>으로 제시된 자극. 의식적으로 지각하지 못해도 심리 기제에 영향을 줄 수 있다.</li>\n</ul>\n<h2>p.5 — 점화 연구(Priming Study) ⭐⭐</h2>\n<ul>\n<li><strong>점화(Priming)</strong>: 특정 자극을 먼저 제시해 관련 개념을 미리 활성화시키는 것. 점화 자극에 의해 활성화된 속성이 나중 자극의 처리에 영향(예: 사과 → 배는 단어 판단이 빠르고, 사과 → 하늘은 느림).</li>\n<li>점화 자극의 제시 시간과 <strong>차폐(mask) 자극</strong>을 이용해 <strong>역치하 자극</strong>으로 만들 수 있다. 예시: <code>####</code> (50ms) – 점화어 &quot;커피&quot; (50ms) – <code>####</code> – 표적 &quot;원두&quot;; <strong>SOA(Stimulus Onset Asynchrony)</strong>.</li>\n<li>교수: 점화 연구는 역치하 자극 효과를 보는 패러다임이며, 제시 시간이 길어지면 다른 인지 처리가 개입해 &quot;순수한 점화 효과&quot;라 하기 어려워 <strong>짧게(약 43~50ms) 제시하는 것을 권장</strong>한다. 소리 자극은 짧게 제시하기 어렵다는 한계도 언급.</li>\n</ul>\n<h2>p.6 — 신호 탐지 이론(Signal Detection Theory) ⭐⭐⭐</h2>\n<p>절대 역치가 개인차·상태에 따라 변하므로, <strong>사람이 어떤 기준으로 &quot;신호가 있다&quot;고 판단하는가</strong>를 계산하는 이론. 신호/노이즈 상태에서 반응 4가지가 나온다.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>신호 있음</th>\n<th>신호 없음(노이즈)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>&quot;있다&quot; 반응</td>\n<td><strong>적중(Hit)</strong></td>\n<td><strong>오경보(False Alarm)</strong></td>\n</tr>\n<tr>\n<td>&quot;없다&quot; 반응</td>\n<td><strong>놓침(Miss)</strong></td>\n<td><strong>정기각(Correct Rejection)</strong></td>\n</tr>\n</tbody></table>\n<ul>\n<li><strong>민감도(d&#39;)</strong>: 실제 신호와 노이즈를 구별하는 능력. 신호 분포와 노이즈 분포의 <strong>피크 간 거리</strong>가 멀수록 민감도가 높다.</li>\n<li><strong>편향성(반응 편향)</strong>: 신호가 있다고 판단하는 개인의 <strong>기준선</strong>. 우측일수록 <strong>엄격</strong>(적중·오경보 모두 감소), 좌측일수록 <strong>관대</strong>(적중 증가, 오경보도 증가).</li>\n<li>청력 검사에서 활용 가능. 경험, 기대, 각성 상태에 따라 변동.</li>\n<li>(노트) 민감도 = z(Hit rate) − z(False alarm rate) / 반응 편향 c = −½[z(H)+z(FA)] (0=중립, 양수=보수적, 음수=자유로운 기준). 계산식 자체는 수업에서 다루지 않았다.</li>\n</ul>\n<h2>p.7 — 차이 역치와 베버의 법칙 ⭐⭐⭐</h2>\n<ul>\n<li><strong>차이 역치(difference threshold)</strong> = <strong>최소식별차이(JND)</strong>: 두 자극이 다르다고 탐지할 확률이 0.5가 되는 최소 차이값.</li>\n<li><strong>베버의 법칙(Weber&#39;s Law)</strong>: 두 자극의 차이를 지각하려면 절대적 양이 아니라 <strong>일정 비율</strong>만큼 변해야 한다.</li>\n<li>교수 예시: 100kg 가방이 10% 늘어야 무겁다고 느낀다면 110kg, 그다음은 +11kg(121kg)이 필요하다. (녹음 오인식으로 &quot;15의 원칙&quot;처럼 들렸지만 핵심은 &quot;일정 비율&quot;)</li>\n</ul>\n<h2>p.8 — 감각 순응(Sensory adaptation) ⭐⭐⭐</h2>\n<ul>\n<li>자극에 <strong>반복 노출</strong>되면 감각 기관의 <strong>민감도가 감소</strong>. 목적: 새롭거나 더 중요한 대상에 주의를 집중 → 외부 자극을 그대로가 아니라 <strong>개인의 필요성에 맞게</strong> 지각.</li>\n<li>신경 수준: 뉴런은 **활동전위 크기가 아니라 발화율(firing rate)**의 변화로 자극 강도를 표상한다. 순응이 일어나면 발화율이 감소 → 신경 표상이 약해져 지각도 약화.</li>\n<li>오감 중 <strong>후각</strong>이 순응이 가장 빠르다(수용기 세포가 가장 빨리 피로). 예: 디퓨저 냄새가 처음엔 강하다가 곧 안 느껴짐. 발달 장(3장)의 아기 <strong>습관화</strong>와 유사.</li>\n</ul>\n<h2>p.9 — 지각 갖춤새(Perceptual set) ⭐⭐⭐</h2>\n<ul>\n<li><strong>지각 갖춤새</strong>: 경험에 근거해 특정 지각에 대해 형성되는 <strong>기대</strong>. 사전에 제시된 환경적 맥락에 따라 지각 양상이 달라짐. <strong>하향 처리의 대표 예시.</strong></li>\n<li>기대는 과제 목표, 주의, 반복 경험으로 생긴 지식 등 여러 요인으로 형성된다.</li>\n<li>예시(가로 vs 세로): 같은 가운데 자극이 가로로 읽으면 알파벳 <strong>B</strong>(A-B-C), 세로로 읽으면 숫자 <strong>13</strong>(12-13-14)으로 보인다.</li>\n</ul>\n<h2>p.10 — 지각 갖춤새: 중의적 그림 ⭐⭐</h2>\n<p>교수는 그림 3개를 보여주었다. 왼쪽에 명확한 <strong>젊은 귀부인</strong> 그림 → 가운데 중의적 그림 → 지각이 귀부인 쪽으로 기움. 반대로 <strong>할머니</strong> 얼굴이 명확한 그림을 먼저 보고 가운데를 보면 할머니로 지각. 먼저 본 그림(사전 제시된 지식)이 가운데 그림의 해석을 결정한다. (9/22 31:35~34:59)</p>\n<h2>p.11 — 지각 갖춤새: 미각·청각 ⭐⭐</h2>\n<ul>\n<li>유명 프랜차이즈 로고가 새겨진 봉투에 담긴 감자튀김을 아이들이 더 맛있게 평가(Robinson et al.). → <strong>블라인드 테스트</strong>를 하는 이유가 이런 인지 요인 때문. 교수는 커피 프랜차이즈 블라인드 테스트 경험담도 언급.</li>\n<li><strong>&#39;원효대사 해골물&#39;</strong>: 모르고 마셨을 땐 시원했는데 해골물인 걸 알자 달라짐 → &quot;모든 건 마음먹기에 달렸다&quot;는 심리학적으로 꽤 맞는 말.</li>\n<li><strong>말 분절(Speech Segmentation)</strong>: 연속된 말소리 안에서 단어의 시작과 끝을 구분하는 능력. 모국어의 단어·문법 지식이 있어야 가능하므로 <strong>청각에서의 하향 처리 예시</strong>(러시아어는 분절이 어려움).</li>\n</ul>\n<h2>p.12 — 가짜약(Placebo) 효과 ⭐⭐</h2>\n<ul>\n<li><strong>플라시보 효과</strong>는 사람의 **기대치(Expectation)**가 적용된 하향 처리의 대표 사례. 예: 디카페인 커피에 대한 위약 효과(Dawkins et al., 2011).</li>\n<li><strong>가짜약 조건(placebo condition)</strong>: 특정 처치를 받았다고 참가자가 착각하게 만드는 조건. 효과가 처치를 받았다는 &#39;인지&#39;에 의한 것인지 &#39;처치&#39; 자체 효과인지 비교할 수 있다. (1장 실험설계 내용과 연결)</li>\n<li>교수: 하향 처리에 의한 지각 경험 차이를 가장 잘 보여주는 것은 시각보다 <strong>통증</strong> 쪽.</li>\n</ul>\n<h2>p.13 — 인지·주의에 따른 통각 ⭐⭐⭐</h2>\n<ul>\n<li>개인의 기대나 주의가 <strong>통지각</strong>을 바꿀 수 있다(Wiech et al., 2008).</li>\n<li><strong>Beecher(1959)</strong>: 2차 세계대전 <strong>부상병</strong>들이 객관적으로 중상인데도 통증을 덜 보고하거나 못 느낌.</li>\n<li>과거에는 통증
