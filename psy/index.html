전체의 공통 생물학적 특성·보편성 / 행동유전학=유전자·환경 차이로 인한 개인차</p>\n","src":"서막 p.17-18"},{"id":"c_ch0_018","ch":"ch0","tag":"함정","front":"<p>분트의 공이치기 실험에서, 소리를 듣고 바로 버튼을 누른 반응 시간과 소리를 자각한 뒤 버튼을 누른 반응 시간은 각각 몇 초인가?</p>\n","back":"<p>즉각 반응(자각 없이) ≈ 0.1초 / 자각 후 반응 ≈ 0.2초 — 두 수치를 서로 바꿔 내는 문항이 함정</p>\n","src":"서막 p.8"},{"id":"c_ch0_019","ch":"ch0","tag":"함정","front":"<p>컴퓨터 메타포에서 SSD와 RAM은 각각 어떤 기억에 대응하는가?</p>\n","back":"<p>SSD=장기 기억, RAM=작업(단기) 기억 — 시험에서 이 대응을 뒤바꿔 놓는 오답이 자주 나옴</p>\n","src":"서막 p.13"},{"id":"c_ch1_001","ch":"ch1","tag":"명칭","front":"<p>결과를 알고 난 뒤 자신이 처음부터 예측할 수 있었다고 믿는 경향은?</p>\n","back":"<p>후견 편향(hindsight bias) — 연령·문화 무관 보편적, 예: 콜럼버스의 달걀</p>\n","src":"1장 p.4"},{"id":"c_ch1_002","ch":"ch1","tag":"명칭","front":"<p>실제로 아는 것보다 더 많이 안다고 생각하는 경향은?</p>\n","back":"<p>과신(overconfidence) — 테틀록 연구: 80% 확신한 사건의 실제 적중률 40% 이하</p>\n","src":"1장 p.5"},{"id":"c_ch1_003","ch":"ch1","tag":"명칭","front":"<p>자신의 사고 과정을 아는 능력, 즉 &#39;인지에 대한 인지&#39;는?</p>\n","back":"<p>메타인지(metacognition) — Flavell(1979). 발달할수록 후견 편향·과신이 줄어듦</p>\n","src":"1장 p.6"},{"id":"c_ch1_004","ch":"ch1","tag":"명칭","front":"<p>떠올리기 쉬운 강렬한 사례를 중심으로 확률·빈도를 판단하는 사고방식은?</p>\n","back":"<p>가용성 어림법(availability heuristic)</p>\n","src":"1장 p.10"},{"id":"c_ch1_005","ch":"ch1","tag":"명칭","front":"<p>인간이 정신적 자원 소모를 최소화하려는 경향을 가리키는 말은?</p>\n","back":"<p>인지적 구두쇠(cognitive miser)</p>\n","src":"1장 p.10"},{"id":"c_ch1_006","ch":"ch1","tag":"명칭","front":"<p>자신의 기존 견해에 맞는 정보만 선택적으로 받아들이는 경향은?</p>\n","back":"<p>확증 편향(confirmation bias)</p>\n","src":"1장 p.11"},{"id":"c_ch1_007","ch":"ch1","tag":"명칭","front":"<p>개인의 신념·감정이 객관적 사실보다 여론 형성에 더 큰 영향을 미치는 현상·시대는?</p>\n","back":"<p>탈진실(post-truth) — 2017 옥스퍼드 올해의 단어</p>\n","src":"1장 p.8"},{"id":"c_ch1_008","ch":"ch1","tag":"명칭","front":"<p>이론에서 도출된, 검증 가능한 형태로 표현된 예측은?</p>\n","back":"<p>가설(hypothesis)</p>\n","src":"1장 p.14"},{"id":"c_ch1_009","ch":"ch1","tag":"명칭","front":"<p>측정할 수 없는 추상 개념을 계량 가능한 절차로 정확히 진술하는 것은?</p>\n","back":"<p>조작적 정의(operational definition) — 예: 수면 박탈 = 24시간 동안 수면 1시간 미만</p>\n","src":"1장 p.14"},{"id":"c_ch1_010","ch":"ch1","tag":"명칭","front":"<p>소수의 개인·집단을 집중적으로 관찰해 심층 분석하는 기술적 연구 방법은?</p>\n","back":"<p>사례 연구(case study) — 일반화가 곤란하다는 한계</p>\n","src":"1장 p.16"},{"id":"c_ch1_011","ch":"ch1","tag":"명칭","front":"<p>질문 문항의 어휘 표현에 따라 응답이 달라지는 효과는?</p>\n","back":"<p>말표현 효과(wording effect)</p>\n","src":"1장 p.17"},{"id":"c_ch1_012","ch":"ch1","tag":"명칭","front":"<p>모집단의 모든 구성원이 표본에 뽑힐 동등한 기회를 갖도록 하는 표집 원칙은?</p>\n","back":"<p>무선 표집(random sampling) — 표본 크기보다 대표성이 중요</p>\n","src":"1장 p.18"},{"id":"c_ch1_013","ch":"ch1","tag":"명칭","front":"<p>실제로는 관계가 없는 두 변인 사이에 관계가 있다고 지각하는 현상은?</p>\n","back":"<p>착각 상관(illusory correlation)</p>\n","src":"1장 p.19"},{"id":"c_ch1_014","ch":"ch1","tag":"명칭","front":"<p>극단적인 사건이 일어난 뒤 다음에는 평균값 쪽으로 되돌아오는 통계적 경향은?</p>\n","back":"<p>평균으로의 회귀(regression toward the mean)</p>\n","src":"1장 p.19"},{"id":"c_ch1_015","ch":"ch1","tag":"명칭","front":"<p>참가자를 실험 조건과 통제 조건에 무작위로 배정해 개인차의 영향을 최소화하는 기법은?</p>\n","back":"<p>무선 할당(random assignment)</p>\n","src":"1장 p.21"},{"id":"c_ch1_016","ch":"ch1","tag":"명칭","front":"<p>참가자와 실험자 모두 누가 가짜약(위약) 조건인지 모르게 하는 절차는?</p>\n","back":"<p>이중 은폐(double-blind procedure)</p>\n","src":"1장 p.22"},{"id":"c_ch1_017","ch":"ch1","tag":"명칭","front":"<p>인간·동물을 대상으로 하는 연구의 윤리적 적합성을 사전에 심의하는 기관은?</p>\n","back":"<p>기관 생명 윤리 위원회(IRB, Institutional Review Board) — 슬라이드 29번, 1장 시험 범위의 마지막</p>\n","src":"1장 p.29"},{"id":"c_ch1_018","ch":"ch1","tag":"개념","front":"<p>기술적 방법·상관 연구·실험법은 각각 인과관계를 밝힐 수 있는가?</p>\n","back":"<p>기술적 방법=현상 기술만 가능, 상관 연구=예측은 가능하나 인과 불가, 실험법=인과 검증 가능(유일)</p>\n","src":"1장 p.15-21"},{"id":"c_ch1_019","ch":"ch1","tag":"개념","front":"<p>무선 표집과 무선 할당은 각각 무엇을 대상으로, 무엇을 위해 하는가?</p>\n","back":"<p>무선 표집=모집단→표본을 뽑을 때(목적: 대표성) / 무선 할당=뽑힌 참가자를 조건에 배정할 때(목적: 개인차 최소화)</p>\n","src":"1장 p.18-21"},{"id":"c_ch1_020","ch":"ch1","tag":"개념","front":"<p>착각 상관, 평균으로의 회귀, 후견 편향을 서로 구분하는 핵심 포인트는?</p>\n","back":"<p>착각 상관=없는 관계를 있다고 지각 / 평균으로의 회귀=극단값 뒤 평균 쪽 복귀 / 후견 편향=결과를 안 뒤 예측 가능했다고 믿음</p>\n","src":"1장 p.19, p.4"},{"id":"c_ch1_021","ch":"ch1","tag":"개념","front":"<p>가짜약(위약) 조건과 이중 은폐는 각각 무엇을 가리키는가?</p>\n","back":"<p>가짜약 조건=처치를 받았다고 착각하게 하는 통제 조건 / 이중 은폐=참가자와 실험자 모두 조건을 모르는 절차</p>\n","src":"1장 p.22"},{"id":"c_ch1_022","ch":"ch1","tag":"함정","front":"<p>상관 연구에서 두 변인 사이에 강한 상관이 나타나면 한 변인이 다른 변인의 원인이라고 결론지어도 되는가?</p>\n","back":"<p>안 된다 — 상관은 인과를 입증하지 못한다(제3의 변인 가능성). 교수가 &#39;굉장히 중요한 사안&#39;이라고 반복 강조한 포인트</p>\n","src":"1장 p.19-20 · 교수 강조(0901)"},{"id":"c_ch1_023","ch":"ch1","tag":"함정","front":"<p>좋은 표본의 조건은 표본의 크기가 큰 것인가, 대표성이 있는 것인가?</p>\n","back":"<p>대표성이 핵심이다 — 표본이 아무리 커도 대표성이 없으면 좋은 표본이 아니라고 교수가 강조함</p>\n","src":"1장 p.18 · 교수 강조(0901)"},{"id":"c_ch2_001","ch":"ch2","tag":"명칭","front":"<p>손상 후 재조직되거나 경험에 따라 구조와 기능이 변하는 뇌의 능력은?</p>\n","back":"<p>신경 가소성(neuroplasticity) — 런던 택시 운전사의 해마가 버스 운전사보다 큼(Maguire 2006)</p>\n","src":"2장 p.5"},{"id":"c_ch2_002","ch":"ch2","tag":"명칭","front":"<p>활동 전위가 역치를 넘으면 완전한 크기로, 넘지 못하면 전혀 발생하지 않는 성질은?</p>\n","back":"<p>실무율(all-or-none law) — 자극이 강해지면 크기가 아니라 발화율이 증가함</p>\n","src":"2장 p.8"},{"id":"c_ch2_003","ch":"ch2","tag":"명칭","front":"<p>뉴런 내부로 양전하가 유입되어 안팎의 전위차가 사라지는 현상은?</p>\n","back":"<p>탈분극화(depolarization)</p>\n","src":"2장 p.7-8"},{"id":"c_ch2_004","ch":"ch2","tag":"명칭","front":"<p>시냅스로 방출된 신경전달물질 중 과잉분이 방출 뉴런으로 되돌아가는 과정은?</p>\n","back":"<p>재흡수(reuptake) — 재흡수를 차단하는 약물이 우울을 완화함</p>\n","src":"2장 p.9"},{"id":"c_ch2_005","ch":"ch2","tag":"명칭","front":"<p>과잉되면 조현병, 부족하면 파킨슨병과 관련되는 신경전달물질은?</p>\n","back":"<p>도파민(dopamine)</p>\n","src":"2장 p.10"},{"id":"c_ch2_006","ch":"ch2","tag":"명칭","front":"<p>부족하면 우울증과 관련되는 신경전달물질은?</p>\n","back":"<p>세로토닌(serotonin)</p>\n","src":"2장 p.10"},{"id":"c_ch2_007","ch":"ch2","tag":"명칭","front":"<p>대표적인 억제성 신경전달물질로, 부족하면 경련·불면과 관련되는 것은?</p>\n","back":"<p>GABA — 글루타메이트(흥분성)와 대비되는 억제성 신경전달물질</p>\n","src":"2장 p.10"},{"id":"c_ch2_008","ch":"ch2","tag":"명칭","front":"<p>백질의 물 분자 확산 패턴을 이용해 신경 섬유의 연결 구조를 촬영하는 뇌 영상 기법은?</p>\n","back":"<p>확산 스펙트럼 영상(DSI, Diffusion Spectrum Imaging)</p>\n","src":"2장 p.13"},{"id":"c_ch2_009","ch":"ch2","tag":"명칭","front":"<p>혈중 산소 농도 변화(BOLD) 신호로 뇌의 기능적 활동을 촬영하는 기법은?</p>\n","back":"<p>fMRI(기능적 자기공명영상) — 공간 해상도가 매우 높음</p>\n","src":"2장 p.13"},{"id":"c_ch2_010","ch":"ch2","tag":"명칭","front":"<p>자극 제시 시점을 기준으로 두피의 전위 변화를 평균 낸 뇌파 측정 지표는?</p>\n","back":"<p>사건 관련 전위(ERP, Event-Related Potential) — N400(의미)·P600(문법)</p>\n","src":"2장 p.12"},{"id":"c_ch2_011","ch":"ch2","tag":"명칭","front":"<p>후각을 제외한 모든 감각 정보가 대뇌 피질로 가기 전 거치는 중계소는?</p>\n","back":"<p>시상(thalamus) — 시상은 후각을 거치지 않는다는 점이 교수 강조 포인트</p>\n","src":"2장 p.15"},{"id":"c_ch2_012","ch":"ch2","tag":"명칭","front":"<p>감각·운동 영역을 제외한 대뇌 피질의 나머지 영역으로, 판단·계획·얼굴 재인 등을 담당하는 곳은?</p>\n","back":"<p>연합 영역(association areas) — 관찰 가능한 반응을 직접 산출하지 않는다는 것이 핵심 특징</p>\n","src":"2장 p.17"},{"id":"c_ch2_013","ch":"ch2","tag":"명칭","front":"<p>좌우 대뇌 반구를 연결하는 신경 다리로, 분할 뇌 수술에서 절단되는 부위는?</p>\n","back":"<p>뇌량(corpus callosum)</p>\n","src":"2장 p.18"},{"id":"c_ch2_014","ch":"ch2","tag":"명칭","front":"<p>여러 말소리 중 자신이 관심 있는 하나에만 선택적으로 주의를 기울이는 현상은?</p>\n","back":"<p>칵테일 파티 효과(cocktail party effect)</p>\n","src":"2장 p.19"},{"id":"c_ch2_015","ch":"ch2","tag":"명칭","front":"<p>한 사건에 집중하느라 눈앞 장면의 변화를 알아차리지 못하는 현상은?</p>\n","back":"<p>변화맹(change blindness) — 부주의적 맹시의 한 유형</p>\n","src":"2장 p.19"},{"id":"c_ch2_016","ch":"ch2","tag":"명칭","front":"<p>REM 수면을 박탈당한 뒤 더 많은/더 빠른 REM 수면으로 되돌아가려는 현상은?</p>\n","back":"<p>REM 반동(REM rebound)</p>\n","src":"2장 p.21"},{"id":"c_ch2_017","ch":"ch2","tag":"개념","front":"<p>EEG/ERP, MEG, fMRI는 시간 해상도와 공간 해상도에서 각각 어떤 강점이 있나?</p>\n","back":"<p>EEG/ERP=시간 해상도 높음·공간 낮음 / MEG=시간·공간 해상도 모두 높음 / fMRI=공간 해상도 매우 높음(시간은 상대적으로 느림)</p>\n","src":"2장 p.12-13"},{"id":"c_ch2_018","ch":"ch2","tag":"개념","front":"<p>부주의적 맹시와 변화맹의 관계는 어떻게 되는가?</p>\n","back":"<p>부주의적 맹시=주의를 주지 않은 자극을 지각하지 못함(상위 개념) / 변화맹=장면의 변화를 알아차리지 못함(부주의적 맹시의 한 유형)</p>\n","src":"2장 p.19"},{"id":"c_ch2_019","ch":"ch2","tag":"개념","front":"<p>역행성 기억상실과 순행성 기억상실은 어떻게 다른가?</p>\n","back":"<p>역행성=손상 이전의 기억을 떠올리지 못함(영화 「제이슨 본」) / 순행성=손상 이후 새 기억을 형성하지 못함(영화 「메멘토」, 더 일반적)</p>\n","src":"2장 강의 메모(0908)"},{"id":"c_ch2_020","ch":"ch2","tag":"개념","front":"<p>교감신경계와 부교감신경계는 각각 어떤 상태를 담당하는가?</p>\n","back":"<p>교감신경계=각성(심박↑, 소화 억제) / 부교감신경계=이완(심박↓, 소화 촉진)</p>\n","src":"2장 p.16"},{"id":"c_ch2_021","ch":"ch2","tag":"함정","front":"<p>변연계를 구성하는 구조에 시상이 포함되는가?</p>\n","back":"<p>포함되지 않는다 — 변연계는 시상하부·뇌하수체·편도체·해마로 구성되며 시상은 별도 구조</p>\n","src":"2장 p.15-16"},{"id":"c_ch2_022","ch":"ch2","tag":"함정","front":"<p>분할 뇌 환자가 우시야로 본 단어를 &#39;말로&#39; 보고하는 것과 좌시야로 본 단어를 &#39;손으로 가리켜&#39; 표현하는 것은 각각 어느 반구가 처리한 것인가?</p>\n","back":"<p>우시야 단어를 말로 보고 = 좌뇌(언어 처리) / 좌시야 단어를 가리키기 = 우뇌 — 우시야·좌시야와 좌뇌·우뇌 대응을 뒤바꾸는 함정에 주의</p>\n","src":"2장 p.18(Gazzaniga 1967)"},{"id":"c_ch3_001","ch":"ch3","tag":"명칭","front":"<p>동일 시간대에 서로 다른 연령 집단을 비교하는 발달 연구법은?</p>\n","back":"<p>횡단 연구(cross-sectional study) — 데이터 수집은 빠르지만 개인의 변화 추적은 어려움</p>\n","src":"3장 p.3"},{"id":"c_ch3_002","ch":"ch3","tag":"명칭","front":"<p>동일 집단을 장기간 추적하며 변화를 관찰하는 발달 연구법은?</p>\n","back":"<p>종단 연구(longitudinal study) — 변화 추적에는 강하나 중도 이탈 문제가 있음. 짧은 기간에도 적용 가능</p>\n","src":"3장 p.3"},{"id":"c_ch3_003","ch":"ch3","tag":"명칭","front":"<p>태아에게 해를 끼칠 수 있는 알코올·니코틴·바이러스 등 외부 물질을 통칭하는 말은?</p>\n","back":"<p>테라토겐(teratogen) — 대표 예: 태아 알코올 증후군</p>\n","src":"3장 p.5"},{"id":"c_ch3_004","ch":"ch3","tag":"명칭","front":"<p>같은 자극이 반복 제시될 때 반응이 점차 줄어드는 현상으로, 신생아의 자극 기억을 확인하는 방법으로도 쓰이는 것은?</p>\n","back":"<p>습관화(habituation)</p>\n","src":"3장 p.6"},{"id":"c_ch3_005","ch":"ch3","tag":"명칭","front":"<p>정보를 체제화하고 해석하는 인지의 틀은?</p>\n","back":"<p>스키마(schema)</p>\n","src":"3장 p.7"},{"id":"c_ch3_006","ch":"ch3","tag":"명칭","front":"<p>새로운 경험을 기존의 스키마에 맞추어 해석하는 것은?</p>\n","back":"<p>동화(assimilation)</p>\n","src":"3장 p.7"},{"id":"c_ch3_007","ch":"ch3","tag":"명칭","front":"<p>새로운 정보를 받아들이기 위해 기존 스키마 자체를 바꾸는 것은?</p>\n","back":"<p>조절(accommodation)</p>\n","src":"3장 p.7"},{"id":"c_ch3_008","ch":"ch3","tag":"명칭","front":"<p>눈앞에 보이지 않아도 대상이 계속 존재한다는 것을 아는, 감각운동기의 핵심 성취는?</p>\n","back":"<p>대상영속성(object permanence)</p>\n","src":"3장 p.8"},{"id":"c_ch3_009","ch":"ch3","tag":"명칭","front":"<p>타인도 자신과 똑같이 보고 생각한다고 여기는, 전조작기 아동의 사고 특징은?</p>\n","back":"<p>자기중심성(egocentrism)</p>\n","src":"3장 p.9"},{"id":"c_ch3_010","ch":"ch3","tag":"명칭","front":"<p>타인의 심적 상태(생각·믿음·의도)를 추론하는 능력으로, 4~5세에 급격히 발달하는 것은?</p>\n","back":"<p>마음 이론(theory of mind) — 발달해야 사회성(공감)이 시작된다는 것이 교수 강조 포인트</p>\n","src":"3장 p.11"},{"id":"c_ch3_011","ch":"ch3","tag":"명칭","front":"<p>비고츠키 이론에서, 부모·교사가 아동의 발달 수준보다 한 단계 위의 과제를 해낼 수 있도록 제공하는 일시적 지지는?</p>\n","back":"<p>도약대(scaffolding)</p>\n","src":"3장 p.10"},{"id":"c_ch3_012","ch":"ch3","tag":"명칭","front":"<p>언어를 내면화하여 스스로 문제를 해결하는 데 사용하는 것(비고츠키)은?</p>\n","back":"<p>속내말(inner speech)</p>\n","src":"3장 p.10"},{"id":"c_ch3_013","ch":"ch3","tag":"명칭","front":"<p>새끼 오리가 부화 후 처음 본 대상을 따라다니게 되는, 친숙성에 기반한 애착 현상은?</p>\n","back":"<p>각인(imprinting) — 결정적 시기 개념과 연결</p>\n","src":"3장 p.12"},{"id":"c_ch3_014","ch":"ch3","tag":"명칭","front":"<p>세상은 예측 가능하고 믿을 만하다는, 안정 애착에서 형성되는 정서적 느낌은?</p>\n","back":"<p>기본 신뢰감(basic trust)</p>\n","src":"3장 p.13"},{"id":"c_ch3_015","ch":"ch3","tag":"명칭","front":"<p>자녀에게 명확히 요구하면서도 타협을 통해 자녀의 의견을 수용하는, 자녀의 자존감을 높이는 양육 방식은?</p>\n","back":"<p>권위적(authoritative) 양육 — 강압적인 권위주의적 양육과 혼동 주의</p>\n","src":"3장 p.14"},{"id":"c_ch3_016","ch":"ch3","tag":"명칭","front":"<p>도덕 추론 3수준 중 처벌 회피와 보상 획득이 핵심 동기인 가장 초기 수준은?</p>\n","back":"<p>전인습적 도덕 수준(preconventional level)</p>\n","src":"3장 p.16"},{"id":"c_ch3_017","ch":"ch3","tag":"명칭","front":"<p>청소년기의 핵심 심리사회적 위기로, 자기 통합과 차별성 확립이 중심인 것은?</p>\n","back":"<p>정체성 vs 역할 혼미(에릭슨) — 정체성 수립의 가장 중요한 요소는 &#39;차별성&#39;</p>\n","src":"3장 p.17"},{"id":"c_ch3_018","ch":"ch3","tag":"명칭","front":"<p>결혼·취업·은퇴 등 인생의 주요 사건이 일어나기에 문화적으로 적절하다고 여겨지는 시기는?</p>\n","back":"<p>사회적 시계(social clock)</p>\n","src":"3장 p.19"},{"id":"c_ch3_019","ch":"ch3","tag":"명칭","front":"<p>단어가 혀끝에서 맴돌면서도 정확히 떠오르지 않는 현상은?</p>\n","back":"<p>설단 현상(tip-of-the-tongue phenomenon)</p>\n","src":"3장 p.19"},{"id":"c_ch3_020","ch":"ch3","tag":"명칭","front":"<p>이전 정보를 직접 산출하지 않고 제시된 것을 &#39;본 적 있다&#39;고 확인만 하면 되는, 노화의 영향을 적게 받는 기억 측정법은?</p>\n","back":"<p>재인(recognition) — 회상은 노화로 하락하지만 재인은 비교적 유지됨</p>\n","src":"3장 p.19"},{"id":"c_ch3_021","ch":"ch3","tag":"개념","front":"<p>피아제와 비고츠키는 아동 발달에서 각각 무엇을 강조했나?</p>\n","back":"<p>피아제=아동 스스로 물리적 환경을 탐색하며 단계적으로 발달 / 비고츠키=사회적 환경(도약대·속내말)을 통한 발달</p>\n","src":"3장 p.10 · 교수 강조(0915)"},{"id":"c_ch3_022","ch":"ch3","tag":"개념","front":"<p>권위주의적 양육과 권위적 양육은 어떻게 다른가?</p>\n","back":"<p>권위주의적=강압적으로 복종을 요구(자존감↓) / 권위적=요구하되 타협으로 의견을 수용(자존감·자율성↑) — 용어가 비슷해 혼동 주의</p>\n","src":"3장 p.14 · 교수 강조(0915)"},{"id":"c_ch3_023","ch":"ch3","tag":"개념","front":"<p>불안정 애착 중 불안 애착과 회피 애착은 각각 어떤 양상을 보이는가?</p>\n","back":"<p>불안 애착=인정을 갈망하고 배척 신호에 민감 / 회피 애착=친밀한 관계를 불편해하며 거리를 둠</p>\n","src":"3장 p.13"},{"id":"c_ch3_024","ch":"ch3","tag":"개념","front":"<p>콜버그의 인습적 수준과 후인습적 수준은 무엇을 기준으로 도덕을 판단하는가?</p>\n","back":"<p>인습적=사회적 인정과 질서 유지 / 후인습적=보편적 권리와 자신의 윤리 원칙 — 후인습은 개인주의 문화권에서 발현이 더 쉬움</p>\n","src":"3장 p.16"},{"id":"c_ch3_025","ch":"ch3","tag":"함정","front":"<p>양육 방식(권위적 vs 권위주의적 등)과 자녀의 성격 특성 사이의 관계는 인과관계로 볼 수 있는가?</p>\n","back":"<p>아니다 — 상관관계일 뿐 인과관계가 입증된 것은 아니라고 교수가 강조함</p>\n","src":"3장 p.14 · 교수 강조(0915)"},{"id":"c_ch3_026","ch":"ch3","tag":"함정","front":"<p>노화가 진행되면 회상 능력과 재인 능력은 각각 어떻게 변하는가?</p>\n","back":"<p>회상은 하락하지만 재인은 비교적 유지된다 — 두 수치를 뒤바꾸는 함정 주의</p>\n","src":"3장 p.19 · 교수 강조(0915)"},{"id":"c_ch4_001","ch":"ch4","tag":"명칭","front":"<p>자극을 탐지할 확률이 정확히 0.5가 되는 최소 자극 강도는?</p>\n","back":"<p>절대 역치(absolute threshold)</p>\n","src":"4장 p.4"},{"id":"c_ch4_002","ch":"ch4","tag":"명칭","front":"<p>탐지 확률이 0.5 미만이어서 의식적으로 자각하지 못하지만 행동에 영향을 줄 수 있는 자극은?</p>\n","back":"<p>역치하 자극(subliminal stimulus) — 점화 효과로 그 영향을 확인함</p>\n","src":"4장 p.5"},{"id":"c_ch4_003","ch":"ch4","tag":"명칭","front":"<p>앞서 제시된 자극이 관련 개념을 미리 활성화해 뒤이은 자극의 처리에 영향을 주는 현상은?</p>\n","back":"<p>점화(priming)</p>\n","src":"4장 p.5"},{"id":"c_ch4_004","ch":"ch4","tag":"명칭","front":"<p>신호 탐지 이론에서, 신호와 소음(노이즈)을 구별해내는 능력을 가리키는 지표는?</p>\n","back":"<p>민감도(d′, sensitivity) — 두 분포(신호/소음) 피크 간 거리로 측정</p>\n","src":"4장 p.6"},{"id":"c_ch4_005","ch":"ch4","tag":"명칭","front":"<p>두 자극 간 차이를 지각하려면 자극의 절대량이 아니라 일정한 비율만큼 변해야 한다는 법칙은?</p>\n","back":"<p>베버의 법칙(Weber&#39;s law) — 예: 100kg→110kg처럼 일정 비율로 증가해야 차이를 느낌</p>\n","src":"4장 p.7"},{"id":"c_ch4_006","ch":"ch4","tag":"명칭","front":"<p>동일한 자극이 반복 제시될 때 감각 기관의 민감도가 점차 감소하는 현상(후각이 가장 빠름)은?</p>\n","back":"<p>감각 순응(sensory adaptation)</p>\n","src":"4장 p.8"},{"id":"c_ch4_007","ch":"ch4","tag":"명칭","front":"<p>경험과 기대에 근거해 특정 방식으로 지각하도록 준비된 상태로, 하향 처리의 대표적 예는?</p>\n","back":"<p>지각 갖춤새(perceptual set) — 풍경 속 얼굴 13개 찾기 사례</p>\n","src":"4장 p.9"},{"id":"c_ch4_008","ch":"ch4","tag":"명칭","front":"<p>연속된 말소리 흐름에서 개별 단어의 시작과 끝을 구분해내는 능력은?</p>\n","back":"<p>말 분절(speech segmentation)</p>\n","src":"4장 p.9"},{"id":"c_ch4_009","ch":"ch4","tag":"명칭","front":"<p>문장의 일부 소리가 누락되어도 맥락을 이용해 완전한 단어로 복원해 듣는 현상은?</p>\n","back":"<p>음소 복원 효과(phonemic restoration effect)</p>\n","src":"4장 p.9"},{"id":"c_ch4_010","ch":"ch4","tag":"명칭","front":"<p>얼굴 재인을 전문적으로 담당하는 측두엽의 방추상 영역은?</p>\n","back":"<p>방추상 얼굴 영역(FFA, Fusiform Face Area) — 손상 시 얼굴실인증, TMS로 기능 저하 유발 가능</p>\n","src":"4장 p.12"},{"id":"c_ch4_011","ch":"ch4","tag":"명칭","front":"<p>여러 하위 차원(색·형태·움직임 등)의 정보를 동시에 처리하는 방식은?</p>\n","back":"<p>병렬 처리(parallel processing)</p>\n","src":"4장 p.12"},{"id":"c_ch4_012","ch":"ch4","tag":"명칭","front":"<p>전체는 부분들의 단순한 합 이상이라고 보며, 타고난 지각 조직화 원리를 강조하는 심리학 접근은?</p>\n","back":"<p>게슈탈트 심리학(Gestalt psychology) — 타고난 상향 처리 중심이라는 점이 교수 강조 포인트</p>\n","src":"4장 p.13"},{"id":"c_ch4_013","ch":"ch4","tag":"명칭","front":"<p>공간적으로 가까이 있는 대상들을 하나로 묶어 지각하는 게슈탈트 집단화 원리는?</p>\n","back":"<p>근접성(proximity)</p>\n","src":"4장 p.13"},{"id":"c_ch4_014","ch":"ch4","tag":"명칭","front":"<p>끊어지거나 불완전한 부분을 메워 완전한 형태로 지각하는 게슈탈트 집단화 원리는?</p>\n","back":"<p>폐쇄(closure)</p>\n","src":"4장 p.13"},{"id":"c_ch4_015","ch":"ch4","tag":"명칭","front":"<p>2차원 망막 상을 만들어낸 3차원 물체의 근원이 이론적으로 여럿일 수 있다는 문제는?</p>\n","back":"<p>역투사의 문제(inverse projection problem)</p>\n","src":"4장 p.14"},{"id":"c_ch4_016","ch":"ch4","tag":"명칭","front":"<p>두 눈의 망막에 맺히는 상의 차이(가까울수록 클수록 커짐)를 이용해 깊이를 지각하는 양안 단서는?</p>\n","back":"<p>망막 부등(retinal disparity)</p>\n","src":"4장 p.15"},{"id":"c_ch4_017","ch":"ch4","tag":"명칭","front":"<p>움직이거나 각도가 바뀌어도 투영된 모양이 달라도 같은 사물로 지각하는 특성은?</p>\n","back":"<p>모양 항등성(shape constancy)</p>\n","src":"4장 p.16"},{"id":"c_ch4_018","ch":"ch4","tag":"명칭","front":"<p>청각 정보(음성)와 시각 정보(입 모양)가 불일치할 때 실제와 다른 제3의 소리를 지각하는 현상은?</p>\n","back":"<p>맥거크 효과(McGurk effect)</p>\n","src":"4장 p.17"},{"id":"c_ch4_019","ch":"ch4","tag":"명칭","front":"<p>신체적 감각 경험이 인지적 판단과 상호작용하는 현상(따뜻한 커피→우호적 판단 등)은?</p>\n","back":"<p>체화 인지(embodied cognition)</p>\n","src":"4장 p.17"},{"id":"c_ch4_020","ch":"ch4","tag":"명칭","front":"<p>일반적인 감각 경로 없이도 지각이 일어난다는 주장으로, 린드버그 유괴사건처럼 과학적으로 입증되지 않은 것은?</p>\n","back":"<p>초감각지각(ESP, Extra-Sensory Perception)</p>\n","src":"4장 p.18"},{"id":"c_ch4_021","ch":"ch4","tag":"개념","front":"<p>절대 역치와 차이 역치(최소식별차이)는 각각 무엇을 기준으로 정의되는가?</p>\n","back":"<p>절대 역치=자극 유무를 0.5 확률로 탐지하는 지점 / 차이 역치=두 자극의 차이를 0.5 확률로 탐지하는 최소 변화량(베버의 법칙과 연결)</p>\n","src":"4장 p.4-7"},{"id":"c_ch4_022","ch":"ch4","tag":"개념","front":"<p>신호 탐지 이론에서 민감도와 편향성은 각각 무엇을 의미하는가?</p>\n","back":"<p>민감도=신호와 소음을 구별하는 능력(두 분포 피크 거리) / 편향성=판단 기준선의 위치(엄격 vs 관대)</p>\n","src":"4장 p.6"},{"id":"c_ch4_023","ch":"ch4","tag":"개념","front":"<p>감각 순응과 암순응은 어떻게 다른가?</p>\n","back":"<p>감각 순응=반복 자극에 대한 민감도 전반의 감소 / 암순응=어둠에 적응해 간상체가 활성화되며 형체를 식별하게 되는 과정</p>\n","src":"4장 p.8, p.11"},{"id":"c_ch4_024","ch":"ch4","tag":"개념","front":"<p>원추체와 간상체는 위치·기능·작동 조건에서 어떻게 다른가?</p>\n","back":"<p>원추체=망막 중앙, 색·세부 시각, 밝은 곳에서 작동 / 간상체=망막 주변, 밝기 감지, 어두운 곳에서 작동(암순응)</p>\n","src":"4장 p.10"},{"id":"c_ch4_025","ch":"ch4","tag":"개념","front":"<p>양안 단서와 단안 단서는 각각 무엇이 있으며 어떻게 구분되는가?</p>\n","back":"<p>양안 단서(2개)=망막 부등, 수렴 / 단안 단서(5개)=중첩, 상대적 운동, 상대적 높이, 선형 조망, 상대적 크기 — 눈 하나로도 쓸 수 있는지가 구분 기준</p>\n","src":"4장 p.15 · 교수 강조(0922)"},{"id":"c_ch4_026","ch":"ch4","tag":"개념","front":"<p>구조주의와 게슈탈트 심리학은 &#39;전체와 부분&#39;을 각각 어떻게 보았는가?</p>\n","back":"<p>구조주의=부분(감각 요소)을 모으면 전체가 됨 / 게슈탈트=전체는 부분의 합 이상이며 타고난 조직화 원리가 작동</p>\n","src":"4장 p.13"},{"id":"c_ch4_027","ch":"ch4","tag":"함정","front":"<p>게슈탈트의 집단화 원리(근접성·연속성·폐쇄)는 경험에 의한 하향 처리인가, 타고난 상향 처리인가?</p>\n","back":"<p>타고난 상향 처리이다 — 유아도 사용함. 하향 처리로 착각하기 쉬운 &#39;많이 헷갈리는 부분&#39;이라고 교수가 강조</p>\n","src":"4장 p.13 · 교수 강조(0922)"},{"id":"c_ch4_028","ch":"ch4","tag":"함정","front":"<p>좌시야로 들어온 시각 정보는 어느 쪽 대뇌 반구에서 처리되는가?</p>\n","back":"<p>우반구다 — 슬라이드에 &#39;우시야→우반구&#39;로 잘못 표기된 오탈자가 있으니 좌시야=우반구, 우시야=좌반구로 정확히 기억할 것</p>\n","src":"4장 p.25(슬라이드 오탈자)"},{"id":"c_ch4_029","ch":"ch4","tag":"함정","front":"<p>절대 역치가 낮을수록 항상 유리한가?</p>\n","back":"<p>아니다 — 역치가 낮으면 너무 많은 자극을 처리해야 해 정신적 자원의 한계에 부딪힐 수 있다고 교수가 강조</p>\n","src":"4장 p.4 · 교수 강조(0922)"},{"id":"c_ch5_001","ch":"ch5","tag":"명칭","front":"<p>경험에 따른 유기체 행동의 비교적 영속적인 변화를 가리키는 말은?</p>\n","back":"<p>학습(learning) — 비연합/연합/인지(관찰) 세 양상으로 나뉨</p>\n","src":"5장 p.3"},{"id":"c_ch5_002","ch":"ch5","tag":"명칭","front":"<p>동일 자극에 대한 행동 반응의 빈도가 증대되는 비연합 학습은?</p>\n","back":"<p>민감화(sensitization)</p>\n","src":"5장 p.4"},{"id":"c_ch5_003","ch":"ch5","tag":"명칭","front":"<p>동일 자극에 대한 반응 빈도가 낮아지는 비연합 학습은?</p>\n","back":"<p>둔감화(habituation as desensitization) — 신경 가소성이 바탕이 됨</p>\n","src":"5장 p.4"},{"id":"c_ch5_004","ch":"ch5","tag":"명칭","front":"<p>조건형성 이전에는 반응을 유발하지 않다가, 무조건 자극과 연합된 후 반응을 유발하게 되는 자극은?</p>\n","back":"<p>중성 자극(NS, Neutral Stimulus) — 조건형성 후에는 조건 자극(CS)이 됨</p>\n","src":"5장 p.5"},{"id":"c_ch5_005","ch":"ch5","tag":"명칭","front":"<p>자연스럽고 자동적인 무조건 반응을 촉발하는, 학습 없이도 반응을 일으키는 자극은?</p>\n","back":"<p>무조건 자극(US, Unconditioned Stimulus)</p>\n","src":"5장 p.5"},{"id":"c_ch5_006","ch":"ch5","tag":"명칭","front":"<p>이미 형성된 조건 자극을 다시 새로운 중성 자극과 연합시켜 조건화를 이어가는 것으로, 1차 조건형성보다 약한 것은?</p>\n","back":"<p>고차 조건형성(higher-order conditioning)</p>\n","src":"5장 p.6"},{"id":"c_ch5_007","ch":"ch5","tag":"명칭","front":"<p>조건 자극만 반복해서 제시했을 때 조건 반응이 점차 감소하는 현상(반응의 제거가 아니라 억압)은?</p>\n","back":"<p>소거(extinction)</p>\n","src":"5장 p.6"},{"id":"c_ch5_008","ch":"ch5","tag":"명칭","front":"<p>소거된 조건 반응이 휴지 기간 후에 다시 부분적으로 나타나는 현상으로, 소거가 완전한 제거가 아님을 보여주는 증거는?</p>\n","back":"<p>자발적 회복(spontaneous recovery)</p>\n","src":"5장 p.6"},{"id":"c_ch5_009","ch":"ch5","tag":"명칭","front":"<p>조건 자극과 유사한 자극에도 조건 반응이 나타나는 현상은?</p>\n","back":"<p>일반화(generalization) — 공포의 일반화는 잘 사라지지 않음</p>\n","src":"5장 p.6"},{"id":"c_ch5_010","ch":"ch5","tag":"명칭","front":"<p>보상이 뒤따르는 행동은 증가하고 처벌이 뒤따르는 행동은 감소한다는, 손다이크가 제시한 법칙은?</p>\n","back":"<p>효과의 법칙(law of effect, Thorndike 1898) — 고양이 문제상자 실험</p>\n","src":"5장 p.8"},{"id":"c_ch5_011","ch":"ch5","tag":"명칭","front":"<p>보상·처벌을 통해 유기체의 행동을 원하는 목표 행동 쪽으로 점진적으로 유도하는 스키너의 기법은?</p>\n","back":"<p>행동 조성(shaping)</p>\n","src":"5장 p.8"},{"id":"c_ch5_012","ch":"ch5","tag":"명칭","front":"<p>최종 목표 행동에 점점 가까워지는 중간 단계 행동들에 순차적으로 강화를 주는 방법은?</p>\n","back":"<p>계기적 근사법(successive approximation)</p>\n","src":"5장 p.8"},{"id":"c_ch5_013","ch":"ch5","tag":"명칭","front":"<p>혐오 자극을 제거함으로써 행동의 빈도를 오히려 증가시키는 것은?</p>\n","back":"<p>부적 강화(negative reinforcement) — 처벌이 아님에 주의. 약물 중독=금단 증상 제거에 의한 부적 강화</p>\n","src":"5장 p.9"},{"id":"c_ch5_014","ch":"ch5","tag":"명칭","front":"<p>다른 강화물과 연합되어 강화력을 획득한, 생득적이지 않은 강화물은?</p>\n","back":"<p>조건 강화물(이차 강화물, conditioned/secondary reinforcer)</p>\n","src":"5장 p.10"},{"id":"c_ch5_015","ch":"ch5","tag":"명칭","front":"<p>반응의 일부에만 강화를 주는, 학습은 느리지만 소거 저항이 높은 강화 계획은?</p>\n","back":"<p>부분(간헐적) 강화 계획(partial/intermittent reinforcement schedule)</p>\n","src":"5장 p.11"},{"id":"c_ch5_016","ch":"ch5","tag":"명칭","front":"<p>반응 횟수가 랜덤하게 변하는 기준으로 강화하며, 소거가 가장 잘 되지 않는 강화 계획(슬롯머신)은?</p>\n","back":"<p>변동비율 계획(variable-ratio schedule)</p>\n","src":"5장 p.11"},{"id":"c_ch5_017","ch":"ch5","tag":"명칭","front":"<p>보상을 철회하여 행동의 빈도를 감소시키는 처벌 유형(타임아웃이 대표 예)은?</p>\n","back":"<p>부적 처벌(negative punishment, 제2유형)</p>\n","src":"5장 p.12"},{"id":"c_ch5_018","ch":"ch5","tag":"명칭","front":"<p>타인의 행동과 그 결과를 관찰함으로써 학습이 일어나는 것은?</p>\n","back":"<p>관찰 학습(observational learning) — Bandura의 보보 인형(오뚝이) 실험(1961)이 대표 연구</p>\n","src":"5장 p.13"},{"id":"c_ch5_019","ch":"ch5","tag":"명칭","front":"<p>자신이 직접 행동할 때뿐 아니라 타인의 같은 행동을 관찰할 때도 활성화되는 전두엽의 뉴런은?</p>\n","back":"<p>거울 뉴런(mirror neuron) — 리졸라티가 발견</p>\n","src":"5장 p.13"},{"id":"c_ch5_020","ch":"ch5","tag":"명칭","front":"<p>타인의 심적 상태(생각·의도)를 추론하는 능력으로 관찰 학습과도 연결되는 것은?</p>\n","back":"<p>마음 이론(theory of mind)</p>\n","src":"5장 p.13"},{"id":"c_ch5_021","ch":"ch5","tag":"명칭","front":"<p>타인의 행동을 관찰한 뒤, 비효율적인 부분까지 불필요하게 그대로 따라 하는 현상은?</p>\n","back":"<p>과잉 모방(overimitation)</p>\n","src":"5장 p.13"},{"id":"c_ch5_022","ch":"ch5","tag":"개념","front":"<p>고전적 조건화와 조작적 조건화는 각각 무엇 사이의 연합을 다루는가?</p>\n","back":"<p>고전적 조건화=통제할 수 없는 자극들 사이의 연합(비자발적 반응) / 조작적 조건화=행동과 그 결과 사이의 연합(자발적 행동, 환경에 조작을 가함)</p>\n","src":"5장 p.5-8"},{"id":"c_ch5_023","ch":"ch5","tag":"개념","front":"<p>정적/부적과 강화/처벌을 조합하면 4가지 조합이 나온다. 각각 무엇인가?</p>\n","back":"<p>자극 부여+행동 증가=정적 강화 / 자극 제거+행동 증가=부적 강화 / 자극 부여+행동 감소=정적 처벌 / 자극 제거+행동 감소=부적 처벌</p>\n","src":"5장 p.9-12"},{"id":"c_ch5_024","ch":"ch5","tag":"개념","front":"<p>고정비율·변동비율·고정간격·변동간격 강화 계획은 각각 어떤 특징을 보이는가?</p>\n","back":"<p>고정비율=일정 반응 수 후 강화(커피 쿠폰) / 변동비율=랜덤 반응 수 후 강화, 소거 저항 최고(슬롯머신) / 고정간격=일정 시간 후 강화, 시점 임박시 급증(정기 할인) / 변동간격=가변 시간 후 강화, 느리지만 꾸준(SNS 알림)</p>\n","src":"5장 p.11"},{"id":"c_ch5_025","ch":"ch5","tag":"함정","front":"<p>혐오 자극을 제거해서 행동의 빈도가 증가했다면 이것은 강화인가, 처벌인가?</p>\n","back":"<p>강화(부적 강화)다 — 행동이 증가하면 무조건 강화, 감소하면 처벌. &#39;부적&#39;이라는 말 때문에 처벌로 착각하는 것이 대표적인 함정</p>\n","src":"5장 p.9 · 교수 강조(0929)"},{"id":"c_ch5_026","ch":"ch5","tag":"함정","front":"<p>고전적 조건화가 성립하려면 중성 자극(NS)과 무조건 자극(US) 중 어느 것이 먼저 제시되어야 하는가?</p>\n","back":"<p>중성 자극(NS)이 먼저, 무조건 자극(US)이 나중에 제시되어야 한다 — 순서가 바뀌면(US가 먼저) 조건형성이 거의 일어나지 않음</p>\n","src":"5장 p.5 · 교수 강조(0929)"},{"id":"c_ch5_027","ch":"ch5","tag":"함정","front":"<p>슬라이드에 쓰인 &#39;Operational Conditioning&#39;이라는 표기는 정확한 영어 용어인가?</p>\n","back":"<p>아니다 — 정확한 용어는 &#39;Operant Conditioning&#39;(조작적 조건화)이며 슬라이드의 오탈자이므로 영어 답안에서 그대로 베끼지 않도록 주의</p>\n","src":"5장(슬라이드 오탈자)"},{"id":"c_ch6_001","ch":"ch6","tag":"명칭","front":"<p>이전에 학습한 항목을 단서 없이 직접 떠올려 생성하는 기억 측정법은?</p>\n","back":"<p>회상(recall)</p>\n","src":"6장 p.4"},{"id":"c_ch6_002","ch":"ch6","tag":"명칭","front":"<p>같은 내용을 다시 학습할 때 처음보다 얼마나 빨리 습득하는지로 기억을 측정하는 방법은?</p>\n","back":"<p>재학습(relearning) — 에빙하우스의 파지 곡선이 이 방법에 기반함</p>\n","src":"6장 p.4"},{"id":"c_ch6_003","ch":"ch6","tag":"명칭","front":"<p>기억을 감각 기억 → 단기/작업 기억 → 장기 기억의 세 단계로 설명한, 앳킨슨과 시프린이 제안한 모형은?</p>\n","back":"<p>다중 저장고 모형(multi-store model, 1968) — 정보처리 모형이라고도 함</p>\n","src":"6장 p.5"},{"id":"c_ch6_004","ch":"ch6","tag":"명칭","front":"<p>작업 기억에서 주의를 배분하고 여러 하위 시스템을 조정하며 장기 기억 인출에도 관여하는 구성 요소는?</p>\n","back":"<p>중앙 집행기(central executive) — Baddeley &amp; Hitch(1974)</p>\n","src":"6장 p.6"},{"id":"c_ch6_005","ch":"ch6","tag":"명칭","front":"<p>작업 기억에서 조음 되뇌기를 통해 음운 정보를 유지하는 구성 요소는?</p>\n","back":"<p>음운 루프(phonological loop)</p>\n","src":"6장 p.6"},{"id":"c_ch6_006","ch":"ch6","tag":"명칭","front":"<p>현재 자극이 N번째 이전 자극과 같은지를 판단하게 하여 정보의 유지와 조작 능력(작업 기억)을 측정하는 과제는?</p>\n","back":"<p>N-Back 과제</p>\n","src":"6장 p.6"},{"id":"c_ch6_007","ch":"ch6","tag":"명칭","front":"<p>정보를 의미 있는 단위로 묶어서 단기 기억의 제한된 용량을 넘어 더 많이 저장하는 전략은?</p>\n","back":"<p>청크화(chunking)</p>\n","src":"6장 p.8"},{"id":"c_ch6_008","ch":"ch6","tag":"명칭","front":"<p>공부 시점을 여러 번에 나누어 하면 벼락치기보다 기억이 더 오래 유지되는 현상은?</p>\n","back":"<p>간격두기 효과(spacing effect)</p>\n","src":"6장 p.8"},{"id":"c_ch6_009","ch":"ch6","tag":"명칭","front":"<p>단순히 반복해서 읽는 것보다 퀴즈·모의고사처럼 인출을 연습할 때 기억이 더 오래 가는 현상은?</p>\n","back":"<p>검증 효과(testing effect) — 인출 연습(retrieval practice)</p>\n","src":"6장 p.8"},{"id":"c_ch6_010","ch":"ch6","tag":"명칭","front":"<p>단어를 형태·소리보다 의미 위주로 처리할수록 더 잘 기억된다는 이론적 틀은?</p>\n","back":"<p>처리 수준 이론(levels of processing, Craik &amp; Tulving 1975) — &#39;깊은 처리&#39;가 핵심</p>\n","src":"6장 p.8"},{"id":"c_ch6_011","ch":"ch6","tag":"명칭","front":"<p>정보를 자기 자신과 연관지어 처리하면 회상이 향상되는 현상은?</p>\n","back":"<p>자기참조 효과(self-reference effect)</p>\n","src":"6장 p.8"},{"id":"c_ch6_012","ch":"ch6","tag":"명칭","front":"<p>9/11이나 첫사랑처럼 정서적으로 중대한 사건에 대해 선명하고 확신도 높게 남는 기억은?</p>\n","back":"<p>섬광 기억(flashbulb memory) — 담당 뇌 영역은 편도체</p>\n","src":"6장 p.9"},{"id":"c_ch6_013","ch":"ch6","tag":"명칭","front":"<p>부호화 당시의 특정 단서·맥락이 인출에 가장 효과적이라는 원리는?</p>\n","back":"<p>부호화 명세성 원리(encoding specificity principle)</p>\n","src":"6장 p.10"},{"id":"c_ch6_014","ch":"ch6","tag":"명칭","front":"<p>새로 학습한 정보가 이전에 학습한 정보의 회상을 방해하는 간섭 현상은?</p>\n","back":"<p>역행 간섭(retroactive interference)</p>\n","src":"6장 p.11"},{"id":"c_ch6_015","ch":"ch6","tag":"명칭","front":"<p>이전에 학습한 정보가 새로 학습하는 정보의 회상을 방해하는 간섭 현상은?</p>\n","back":"<p>순행 간섭(proactive interference)</p>\n","src":"6장 p.11"},{"id":"c_ch6_016","ch":"ch6","tag":"명칭","front":"<p>기억을 인출한 뒤 다시 저장되는 과정에서 내용이 변형되기 쉬운 현상으로, 목격자 진술 오류와 관련된 것은?</p>\n","back":"<p>재응고화(reconsolidation)</p>\n","src":"6장 p.12"},{"id":"c_ch6_017","ch":"ch6","tag":"명칭","front":"<p>사건 후 질문 방식 등으로 잘못된 정보를 제공받으면 원래 본 것과 다르게 기억하게 되는 현상은?</p>\n","back":"<p>오정보 효과(misinformation effect, Loftus &amp; Palmer 1974) — &#39;접촉&#39; vs &#39;충돌&#39; 단어 실험</p>\n","src":"6장 p.12"},{"id":"c_ch6_018","ch":"ch6","tag":"명칭","front":"<p>해마 제거 수술 이후 새로운 의식적(외현) 기억을 형성하지 못하게 된 증상으로, 환자 H.M.이 대표 사례인 것은?</p>\n","back":"<p>순행성 기억상실증(anterograde amnesia)</p>\n","src":"6장 p.11"},{"id":"c_ch6_019","ch":"ch6","tag":"명칭","front":"<p>정보를 얻은 시점이나 출처를 잘못 기억하는 현상은?</p>\n","back":"<p>출처 기억상실(source amnesia/misattribution)</p>\n","src":"6장 p.12"},{"id":"c_ch6_020","ch":"ch6","tag":"개념","front":"<p>순행 간섭과 역행 간섭은 각각 어느 방향으로 기억을 방해하는가?</p>\n","back":"<p>순행 간섭=옛 기억이 새 기억(학습)을 방해 / 역행 간섭=새 기억이 옛 기억의 회상을 방해</p>\n","src":"6장 p.11"},{"id":"c_ch6_021","ch":"ch6","tag":"개념","front":"<p>순행성 기억상실증과 역행성 기억상실증은 각각 어떤 기억에 문제가 생기는가?</p>\n","back":"<p>순행성=손상 이후 새로운 기억을 형성하지 못함(H.M.) / 역행성=손상 이전에 저장된 기억을 인출하지 못함</p>\n","src":"6장 p.11"},{"id":"c_ch6_022","ch":"ch6","tag":"개념","front":"<p>간격두기 효과와 검증 효과는 각각 공부법의 어떤 측면을 강조하는가?</p>\n","back":"<p>간격두기 효과=학습 &#39;시점&#39;을 분산시키는 것 / 검증 효과=반복이 아닌 &#39;인출 연습&#39;(퀴즈)을 하는 것</p>\n","src":"6장 p.8"},{"id":"c_ch6_023","ch":"ch6","tag":"개념","front":"<p>맥락 의존 기억과 상태 의존 기억은 각각 무엇의 일치를 이용하는가?</p>\n","back":"<p>맥락 의존 기억=부호화 당시의 외부 환경과 인출 시 환경의 일치 / 상태 의존 기억=부호화 당시의 내적 기분과 인출 시 기분의 일치</p>\n","src":"6장 p.10"},{"id":"c_ch6_024","ch":"ch6","tag":"개념","front":"<p>응고화와 재응고화는 각각 언제 일어나며 무엇이 다른가?</p>\n","back":"<p>응고화=최초 학습 후 해마·수면을 통해 기억이 안정적으로 저장되는 과정 / 재응고화=이미 저장된 기억을 인출한 뒤 다시 저장하는 과정으로 이때 변형될 위험이 있음</p>\n","src":"6장 p.9, p.12"},{"id":"c_ch6_025","ch":"ch6","tag":"개념","front":"<p>단기 기억과 작업 기억은 정보 처리 관점에서 어떻게 다른가?</p>\n","back":"<p>단기 기억=정보를 잠시 &#39;저장&#39;하는 데 초점 / 작업 기억=저장에 더해 정보를 &#39;적극적으로 처리·조작&#39;하는 데 초점(중앙 집행기·시공간 잡기장·음운 루프로 구성)</p>\n","src":"6장 p.5-6"},{"id":"c_ch6_026","ch":"ch6","tag":"함정","front":"<p>단기 기억의 유지 시간과 용량, 감각 기억의 유지 시간과 용량은 각각 얼마이며 서로 헷갈리지 않으려면?</p>\n","back":"<p>단기 기억=약 12초 유지, 용량 7±2(매직 넘버 7) / 감각 기억=약 0.5<del>1초 유지, 용량 3</del>4개 — 두 쌍의 숫자를 서로 바꿔 내는 문항에 주의</p>\n","src":"6장 p.5-6"},{"id":"c_ch6_027","ch":"ch6","tag":"함정","front":"<p>6장 슬라이드에 나오는 &#39;72개&#39;라는 숫자는 실제로 어떤 개념을 가리키는가?</p>\n","back":"<p>&#39;72개&#39;는 슬라이드 오탈자이며 실제로는 밀러의 매직 넘버 &#39;7±2&#39;를 가리킨다 — 시험에서 72라는 숫자 자체를 답으로 쓰지 않도록 주의</p>\n","src":"6장 p.18(슬라이드 오탈자)"},{"id":"c_ch6_028","ch":"ch6","tag":"함정","front":"<p>해마는 장기 기억을 영구적으로 저장하는 장소인가?</p>\n","back":"<p>아니다 — 해마는 외현 기억의 &#39;형성과 응고화&#39;를 담당할 뿐 저장 장소가 아니다. 절차 기억은 해마가 아니라 기저 신경절이 담당</p>\n","src":"6장 p.9"},{"id":"c_ch6_029","ch":"ch6","tag":"함정","front":"<p>Sperling의 감각 기억 실험에서 전체 보고법과 부분 보고법의 결과 차이는 무엇을 보여주는가?</p>\n","back":"<p>전체 보고법(약 4개 회상)보다 부분 보고법(제시된 줄 전부 회상)의 성과가 더 높게 나와, 감각 기억에 순간적으로 더 많은 정보가 저장되어 있음을 보여준다(단, 지연 보고 시 저하)</p>\n","src":"6장 p.5(Sperling 1960)"}],"quiz":[{"id":"q_ch0_sa01","ch":"ch0","type":"sa","q":"<p>다음 설명에 해당하는 학파의 이름을 쓰시오. 분트와 그의 제자 티치너가 제안한 이 관점은 마음이 더 이상 나눌 수 없는 여러 감각 요소의 복합체라고 보았다. 물 분자를 수소와 산소로 쪼갤 수 있듯 마음도 구성 요소로 분해할 수 있다고 가정하고, 참가자가 지정된 지침에 따라 자신의 경험을 스스로 보고하게 하여 그 요소를 찾으려 했다.</p>\n","choices":[],"answer":"구조주의","alts":["구조 주의","Structuralism","structuralism"],"answerHtml":"<p>구조주의</p>\n","solution":"<p>마음을 감각 요소의 복합체로 보고 내성법으로 분석한 학파는 구조주의(분트, 티치너)이다. 기능주의(제임스)는 마음이 생존에 어떤 적응적 기능을 하는가를 묻는 점에서 다르다.</p>\n","src":"서막 p.9","diff":2,"prof":false},{"id":"q_ch0_sa02","ch":"ch0","type":"sa","q":"<p>다음 설명에 해당하는 명칭을 쓰시오. 1960년대, 행동주의가 배제했던 심적 과정을 다시 심리학의 연구 대상으로 되돌리고 과학적 연구 방법의 적용을 주장한 패러다임의 전환으로, 컴퓨터의 작동 방식이 마음의 작동 방식과 유사하다는 정보 처리 접근이 등장한 계기가 되었다.</p>\n","choices":[],"answer":"인지혁명","alts":["인지 혁명","cognitive revolution","Cognitive Revolution"],"answerHtml":"<p>인지혁명</p>\n","solution":"<p>심적 과정에 대한 초기 관심사를 되돌리고 과학적 연구 방법론의 적용을 주장한 1960년대의 패러다임 전환이 인지혁명이며, 마음으로의 회귀라고도 불린다. 컴퓨터의 개발·도입으로 컴퓨터의 작동 메커니즘이 마음의 작동 방식과 유사하다는 정보 처리 접근이 제기되었다. 관찰 가능한 행동만 다룬 행동주의에 대한 반작용이라는 점을 함께 기억할 것.</p>\n","src":"서막 p.13","diff":2,"prof":false},{"id":"q_ch0_sa03","ch":"ch0","type":"sa","q":"<p>다음 사례에 해당하는 접근법의 이름을 쓰시오. 민수는 시험 때마다 크게 불안해한다. 연구자는 이를 유전적 기질과 뇌 활동, 실패할 것이라는 부정적 기대와 상황 해석, 가족의 높은 기대와 경쟁적인 학교 문화가 모두 함께 작용한 결과로 설명한다. 이처럼 인간의 마음과 행동을 세 가지 분석 수준의 통합된 결과물로 보는 접근법이다.</p>\n","choices":[],"answer":"생물심리사회적 접근법","alts":["생물심리사회적 접근","생물심리사회 접근법","생물심리사회적접근법","biopsychosocial approach","biopsychosocial"],"answerHtml":"<p>생물심리사회적 접근법</p>\n","solution":"<p>생물학적 수준(유전자, 뇌), 심리적 수준(기대, 해석), 사회문화적 수준(가족, 문화)이 통합되어 심적 과정과 행동을 만든다고 보는 것이 생물심리사회적 접근법이다. 교수 강조(8/25): 동일한 행동도 어느 하나의 요인만으로는 설명하지 않는다.</p>\n","src":"서막 p.22–23","diff":2,"prof":true},{"id":"q_ch0_mc01","ch":"ch0","type":"mc","q":"<p>윌리엄 제임스와 관련된 학파와 그 핵심 주장을 옳게 짝지은 것은?</p>\n","choices":["<p>정신분석 – 인간을 자아실현을 추구하는 주체적 존재로 본다</p>\n","<p>행동주의 – 아동기 경험에 대한 무의식적 사고가 행동에 미치는 영향력을 강조한다</p>\n","<p>기능주의 – 의식은 생존에 도움이 되는 적응적 기능이며, 다윈의 진화론의 영향을 받았다</p>\n","<p>인본주의 – 다양한 방어 기제를 제시하였다</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>윌리엄 제임스는 기능주의를 대표하며, 의식이 과거 회상, 현재 적응, 미래 계획을 돕는 적응적 기능이라고 보았다. ①은 자아실현을 추구하는 주체적 존재라는 인본주의(로저스, 매슬로우)의 설명, ②는 정신분석(프로이트)의 설명으로 행동주의는 관찰 가능한 행동만을 연구 대상으로 보았으며(p.11–12), ④는 방어 기제를 제시한 프로이트의 정신분석 설명이라 학파와 주장이 어긋난다.</p>\n","src":"서막 p.10","diff":2,"prof":false},{"id":"q_ch0_mc02","ch":"ch0","type":"mc","q":"<p>분트의 공이치기 실험(소리를 듣고 전신기 버튼 누르기)에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>소리를 자각했을 때 버튼을 누르는 조건이 소리를 듣자마자 누르는 조건보다 오래 걸려, 심적 과정도 측정할 수 있음을 보였다</p>\n","<p>두 조건 모두 반응 시간이 약 1초로 같아, 자각에는 추가 과정이 필요하지 않음을 보였다</p>\n","<p>소리를 듣자마자 누르는 조건이 자각 후 누르는 조건보다 오래 걸렸다</p>\n","<p>참가자가 자유롭게 서술한 경험 내용을 분석하여 마음의 구성 요소를 찾아냈다</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>즉각 반응은 약 0.1초, 자각 후 반응은 약 0.2초로 자각에 추가 과정이 더 걸린다는 가설을 계량적으로 확인했다. ②는 시간이 다르고 ③은 순서가 반대이며, ④는 공이치기 실험이 반응 시간을 계량적으로 측정한 실험이라는 점에서 틀리며, 구조주의의 내성법도 자유로운 서술이 아니라 지정된 내용만 보고하게 한 엄격한 방식이었다(p.9 노트).</p>\n","src":"서막 p.8","diff":2,"prof":false},{"id":"q_ch0_mc03","ch":"ch0","type":"mc","q":"<p>행동주의자들이 분트와 제임스로 대표되는 초기 심리학의 접근을 비판한 이유로 가장 적절한 것은?</p>\n","choices":["<p>진화론을 마음의 연구에 적용하지 않았다</p>\n","<p>의식의 기능을 지나치게 무시하였다</p>\n","<p>실험실을 갖추지 않아 측정이 불가능했다</p>\n","<p>관찰할 수 없는 내부 요소(감각, 심상, 감정)를 탐구하여 과학적 객관성이 부족했다</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>행동주의는 심적 과정 자체는 관찰이 불가하고 행동만 관찰 가능하다고 보았다. 교수 강조(8/25): 구조주의와 기능주의가 둘 다 마음 내부를 다룬다는 점에 강하게 반발했다. ①은 오히려 기능주의의 특징, ②는 기능주의가 의식을 다룬 것과 반대, ③은 분트가 실험실을 세운 사실과 배치되어 틀리다.</p>\n","src":"서막 p.11","diff":2,"prof":true},{"id":"q_ch0_mc04","ch":"ch0","type":"mc","q":"<p>고전적 조건화와 조작적 조건화에 대한 설명으로 옳지 않은 것은?</p>\n","choices":["<p>고전적 조건화는 중립 자극을 무조건 자극과 연합하여 조건 자극으로 만드는 것이다</p>\n","<p>두 조건화는 학습 과정 안에서 일어나는 내적 정보 처리를 밝히는 데 중점을 둔다</p>\n","<p>조작적 조건화는 강화와 처벌을 조작하여 행동의 빈도를 조절하는 것이다</p>\n","<p>행동주의자는 학습도 행동의 변화로 관찰할 수 있으므로 행동의 연장선으로 본다</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>옳지 않은 것은 ②이다. 교수 강조(8/25): 두 조건화 모두 자극과 그에 따른 행동 반응에만 중점을 두고, 그 사이에서 일어나는 내적 과정에는 관심을 두지 않는다. ①, ③은 정의 그대로 옳고, ④는 학습을 행동 변화로 관찰한다는 행동주의 관점으로 옳다.</p>\n","src":"서막 p.11","diff":2,"prof":true},{"id":"q_ch0_mc05","ch":"ch0","type":"mc","q":"<p>컴퓨터 메타포에서 사람의 마음과 컴퓨터 부품의 대응으로 옳은 것은?</p>\n","choices":["<p>장기 기억은 RAM에 대응된다</p>\n","<p>감각 기관은 CPU에 대응된다</p>\n","<p>장기 기억은 SSD(저장 장치)에 대응된다</p>\n","<p>행동 반응은 입력 장치에 대응된다</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>반영구적으로 지식을 저장하는 장기 기억은 SSD에, 일시적으로 정보를 유지하며 연산에 쓰는 작업(단기) 기억은 RAM에 대응된다. ①은 RAM이 작업 기억이므로 틀리고, ②는 감각 기관이 입력 장치에 해당하며 CPU는 처리 담당이라 틀리며, ④는 행동 반응이 출력(산출)이라 틀리다.</p>\n","src":"서막 p.14","diff":2,"prof":false},{"id":"q_ch0_mc06","ch":"ch0","type":"mc","q":"<p>선천성과 후천성의 예시를 옳게 짝지은 것은?</p>\n","choices":["<p>선천성: 에크만의 6가지 기본 감정을 문화와 무관하게 식별함 / 후천성: 몽골어와 중국어 화자의 색 지각 차이</p>\n","<p>선천성: 몽골어와 중국어 화자의 색 지각 차이 / 후천성: 에크만의 6가지 기본 감정을 문화와 무관하게 식별함</p>\n","<p>선천성과 후천성 모두: 에크만의 6가지 기본 감정</p>\n","<p>선천성과 후천성 모두: 몽골어와 중국어 화자의 색 지각 차이</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>기본 감정(기쁨, 슬픔, 분노, 공포, 혐오, 놀람)의 식별은 문화·인종과 무관해 선천성의 예이다. 몽골어는 녹색·파란색 계통이 세분화되고 중국어는 통일되어 있어 언어(환경)에 따라 색 분류가 달라지므로 후천성의 예이다. ②는 순서가 반대이고, ③과 ④는 두 예시를 한쪽으로만 몰아 틀리다.</p>\n","src":"서막 p.20–21","diff":2,"prof":false},{"id":"q_ch0_mc07","ch":"ch0","type":"mc","q":"<p>「유전자와 환경은 어떻게 개인차에 영향을 미치는가?」를 주요 연구 질문으로 삼는 이론적 조망은?</p>\n","choices":["<p>진화론</p>\n","<p>정신역동</p>\n","<p>사회문화</p>\n","<p>행동유전학</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>유전자와 환경이 개인차에 미치는 영향을 묻는 조망은 행동유전학이다(관련 분야: 성격, 발달, 법). ①진화론의 질문은 특질의 자연선택이 유전자의 생존을 어떻게 촉진하는가로, 개인차보다 종 전반의 보편적 특질을 다룬다. ②정신역동은 무의식적 추동과 갈등이 행동을 어떻게 유도하는가를 묻는다. ③사회문화는 행동과 사고가 상황과 문화에 따라 어떻게 달라지는가를 묻는다.</p>\n","src":"서막 p.24–25","diff":2,"prof":false},{"id":"q_ch0_mc08","ch":"ch0","type":"mc","q":"<p>분노를 설명하는 접근과 이론적 조망이 옳게 짝지어진 것은?</p>\n","choices":["<p>무의식적 적대감의 방출 – 인지심리학</p>\n","<p>맞서 싸우거나 도주하는 Fight or Flight 반응의 진화적 기능 – 진화론</p>\n","<p>문화 맥락에 따른 분노 표현의 차이 – 신경과학</p>\n","<p>상황의 해석이 분노에 미치는 영향 – 정신역동</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>Fight or Flight 반응은 유전자가 분노를 어떻게 촉진했는가를 묻는 진화론의 접근이다. ①의 무의식적 적대감은 정신역동, ③의 문화 맥락은 사회문화, ④의 상황 해석은 인지심리학의 접근이라 짝이 틀렸다.</p>\n","src":"서막 p.24","diff":2,"prof":false},{"id":"q_ch1_sa01","ch":"ch1","type":"sa","q":"<p>다음 사례에 해당하는 경향의 이름을 쓰시오. 시우는 축구 경기가 끝나고 결과를 확인한 뒤 「내 그럴 줄 알았다니까, 처음부터 그렇게 될 것 같았어」라고 말한다. 그러나 경기 전에는 누구에게도 결과를 확신 있게 예측하지 못했다. 이처럼 결과를 알고 난 뒤 자신이 그 결과를 예측할 수 있었다고 믿는 경향은 연령과 문화에 관계없이 나타난다.</p>\n","choices":[],"answer":"후견 편향","alts":["후견편향","hindsight bias","Hindsight Bias"],"answerHtml":"<p>후견 편향</p>\n","solution":"<p>결과를 알고 난 후에 예측할 수 있었다고 믿는 경향이 후견 편향(hindsight bias)이다. 콜럼버스의 달걀이 대표 예이고, 연령과 문화에 무관한 보편적 현상이다. 결과를 모르는 상태에서 실제 능력보다 더 안다고 믿는 과신과 구별할 것.</p>\n","src":"1장 p.5","diff":2,"prof":false},{"id":"q_ch1_sa02","ch":"ch1","type":"sa","q":"<p>다음 사례에 해당하는 개념의 이름을 쓰시오. 연구자는 「스트레스가 높은 상태」를 「지각된 스트레스 척도에서 30점 이상을 받은 상태」로, 「학업 수행」을 「기말고사 총점」으로 구체적이고 측정 가능한 형태로 진술하였다. 이처럼 연구에서 사용하는 개념이나 절차를 정확하게 진술하여 측정할 수 있게 만드는 것을 무엇이라 하는가?</p>\n","choices":[],"answer":"조작적 정의","alts":["조작적정의","operational definition","Operational Definition"],"answerHtml":"<p>조작적 정의</p>\n","solution":"<p>눈에 보이지 않는 심리 기제를 계량할 수 있는 형태로 재정립하는 것이 조작적 정의(operational definition)이다. 교수 강조(9/1): 가설은 측정 가능한 형태로 재정립해야 하며, 예시는 수면 박탈 = 최근 24시간 수면 1시간 미만, 기억 = 기억력 검사의 정답 수였다.</p>\n","src":"1장 p.16","diff":2,"prof":true},{"id":"q_ch1_sa03","ch":"ch1","type":"sa","q":"<p>다음 사례에 해당하는 효과의 이름을 쓰시오. 같은 정책을 두고 설문에서 「극빈자 지원」이라고 물었을 때는 찬성 응답이 많았고 「복지」라고 물었을 때는 반대 응답이 많았다. 이처럼 문항을 구성하는 어휘에 따라 참가자의 응답이 달라지는 효과를 무엇이라 하는가?</p>\n","choices":[],"answer":"말표현 효과","alts":["말 표현 효과","말표현효과","wording effect","Wording Effect"],"answerHtml":"<p>말표현 효과</p>\n","solution":"<p>사회조사에서 문항에 쓰인 어휘가 응답 방향을 유도하여 응답을 바꾸는 것을 말표현 효과라고 한다. 사회조사의 또 다른 약점은 응답자가 자신의 응답을 사회적으로 바람직한 방향으로 위장할 수 있다는 점이다.</p>\n","src":"1장 p.20","diff":2,"prof":false},{"id":"q_ch1_sa04","ch":"ch1","type":"sa","q":"<p>다음 설명에 해당하는 기구의 이름을 쓰시오. 대학 등의 연구 기관에서 인간 및 동물을 대상으로 하는 연구를 수행하기 전에 그 연구가 참가자에게 해를 끼치지 않는지 적합성을 검토하고 사전에 승인하는 기구이다. 이곳의 승인을 받기 전에 참가자를 모집하거나 실험을 진행하면 중대한 위반이 된다. 약칭은 영문 세 글자이다.</p>\n","choices":[],"answer":"기관 생명 윤리 위원회","alts":["기관생명윤리위원회","기관 생명윤리 위원회","IRB","irb","Institutional Review Board"],"answerHtml":"<p>기관 생명 윤리 위원회</p>\n","solution":"<p>기관 생명 윤리 위원회(Institutional Review Board, IRB)는 인간·동물 대상 연구의 윤리적 적합성을 사전에 검토한다. 교수 강조(9/1): 승인 후에야 참가자를 모집할 수 있고, 승인받은 인원을 초과하여 모집해서는 안 된다.</p>\n","src":"1장 p.27","diff":2,"prof":true},{"id":"q_ch1_mc01","ch":"ch1","type":"mc","q":"<p>테틀록이 수행한 전문가의 예측 연구에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>전문가는 해당 분야의 지식이 풍부하므로 과신에서 자유로웠다</p>\n","<p>평균 80%의 확신도를 보인 사건들의 실제 예측 정확도는 40% 이하였다</p>\n","<p>정확하게 예측하는 슈퍼 예측자는 전문가의 절반 이상을 차지했다</p>\n","<p>예측 정확도는 전문가의 주관적 확신도에 정비례하여 높아졌다</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>테틀록은 세계적 사건에 대한 전문가 예측을 수집했는데, 80% 확신을 보인 사건의 적중률이 40% 이하로 주관적 확신과 실제 사실 간에 괴리가 있었다. ①은 전문가도 과신에서 자유롭지 않았다는 결과와 반대이고, ③은 슈퍼 예측자가 극소수(교수: 약 2%)라 틀리며, ④는 확신도와 정확도가 괴리되었다는 결과와 반대라 틀리다.</p>\n","src":"1장 p.6","diff":2,"prof":true},{"id":"q_ch1_mc02","ch":"ch1","type":"mc","q":"<p>다음 사례에서 탈진실 세상에서 개인의 취약성을 형성하는 요인은?  「A씨는 2014년에 지하철 추돌 사고를 직접 겪은 뒤로, 통계상 자동차 사고가 훨씬 많음에도 지하철이 자동차보다 훨씬 위험하다고 생각한다.」</p>\n","choices":["<p>반복</p>\n","<p>집단 정체성</p>\n","<p>거짓뉴스</p>\n","<p>강력한 사례의 가용성</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>강렬한 경험이나 자극적인 사례가 쉽게 떠올라 위험성을 과대 추정하는 것이 강력한 사례의 가용성이며, 가용성 어림법과 직접 관련된다(교수 예시: 지하철 vs 자동차). ①은 같은 진술을 되풀이해 들어서 믿게 되는 경우, ②는 같은 편끼리만 어울려 확증 편향으로 이어지는 경우, ③은 거짓 정보의 빠른 확산 문제라 이 사례와 맞지 않다.</p>\n","src":"1장 p.14","diff":2,"prof":true},{"id":"q_ch1_mc03","ch":"ch1","type":"mc","q":"<p>연구 방법과 그 약점을 옳게 짝지은 것은?</p>\n","choices":["<p>사례 연구 – 대표적이지 않은 소수의 사례가 결과를 오도할 수 있고 일반화하기 어렵다</p>\n","<p>상관 연구 – 참가자에게 처치를 가해야 하므로 윤리적 문제가 자주 발생한다</p>\n","<p>실험 – 변인을 통제하지 않으므로 인과를 전혀 검증하지 못한다</p>\n","<p>사회조사 – 표본 수만 충분히 크면 대표성 문제는 발생하지 않는다</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>사례 연구는 소수를 집중 관찰하므로 특이 사례가 결과를 오도하고 일반화가 어렵다. ②는 상관 연구에 처치가 없으므로 틀리다. ③은 실험이 다른 변인을 통제하여 인과를 검증하는 방법이므로 반대이고(실험의 약점은 일반화 한계와 윤리적 제약), ④는 표본 수가 커도 대표성이 없으면 바람직한 표본이 아니라는 원칙에 어긋난다.</p>\n","src":"1장 p.18, p.21, p.25","diff":2,"prof":false},{"id":"q_ch1_mc04","ch":"ch1","type":"mc","q":"<p>감독이 대패한 다음 날 선수들을 심하게 비난했더니 다음 경기의 결과가 나아졌다. 「비난이 효과가 있었다」고 결론 내릴 때 간과하고 있는 현상으로 가장 적절한 것은?</p>\n","choices":["<p>과신</p>\n","<p>확증 편향</p>\n","<p>평균으로의 회귀</p>\n","<p>가용성 어림법</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>극단적으로 부진한 결과 뒤에는 그 다음 결과가 평균 방향으로 되돌아오는 경향(평균으로의 회귀)이 있어, 비난과 무관하게 성적이 좋아질 수 있다(노트의 야구 예시). ①은 실제보다 더 안다고 믿는 경향, ②는 자신에게 유리한 정보만 선택적으로 취하는 경향, ④는 떠올리기 쉬운 사례로 판단하는 사고 방식이라 이 상황의 핵심이 아니다.</p>\n","src":"1장 p.22","diff":2,"prof":false},{"id":"q_ch1_mc05","ch":"ch1","type":"mc","q":"<p>여름철에 아이스크림 소비율과 식중독 발병률이 함께 증가하는 정적 상관이 관찰되었다. 이에 대한 해석으로 가장 적절한 것은?</p>\n","choices":["<p>아이스크림을 많이 먹는 것이 식중독의 원인이다</p>\n","<p>기온과 같은 제3의 변인이 두 변인 모두에 영향을 주었을 수 있으므로 인과로 해석해서는 안 된다</p>\n","<p>한 변인이 증가할 때 다른 변인이 감소하는 부적 상관이다</p>\n","<p>무선 표집으로 참가자를 뽑았다면 이 상관으로 인과를 확정할 수 있다</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>상관은 연관성과 예측 가능성만 보여줄 뿐 인과성을 입증하지 못하며, 두 변인에 모두 영향을 주는 제3의 변인(기온·날씨)이 있을 수 있다. 교수 강조(9/1): 상관은 인과성을 입증하는 지표가 아니다. ①은 인과로 단정하여 틀리고, ③은 함께 증가하므로 정적 상관이며, ④는 인과 검증은 무선 표집이 아니라 처치와 통제(실험)로 가능하므로 틀리다.</p>\n","src":"1장 p.22","diff":2,"prof":true},{"id":"q_ch1_mc06","ch":"ch1","type":"mc","q":"<p>무선 표집과 무선 할당에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>무선 표집은 모집된 참가자를 실험 조건과 통제 조건에 무작위로 배정하는 절차이다</p>\n","<p>무선 할당은 모집단의 구성원이 동등한 기회를 갖도록 뽑아 표본의 대표성을 높인다</p>\n","<p>표본 수가 충분히 크면 무선 표집을 하지 않아도 대표성이 보장된다</p>\n","<p>무선 할당은 개인차가 특정 조건에 몰리는 것을 막아 개인차의 영향을 최소화한다</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>무선 할당은 모집된 참가자를 확률에 따라 실험·통제 조건에 배정하여 기존 개인차의 영향을 최소화한다. ①과 ②는 무선 표집과 무선 할당의 정의를 서로 바꿔 놓아 틀리다. 교수 강조(9/1): 표본 수가 큰 것보다 대표성을 띠는 표본이 더 중요하므로 ③도 틀리다.</p>\n","src":"1장 p.21, p.23","diff":2,"prof":true},{"id":"q_ch1_mc07","ch":"ch1","type":"mc","q":"<p>실험법에서의 가짜약(위약) 조건과 이중 은폐에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>이중 은폐는 참가자뿐 아니라 실험자도 어떤 집단이 가짜약 조건인지 모르는 절차이다</p>\n","<p>가짜약 조건은 참가자가 처치를 받지 않았음을 분명히 알려 주는 조건이다</p>\n","<p>가짜약 효과는 실험실 안에서만 나타나며 일상에서는 보고된 적이 없다</p>\n","<p>참가자만 조건을 모르고 실험자는 아는 절차를 이중 은폐라고 한다</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>이중 은폐(double-blind)는 참가자와 실험자 모두 가짜약 조건을 모르는 절차이다. ②는 가짜약 조건이 처치를 받았다고 착각하게 만드는 조건이므로 반대이고, ③은 디카페인 커피 등 일상에서도 위약 효과가 보고되었다는 내용에 어긋나며, ④는 참가자만 모르는 것은 이중이 아닌 단일 은폐라 틀리다.</p>\n","src":"1장 p.24","diff":2,"prof":false},{"id":"q_ch1_mc08","ch":"ch1","type":"mc","q":"<p>이론과 가설에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>이론은 검증 가능한 개별 예측이고, 가설은 관찰을 체제화한 통합적 설명이다</p>\n","<p>이론과 가설은 모두 데이터 분석이 끝난 뒤에 수립된다</p>\n","<p>이론은 관찰을 체제화하고 사건을 예측하는 통합적 설명이며, 가설은 이론에서 도출한 검증 가능한 예측이다</p>\n","<p>가설이 지지되지 않으면 이론은 반드시 폐기해야 한다</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>이론은 관찰을 체제화하고 행동·사건을 예측하는 원리의 통합적 설명이고, 가설은 이론을 기반으로 도출한 검증 가능한 예측이다. ①은 둘을 뒤바꿨고, ②는 이론과 가설이 분석 이전 단계(이론 제시, 가설 수립)에서 수립되므로 틀리며, ④는 분석 결과가 기존 이론을 지지·반박·확장하는 것이지 반드시 폐기하는 것이 아니므로 틀리다.</p>\n","src":"1장 p.16","diff":2,"prof":false},{"id":"q_ch1_mc09","ch":"ch1","type":"mc","q":"<p>연구 승인 심의 절차에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>승인 결과를 기다리는 동안 참가자를 미리 모집해 두면 연구를 빨리 시작할 수 있어 권장된다</p>\n","<p>모집 인원은 객관적 근거와 함께 제시해야 하며, 승인받은 인원을 초과하여 모집하려면 변경 심의를 받아야 한다</p>\n","<p>참가자 보상은 재원과 무관하게 금액만 기재하면 된다</p>\n","<p>참가자 식별 정보 외에도 가능한 한 많은 개인 정보를 수집하도록 요구한다</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>교수 강조(9/1): 심의에서 모집 인원수와 그 객관적 근거(논문이나 검정력 계산), 참가자 보상의 금액과 재원을 특히 중시하며, 승인 인원 초과 모집은 안 되고 증원이 필요하면 변경 심의를 받아야 한다. ①은 승인 전 모집이 연구 윤리 위반이라 틀리고, ③은 재원과 예산 편성 여부를 철저히 따지므로 틀리며, ④는 식별·논문 보고에 필요한 정보 외의 수집이 금지되므로 틀리다.</p>\n","src":"1장 p.28–29","diff":2,"prof":true},{"id":"q_ch1_mc10","ch":"ch1","type":"mc","q":"<p>심리학 연구 윤리에 대한 설명으로 옳지 않은 것은?</p>\n","choices":["<p>연구를 시작하기 전에 참가자로부터 고지된 동의를 받아야 한다</p>\n","<p>참가자의 개인 정보는 비밀에 붙여야 하며, 실험이 끝난 뒤 실험에 대한 상세한 설명을 전달해야 한다</p>\n","<p>뉘른베르크 강령, 헬싱키 선언, 벨몬트 보고서의 취지를 따른다</p>\n","<p>참가자가 피로 때문에 그만두고 싶다고 해도 자료 확보를 위해 실험은 끝까지 마쳐야 한다</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>옳지 않은 것은 ④이다. 교수 강조(9/1): 참가자가 그만두고 싶다고 하면(단순 피로도라 해도) 연구자는 이유를 불문하고 실험을 중단해야 한다. ①은 고지된 동의, ②는 비밀 보장과 디브리핑, ③은 세계 각국의 윤리 지침으로 모두 옳다.</p>\n","src":"1장 p.26–27","diff":2,"prof":true},{"id":"q_ch2_sa01","ch":"ch2","type":"sa","q":"<p>다음 사례에 해당하는 명칭을 쓰시오. 런던의 택시 운전사들은 버스 운전사들보다 해마가 더 큰 것으로 나타났다. 길을 스스로 찾아다니는 경험을 통해 신경망이 새롭게 구축되어 뇌가 변하는 이 능력을 무엇이라 하는가?</p>\n","choices":[],"answer":"신경 가소성","alts":["신경가소성","neuroplasticity","뇌 가소성"],"answerHtml":"<p>신경 가소성</p>\n","solution":"<p>손상 후 신경망을 재조직하거나 경험을 통해 새로운 신경 통로를 구축해 뇌가 변하는 능력이 신경 가소성(neuroplasticity)이다. 택시 운전사의 해마가 더 크다는 Maguire et al.(2006)이 대표 증거.</p>\n","src":"2장 p.4","diff":2,"prof":false},{"id":"q_ch2_sa02","ch":"ch2","type":"sa","q":"<p>다음 사례에 해당하는 현상의 명칭을 쓰시오. 민지는 여러 사람이 동시에 떠드는 시끄러운 파티장에서도 자기 친구의 목소리에만 주의를 기울여 대화를 이어 간다. 그러다 멀리서 누군가 자기 이름을 부르자 그 소리도 곧바로 알아차렸다. 이는 선택적 주의라는 심리 기제의 대표적 예로 제시된 현상이다. 이 현상의 명칭을 쓰시오.</p>\n","choices":[],"answer":"칵테일 파티 효과","alts":["칵테일파티 효과","칵테일파티효과","cocktail party effect"],"answerHtml":"<p>칵테일 파티 효과</p>\n","solution":"<p>여러 말소리 중 하나의 목소리에만 주의를 기울이며 자신과 관련된 의미 있는 정보만 필터링하는 선택적 주의의 예가 칵테일 파티 효과(cocktail party effect)이다.</p>\n","src":"2장 p.32","diff":2,"prof":false},{"id":"q_ch2_sa03","ch":"ch2","type":"sa","q":"<p>다음 사례에 해당하는 현상의 명칭을 쓰시오. 어떤 영화에서 주인공이 들고 있던 컵의 위치가 컷마다 바뀌어 있었지만 대부분의 관객은 이를 눈치채지 못했다(영화의 옥의 티). 이는 주의를 기울이지 않은 시각 자극을 인지하지 못하는 현상의 한 유형이다.</p>\n","choices":[],"answer":"변화맹","alts":["변화 맹","change blindness","변화맹시"],"answerHtml":"<p>변화맹</p>\n","solution":"<p>상황이나 장면에서 어떤 변화가 일어나도 그것을 눈치채지 못하는 현상이 변화맹(change blindness)이며, 부주의적 맹시의 한 유형이다(Simons &amp; Levin, 1998).</p>\n","src":"2장 p.33","diff":2,"prof":false},{"id":"q_ch2_sa04","ch":"ch2","type":"sa","q":"<p>다음 설명에 해당하는 원리의 명칭을 쓰시오. 의식 경험에 대한 정보를 다룰 때, 회고적이고 신중하게 자극을 하나씩 다루는 경로와 자동적이고 신속하게 여러 특성을 한꺼번에 다루는 경로가 함께 개입한다는 원리.</p>\n","choices":[],"answer":"이중 처리","alts":["이중처리","이중 처리 과정","이중처리과정","dual processing"],"answerHtml":"<p>이중 처리</p>\n","solution":"<p>이중 처리(dual processing)는 의식적(계열 처리·신중) 경로와 무의식적(병렬 처리·자동적) 경로가 동시에 개입한다는 원리이다. 기억·사고·언어에 모두 적용된다.</p>\n","src":"2장 p.34","diff":2,"prof":false},{"id":"q_ch2_mc01","ch":"ch2","type":"mc","q":"<p>활동 전위(action potential)에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>자극이 강할수록 활동 전위의 크기 자체가 커진다.</p>\n","<p>역치를 넘으면 자극 강도와 관계없이 같은 크기로 발생하며, 강한 자극은 발화율을 높여 표상된다.</p>\n","<p>활동 전위가 끝난 직후에는 불응기 없이 곧바로 다음 활동 전위가 발생할 수 있다.</p>\n","<p>안정 전위 상태에서는 뉴런 내부가 양전하, 외부가 음전하이다.</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>활동 전위는 실무율(all-or-none) 반응이라 크기는 동일하고, 강한 자극은 발화율을 높인다(교수 강조 9/8: 뇌는 뉴런의 발화 횟수로 자극 강도를 표상). ①은 크기가 아니라 발화율이 변하므로 틀림. ③은 불응기가 있어 안정 전위로 돌아가기 전까지 재발생하지 않으므로 틀림. ④는 안정 전위에서 외부가 (+), 내부가 (−)이므로 반대로 서술해 틀림.</p>\n","src":"2장 p.6–7","diff":2,"prof":true},{"id":"q_ch2_mc02","ch":"ch2","type":"mc","q":"<p>한 환자가 손 떨림과 동작 감소(운동 느려짐)를 보이며 파킨슨병으로 진단받았다. 이 증상과 가장 관련이 깊은, 공급 부족 상태의 신경전달물질은?</p>\n","choices":["<p>세로토닌</p>\n","<p>GABA</p>\n","<p>아세틸콜린</p>\n","<p>도파민</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>도파민은 움직임·학습·주의·정서에 관여하며, 부족하면 파킨슨병의 떨림과 동작 감소를 초래한다(과잉이면 조현병 관련). ①세로토닌 부족은 우울증, ②GABA 부족은 경련·떨림·불면증, ③아세틸콜린 퇴화는 알츠하이머와 관련되어 틀림.</p>\n","src":"2장 p.9","diff":2,"prof":false},{"id":"q_ch2_mc03","ch":"ch2","type":"mc","q":"<p>신경계에 대한 설명으로 옳지 않은 것은?</p>\n","choices":["<p>체신경계는 분비선과 내장 근육의 제어를 담당한다.</p>\n","<p>척수는 말초 신경계와 두뇌를 연결하고 반사를 담당한다.</p>\n","<p>간뉴런은 감각 입력과 운동 출력 사이의 소통을 담당한다.</p>\n","<p>운동 뉴런은 중추 신경계의 명령을 근육과 내분비선에 전달한다.</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>분비선과 내장 근육을 제어하는 것은 자율 신경계이고, 체신경계는 감각 수용과 골격근의 자발적 제어를 담당한다. 따라서 ①이 옳지 않다. ②③④는 슬라이드 내용과 일치한다.</p>\n","src":"2장 p.10–11","diff":2,"prof":false},{"id":"q_ch2_mc04","ch":"ch2","type":"mc","q":"<p>뇌 연구 기법과 그 특징의 짝이 옳은 것은?</p>\n","choices":["<p>뇌전도(EEG) - 자기장을 측정하며 공간 해상도가 매우 높다.</p>\n","<p>자기공명 영상(MRI) - BOLD 신호로 신경 활동을 촬영한다.</p>\n","<p>뇌자도(MEG) - 뇌의 전기 신호가 만든 자기장을 측정하며 시간·공간 해상도가 모두 높은 편이다.</p>\n","<p>양전자 방출 단층촬영법(PET) - 강한 자기장을 쬐어 원자가 재정렬할 때의 신호를 촬영한다.</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>MEG는 전기 신호가 생성한 자기장을 이용하며 시간·공간 해상도가 모두 높다. ①EEG는 전기 신호를 증폭하고 공간 해상도가 낮다. ②BOLD로 기능을 보는 것은 fMRI이고 MRI만으로는 신경 활동 관찰이 어렵다. ④자기장 원자 재정렬은 MRI이고, PET는 방사성 포도당의 감마선을 탐지한다.</p>\n","src":"2장 p.13, 17, 18","diff":2,"prof":false},{"id":"q_ch2_mc05","ch":"ch2","type":"mc","q":"<p>fMRI와 확산 스펙트럼 영상(DSI)의 비교로 옳은 것은?</p>\n","choices":["<p>fMRI는 회질에서 발생한 BOLD 신호의 활성화를, DSI는 백질 신경 섬유 주변 물 분자의 확산을 토대로 연결 구조를 촬영한다.</p>\n","<p>fMRI는 백질 신경 섬유의 물 분자 확산을, DSI는 회질의 BOLD 신호를 측정한다.</p>\n","<p>두 기법 모두 방사성 동위원소가 섞인 포도당을 주사해 감마선을 탐지한다.</p>\n","<p>DSI는 밀리초 단위로 뇌의 전기적 활동 변화를 추적하는 데 가장 적합하다.</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>fMRI는 회질의 BOLD 신호, DSI는 백질 신경 섬유의 물 분자 확산으로 신경 통로 지도를 그린다. ②는 서로 뒤바뀐 서술이다. ③방사성 포도당은 PET이다. ④밀리초 단위 시간 추적은 EEG/ERP의 강점이다.</p>\n","src":"2장 p.18–19","diff":2,"prof":false},{"id":"q_ch2_mc06","ch":"ch2","type":"mc","q":"<p>시상(thalamus)에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>후각을 포함한 모든 감각을 예외 없이 시상을 거쳐 대뇌 피질로 전달한다.</p>\n","<p>후각을 제외한 감각 정보를 받아 대뇌의 각 감각 피질에 전달하는 감각 정보의 관문이다.</p>\n","<p>심장 활동과 허파의 호흡을 조절한다.</p>\n","<p>정교한 신체 운동과 협응, 비언어적 학습·기억에 관여한다.</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>교수 강조(9/8): 시상은 후각을 제외한 모든 감각을 받아 대뇌 각 감각 피질에 전달하는 관문이다. ①후각은 시상을 거치지 않으므로 틀림. ③심장·호흡 조절은 연수의 기능. ④정교한 운동·협응·비언어적 학습은 소뇌의 기능이다.</p>\n","src":"2장 p.21","diff":2,"prof":true},{"id":"q_ch2_mc07","ch":"ch2","type":"mc","q":"<p>다음 중 변연계(limbic system)를 구성하는 구조에 해당하지 않는 것은?</p>\n","choices":["<p>편도체</p>\n","<p>해마</p>\n","<p>뇌하수체</p>\n","<p>시상</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>변연계는 시상하부·뇌하수체·편도체·해마 네 구조로 이루어진 시스템이다. 시상은 이름이 비슷한 시상하부와 혼동하기 쉽지만 변연계 구성원이 아니라 감각 정보의 관문이다. ①②③은 모두 변연계 구성원이다.</p>\n","src":"2장 p.23","diff":2,"prof":false},{"id":"q_ch2_mc08","ch":"ch2","type":"mc","q":"<p>환자 A는 위협적인 장면을 보아도 공포를 느끼지 못하고, 환자 B는 사고 이후 새로운 정보를 기억하는 데 어려움을 겪는다. 손상되었을 가능성이 높은 부위를 순서대로(A, B) 짝지은 것은?</p>\n","choices":["<p>해마, 편도체</p>\n","<p>시상하부, 해마</p>\n","<p>편도체, 해마</p>\n","<p>편도체, 소뇌</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>위협 상황에서 공포를 느끼지 못하는 것은 편도체 손상(환자 S.M), 새 정보를 기억하지 못하는 것은 의식적·명시적 기억을 처리하는 해마 손상이다. ①은 순서가 뒤바뀌었다. ②시상하부는 항상성·섭식과 관련된다. ④소뇌는 정교한 운동과 협응을 담당한다.</p>\n","src":"2장 p.24","diff":2,"prof":false},{"id":"q_ch2_mc09","ch":"ch2","type":"mc","q":"<p>연합 영역(association area)에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>감각 영역과 운동 영역을 제외한 광범위한 영역이며, 그 활동만으로는 관찰 가능한 반응을 산출하지 않는다.</p>\n","<p>전두엽에만 존재하며 다른 엽에서는 발견되지 않는다.</p>\n","<p>얼굴 재인과 수학·공간 추리를 모두 전전두엽이 전담한다.</p>\n","<p>호문쿨루스는 연합 영역의 담당 크기에 따라 그린 신체 지도이다.</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>교수 강조(9/8): 연합 영역의 가장 중요한 특징은 관찰 가능한 반응을 산출하지 않는다는 점이며, 그래서 신경과학 기법이 필요하다. ②연합 영역은 뇌 전 영역에 존재한다. ③얼굴 재인은 측두엽(FFA), 수학·공간 추리는 두정엽이다. ④호문쿨루스는 운동·체감각 피질의 담당 영역에 따른 지도이다.</p>\n","src":"2장 p.27–28","diff":2,"prof":true},{"id":"q_ch2_mc10","ch":"ch2","type":"mc","q":"<p>뇌량이 절단된 환자가 화면 중앙을 응시한 상태에서 좌시야에 「열쇠」, 우시야에 「연필」이 제시되었다. 이 환자의 반응으로 예상되는 것은?</p>\n","choices":["<p>말로 무엇을 보았느냐고 물으면 「열쇠」라고 답하고, 가리키라고 하면 「연필」을 가리킨다.</p>\n","<p>말로는 「열쇠」와 「연필」 둘 다 보았다고 정확히 답한다.</p>\n","<p>말로도 가리키기로도 아무것도 보지 못했다고 반응한다.</p>\n","<p>말로는 「연필」이라고 답하지만, 가리키라고 하면 「열쇠」를 가리킨다.</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>우시야 정보는 좌뇌(언어 처리)로, 좌시야 정보는 우뇌로 전달되는데 뇌량이 끊어져 공유되지 않는다. 그래서 말로 보고하면 우시야의 「연필」만 답하고, 가리키기에서는 좌시야의 「열쇠」를 가리킨다(Gazzaniga). ①은 좌우가 뒤바뀌었다. ②는 정보 공유가 되지 않으므로 틀림. ③은 우뇌가 본 것을 가리킬 수 있으므로 틀림.</p>\n","src":"2장 p.29–30","diff":2,"prof":false},{"id":"q_ch2_mc11","ch":"ch2","type":"mc","q":"<p>수면과 REM 수면에 대한 설명으로 옳지 않은 것은?</p>\n","choices":["<p>REM 수면은 빠른 안구 운동을 수반하며 선명한 꿈이 나타나는 단계이다.</p>\n","<p>REM 수면에서는 뇌간이 근육으로 가는 신호를 차단하므로 심장 박동과 호흡도 함께 느려진다.</p>\n","<p>REM 수면의 수면 파형 자체는 N1과 유사하다.</p>\n","<p>REM 수면은 겉으로는 이완되어 있으나 내적으로는 각성된 상태로 볼 수 있다.</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>REM 수면은 N1과 파형이 비슷하지만 심장 박동과 호흡이 오히려 빨라진다는 차이가 있다. 근육 신호가 차단되는 것은 외적으로 이완되어 보이게 할 뿐이다. 따라서 ②가 옳지 않다. ①③④는 슬라이드 내용과 일치한다.</p>\n","src":"2장 p.35–36","diff":2,"prof":false},{"id":"q_ch2_mc12","ch":"ch2","type":"mc","q":"<p>꿈에 대한 이론과 그 설명의 짝이 옳은 것은?</p>\n","choices":["<p>정보 처리 이론 - 꿈은 표출된 내용과 깊은 곳의 잠재 내용을 담고 있다.</p>\n","<p>프로이트의 소망충족 - 꿈은 그날의 사건을 분류하고 기억을 공고하게 만든다.</p>\n","<p>활성화-종합 - REM 수면이 무작위로 시각 기억을 유발하는 신경활동을 촉발하고, 뇌가 이를 하나의 이야기로 엮는다.</p>\n","<p>생물학적 기능 - 꿈의 내용은 꿈꾸는 사람의 지식과 이해를 반영하여 실제를 시뮬레이션한다.</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>활성화-종합 이론은 REM의 무작위 시각 기억 활성화를 뇌가 이야기로 종합한다고 본다. ①표출·잠재 내용은 프로이트의 소망충족. ②기억 공고화·사건 분류는 정보 처리 이론. ④지식·이해 반영과 실제 시뮬레이션은 인지 발달 이론이며, 생물학적 기능 이론은 REM의 규칙적 뇌 자극으로 신경 통로가 발달·유지된다는 것이다.</p>\n","src":"2장 p.38","diff":2,"prof":false},{"id":"q_ch3_sa01","ch":"ch3","type":"sa","q":"<p>다음 사례에 해당하는 개념의 명칭을 쓰시오. 생후 4개월 된 아기는 좋아하는 딸랑이를 담요로 덮어 가리면 딸랑이가 사라진 것처럼 반응한다. 그러나 생후 8개월이 된 아기는 같은 상황에서 담요를 들춰 딸랑이를 찾아낸다. 눈에 보이지 않아도 그것이 계속 있다는 것을 아는 이 개념은 무엇인가?</p>\n","choices":[],"answer":"대상영속성","alts":["대상 영속성","object permanence"],"answerHtml":"<p>대상영속성</p>\n","solution":"<p>대상영속성(object permanence)은 대상이 물리적으로 지각되지 않아도 존재함을 아는 것으로, 피아제의 감각 운동 단계(출생~2세)에서 생후 6개월 이후에 형성된다.</p>\n","src":"3장 p.10","diff":2,"prof":false},{"id":"q_ch3_sa02","ch":"ch3","type":"sa","q":"<p>다음 사례에 해당하는 능력의 명칭을 쓰시오. 반창고 상자를 열어 보니 연필이 들어 있었다. 이 상자를 처음 보는 다른 친구는 안에 무엇이 들어 있다고 말할지 묻자, 3세 아동은 「연필」이라 답하고 4~5세 아동은 「반창고」라고 답했다. 타인이 잘못된 인식을 지닐 수 있음을 이해하는, 타인의 심적 상태를 추론하는 이 능력은 무엇인가?</p>\n","choices":[],"answer":"마음 이론","alts":["마음이론","theory of mind","ToM"],"answerHtml":"<p>마음 이론</p>\n","solution":"<p>마음 이론(theory of mind)은 감정·지각·사고 등 타인과 자신의 심적 상태에 대한 생각으로, 4~5세를 기점으로 급격히 발달하며 타인에 대한 이해와 공감의 시작점이다(젠킨스 &amp; 애스팅턴, 1996).</p>\n","src":"3장 p.18","diff":2,"prof":false},{"id":"q_ch3_sa03","ch":"ch3","type":"sa","q":"<p>다음 사례에 해당하는 피아제 개념의 명칭을 쓰시오. 세 살 아이는 네 발 달린 동물은 모두 「멍멍이」라고 알고 있었다. 어느 날 고양이를 보고 「멍멍이」라고 불렀다가 엄마가 아니라고 알려 주자, 「고양이」라는 새로운 범주를 만들어 자신의 기존 틀 자체를 고쳤다. 새로운 정보를 받아들이기 위해 기존 틀을 변화시키는 이 과정은 무엇인가?</p>\n","choices":[],"answer":"조절","alts":["accommodation","조절 (accommodation)"],"answerHtml":"<p>조절</p>\n","solution":"<p>조절(accommodation)은 새로운 정보를 수용하기 위해 스키마를 변화·적응시키는 것이다. 반대로 새로운 경험을 기존 스키마로 해석하는 것은 동화(assimilation)이다. 사례에서 처음 고양이를 멍멍이라 부른 것은 동화, 새 범주를 만든 것이 조절이다.</p>\n","src":"3장 p.9","diff":2,"prof":false},{"id":"q_ch3_sa04","ch":"ch3","type":"sa","q":"<p>다음 설명에 해당하는 현상의 명칭을 쓰시오. 알에서 갓 깨어난 새끼 오리는 처음 눈에 띈 움직이는 대상을 어미처럼 졸졸 따라다닌다. 이는 신체 접촉이 아니라 친숙성에 기반해 애착이 형성되는 사례로 제시된다.</p>\n","choices":[],"answer":"각인","alts":["imprinting","각인 현상"],"answerHtml":"<p>각인</p>\n","solution":"<p>오리의 각인(imprinting)은 친숙성 기반 애착의 사례이다. 애착도 인지 기능과 유사하게 결정적 시기(critical period)에 형성된다. 신체 접촉 기반 애착의 사례는 할로우의 대리모 실험이다.</p>\n","src":"3장 p.19","diff":2,"prof":false},{"id":"q_ch3_mc01","ch":"ch3","type":"mc","q":"<p>횡단 연구와 종단 연구에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>횡단 연구는 동일한 집단을 시간 경과에 따라 추적하는 방법이다.</p>\n","<p>종단 연구는 참가자가 중간에 그만둘 가능성이 낮다는 장점이 있다.</p>\n","<p>종단 연구는 동일 집단을 추적하여 변화 양상을 확인하기 쉽고, 추적 기간이 짧은 경우에도 적용할 수 있다.</p>\n","<p>횡단 연구는 한 집단의 변화 양상을 추적하는 데 가장 적합하다.</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>교수 강조(9/15): 종단 연구는 꼭 몇 년 단위가 아니라 며칠 간격으로 학습 여부를 테스트하는 짧은 기간에도 적용할 수 있다. ①동일 집단 추적은 종단 연구이고 횡단 연구는 동일 시간대의 상이한 집단을 비교한다. ②종단 연구의 단점이 중도 이탈 가능성이 높다는 점이다. ④한 집단의 변화 양상 추적이 어려운 것이 횡단 연구의 단점이다.</p>\n","src":"3장 p.3","diff":2,"prof":true},{"id":"q_ch3_mc02","ch":"ch3","type":"mc","q":"<p>성인기의 사회성에 대한 설명으로 옳지 않은 것은?</p>\n","choices":["<p>사회적 시계는 결혼·은퇴 같은 사건에 대해 문화적으로 선호하는 타이밍이며, 문화나 시대에 따라 변한다.</p>\n","<p>성공적인 결혼 생활을 유지하려면 긍정적 상호작용과 부정적 상호작용의 비율이 5:1은 되어야 한다.</p>\n","<p>자신의 흥미에 맞고 유능감·성취감을 주는 직업을 갖는 것은 행복과 연관되며, 높은 직무 만족은 삶의 만족으로 이어진다.</p>\n","<p>연구에 따르면 40대의 중년기 전환기에는 심리적 위기를 일으키는 사건이 매우 자주 발생하므로 대부분이 큰 좌절을 겪는다.</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>통념과 달리 40대에 그만한 사건이 자주 발생하지는 않는다(Hunter &amp; Sundel, 1989). 따라서 ④가 옳지 않다. ①은 사회적 시계, ②는 고트만 &amp; 고트만(2018)의 5:1 비율, ③은 생산성(직업) 설명으로 모두 슬라이드와 일치한다.</p>\n","src":"3장 p.37–38","diff":2,"prof":false},{"id":"q_ch3_mc03","ch":"ch3","type":"mc","q":"<p>피아제의 인지 발달 단계와 그 특징의 짝으로 옳은 것은?</p>\n","choices":["<p>감각 운동 단계 - 가설적 명제에서 결론을 도출하는 체계적 추리를 한다.</p>\n","<p>전조작 단계 - 단어와 이미지로 대상을 표상하고 가상 놀이를 하지만 심적 조작은 할 수 없다.</p>\n","<p>구체적 조작 단계 - 자기중심성이 두드러지고 보존 개념이 아직 결여되어 있다.</p>\n","<p>형식적 조작 단계 - 출생부터 만 2세까지의 아동이 해당한다.</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>전조작 단계(2<del>6세)는 단어·이미지 표상과 가상 놀이가 가능하나 심적 조작이 불가능하다. ①가설적 명제 추리는 형식적 조작 단계(12세</del>)의 특징이다. ③자기중심성과 보존 개념 결여는 전조작 단계의 특징이며 구체적 조작 단계(7<del>11세)에서 보존을 이해하기 시작한다. ④출생</del>2세는 감각 운동 단계이다.</p>\n","src":"3장 p.10–16","diff":2,"prof":false},{"id":"q_ch3_mc04","ch":"ch3","type":"mc","q":"<p>다섯 살 민수는 똑같은 양의 주스가 든 두 컵 중 하나를 좁고 긴 컵에 옮겨 붓는 것을 직접 본 뒤, 수면이 더 높은 좁고 긴 컵의 주스가 더 많다고 답했다. 이 사례를 가장 정확히 설명한 것은?</p>\n","choices":["<p>형식적 조작 단계의 아동으로, 추상적 추리 능력이 결여되어 있다.</p>\n","<p>감각 운동 단계의 아동으로, 낯가림이 아직 발달하지 않았다.</p>\n","<p>구체적 조작 단계의 아동으로, 보존 개념이 결여되어 있다.</p>\n","<p>전조작 단계의 아동으로, 보존 개념이 결여되어 있다.</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>2<del>6세 전조작 단계 아동은 시각(눈에 보이는 수면 높이)에 초점을 맞추어 보존 개념이 결여되어 있다. ③구체적 조작 단계(7</del>11세)는 보존을 이해하기 시작하는 시기이므로 보존 결여라는 설명이 틀림. ①형식적 조작 단계는 12세 이후이며 이 연령의 사례가 아님. ②감각 운동 단계는 출생~2세이고 이 사례는 보존 실험이므로 틀림.</p>\n","src":"3장 p.12, 14","diff":2,"prof":false},{"id":"q_ch3_mc05","ch":"ch3","type":"mc","q":"<p>피아제와 비고츠키의 인지 발달 접근에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>비고츠키는 아동의 마음이 사회적 환경과의 상호작용을 통해 성장하며, 부모와 교사가 새로운 어휘 등으로 성장의 도약대를 제공한다고 보았다.</p>\n","<p>피아제는 언어가 사고의 토대를 제공하고 이를 내면화한 속내말로 문제를 해결한다고 보았다.</p>\n","<p>비고츠키는 물리적 대상이나 환경 변화에 대한 심적 조작 과정을 발달의 핵심으로 보았다.</p>\n","<p>피아제는 부모와 교사가 제공하는 도약대가 아동 발달의 주된 원동력이라고 보았다.</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>비고츠키의 사회적 아동은 사회적 환경과의 상호작용, 도약대, 속내말을 강조한다. ②는 비고츠키의 주장이고 ③④는 피아제(물리적 환경과의 상호작용, 심적 조작)와 비고츠키의 내용이 뒤바뀐 서술이다. (교수 강조 9/15: 피아제는 물리적 환경, 비고츠키는 사회적 환경을 중시.)</p>\n","src":"3장 p.17","diff":2,"prof":true},{"id":"q_ch3_mc06","ch":"ch3","type":"mc","q":"<p>애착에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>안정 애착과 불안정 애착의 차이는 부모의 반응과 무관하게 전적으로 선천적 기질로 결정된다.</p>\n","<p>안정 애착 아동은 부모가 사라져도 전혀 불안해하지 않는다.</p>\n","<p>안정 애착 아동은 부모와 있으면 편안하고 부모가 사라지면 불안해하다가 다시 만나면 신체 접촉을 시도하며, 이 차이는 부모의 적절한 반응에 따라 결정된다.</p>\n","<p>기본 신뢰감은 생득적으로 타고나는 것이며 애착과는 무관하다.</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>안정 애착의 특징과 안정/불안정 차이가 부모의 적절한 반응에 따라 결정된다는 설명이 슬라이드와 일치한다(De Wolff &amp; Van IJzendoorn, 1997). ①애착은 선천적 기질과 양육 방식 모두의 영향을 받고, 감수성 훈련에 따라 안정 애착 비율이 변한다. ②안정 애착 아동도 부모가 사라지면 불안해한다. ④기본 신뢰감은 안정 애착을 통해 후천적으로 형성된다(p.23).</p>\n","src":"3장 p.21–23","diff":2,"prof":false},{"id":"q_ch3_mc07","ch":"ch3","type":"mc","q":"<p>불안정 애착과 애착 박탈에 대한 설명으로 옳지 않은 것은?</p>\n","choices":["<p>불안 애착은 배척 신호에 예민한 성향을 보인다.</p>\n","<p>회피 애착은 끊임없이 타인의 인정을 갈망하는 성향이다.</p>\n","<p>애착이 박탈된 아동은 지능과 두뇌 발달의 저하, 비정상적 스트레스 반응, ADHD 등이 보고되었다.</p>\n","<p>불안이나 회피적 경향성은 위험을 탐지하거나 회피하는 데 도움이 될 수도 있다.</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>끊임없이 인정을 갈망하고 배척 신호에 민감한 것은 불안 애착이고, 회피 애착은 긴밀한 관계가 형성될 때 불편함을 느끼며 거리를 유지하려는 성향이다. 따라서 ②가 옳지 않다. ①③④는 슬라이드와 일치한다(루마니아 아동 연구, Ein-Dor et al., 2010).</p>\n","src":"3장 p.23–24","diff":2,"prof":false},{"id":"q_ch3_mc08","ch":"ch3","type":"mc","q":"<p>아버지 A는 자녀에게 「이번 시험에서 성적을 올리면 원하는 것을 사 주겠다」라며 조건을 제시하고, 자녀가 조건이 비현실적이라고 하면 수정안을 내 보라고 하여 타협한다. 이 양육 방식의 유형과 자녀에게 흔히 나타나는 특성으로 옳은 것은?</p>\n","choices":["<p>권위적 부모 - 높은 자존감과 자기신뢰감, 자율성</p>\n","<p>권위주의적 부모 - 높은 자존감과 자기신뢰감, 자율성</p>\n","<p>허용적 부모 - 사회적 기술과 자존감 저하 위험</p>\n","<p>방임적 부모 - 높은 자존감과 자율성</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>요구를 하되 타협을 통해 자녀의 요구도 수용하는 것은 권위적(authoritative) 부모이며 높은 자존감·자기신뢰감·자율성과 연관된다. ②권위주의적 부모는 강압적으로 복종을 요구하고 자존감 저하 위험이 있다. ③사회적 기술·자존감 저하는 권위주의적 부모의 자녀이고, 허용적 부모의 자녀는 공격적이고 미숙할 수 있다. ④방임적 부모의 자녀는 학업과 사회적 관계가 낮다. (교수 강조 9/15: 「권위적/권위주의적」은 번역 용어가 겹쳐 헷갈리니 구분할 것, 양육 방식과 자녀 특성은 상관이지 인과가 아님.)</p>\n","src":"3장 p.25","diff":2,"prof":true},{"id":"q_ch3_mc09","ch":"ch3","type":"mc","q":"<p>콜버그의 도덕성 발달 단계에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>전인습적 단계에서는 처벌을 피하거나 구체적 보상을 얻는 것이 규칙 준수의 핵심 기제로 작용한다.</p>\n","<p>인습적 단계는 보편적 기본 권리와 스스로 규정한 윤리적 원칙에 대한 신념을 반영한다.</p>\n","<p>후인습적 단계는 9세 이전 아동에게서 나타난다.</p>\n","<p>콜버그의 단계는 아동의 인지 발달과 무관하게 제안되었다.</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>전인습적 단계(9세 이전)는 처벌 회피·구체적 보상이 핵심이다. ②보편적 권리와 윤리 원칙에 대한 신념은 후인습적 단계이고 인습적 단계는 사회적 인정·질서 유지가 핵심이다. ③후인습적 단계는 청소년기와 그 이후에 나타난다. ④아동의 도덕적 판단은 인지 발달(피아제+콜버그)에 기초한다.</p>\n","src":"3장 p.28–29","diff":2,"prof":false},{"id":"q_ch3_mc10","ch":"ch3","type":"mc","q":"<p>도덕 직관과 도덕 행위에 대한 설명으로 옳지 않은 것은?</p>\n","choices":["<p>도덕성의 상당 부분은 이성보다 직관과 정서에 기반해 형성된다.</p>\n","<p>혐오감이나 기쁨 같은 정서가 도덕 추리를 촉발할 수 있다.</p>\n","<p>트롤리 딜레마에서 레버를 돌리는 경우와 직접 사람을 밀치는 경우의 판단 차이는 직관·정서적 요소와 관련지어 살펴볼 수 있다.</p>\n","<p>도덕적 행동을 통해 도덕적 태도를 함양하는 것은 불가능하며, 태도가 먼저 형성되어야만 행동이 가능하다.</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>교수 강조(9/15): 도덕적 행동을 통해서도 도덕적 태도를 함양할 수 있으며(Heller, 2014; Piliavin, 2003), 법원의 행동 프로그램 이수 명령도 행동에서 태도가 형성된다는 점을 인정하는 사례이다. 따라서 ④가 옳지 않다. ①②③은 하이트(2012), Chester &amp; DeWall(2016), 트롤리 딜레마 설명과 일치한다.</p>\n","src":"3장 p.30","diff":2,"prof":true},{"id":"q_ch3_mc11","ch":"ch3","type":"mc","q":"<p>에릭슨의 심리사회적 발달 단계와 심리사회적 위기의 짝으로 옳은 것은?</p>\n","choices":["<p>유아기(0~1세) - 자율성 대 수치감·자기의심</p>\n","<p>청소년기 - 정체성 대 역할 혼미</p>\n","<p>중년기 - 친밀감 대 소외감</p>\n","<p>노년기 - 선도성 대 죄책감</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>청소년기의 위기는 정체성 대 역할 혼미이다(교수 강조 9/15: 정체성 수립의 가장 중요한 요소는 차별성). ①유아기(0<del>1세)는 신뢰감 대 불신감이고 자율성 대 수치감은 걸음마기(1</del>2세). ③친밀감 대 소외감은 성인 초기이고 중년기는 생산성 대 침체감. ④선도성 대 죄책감은 학령 전기(3~6세)이고 노년기는 통합감 대 절망감이다.</p>\n","src":"3장 p.34, 39","diff":2,"prof":true},{"id":"q_ch3_mc12","ch":"ch3","type":"mc","q":"<p>성인기의 인지 기능과 노화에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>노화에 따라 회상 과제와 재인 과제의 수행이 같은 폭으로 하락한다.</p>\n","<p>재인 과제는 노화에 따라 크게 하락하지만 회상 과제는 변화가 없다.</p>\n","<p>회상 과제의 수행은 나이에 따라 하락하지만 재인 능력은 노화에 따른 변화가 적으며, 노년층은 설단 현상 망각을 더 자주 경험한다.</p>\n","<p>기억력의 개인차는 나이가 들수록 점점 줄어든다.</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>교수 강조(9/15): 직접 단어를 말해야 하는 회상 과제는 하락하지만, 본 적 있는지 판단하는 재인 과제에서는 노화에 따른 변화 양상이 보이지 않는다. 노인이 단어를 잘 말하지 못하는 것은 기억이 지워진 것이 아니라 직접 산출의 차이이다. ①②는 재인과 회상의 양상이 틀리게 서술되어 틀림. ④기억력의 개인차는 나이가 들수록 점점 더 커진다.</p>\n","src":"3장 p.35","diff":2,"prof":true},{"id":"q_ch4_sa01","ch":"ch4","type":"sa","q":"<p>다음 사례에 해당하는 심리 현상(개념)의 명칭을 쓰시오. 아이들에게 똑같은 감자튀김을 로고가 없는 흰 봉투와 유명 프랜차이즈 로고가 찍힌 봉투에 각각 담아 주었더니, 로고가 찍힌 봉투의 감자튀김을 더 맛있다고 평가하였다. 이처럼 과거 경험에 근거하여 미리 형성된 기대가 이후 입력 정보의 해석을 이끄는 현상 중, 하향 처리의 대표적 예시로 경험에 근거하여 특정 지각에 대해 형성되는 기대를 가리키는 명칭을 쓰시오.</p>\n","choices":[],"answer":"지각 갖춤새","alts":["지각갖춤새","지각 세트","지각태세","perceptual set"],"answerHtml":"<p>지각 갖춤새</p>\n","solution":"<p>경험에 근거한 특정 지각에 대한 기대를 지각 갖춤새(perceptual set)라 하며 하향 처리의 대표 예시이다. 교수는 블라인드 테스트를 하는 이유도 이런 인지 요인이 맛 평가를 바꾸기 때문이라고 설명했다.</p>\n","src":"4장 p.9, p.11","diff":2,"prof":true},{"id":"q_ch4_sa02","ch":"ch4","type":"sa","q":"<p>철수는 강한 디퓨저 향이 나는 사무실에 처음 들어갔을 때는 냄새가 머리가 띵할 정도로 강렬했지만, 30분쯤 지나자 그 냄새가 거의 느껴지지 않았다. 같은 자극이 반복되면 그 자극에 대한 수용 기관의 민감도가 줄어드는 이 현상의 명칭을 쓰시오.</p>\n","choices":[],"answer":"감각 순응","alts":["감각순응","sensory adaptation","순응"],"answerHtml":"<p>감각 순응</p>\n","solution":"<p>반복 자극에 대한 민감도 감소를 감각 순응(sensory adaptation)이라 한다. 새롭거나 더 중요한 대상에 주의를 돌리기 위한 것이며, 오감 중 후각에서 가장 빨리 일어난다. 뉴런의 발화율이 감소하면서 지각도 약해진다.</p>\n","src":"4장 p.8","diff":2,"prof":false},{"id":"q_ch4_sa03","ch":"ch4","type":"sa","q":"<p>볼펜 두 자루의 끝을 맞추는 과제는 두 눈을 뜨고 하면 쉽지만 한 눈을 감고 하면 어렵다. 좌·우 눈이 받아들이는 상의 차이를 계산하여 그 차이가 클수록 대상이 가깝다고 판단하는, 깊이 지각의 양안 단서의 명칭을 쓰시오.</p>\n","choices":[],"answer":"망막 부등","alts":["망막부등","retinal disparity","양안 부등"],"answerHtml":"<p>망막 부등</p>\n","solution":"<p>두 망막에 맺힌 이미지의 차이를 이용하는 양안 단서가 망막 부등(retinal disparity)이다. 차이가 클수록 가까이 있는 사물로 지각한다. 또 다른 양안 단서는 수렴(두 눈의 내각)이다.</p>\n","src":"4장 p.34","diff":2,"prof":false},{"id":"q_ch4_sa04","ch":"ch4","type":"sa","q":"<p>영희는 화면 속 사람이 입으로는 「가」 소리를 내는 장면을 보면서, 스피커에서는 「바」 소리를 들었다. 그러자 영희는 「가」도 「바」도 아닌 「다」라는 제3의 소리를 들었다고 보고하였다. 이처럼 입술 모양(시각)이 청각 정보 처리에 영향을 주는 현상의 명칭을 쓰시오.</p>\n","choices":[],"answer":"맥거크 효과","alts":["맥거크효과","McGurk effect","맥거크 현상","맥거크"],"answerHtml":"<p>맥거크 효과</p>\n","solution":"<p>시각–청각 상호작용의 대표 예시인 맥거크 효과(McGurk effect; McGurk &amp; MacDonald, 1976)이다. 입모양과 소리의 언어 정보가 다를 때 전혀 다른 제3의 정보를 지각하며, 독순술도 이와 연결되는 하나의 듣기 형태이다.</p>\n","src":"4장 p.39","diff":2,"prof":false},{"id":"q_ch4_mc01","ch":"ch4","type":"mc","q":"<p>절대 역치와 역치하 자극에 대한 설명으로 옳지 않은 것은?</p>\n","choices":["<p>절대 역치는 특정 자극의 탐지 비율이 0.5가 되는 지점이다.</p>\n","<p>역치하 자극은 탐지율 0.5 미만의 강도로 제시된 자극이다.</p>\n","<p>역치하 자극은 의식적으로 지각되지 않으므로 심리 기제에 어떤 영향도 줄 수 없다.</p>\n","<p>같은 사람이라도 심리 상태에 따라 절대 역치가 달라질 수 있다.</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>정답 ③. 슬라이드는 「의식적 지각을 하지 못하더라도 심리 기제에 영향을 줄 수 있음」이라고 했고, 점화 연구가 그 증거이다. ①은 절대 역치의 정의로 옳다. ②는 역치하 자극의 정의로 옳다. ④는 절대 역치가 자극 강도뿐 아니라 개인의 심리 상태(예: 청력 검사에서 주의를 기울일 때 역치가 낮아짐)에도 영향받는다는 내용으로 옳다. 교수 강조(9/22): 역치가 낮은 것이 언제나 좋은 것은 아니며, 약한 자극도 영향을 줄 수 있다는 점이 함께 강조되었다.</p>\n","src":"4장 p.4","diff":2,"prof":true},{"id":"q_ch4_mc02","ch":"ch4","type":"mc","q":"<p>신호 탐지 이론에서 개인의 판단 기준선(편향성)을 오른쪽으로 이동시켜 판단을 더 엄격하게 할 때 나타나는 변화로 가장 적절한 것은?</p>\n","choices":["<p>적중(Hit)과 오경보(False Alarm)가 모두 감소한다.</p>\n","<p>신호와 노이즈를 구별하는 능력인 민감도가 증가한다.</p>\n","<p>적중은 증가하고 오경보는 감소한다.</p>\n","<p>적중과 오경보가 모두 증가한다.</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>정답 ①. 기준선이 오른쪽(엄격)으로 가면 「있다」고 답하는 경우 자체가 줄어 적중도, 오경보도 함께 감소한다. ②는 민감도가 두 분포의 피크 사이 거리이므로 기준선 이동과 무관하여 틀리다. ③은 엄격해지면 적중이 오히려 감소하므로 틀리다. ④는 기준선이 왼쪽(관대)으로 이동할 때의 결과이다.</p>\n","src":"4장 p.6","diff":2,"prof":false},{"id":"q_ch4_mc03","ch":"ch4","type":"mc","q":"<p>베버의 법칙에 따라 어떤 사람이 100kg 가방에서 10%가 늘어야 무거워졌음을 지각한다고 하자. 110kg 가방을 든 이 사람이 다시 더 무겁다고 지각하려면 가방은 최소 몇 kg이 되어야 하는가?</p>\n","choices":["<p>111kg</p>\n","<p>115kg</p>\n","<p>120kg</p>\n","<p>121kg</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>정답 ④. 베버의 법칙은 절대적 양이 아니라 현재 자극의 일정 비율만큼 변해야 차이를 지각한다는 법칙이다. 110kg의 10%는 11kg이므로 121kg이 필요하다. ③(120kg)은 처음과 같은 10kg만 더하면 된다고 생각한 오답(절대량 기준)이다. ①, ②는 필요한 증가분에 못 미친다.</p>\n","src":"4장 p.7 (교수 예시)","diff":2,"prof":false},{"id":"q_ch4_mc04","ch":"ch4","type":"mc","q":"<p>한 실험자가 엘리베이터에서 참가자에게 잠깐 따뜻한 커피를 들어달라고 부탁한 뒤 설문을 부탁하였더니, 차가운 커피를 들었던 참가자보다 더 우호적인 평가를 하였다. 이 결과를 가장 잘 설명하는 개념은?</p>\n","choices":["<p>베버의 법칙</p>\n","<p>체화 인지</p>\n","<p>신호 탐지 이론</p>\n","<p>공감각</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>정답 ②. 신체적 따뜻함이 사회적 따뜻함으로 이어지는 것은 신체 감각의 두뇌 회로와 인지 회로가 상호작용하는 체화 인지의 예이다(Fetterman et al., 2018). ①은 현재 자극의 일정 비율만큼 변해야 차이를 지각한다는 차이 역치의 법칙이므로 무관하다. ③은 신호와 노이즈를 구분하는 민감도와 판단 기준선으로 탐지 수행을 설명하는 이론이므로 온도가 태도 평가를 바꾸는 사례와 무관하다. ④는 한 감각 경험이 다른 감각 경험을 함께 일으키는 현상(예: 숫자를 보면 색을 지각)으로, 이 사례처럼 온도가 태도 평가를 바꾸는 것과는 다르다.</p>\n","src":"4장 p.40","diff":2,"prof":false},{"id":"q_ch4_mc05","ch":"ch4","type":"mc","q":"<p>다음 중 하향 처리(top-down)의 예로 보기 어려운 것은?</p>\n","choices":["<p>갈증 상태에서 물병이 실제보다 더 가깝게 지각된다.</p>\n","<p>중상을 입은 부상병이 예상보다 통증을 덜 보고한다.</p>\n","<p>밝은 방에 들어가면 물리적 빛의 세기에 따라 동공이 수축한다.</p>\n","<p>슬픈 음악을 들은 뒤 Pain 같은 단어를 더 부정적으로 지각한다.</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>정답 ③. 밝은 곳에서 동공이 수축하는 것은 보통 물리적 자극 강도에 의해 결정되는 반응이다(교수 설명 9/22 1:00:52. 홍채는 밝은 공간을 상상하는 것만으로도 조절될 수 있어 예외적으로 하향 영향이 확인되었다). ①은 동기, ②는 기대·주의의 영향, ④는 정서의 영향으로 모두 하향 처리의 예이다.</p>\n","src":"4장 p.13, 16, 17, 21","diff":2,"prof":true},{"id":"q_ch4_mc06","ch":"ch4","type":"mc","q":"<p>통증 지각에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>직접 경로 모형은 통증 지각이 상향 처리 중심이라고 보았고, 2차 대전 부상병 관찰(Beecher, 1959)은 이 모형에 불리한 근거가 되었다.</p>\n","<p>직접 경로 모형에 따르면 개인의 기대와 주의가 통증 지각을 결정하는 가장 중요한 요인이다.</p>\n","<p>부상병 연구는 부상이 심각할수록 통증 보고도 항상 더 커진다는 것을 보여주었다.</p>\n","<p>가상현실 게임으로 주의를 분산시키면 화상 환자의 통증 지각이 증가한다.</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>정답 ①. 직접 경로 모형은 감각 수용 정보가 대뇌로 직접 전달된다는 상향 처리 중심 설명인데, 중상인데도 통증을 덜 느끼는 부상병이 많다는 보고가 이 설명과 맞지 않았다. ②는 기대·주의가 핵심이라는 것은 하향 처리 관점이지 직접 경로 모형이 아니다. ③은 부상병 연구 결과와 반대이다. ④는 반대로 주의 분산이 화상 환자의 통증 지각을 감소시켰다(Hoffman et al., 2008).</p>\n","src":"4장 p.13","diff":2,"prof":false},{"id":"q_ch4_mc07","ch":"ch4","type":"mc","q":"<p>원추체와 간상체에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>원추체는 간상체보다 개체 수가 많고 망막 주변부에 주로 분포한다.</p>\n","<p>간상체는 색채와 세부사항을 탐지하는 데 특화되어 있다.</p>\n","<p>원추체는 두뇌로 가는 핫라인이 없어서 여러 뉴런의 신호를 합산하여 전달한다.</p>\n","<p>간상체는 약한 빛에서 밝기를 감지하며 망막 주변에 주로 분포하고, 암순응과 관련된다.</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>정답 ④. 간상체는 1억 2천만 개로 주변부에 분포하고 약한 빛의 밝기(명암)를 감지하며 어두운 곳에서 형체를 식별하는 암순응과 연관된다. ①은 원추체가 600만 개로 더 적고 망막 중앙에 분포하므로 틀리다. ②는 색채·세부사항은 원추체의 역할이다. ③은 핫라인이 있는 쪽이 원추체이고 합산 전달은 간상체이다.</p>\n","src":"4장 p.23, 24","diff":2,"prof":false},{"id":"q_ch4_mc08","ch":"ch4","type":"mc","q":"<p>얼굴 재인과 관련된 뇌 영역에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>PPA는 얼굴 자극에 특히 강하게 반응한다.</p>\n","<p>FFA가 손상되면 얼굴실인증이 나타나고, FFA에 경두개 자기장 자극술(TMS)을 적용하면 얼굴 재인 능력이 저하된다.</p>\n","<p>FFA는 장소·공간 이미지에 강하게 반응하고 얼굴 자극에는 반응하지 않는다.</p>\n","<p>얼굴과 장소 사진을 겹쳐 보여줄 때는 주의와 무관하게 항상 FFA만 활성화된다.</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>정답 ②. FFA(방추상 얼굴 영역)는 얼굴 재인을 담당하며 손상 시 얼굴실인증이 나타나고 TMS로 저하된다(McKone et al., 2007). ①은 PPA(해마곁 장소 영역)가 장소·공간에 반응하는 영역이므로 틀리다. ③은 장소·공간에 반응하는 영역은 PPA이고 FFA는 얼굴 재인을 담당하므로 틀리다. ④는 얼굴에 주의를 두면 FFA, 장소에 주의를 두면 PPA가 반응하는 등 주의에 따라 활성화가 달라진다는 교수 설명과 반대이다.</p>\n","src":"4장 p.26","diff":2,"prof":true},{"id":"q_ch4_mc09","ch":"ch4","type":"mc","q":"<p>게슈탈트 심리학에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>부분 요소의 합이 곧 전체라고 본다.</p>\n","<p>집단화 원리는 후천적 경험과 학습으로 형성된다고 본다.</p>\n","<p>집단화 원리는 타고난 것이며, 지각 설명에서 하향 처리보다 상향 처리를 더 강조한다.</p>\n","<p>전경–배경 관계는 고정되어 있어 주의를 어디에 두어도 바뀌지 않는다.</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>정답 ③. 교수 강조(9/22 1:26:56~1:28:47): 게슈탈트 원리는 얼핏 하향 처리 같지만 경험에 의해 형성된 것이 아니라 내재된 것이고, 부분(하위)에서 전체로 진행되므로 상향 처리 중심이다(유아도 사용, Wertheimer 1912). ①은 「전체는 부분의 합 이상」이라는 게슈탈트의 핵심과 반대이다. ②는 타고난 것이라는 입장과 반대이다. ④는 전경–배경은 가역적이며 주의에 따라 바뀐다.</p>\n","src":"4장 p.28-30","diff":2,"prof":true},{"id":"q_ch4_mc10","ch":"ch4","type":"mc","q":"<p>올림픽 오륜기를 볼 때 우리는 겹친 부분을 조각조각 나누지 않고 부드럽게 이어진 다섯 개의 원으로 지각한다. 이 지각에 가장 직접적으로 작용한 집단화 원리는?</p>\n","choices":["<p>연속성</p>\n","<p>근접성</p>\n","<p>폐쇄</p>\n","<p>전경–배경 구분</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>정답 ①. 부드럽게 연속된 패턴을 하나로 지각하는 것이 연속성이며 교수가 든 대표 예시가 올림픽 오륜기이다. ②는 가까이 있는 것끼리 묶는 원리(예: 6개 선을 3쌍으로 봄)이다. ③은 끊어진 부분을 메워 닫힌 형태로 지각하는 원리(예: 흰 삼각형)로 헷갈리기 쉬우나 이 사례는 틈을 메우는 것이 아니다. ④는 집단화가 아니라 그 이전 단계인 대상과 배경의 분리이다.</p>\n","src":"4장 p.30","diff":2,"prof":true},{"id":"q_ch4_mc11","ch":"ch4","type":"mc","q":"<p>다음 중 단안 단서(monocular cue)에 해당하지 않는 것은?</p>\n","choices":["<p>중첩</p>\n","<p>상대적 운동</p>\n","<p>선형 조망</p>\n","<p>수렴</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>정답 ④. 수렴은 가까운 사물에 초점을 맞출 때 두 눈이 이루는 내각을 이용하는 양안 단서이다(다른 양안 단서는 망막 부등). ①, ②, ③은 각각 한 눈만으로도 쓸 수 있는 단안 단서이다(단안 단서 5가지: 중첩, 상대적 운동, 상대적 높이, 선형 조망, 상대적 크기). 교수 강조(9/22 1:47:42): 양안 단서와 단안 단서의 유형을 잘 구분해 둘 것.</p>\n","src":"4장 p.34-36","diff":2,"prof":true},{"id":"q_ch4_mc12","ch":"ch4","type":"mc","q":"<p>깁슨과 워크(1960)의 시각 절벽 실험과 그 해석으로 옳은 것은?</p>\n","choices":["<p>성인을 대상으로 하여 깊이 지각이 학습된 능력임을 보였다.</p>\n","<p>기어 다니기 시작한 6~14개월 유아가 시각 절벽을 건너려 하지 않았고, 대부분의 동물 새끼도 비슷하여 깊이 지각의 선천성을 시사한다.</p>\n","<p>유아는 엄마가 불러도 시각 절벽을 항상 건넜다.</p>\n","<p>생후 며칠 된 신생아도 기어 다니며 시각 절벽을 회피했다.</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>정답 ②. 6~14개월 유아가 높이를 피하는 결과와 다수 동물 새끼의 회피는 깊이 지각이 생존과 관련된 선천적 경향이 있음을 시사한다. ①은 대상이 유아이며 학습이 아니라 선천성을 시사한다. ③은 슬라이드에서 기어 다니기 시작한 유아가 높이를 조심하는 경향을 보이고 시각 절벽을 건너려고 하지 않았다고 했으므로 항상 건넜다는 서술은 틀리다. ④는 기어 다니기 시작한 유아 대상이므로 틀리다.</p>\n","src":"4장 p.33","diff":2,"prof":false},{"id":"q_ch5_sa01","ch":"ch5","type":"sa","q":"<p>종소리와 먹이를 짝지어 제시하여 종소리만 들어도 침을 흘리게 된 개가 있다. 이후 이 개에게 먹이는 주지 않고 종소리와 불빛을 반복해서 짝지어 제시했더니, 불빛만 봐도 침을 흘리게 되었다. 이미 반응을 이끌어내는 자극을 또 다른 중립 자극과 연합시켜 새로운 자극으로 만드는 이 절차의 명칭을 쓰시오.</p>\n","choices":[],"answer":"고차 조건형성","alts":["고차조건형성","고차 조건화","고차조건화","고차 조건 형성","higher-order conditioning","이차 조건형성"],"answerHtml":"<p>고차 조건형성</p>\n","solution":"<p>한 조건 자극을 다른 중성 자극과 연합해 조건화시키는 방법이 고차 조건형성(higher-order conditioning)이다. 1차 조건형성보다는 약하게 형성되지만 일생의 삶에 영향을 줄 수 있다(예: 개에게 물린 사람이 개 짖는 소리만 들어도 두려워함).</p>\n","src":"5장 p.10","diff":2,"prof":false},{"id":"q_ch5_sa02","ch":"ch5","type":"sa","q":"<p>종소리에 침을 흘리도록 학습된 개에게 먹이 없이 종소리만 여러 번 들려주었더니 더 이상 침을 흘리지 않게 되었다. 그런데 며칠 쉬게 한 뒤 다시 종소리를 들려주자 침을 조금 흘렸다. 이처럼 일정한 휴지 기간 뒤에 사라졌던 반응이 다시 나타나는 현상의 명칭을 쓰시오.</p>\n","choices":[],"answer":"자발적 회복","alts":["자발적회복","spontaneous recovery"],"answerHtml":"<p>자발적 회복</p>\n","solution":"<p>소거된 조건 반응이 휴지 기간 후 조건 자극을 다시 제시할 때 부분적으로 나타나는 현상이 자발적 회복(spontaneous recovery)이다. 소거가 반응을 제거하는 것이 아니라 억압하는 쪽에 가깝다는 근거이다.</p>\n","src":"5장 p.11","diff":2,"prof":false},{"id":"q_ch5_sa03","ch":"ch5","type":"sa","q":"<p>철수는 청소 당번이 되는 것이 정말 싫었다. 그런데 숙제를 완벽히 해 오면 청소 당번이 면제된다는 것을 알게 된 뒤로 숙제를 해 오는 행동이 크게 늘었다. 싫은 것이 없어지기 때문에 행동 빈도가 증가하는, 조작적 조건화의 이 원리(유형)의 명칭을 쓰시오.</p>\n","choices":[],"answer":"부적 강화","alts":["부적강화","negative reinforcement","네거티브 리인포스먼트"],"answerHtml":"<p>부적 강화</p>\n","solution":"<p>혐오 자극(청소 당번)을 제거하여 행동 빈도를 증가시키는 것이 부적 강화(negative reinforcement)이다. 부적 강화는 처벌이 아니다(교수 강조 9/29): 행동이 증가하면 강화, 감소하면 처벌이며, 무언가를 빼 주면 부적이다.</p>\n","src":"5장 p.19","diff":2,"prof":true},{"id":"q_ch5_sa04","ch":"ch5","type":"sa","q":"<p>영희는 강아지에게 구르기 재주를 가르치려 한다. 처음에는 엎드리기만 해도 간식을 주다가, 다음에는 옆으로 눕는 동작을 해야만 간식을 주고, 마지막에는 완전히 한 바퀴 굴러야만 간식을 준다. 이처럼 최종 목표 행동에 이르는 이전 단계 행동들에 적절한 보상을 주면서 목표에 다가가게 하는 방법으로, 행동 조성(shaping)에서 사용하는 구체적 방법의 명칭을 쓰시오.</p>\n","choices":[],"answer":"계기적 근사법","alts":["계기적근사법","순차적 접근법","연속적 접근법","successive approximations","method of successive approximations"],"answerHtml":"<p>계기적 근사법</p>\n","solution":"<p>최종 목표 행동을 학습시키기 위해 이전 단계의 행동에 적절한 보상을 제공하여 목표에 다가가게 하는 방법이 계기적 근사법이며 행동 조성(shaping)에 사용된다. 교수 설명(9/29 55:57): 최종 목표를 몇 단계로 나눠 단계별 목표를 달성할 때마다 보상한다.</p>\n","src":"5장 p.18","diff":2,"prof":true},{"id":"q_ch5_mc01","ch":"ch5","type":"mc","q":"<p>학습의 세 양상 중 비연합 학습(non-associative learning)에 해당하는 사례는?</p>\n","choices":["<p>종소리 다음에 먹이를 주는 것을 반복하자 종소리만 들어도 침을 흘리게 된 개</p>\n","<p>레버를 누르면 먹이가 나온다는 것을 알게 되어 레버를 누르는 횟수가 늘어난 쥐</p>\n","<p>다른 아이가 칭찬받는 모습을 보고 같은 행동을 따라 하게 된 아동</p>\n","<p>같은 자극에 계속 노출되자 그 자극에 대한 반응이 점차 줄어든 신생아</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>정답 ④. 같은 자극에 반복 노출되어 반응 빈도가 줄어드는 것은 둔감화(habituation)로 연합을 쓰지 않는 비연합 학습이다(반대는 민감화). ①은 두 자극을 연합하는 고전적 조건화, ②는 행동과 결과를 연합하는 조작적 조건화로 모두 연합 학습이다. ③은 관찰을 통한 인지(관찰) 학습이다. 교수 강조(9/29): 학습은 비연합·연합·관찰(인지)의 세 양상으로 나뉜다.</p>\n","src":"5장 p.2","diff":2,"prof":true},{"id":"q_ch5_mc02","ch":"ch5","type":"mc","q":"<p>철수는 피자를 먹으면 자연스럽게 침이 고인다. 피자 배달 오토바이 소리는 처음에는 아무 반응도 일으키지 않았지만, 소리가 난 직후 피자가 도착하는 일이 반복되자 이제는 오토바이 소리만 들어도 침이 고인다. 이 사례의 분석으로 옳은 것은?</p>\n","choices":["<p>무조건자극은 오토바이 소리이고 조건반응은 침이다.</p>\n","<p>조건자극은 오토바이 소리이고, 피자를 먹을 때 나오는 침은 무조건반응이다.</p>\n","<p>조건자극은 피자이고, 오토바이 소리에 나오는 침은 무조건반응이다.</p>\n","<p>중성 자극은 피자이고 무조건자극은 침이다.</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>정답 ②. 피자(US)에 대한 자연스러운 침(UR)이 있고, 처음엔 무반응이던 오토바이 소리(NS)가 피자와 연합되어 조건자극(CS)이 되며, 그 소리에 나오는 침이 조건반응(CR)이다. UR과 CR은 겉으로는 같은 행동(침)이지만 유발 자극이 다르다. ①은 오토바이 소리가 학습된 자극이므로 무조건자극이 아니다. ③은 피자가 US이고 소리에 대한 침은 CR이므로 반대이다. ④는 침은 반응이지 자극이 아니고 피자가 중성 자극도 아니다.</p>\n","src":"5장 p.8, 9","diff":2,"prof":false},{"id":"q_ch5_mc03","ch":"ch5","type":"mc","q":"<p>고전적 조건형성이 일어나기 위한 자극 제시 순서로 옳은 것은?</p>\n","choices":["<p>중립 자극을 먼저 제시하고 이어서 무조건 자극을 제시하는 것을 반복한다.</p>\n","<p>무조건 자극을 먼저 제시하고 이어서 중립 자극을 제시하는 것을 반복한다.</p>\n","<p>순서와 관계없이 두 자극이 제시되기만 하면 조건형성은 동일하게 일어난다.</p>\n","<p>조건 자극만 반복해서 제시하고 무조건 자극은 제시하지 않는다.</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>정답 ①. 교수 강조(9/29 28:08~29:08): 중립 자극이 먼저, 무조건 자극이 나중에 제시되어야 조건형성이 일어난다. ②는 슬라이드에서 무조건자극이 중립 자극 이전에 제시되면 조건형성이 거의 발생하지 않는다고 한 경우이다. ③은 제시 순서가 상당히 중요하다는 설명과 반대이다. ④는 조건 반응이 점차 감소하는 소거 절차이다.</p>\n","src":"5장 p.7, 10, 11","diff":2,"prof":true},{"id":"q_ch5_mc04","ch":"ch5","type":"mc","q":"<p>고전적 조건화에서 조건 반응의 소거에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>소거는 조건 반응을 영구적으로 완전히 제거하는 과정이다.</p>\n","<p>소거는 조건 자극과 무조건 자극을 계속 함께 제시할 때 일어난다.</p>\n","<p>소거 후 휴지 기간을 거쳐 조건 자극을 다시 제시하면 조건 반응이 부분적으로 나타나며, 이는 소거가 반응을 제거하기보다 억압하는 쪽에 가까움을 보여 준다.</p>\n","<p>소거된 조건 반응은 새로운 중성 자극과 연합했을 때에만 다시 나타날 수 있다.</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>정답 ③. 교수 강조(9/29 33:12): 소거는 조건 반응을 제거한다기보다 일시적으로 억압하는 현상에 가깝고, 휴지 기간 후 소거된 반응이 다시 나타나는 것이 그 증거이다. ①은 휴지 기간 후 반응이 재출현하므로 영구적 제거라는 서술이 틀리다. ②는 무조건 자극 없이 조건 자극만 제시할 때 소거가 일어나므로 틀리다(함께 제시하면 조건화가 유지·강화됨). ④는 소거된 반응은 새로운 연합과 무관하게 휴지기 후 조건 자극만 다시 제시해도 재출현하므로 틀리다.</p>\n","src":"5장 p.11","diff":2,"prof":true},{"id":"q_ch5_mc05","ch":"ch5","type":"mc","q":"<p>어릴 때 벌에 쏘여 벌을 무서워하게 된 영희는 이제 파리나 나방 같은 날벌레만 봐도 공포를 느낀다. 이 현상을 가장 잘 설명하는 개념은?</p>\n","choices":["<p>일반화</p>\n","<p>변별</p>\n","<p>소거</p>\n","<p>둔감화</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>정답 ①. 조건 자극(벌)과 유사한 속성의 자극에도 조건 반응(공포)을 보이는 것이 일반화이다(「자라 보고 놀란 가슴 솥뚜껑 보고 놀란다」). ②의 변별은 조건 자극과 무관한 자극을 구분하여 반응하지 않는 능력으로 반대 방향이다. ③은 무조건 자극 없이 조건 자극만 제시하여 조건 반응이 감소하는 절차인데 여기서는 그런 절차가 없고 오히려 공포가 유사 자극으로 확장되었다. ④는 같은 자극에 반복 노출되어 반응이 줄어드는 비연합 학습이므로 공포가 유사 자극으로 퍼지는 이 사례와 방향이 맞지 않는다.</p>\n","src":"5장 p.12","diff":2,"prof":false},{"id":"q_ch5_mc06","ch":"ch5","type":"mc","q":"<p>혐오 자극이 제거되어 행동 빈도가 증가한 사례로 옳은 것은?</p>\n","choices":["<p>지각을 한 학생에게 벌점을 주었더니 지각이 줄었다.</p>\n","<p>숙제를 하지 않은 아이의 게임 시간을 빼앗았더니 숙제를 하지 않는 행동이 줄었다.</p>\n","<p>두통이 심한 사람이 진통제를 먹고 통증이 사라지자 이후에도 두통이 올 때마다 진통제를 먹게 되었다.</p>\n","<p>발표를 잘해 칭찬을 받은 아이가 이후 발표를 더 자주 하게 되었다.</p>\n"],"answer":2,"alts":[],"answerHtml":"","solution":"<p>정답 ③. 통증이라는 혐오 자극이 제거되어 진통제를 먹는 행동이 증가했으므로 부적 강화이다. ①은 혐오 자극(벌점)을 가해 행동을 감소시키는 정적 처벌이다. ②는 보상(게임 시간)을 철회해 행동을 감소시키는 부적 처벌이다. ④는 보상(칭찬)을 제공해 행동을 증가시키는 정적 강화이다. 교수 강조(9/29): 부적 강화는 처벌이 아니며, 행동이 증가하면 강화, 감소하면 처벌이다.</p>\n","src":"5장 p.19, 24","diff":2,"prof":true},{"id":"q_ch5_mc07","ch":"ch5","type":"mc","q":"<p>약물 중독에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>약물 사용이 반복되는 것은 쾌감(정적 강화)만으로 설명되며, 정적 강화와 부적 강화는 동시에 발생할 수 없다.</p>\n","<p>약물 중독은 처벌로 행동이 감소하는 대표적 사례이다.</p>\n","<p>부적 강화는 행동 빈도를 감소시키는 기제이므로 약물 중독의 설명에 쓰이지 않는다.</p>\n","<p>약물 중독은 금단 증상이라는 혐오 자극이 제거되어 약물 사용이 늘어나는 부적 강화의 강력한 예이며, 정적 강화와 부적 강화는 동시에 발생할 수도 있다.</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>정답 ④. 슬라이드: 약물 중독자는 부적 강화의 강력한 예(Baker et al., 2004)이고 두 강화는 동시에 발생할 수 있다. 교수 강조(9/29 59:45~1:02:36): 도파민 등의 보상 기제도 있지만 실질적으로 끊지 못하는 것은 금단 증상의 고통을 제거하기 때문이다. ①은 정적·부적 강화가 동시에 발생할 수 있다는 점과 반대이다. ②는 약물 사용이 감소하는 것이 아니라 증가하는 현상이다. ③은 부적 강화는 행동 빈도를 증가시키는 기제이다.</p>\n","src":"5장 p.19","diff":2,"prof":true},{"id":"q_ch5_mc08","ch":"ch5","type":"mc","q":"<p>손다이크와 스키너에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>스키너는 개의 침 분비 실험을 통해 효과의 법칙을 처음 제안하였다.</p>\n","<p>손다이크의 고양이 문제상자 실험에서는 시행이 반복될수록 탈출 소요 시간이 줄었고, 스키너는 효과의 법칙을 행동 공학으로 발전시켜 행동 조성 개념을 제안하였다.</p>\n","<p>손다이크의 효과의 법칙에 따르면 보상이 뒤따르는 행동은 감소하고 처벌이 뒤따르는 행동은 증가한다.</p>\n","<p>스키너 상자에서 쥐가 레버를 누르는 횟수가 늘어나는 것은 고전적 조건화의 예이다.</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>정답 ②. 손다이크(1898)의 고양이 상자 실험은 시행 반복에 따라 효율성이 증대(탈출 시간 감소)함을 보였고, 스키너가 이를 행동 공학으로 발전시켜 행동 조성을 제안했다. ①의 개 침 분비 실험은 파블로프의 고전적 조건화이다. ③은 보상 뒤 행동은 증가(강화), 처벌 뒤 행동은 감소로 반대로 서술되었다. ④는 행동(레버 누름)과 결과(먹이)를 연합하는 조작적 조건화의 예이다.</p>\n","src":"5장 p.17, 18","diff":2,"prof":false},{"id":"q_ch5_mc09","ch":"ch5","type":"mc","q":"<p>SNS에서 좋아요 알림이 언제 올지는 알 수 없지만 가끔 시간이 지나면 알림이 온다. 그래서 사람들은 하루 종일 느리지만 꾸준히 알림을 확인하곤 한다. 이 사례에 해당하는 부분 강화계획은?</p>\n","choices":["<p>고정비율 계획</p>\n","<p>변동비율 계획</p>\n","<p>고정간격 계획</p>\n","<p>변동간격 계획</p>\n"],"answer":3,"alts":[],"answerHtml":"","solution":"<p>정답 ④. 가변적인 시간이 경과한 후 강화가 주어지는 변동간격 계획은 느리지만 매우 꾸준한 반응을 유도한다(예: SNS 좋아요 알림 확인). ①은 고정된 수의 반응 후 강화(커피 쿠폰 10회 1잔 무료)이다. ②는 랜덤한 수의 반응 후 강화로 소거가 잘 안 되며 슬롯머신, 낚시꾼이 예이다. ③은 고정된 시간 경과 후 강화로 보상 시점이 가까워질수록 반응이 급격히 증가하는 패턴(예: 정기 할인 행사)이다.</p>\n","src":"5장 p.22, 23","diff":2,"prof":false},{"id":"q_ch5_mc10","ch":"ch5","type":"mc","q":"<p>처벌과 교육에 관한 설명으로 옳은 것은? (APA, 2019)</p>\n","choices":["<p>처벌받은 행동은 망각되는 것이 아니라 억제되며, 이 일시적 억제가 부모의 처벌 행위를 부적으로 강화한다.</p>\n","<p>체벌은 적절한 행동의 방향을 명확히 알려 주어 행동을 효과적으로 감소시킨다.</p>\n","<p>범죄율 감소에 가장 실질적인 영향을 주는 것은 중형의 위협이다.</p>\n","<p>체벌은 아동의 공격성을 낮추는 효과가 있다.</p>\n"],"answer":0,"alts":[],"answerHtml":"","solution":"<p>정답 ①. 처벌은 행동을 망각시키지 않고 억제할 뿐이며, 아이가 잠시 조용해지면 부모의 처벌 행동이 부적으로 강화된다. ②는 체벌이 적절한 행동의 방향을 제공하지 않는다는 내용과 반대이다. ③은 범죄율 감소에 실질적 영향을 주는 것은 중형의 위협이 아니라 신속하고 확실한 처벌(검거율)이다. ④는 체벌이 공격을 시범 보임으로써 오히려 공격성 증대와 연계된다.</p>\n","src":"5장 p.24-26","diff":2,"prof":false},{"id":"q_ch5_mc11","ch":"ch5","type":"mc","q":"<p>거울 뉴런(mirror neuron)에 대한 설명으로 옳은 것은?</p>\n","choices":["<p>후두엽에 위치하며 시각 자극에만 반응하는 뉴런이다.</p>\n","<p>특정 행동을 수행할 때뿐 아니라 타인이 그 행동을 하는 것을 관찰할 때도 활성화되는 전두엽 뉴런으로, 모방과 관찰 학습의 신경 토대를 제공한다.</p>\n","<p>고전적 조건화에서 조건 자극과 무조건 자극의 연합을 저장하는 뉴런이다.</p>\n","<p>타인이 처벌을 받는 것을 볼 때에만 활성화되는 뉴런이다.</p>\n"],"answer":1,"alts":[],"answerHtml":"","solution":"<p>정답 ②. 리졸라티의 원숭이 연구에서 원숭이가 땅콩을 먹을 때 울리도록 한 버저가 다른 개체가 땅콩을 먹는 것을 볼 때도 울렸다. 거울 뉴런은 모방·관찰 학습, 언어 행동, 공감(마음 이론의 기반)에 관여한다. ①은 전두엽 뉴런이며 시각 자극에만 한정되지 않는다. ③은 거울 뉴런이 아니라 조건 자극–무조건 자극 연결을 담당하는 별도의 신경회로에 대한 내용이다. ④는 처벌 관찰에만 반응하는 것이 아니라 행동 관찰 전반에 반응한다.</p>\n","src":"5장 p.33, 35","diff":2,"prof":false},{"id":"q_ch5_mc12","ch":"ch5","type":"mc","q":"<p>고전적 조건화와 조작적 조건화의 비교로 옳은 것은?</p>\n","choices":["<p>고전적 조건화는 자발적 행동을, 조작적 조건화는 비자발적·자동적 반응을 다룬다.</p>\n","<p>일반화와 변별은 고전적 조건화에서만 나타나고 조작적 조건화에서는 나타나지 않는다.</p>\n","<p>고전적 조건화는 유기체가 제어할 수 없는 사건 간의 연합을, 조작적 조건화는 행동과 결과 간의 연합을 학습한다.</p>\n","<p>조작적 조건화의 획득은 중립 자극과 무조건 자극이 연합하여 이루어진다.</p>\n"],"answe
