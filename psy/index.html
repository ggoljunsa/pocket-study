<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--acc2:#dbeafe;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--tab:#fff;--r:14px;--fs:17px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e6e8ee;--mute:#9aa3b2;--line:#262b36;--acc:#7dd3fc;--acc2:#12304a;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--tab:#12151b}}
:root[data-theme=dark]{--bg:#0f1115;--card:#171a21;--ink:#e6e8ee;--mute:#9aa3b2;--line:#262b36;--acc:#7dd3fc;--acc2:#12304a;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--tab:#12151b}
:root[data-theme=light]{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--acc2:#dbeafe;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--tab:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;line-height:1.55;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#app{max-width:760px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:1.35rem;margin:6px 0 2px}h2{font-size:1.15rem;margin:18px 0 8px}h3{font-size:1.02rem;margin:14px 0 6px}
.mute{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme=dark] button.acc,html:not([data-theme=light]) button.acc{color:#06202f}
@media(prefers-color-scheme:light){html:not([data-theme=dark]) button.acc{color:#fff}}
button.sm{min-height:34px;padding:5px 10px;font-size:.88rem;border-radius:10px}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.chips button{white-space:nowrap;min-height:36px;padding:6px 12px;border-radius:999px;font-size:.9rem}
.chips button.on{background:var(--acc2);border-color:var(--acc);color:var(--ink)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--tab);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
#tabs button{flex:1;border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mute);padding:8px 0 6px;min-height:56px}
#tabs button.on{color:var(--acc);font-weight:700}
#tabs .ic{font-size:1.25rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.block{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0}
.block .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.9rem;margin-top:2px}
.block.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.block.done .t{text-decoration:line-through;color:var(--mute)}
.block .t{font-weight:600}.block .n{font-size:.86rem;color:var(--mute)}
.block .min{font-variant-numeric:tabular-nums;color:var(--mute);font-size:.86rem;flex:none}
.block.cur{background:var(--acc2);margin:0 -16px;padding:10px 16px;border-radius:10px}

<script id="data" type="application/json">{"course":{"id":"psy","title":"심리학으로의 여행 중간고사","subtitle":"심리학의 이해 · Prof. 이소영","exam":"중간고사 · 2026-10-13(화) 14:30–16:00 (90분) · E1-101 컨벤션홀 A구역 · 객관식 25 + 단답형(명칭 쓰기) 5 · 서막~6장 (1장은 슬라이드 29까지)","chapters":[{"id":"ch0","label":"서막 심리학 이야기"},{"id":"ch1","label":"1장 심리과학을 비판적으로 생각하기"},{"id":"ch2","label":"2장 마음의 생물학과 의식"},{"id":"ch3","label":"3장 일생에 걸친 발달"},{"id":"ch4","label":"4장 감각과 지각"},{"id":"ch5","label":"5장 학습"},{"id":"ch6","label":"6장 기억"}],"tips":["<p>필기구는 검은 볼펜(지워지지 않는 펜)만. 빨간 펜·연필·샤프 금지.</p>\n","<p>고사장은 평소 강의실이 아니라 E1-101 컨벤션홀 A구역.</p>\n","<p>단답형은 명칭 쓰기만 나온다 — 개념을 서술하는 장문형 답안은 요구되지 않는다.</p>\n","<p>1장은 슬라이드 29(IRB 연구 승인 절차)까지만 범위. 30번 이후 통계적 추리는 기말 범위.</p>\n","<p>비슷한 개념 구분에 유의: 고전적 vs 조작적 조건형성, 순행 vs 역행 간섭, 동화 vs 조절, 감각 vs 지각, 권위적 vs 권위주의적 양육.</p>\n","<p>슬라이드 오탈자 함정 주의: 4장 &#39;우반구&#39;는 좌반구가 맞고, 6장 &#39;72개&#39;는 7±2가 맞고, 5장 &#39;Operational Conditioning&#39;은 Operant가 맞다.</p>\n","<p>상관≠인과, 조작·통제 가능한 연구법은 실험법뿐 — 교수가 여러 번 강조한 포인트.</p>\n"]},"reading":[{"id":"summary","title":"⭐ 중간고사 통합 요약 (서막~6장)","desc":"시험 직전 전 범위 압축 훑기 — 단답형 후보표, 교수 강조 총정리, 장별 헷갈리는 개념 대비","ch":"all","min":40,"html":"<h1>심리학으로의 여행 — 중간고사 통합 요약</h1>\n<p>심리학으로의 여행 (Prof. 이소영) · 마이어스 심리학 개론 13판 · 범위 서막–6장</p>\n<blockquote>\n<p>이 문서는 장별 정리본(<code>1주차_서막_정리.md</code> … <code>7주차_6장_정리.md</code>)을 <strong>시험 직전용으로 압축</strong>한 것입니다. 개념이 막히면 해당 장 정리본의 <code>p.N</code> 절을 보세요. ⭐가 많을수록 출제 가능성이 높습니다. 굵은 글씨는 <strong>단답형으로 쓸 수 있어야 하는 명칭</strong>입니다.</p>\n</blockquote>\n<h2>0. 시험 한눈에 보기</h2>\n<table>\n<thead>\n<tr>\n<th>항목</th>\n<th>내용</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>일시</td>\n<td><strong>10/13(화) 14:30–16:00 (90분)</strong></td>\n</tr>\n<tr>\n<td>장소</td>\n<td><strong>E1-101 컨벤션홀 A구역</strong> (평소 강의실 아님)</td>\n</tr>\n<tr>\n<td>구성</td>\n<td><strong>객관식 25 + 단답형 5 = 30문항</strong> (0922 녹음 2:10:21)</td>\n</tr>\n<tr>\n<td>단답형</td>\n<td><strong>명칭 쓰기만.</strong> 서술·장문형 없음 (0929 녹음 00:00)</td>\n</tr>\n<tr>\n<td>범위</td>\n<td>서막–6장. <strong>1장은 슬라이드 29번(IRB)까지</strong>, 30번부터 나오는 통계는 제외 (0922 녹음 2:12:52)</td>\n</tr>\n<tr>\n<td>필기구</td>\n<td><strong>빨간 펜·연필·샤프 금지</strong> → 검은 볼펜</td>\n</tr>\n<tr>\n<td>배점</td>\n<td>중간 35 / 기말 35 / 레포트 15 / 출석 15</td>\n</tr>\n</tbody></table>\n<h2>0-1. 무엇이 나올까 — 교수 강조와 출제 예상 총정리</h2>\n<p><strong>단답형 5문항 후보 (장별 최우선 명칭)</strong> — 이 목록은 설명만 보고 명칭이 바로 나와야 합니다.</p>\n<table>\n<thead>\n<tr>\n<th>장</th>\n<th>최우선 명칭</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>서막</td>\n<td>구조주의·기능주의·행동주의·인본주의·인지혁명, 내성법, <strong>생물심리사회적 접근법</strong>, 선천성-후천성 논제</td>\n</tr>\n<tr>\n<td>1장</td>\n<td><strong>후견 편향</strong>, <strong>과신</strong>, 메타인지, 조작적 정의, 사례 연구·자연 관찰·사회조사, 무선 표집, <strong>착각 상관</strong>, 제3의 변인, 무선 할당, 이중맹목, <strong>가짜약 효과</strong>, 고지된 동의, 디브리핑, IRB</td>\n</tr>\n<tr>\n<td>2장</td>\n<td>활동 전위, 실무율, 역치, 신경전달물질, <strong>신경 가소성</strong>, 편도체·해마·시상·시상하부·소뇌, 연합 영역, 뇌량·분할 뇌, 선택적 주의, <strong>칵테일 파티 효과</strong>, <strong>변화맹</strong>, <strong>이중 처리</strong></td>\n</tr>\n<tr>\n<td>3장</td>\n<td><strong>대상 영속성</strong>, 보존, 자기중심성, 동화·조절, <strong>마음 이론</strong>, 도약대(비고츠키), 애착, <strong>각인</strong>, 안정/불안정 애착, 권위적/권위주의적/허용적 양육, 콜버그 수준, 에릭슨 위기, 사회적 시계</td>\n</tr>\n<tr>\n<td>4장</td>\n<td><strong>상향 처리/하향 처리</strong>, 변환, 절대 역치, 차이 역치(<strong>베버 법칙</strong>), 신호탐지 이론, 점화, <strong>감각 순응</strong>, <strong>지각 갖춤새</strong>, 원추체/간상체, 자질 탐지기, 게슈탈트, 양안 단서(망막 부등·수렴), 공감각, ESP</td>\n</tr>\n<tr>\n<td>5장</td>\n<td>민감화·둔감화, <strong>고전적 조건화</strong>(NS·US·UR·CS·CR), 고차 조건형성, <strong>소거</strong>, <strong>자발적 회복</strong>, 일반화·변별, <strong>효과의 법칙</strong>, <strong>행동 조성</strong>, <strong>계기적 근사법</strong>, <strong>정적/부적 강화</strong>, 정적/부적 처벌, 강화 계획 4종, <strong>관찰 학습</strong>, <strong>거울 뉴런</strong></td>\n</tr>\n<tr>\n<td>6장</td>\n<td>앳킨슨-시프린 모형, <strong>작업 기억</strong>(중앙 집행기·음운 루프·시공간 잡기장), 외현/암묵 기억, 매직 넘버 7, <strong>청크화</strong>, <strong>간격두기 효과</strong>, <strong>검증 효과</strong>, 자기참조 효과, 계열 위치(초두·최신) 효과, 순행/역행 간섭, <strong>오정보 효과</strong>, 재응고화</td>\n</tr>\n</tbody></table>\n<p><strong>교수가 녹음에서 직접 강조한 것 (객관식 단골 후보)</strong></p>\n<ol>\n<li><strong>서막</strong> — &quot;어느 하나의 요인만으로는 설명하지 않는다&quot; = 생물심리사회적 접근(0825 1:44:27). 선천성-후천성의 결론은 &quot;둘 다 중요&quot;. 컴퓨터 메타포에서 SSD=장기 기억, RAM=작업 기억.</li>\n<li><strong>1장</strong> — <strong>상관은 인과가 아니다</strong>(&quot;굉장히 중요한 사안&quot;, 0901 1:29:10). 표본은 크기보다 <strong>대표성</strong>. 통제·조작이 가능한 방법은 <strong>실험법 하나뿐</strong>. IRB는 모집 인원 근거와 보상 재원을 따짐.</li>\n<li><strong>2장</strong> — 자극 강도는 <strong>발화 빈도</strong>로 표상(실무율). <strong>시상은 후각만 거치지 않음</strong>. 연합 영역은 관찰 가능한 반응을 직접 내지 않음. 손상법은 가장 오래된 방법이며 인과 추론이 가능함. EEG·ERP는 시간 해상도가 높음. 역행성 기억상실은 「제이슨 본」, 순행성은 「메멘토」.</li>\n<li><strong>3장</strong> — 피아제는 물리적 환경, <strong>비고츠키는 사회적 환경</strong>. 마음 이론이 발달해야 사회성(공감)이 생김. <strong>권위적 vs 권위주의적 용어 혼동 주의</strong>. 양육 방식과 자녀 특성은 상관이지 인과가 아님. 거울 실험으로 자기 개념 확인(15–18개월). 노화하면 회상은 떨어지고 재인은 유지됨. 성공적 노화는 세 요인이 모두 필요.</li>\n<li><strong>4장</strong> — 역치가 낮다고 항상 좋지는 않음. <strong>얼굴 13개 그림 = 하향 처리</strong>. 통증은 하향 처리의 극적인 예. <strong>게슈탈트는 타고난 상향 처리 쪽</strong>(&quot;많이 헷갈리는 부분&quot;). <strong>양안 단서(망막 부등·수렴)와 단안 단서 구분</strong>.</li>\n<li><strong>5장</strong> — NS가 먼저, US가 나중. <strong>소거는 제거가 아니라 억압</strong>이며 자발적 회복이 그 증거. <strong>부적 강화 ≠ 처벌</strong>. <strong>약물 중독 = 금단 제거에 의한 부적 강화</strong>. 정적·부적 강화는 동시에 일어날 수 있음.</li>\n<li><strong>6장</strong> — 10/6 수업 전이라 녹음이 없음. 교수가 &quot;공부법은 기억 챕터에서&quot;라고 했으므로 <strong>간격두기 효과·검증 효과·처리 수준</strong>에 무게를 둠. 첫 수업(0825)에서도 검증 효과와 분산 학습을 학습법으로 조언함.</li>\n</ol>\n<blockquote>\n<p>⚠️ 9/29 수업 후반부(교수가 서막–3장 중요 포인트를 정리한다고 한 부분)와 10/6 수업(6장, 4–6장 정리)은 아직 녹음이 없습니다. 녹음이 생기면 이 절을 갱신합니다.</p>\n</blockquote>\n<hr>\n<h2>서막 심리학 이야기</h2>\n<p>심리학은 <strong>행동과 심적 과정의 과학</strong>이며, 분트의 실험실(1879)에서 출발해 구조주의 → 기능주의 → 행동주의·정신분석·인본주의 → 인지혁명으로 발전했고, 오늘날은 생물심리사회적 접근으로 다각도로 마음을 설명한다.</p>\n<h3>핵심 개념</h3>\n<ul>\n<li>⭐ <strong>심리학</strong> = 마음이 어떻게 작동하고 행동으로 나타나는가를 연구 = 행동과 심적 과정의 과학. 마음 = 인지·정서·신경활동·성격을 총괄하는 시스템.</li>\n<li>⭐⭐ <strong>분트(Wundt)</strong>: 1879 라이프치히 최초 실험실. <strong>공이치기 실험</strong> — 소리 듣고 바로 버튼(약 0.1초) vs 소리를 자각하고 버튼(약 0.2초) → 심적 과정의 계량화.</li>\n<li>⭐⭐⭐ <strong>구조주의</strong>(분트·티치너): 마음 = 감각 요소의 복합체, **내성법(introspection)**으로 구성 요소 분석. 한계 = 자기보고라 신뢰도 낮음.</li>\n<li>⭐⭐⭐ <strong>기능주의</strong>(윌리엄 제임스): 다윈 진화론의 영향, 마음·의식은 생존을 위한 <strong>적응적 기능</strong>(과거 회상·현재 적응·미래 계획).</li>\n<li>⭐⭐⭐ <strong>행동주의</strong>(왓슨·스키너): 관찰 가능한 행동만 연구. <strong>고전적 조건화</strong>(중립 자극 + 무조건 자극 → 조건 자극, 파블로프), <strong>조작적 조건화</strong>(강화/처벌로 행동 빈도 조절, 스키너).</li>\n<li>⭐⭐ <strong>정신분석</strong>(프로이트): 아동기 무의식적 사고가 행동에 영향, 방어 기제. <strong>인본주의</strong>(로저스·매슬로우): 인간은 주체적 존재, <strong>자아실현</strong> 추구, 앞의 두 관점이 인간을 제한적으로 본다고 비판.</li>\n<li>⭐⭐⭐ <strong>인지혁명</strong>(1960년대): 컴퓨터 개발 → <strong>정보 처리 접근</strong>, <strong>컴퓨터 메타포</strong>(입력=감각 기관, CPU=뇌, SSD=장기 기억, RAM=작업 기억, 출력=행동). 마음으로의 회귀.</li>\n<li>⭐⭐ <strong>인지심리학</strong> + 뇌과학 → <strong>인지신경과학</strong>(EEG·fMRI·신경 조절).</li>\n<li>⭐⭐⭐ <strong>선천성-후천성 논제</strong>: 타고난 것 vs 학습. 결론 = 둘 다 중요. <strong>진화심리학</strong>(공통 생물학적 특성·보편성), <strong>행동유전학</strong>(유전자·환경 차이). 일란성 쌍둥이(유전 동일), 이란성(기준점). 다윈 『종의 기원』(1859) 자연 선택설.</li>\n<li>⭐⭐ 선천성 예시 = <strong>에크만의 6가지 기본 감정</strong>(기쁨·슬픔·분노·공포·혐오·놀람, 단서는 눈). 후천성 예시 = 몽골어(녹·청 세분화) vs 중국어(통일) 색 지각. 문화 예시 = 일본 <strong>메이와쿠</strong>(다테마에·혼네).</li>\n<li>⭐⭐⭐ <strong>생물심리사회적 접근법</strong>: 생물학적(유전자·자연선택) / 심리적(정서·인지·기대) / 사회문화적(타인 기대·집단·매체) 수준의 통합. 하나로는 설명 불가.</li>\n<li>⭐⭐⭐ <strong>7가지 이론적 조망</strong>: 신경과학·진화론·행동유전학·정신역동·행동주의·인지심리학·사회문화 (분노 예시: 신경회로 / Fight or Flight / 무의식적 적대감 / 상황 해석 / 문화별 표현).</li>\n<li>⭐⭐⭐ <strong>하위 분야</strong>: 기초(생물심리학/신경과학, 발달, 인지, 성격, 사회) vs 응용(산업조직, 상담, 임상, 정신의학 — 약물 병행).</li>\n<li>⭐ 학습 팁: <strong>검증 효과</strong>(직접 문제 출제해 풀기), <strong>분산 학습</strong>(공부 시간 분산).</li>\n</ul>\n<h3>헷갈리는 개념 대비</h3>\n<table>\n<thead>\n<tr>\n<th>구분</th>\n<th>구조주의</th>\n<th>기능주의</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>핵심 질문</td>\n<td>마음은 무엇으로 이루어졌나</td>\n<td>마음은 무슨 일을 하나</td>\n</tr>\n<tr>\n<td>학자</td>\n<td>분트, 티치너</td>\n<td>윌리엄 제임스</td>\n</tr>\n<tr>\n<td>방법·배경</td>\n<td>내성법</td>\n<td>다윈의 진화론</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>구분</th>\n<th>고전적 조건화</th>\n<th>조작적 조건화</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>연합</td>\n<td>중립 자극 + 무조건 자극</td>\n<td>행동 + 그 결과(강화/처벌)</td>\n</tr>\n<tr>\n<td>학자·예</td>\n<td>파블로프의 개(종소리)</td>\n<td>스키너</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>구분</th>\n<th>진화심리학</th>\n<th>행동유전학</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>초점</td>\n<td>공통 생물학적 특성·<strong>보편성</strong></td>\n<td>유전자·환경 차이로 인한 <strong>개인차</strong></td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>학파</th>\n<th>인간관</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>정신분석</td>\n<td>무의식에 좌우</td>\n</tr>\n<tr>\n<td>행동주의</td>\n<td>자극에만 반응</td>\n</tr>\n<tr>\n<td>인본주의</td>\n<td>주체적, 자아실현 추구</td>\n</tr>\n</tbody></table>\n<h3>출제 예상 (단답형 명칭)</h3>\n<ol>\n<li>1879년 최초의 심리학 실험실을 세운 학자 → <strong>빌헬름 분트</strong></li>\n<li>마음을 감각 요소의 복합체로 보고 분해하려 한 학파 → <strong>구조주의</strong></li>\n<li>자신의 경험을 지정된 기준에 따라 스스로 보고하는 방법 → <strong>내성법(introspection)</strong></li>\n<li>마음과 의식의 적응적 기능을 강조하며 진화론의 영향을 받은 학파 → <strong>기능주의</strong></li>\n<li>관찰 가능한 행동만 연구해야 한다는 관점 → <strong>행동주의</strong></li>\n<li>중립 자극이 무조건 자극과 짝지어져 조건 자극이 되는 학습 → <strong>고전적 조건화</strong></li>\n<li>강화와 처벌로 행동 빈도를 조절하는 학습 → <strong>조작적 조건화</strong></li>\n<li>인간이 자아실현을 추구하는 주체적 존재라는 관점 → <strong>인본주의 심리학</strong></li>\n<li>컴퓨터 작동에서 영감을 받아 마음을 입력-처리-산출로 보는 비유 → <strong>컴퓨터 메타포</strong></li>\n<li>1960년대 내면 과정 연구로의 패러다임 전환 → <strong>인지혁명</strong></li>\n<li>인지심리학과 뇌과학이 융합해 뇌전도·뇌영상을 쓰는 분야 → <strong>인지신경과학</strong></li>\n<li>타고난 것과 환경 학습 중 무엇이 심리의 기원인가 하는 논쟁 → <strong>선천성-후천성 논제</strong></li>\n<li>문화와 무관하게 6가지 감정이 보편적이라 제안한 이론 → <strong>에크만의 기본 감정</strong></li>\n<li>생물학적·심리적·사회문화적 수준의 통합으로 설명하는 접근 → <strong>생물심리사회적 접근법</strong></li>\n<li>심적 위기 상황에 처한 개인의 대처를 지원하는 응용 분야 → <strong>상담심리학</strong></li>\n</ol>\n<h3>출제 예상 (객관식 포인트)</h3>\n<ul>\n<li>구조주의 vs 기능주의 학자·방법 매칭(분트/티치너=구조·내성법, 제임스=기능·진화론) — 서로 바꿔 놓는 함정.</li>\n<li>분트 실험의 0.1초(즉각 반응) vs 0.2초(자각 후 반응) 배정 함정.</li>\n<li>행동주의 비판 대상: 구조주의·기능주의가 <strong>내부 요소</strong>를 탐구 → 행동주의는 관찰 가능한 행동. 인본주의는 정신분석·행동주의를 <strong>제한적</strong>이라 비판.</li>\n<li>컴퓨터 메타포 대응: SSD=장기 기억, RAM=작업(단기) 기억, 감각 기관=입력 — 뒤바꿔 놓는 오답.</li>\n<li>에크만 6가지에 <strong>불안·수치심 등은 없음</strong>(기쁨·슬픔·분노·공포·혐오·놀람). 몽골어=세분화, 중국어=통일 함정.</li>\n<li>진화심리학=보편성 / 행동유전학=차이. 쌍둥이 연구는 선천·후천 <strong>모두</strong> 중요하다는 결론.</li>\n<li>사회문화적 수준=개인 <strong>외부</strong> 요인 / 심리적 수준=개인 <strong>내면</strong> 기제. 정신의학만 약물 치료 병행.</li>\n</ul>\n<h3>교수 강조</h3>\n<ul>\n<li>「동일한 행동이라 하더라도 어느 하나의 요인만으로는 설명하지 않는다 — 가장 중요한 포인트」 (0825 1:44:27, 생물심리사회적 수준)</li>\n<li>「고전적·조작적 조건화 모두 자극과 행동 반응에만 중점을 둔다」 (0825 45:11)</li>\n<li>「타고난 것이든 배운 것이든 둘 다 중요하다」가 선천성-후천성의 결론 (0825 1:28:35)</li>\n<li>내성법은 자유 기술이 아니라 훈련된 엄격한 보고 (0825 33:48–35:30), 분트의 최대 업적은 실험실 설립과 심적 과정의 계량화 (0825 31:54)</li>\n<li>인지혁명 정의 = 「심적 과정에 대한 초기 관심사를 되돌리고 과학적 연구 방법론을 적용하는 패러다임 전환」 (0825 55:13)</li>\n</ul>\n<hr>\n<h2>1장 심리과학을 비판적으로 생각하기 (슬라이드 1–29만 출제, 30번 통계 이후 제외)</h2>\n<p>심리과학은 상식·직관의 함정(후견 편향, 과신, 무선 사건에서 질서 지각, 탈진실 취약성)을 넘어, 이론 → 가설 → 설계 → 분석의 과학적 방법과 기술적 방법·상관·실험이라는 연구 방법, 그리고 연구 윤리(IRB)로 마음에 대한 검증된 결론을 얻는다.</p>\n<h3>핵심 개념</h3>\n<ul>\n<li>⭐⭐ <strong>심리과학의 목표</strong>: 과학적·<strong>재현 가능한</strong> 설명, 견해와 검증된 결론 구분, 원인→결과의 <strong>인과성 탐구</strong>. 반복된 진술·관찰은 진실이 아니다(반복은 더 참처럼 보이게 함, Fazio).</li>\n<li>⭐⭐⭐ <strong>후견 편향</strong>: 결과를 안 뒤 &quot;그럴 줄 알았다&quot;며 예측할 수 있었다고 믿음. 연령·문화 무관 보편적. 예: 콜럼버스의 달걀, 월드컵 결과.</li>\n<li>⭐⭐⭐ <strong>과신</strong>: 실제보다 더 안다고 믿음. <strong>테틀록</strong>: 전문가 80% 확신 사건의 적중률 40% 이하, <strong>슈퍼 예측자</strong>는 극소수. 단어 완성 과제(Goranson, 1978).</li>\n<li>⭐⭐ <strong>메타인지</strong> = 인지에 대한 인지(Flavell, 1979). 발달하면 후견 편향·과신 감소.</li>\n<li>⭐⭐ <strong>무선적 사건에서 질서 지각</strong>: 무선을 무선이 아닌 것으로 봄 → <strong>착각 상관</strong>·<strong>평균으로의 회귀</strong>와 연관. 지각의 집단화(체제화) 원리.</li>\n<li>⭐⭐ <strong>탈진실(post-truth)</strong>: 2017 옥스퍼드 올해의 단어. 범죄율(10명 중 7명 증가 응답, 실제 감소), 이민자 투옥 가능성 <strong>44% 낮음</strong>, 정당 편향성.</li>\n<li>⭐⭐⭐ <strong>취약성 4요인</strong>: ① 거짓뉴스(트위터 6%, 진실보다 빠르게 확산) ② 반복(삼인성호, 사회적 동조) ③ <strong>강력한 사례의 가용성</strong>(<strong>가용성 어림법</strong>, <strong>인지적 구두쇠</strong>) ④ <strong>집단 정체성</strong>(내집단/외집단 편향 → <strong>확증 편향</strong>).</li>\n<li>⭐⭐⭐ <strong>연구 과정</strong>: 현상 인식 → <strong>이론</strong>(관찰을 체제화·예측하는 통합적 설명) → <strong>가설</strong>(검증 가능한 예측, <strong>조작적 정의</strong>) → 연구 설계·집행 → 분석·해석(지지/반박/확장). 사전 등록.</li>\n<li>⭐⭐⭐ <strong>기술적 방법</strong>(설명 불가, 통제 없음): <strong>사례 연구</strong>(소수 심층, 일반화 곤란), <strong>자연 관찰</strong>(자연 상태 기록, 빅데이터), <strong>사회조사</strong>(자기보고, 응답 위장, <strong>말표현 효과</strong>). <strong>무선 표집</strong> — 표본 크기보다 <strong>대표성</strong>.</li>\n<li>⭐⭐⭐ <strong>상관</strong>: 두 변인이 함께 변하는 정도(-1~1). 예측은 가능, <strong>인과 입증 불가</strong>, <strong>제3의 변인</strong>(식중독-아이스크림-날씨). <strong>착각 상관</strong> / <strong>평균으로의 회귀</strong>(극단값이 평균으로).</li>\n<li>⭐⭐⭐ <strong>실험법</strong>: 처치 + 통제로 <strong>인과</strong> 검증. <strong>실험 조건</strong> vs <strong>통제 조건</strong>, <strong>무선 할당</strong>(개인차 최소화). <strong>가짜약(위약) 조건</strong>, <strong>이중 은폐</strong>(참가자와 실험자 모두 모름). 약점: 일반화 한계, 윤리적 제약.</li>\n<li>⭐⭐⭐ <strong>연구 윤리</strong>: 뉘른베르크 강령·헬싱키 선언·벨몬트 보고서. <strong>고지된 동의</strong>, 상해로부터 보호, 개인 정보 비밀, <strong>디브리핑</strong>, <strong>IRB</strong> 사전 승인. 심의: 연구 방법, 모집 인원(객관적 근거, 초과 금지), 보상(금액·재원), 개인 정보 범위·보호, 위험 요소.</li>\n</ul>\n<h3>헷갈리는 개념 대비</h3>\n<table>\n<thead>\n<tr>\n<th>구분</th>\n<th>기술적 방법</th>\n<th>상관 연구</th>\n<th>실험</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>목적</td>\n<td>행동 관찰·기록(현상 기술)</td>\n<td>변인이 서로를 예측하는 정도</td>\n<td>원인과 결과 탐색(인과)</td>\n</tr>\n<tr>\n<td>처치</td>\n<td>없음</td>\n<td>없음</td>\n<td>하나 이상의 독립변인</td>\n</tr>\n<tr>\n<td>약점</td>\n<td>변인 통제 불가, 사례가 오도</td>\n<td>원인·결과 명세 불가</td>\n<td>일반화 어려움, 윤리적 제약</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>구분</th>\n<th>무선 표집</th>\n<th>무선 할당</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>대상</td>\n<td>모집단 → 표본 뽑기</td>\n<td>뽑힌 참가자 → 실험/통제 조건 배정</td>\n</tr>\n<tr>\n<td>목적</td>\n<td>대표성</td>\n<td>개인차 영향 최소화</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>구분</th>\n<th>착각 상관</th>\n<th>평균으로의 회귀</th>\n<th>후견 편향</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>핵심</td>\n<td>없는 관계를 있다고 지각</td>\n<td>극단 뒤 평균 쪽으로 복귀</td>\n<td>결과 안 뒤 예측 가능했다고 믿음</td>\n</tr>\n<tr>\n<td>예</td>\n<td>우연의 일치에 의미 부여</td>\n<td>야구팀 비난 후 다음 경기 호전</td>\n<td>콜럼버스의 달걀</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>구분</th>\n<th>가짜약(위약) 조건</th>\n<th>이중 은폐</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>핵심</td>\n<td>처치를 받았다고 착각하게 하는 조건</td>\n<td>참가자와 실험자 모두 조건을 모름</td>\n</tr>\n</tbody></table>\n<h3>출제 예상 (단답형 명칭)</h3>\n<ol>\n<li>결과를 알고 난 뒤 자신이 예측할 수 있었다고 믿는 경향 → <strong>후견 편향</strong></li>\n<li>실제로 아는 것보다 더 많이 안다고 생각하는 경향 → <strong>과신</strong></li>\n<li>인지에 대한 인지, 자기 사고 과정을 아는 능력 → <strong>메타인지</strong></li>\n<li>떠올리기 쉬운 강한 사례를 중심으로 판단하는 사고 방식 → <strong>가용성 어림법</strong></li>\n<li>인간은 정신 자원 소모를 최소화하려 한다는 입장 → <strong>인지적 구두쇠</strong></li>\n<li>자신의 견해에 맞는 정보만 선택적으로 취득하는 경향 → <strong>확증 편향</strong></li>\n<li>개인의 신념이 객관적 사실보다 더 큰 영향을 미치는 현상·시대 → <strong>탈진실</strong></li>\n<li>이론에서 도출한 검증 가능한 예측 → <strong>가설</strong></li>\n<li>측정할 수 없는 개념을 계량 가능한 형태로 정확히 진술하는 것 → <strong>조작적 정의</strong></li>\n<li>소수의 개인·집단을 집중 관찰하고 심층 분석하는 방법 → <strong>사례 연구</strong></li>\n<li>문항의 어휘에 따라 응답이 달라지는 효과 → <strong>말표현 효과</strong></li>\n<li>모집단의 구성원이 동등한 기회를 갖도록 표본을 뽑는 원칙 → <strong>무선 표집</strong></li>\n<li>실제로는 관계가 없는데 있다고 지각하는 현상 → <strong>착각 상관</strong></li>\n<li>극단적 사건 뒤에 평균 쪽으로 되돌아오는 경향 → <strong>평균으로의 회귀</strong></li>\n<li>참가자를 실험 조건과 통제 조건에 무작위로 배정하는 기법 → <strong>무선 할당</strong></li>\n<li>참가자와 실험자 모두 가짜약 조건을 모르는 절차 → <strong>이중 은폐(double-blind)</strong></li>\n<li>인간·동물 대상 연구의 윤리적 적합성을 사전 검토하는 기관 → <strong>기관 생명 윤리 위원회(IRB)</strong></li>\n</ol>\n<h3>출제 예상 (객관식 포인트)</h3>\n<ul>\n<li><strong>상관 ≠ 인과</strong>: 상관 연구와 기술적 방법은 원인을 밝히지 못함. 인과 검증은 실험만.</li>\n<li>무선 <strong>표집</strong> vs 무선 <strong>할당</strong> 뒤바꿈 함정. 표본이 커도 대표성이 없으면 좋은 표본이 아님.</li>\n<li>사회조사의 약점(응답 위장, 말표현 효과) vs 사례 연구의 약점(일반화 곤란) vs 실험의 약점(일반화·윤리) 매칭.</li>\n<li>취약성 요인 4가지 중 사례 매칭: 자극적 뉴스 하나가 위험 인식을 왜곡 = 강력한 사례의 가용성, 같은 편끼리만 소통 = 집단 정체성/확증 편향.</li>\n<li>과신 vs 후견 편향: 예측 전 확신(과신)과 결과 후 &quot;알았다&quot;(후견) 구분. 테틀록 수치(80% 확신 → 40% 이하).</li>\n<li>이론(통합적 설명) vs 가설(검증 가능한 예측) 구분. 조작적 정의는 선행 문헌 근거.</li>\n<li>연구 윤리: 승인 전 모집 금지, 승인 인원 초과 모집 금지(증원은 변경 심의), 연구 중단 요구 시 즉시 중단, 기만 후 디브리핑. 벨몬트 = 1970년대 터스키기 실험.</li>\n<li><strong>통계(p.30 이후: 평균·중앙값, 표준편차, 영가설, p-value)는 출제 안 됨</strong> — 보기로도 나오지 않음.</li>\n</ul>\n<h3>교수 강조</h3>\n<ul>\n<li>「상관은 인과성을 입증하는 지표가 아니다 — 굉장히 중요한 사안」 (0901 1:29:10)</li>\n<li>「표본 수가 큰 것보다 대표성을 띠는 표본이 더 중요」 (0901 1:23:51)</li>\n<li>「이 소개 범위에서 직접적인 통제·조작을 가하는 연구 방법은 실험법 딱 하나」 (0901 1:17:18)</li>\n<li>조작적 정의: 가설은 측정 가능한 형태로 재정립, 수면 박탈 = 24시간 수면 1시간 미만 (0901 1:03:28)</li>\n<li>IRB가 특히 중시하는 심의 항목(붉은 글씨) = 모집 인원수와 객관적 근거, 참가자 보상 재원 (0901 1:59:03–2:01:20)</li>\n<li>후견 편향은 보편적(&quot;역시 이렇게 될 줄 알았어&quot;를 한 번이라도 했다면) (0901 12:18), 네 취약성 요인은 서로 맞물려 작동 (0901 55:10)</li>\n<li>시험 범위: 1장은 29번 슬라이드까지 (0922 2:12:52)</li>\n</ul>\n<hr>\n<h2>2장 마음의 생물학과 의식</h2>\n<p><strong>요지: 마음은 뉴런의 전기·화학 신호와 뇌 구조의 활동으로 일어나며, 뇌 연구법은 시간/공간 해상도로 구분되고, 의식은 선택적 주의·이중 처리·수면으로 설명된다.</strong></p>\n<h3>핵심 개념</h3>\n<ul>\n<li><strong>골상학(프란츠 갈)</strong>: 두개골 돌출부 = 성격·능력. 틀렸지만 <strong>기능 국재화</strong> 가정은 현대 인지신경과학과 유사.</li>\n<li>⭐⭐ <strong>신경 가소성(neuroplasticity)</strong>: 손상 후 재조직·경험으로 뇌가 변함. 영국 <strong>택시 운전사의 해마</strong>가 버스 운전사보다 큼(Maguire 2006).</li>\n<li>⭐⭐⭐ <strong>활동 전위</strong>: 안정 전위(외부 +, 내부 −) → <strong>탈분극화</strong> → <strong>역치</strong> 초과 → 발생 → <strong>불응기</strong>. <strong>실무율(all-or-none)</strong>: 크기 동일, 자극이 강하면 <strong>발화율</strong>만 증가.</li>\n<li>뉴런 안 = 전기 신호, 뉴런 사이(시냅스) = <strong>신경전달물질</strong>(방출 → 수용 → <strong>재흡수</strong>). 재흡수 차단 → 우울 완화(약). <strong>수초</strong> 손상 = <strong>다발성 경화증</strong>.</li>\n<li>⭐⭐⭐ <strong>신경전달물질</strong>: <strong>ACh</strong>(근육·학습·기억; 알츠하이머), <strong>도파민</strong>(과잉 조현병 / 부족 파킨슨), <strong>세로토닌</strong>(부족 우울), <strong>노르에피네프린</strong>(각성), <strong>글루타메이트</strong>(흥분성), <strong>GABA</strong>(억제성; 부족 경련·불면), <strong>엔도르핀</strong>(통증·쾌감).</li>\n<li>⭐⭐⭐ <strong>신경계</strong>: 중추(두뇌+척수[반사]) / 말초(<strong>체신경계</strong> 골격근 자발 제어 + <strong>자율신경계</strong> 교감=각성·부교감=이완). 뉴런 3유형: <strong>감각·운동·간뉴런</strong>.</li>\n<li>⭐⭐⭐ <strong>뇌 연구법</strong>: <strong>손상법</strong>(초기·인과), <strong>EEG</strong>(전기, 시간↑ 공간↓), <strong>MEG</strong>(자기장, 시간↑ 공간↑), <strong>ERP</strong>(자극 시점 두피 전위 평균, N400=의미·P600=문법), <strong>PET</strong>(방사성 포도당), <strong>MRI</strong>(구조), <strong>fMRI</strong>(BOLD, 공간 매우↑), <strong>DSI</strong>(백질 물 분자 확산 → 신경 섬유 연결 지도).</li>\n<li>⭐⭐⭐ <strong>뇌 구조</strong>: <strong>뇌간</strong>(연수=심장·호흡, 뇌교=움직임·수면), <strong>시상</strong>(후각 제외 감각 관문), <strong>망상체</strong>(필터링·각성), <strong>소뇌</strong>(정교한 운동·비언어적 학습·기억·협응), <strong>변연계</strong>(시상하부+뇌하수체+편도체+해마; 정서·추동).</li>\n<li><strong>편도체</strong>(공포·분노·공격, 환자 S.M), <strong>시상하부</strong>(항상성·섭식), <strong>해마</strong>(명시적 기억; 손상 시 새 정보 기억 곤란).</li>\n<li>⭐⭐ <strong>대뇌 피질</strong>: 4엽. 운동 피질(전두엽 뒷부분), 시각(후두엽), 청각(측두엽), 체감각(두정엽). <strong>호문쿨루스</strong>. <strong>연합 영역</strong>: 감각·운동 제외, <strong>관찰 가능한 반응을 산출하지 않음</strong>; 전전두엽(판단·계획), 측두엽 <strong>FFA</strong>(얼굴), 두정엽(수학·공간).</li>\n<li>⭐⭐⭐ <strong>분할 뇌(Gazzaniga 1967)</strong>: <strong>뇌량</strong> 절단 → 우시야(좌뇌) 단어만 말로 보고, 좌시야(우뇌) 단어는 가리켜서 표현. <strong>기능의 편재화</strong>(좌=언어·수학, 우=추론·자기 자각).</li>\n<li>⭐⭐⭐ <strong>의식</strong>: 자기 자신과 환경에 대한 주관적 자각. <strong>선택적 주의</strong> → <strong>칵테일 파티 효과</strong>, <strong>부주의적 맹시</strong>, <strong>변화맹</strong>(부주의적 맹시의 한 유형).</li>\n<li>⭐⭐⭐ <strong>이중 처리</strong>: 의식적 경로(회고적·신중, <strong>계열</strong>) + 무의식적 경로(자동·신속, <strong>병렬</strong>), 동시 개입.</li>\n<li>⭐⭐⭐ <strong>수면</strong>: <strong>일주기 리듬</strong>(24시간). 베타(각성)·알파(이완)·N1·N2·<strong>N3(델타파)</strong>·<strong>REM</strong>(빠른 안구운동, 선명한 꿈, 뇌간이 근육 신호 차단, 심박·호흡 증가). 노인은 N3 진입 적고 주기 짧음.</li>\n<li><strong>수면의 목적</strong>: 보호, 면역, 알츠하이머 단백질 제거, 기억 공고화, 창의성, 성장 호르몬.</li>\n<li>⭐⭐⭐ <strong>꿈 이론</strong>: <strong>프로이트의 소망충족</strong>(표출/잠재 내용), <strong>정보 처리</strong>, <strong>생물학적 기능</strong>, <strong>활성화-종합</strong>, <strong>인지 발달</strong>. <strong>REM 반동</strong>.</li>\n</ul>\n<h3>헷갈리는 개념 대비</h3>\n<table>\n<thead>\n<tr>\n<th>기법</th>\n<th>측정 대상</th>\n<th>시간 해상도</th>\n<th>공간 해상도</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>EEG / ERP</td>\n<td>두피 전기 신호</td>\n<td>높음</td>\n<td>낮음</td>\n</tr>\n<tr>\n<td>MEG</td>\n<td>자기장</td>\n<td>높음</td>\n<td>상당히 높음</td>\n</tr>\n<tr>\n<td>MRI</td>\n<td>뇌 구조</td>\n<td>–</td>\n<td>높음 (활동 관찰 어려움)</td>\n</tr>\n<tr>\n<td>fMRI</td>\n<td>BOLD (혈중 산소) → 기능</td>\n<td>–</td>\n<td>매우 높음</td>\n</tr>\n<tr>\n<td>DSI</td>\n<td>백질 물 분자 확산 → 연결 구조</td>\n<td>–</td>\n<td>–</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>쌍</th>\n<th>구분 포인트</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>부주의적 맹시 vs 변화맹</td>\n<td>주의 안 준 자극 미지각 vs 장면 변화 미지각(전자의 한 유형)</td>\n</tr>\n<tr>\n<td>역행성 vs 순행성 기억 상실</td>\n<td>손상 이전 기억 못 떠올림(제이슨 본) vs 손상 이후 새 기억 형성 불가(메멘토)</td>\n</tr>\n<tr>\n<td>연수 vs 뇌교</td>\n<td>심장·호흡 vs 움직임·수면</td>\n</tr>\n<tr>\n<td>교감 vs 부교감</td>\n<td>각성(심박↑·소화 억제) vs 이완(심박↓·소화 촉진)</td>\n</tr>\n<tr>\n<td>의식적 vs 무의식적 경로</td>\n<td>계열·신중 vs 병렬·자동</td>\n</tr>\n<tr>\n<td>글루타메이트 vs GABA</td>\n<td>흥분성 vs 억제성</td>\n</tr>\n</tbody></table>\n<h3>출제 예상 (단답형 명칭)</h3>\n<ol>\n<li>손상 후 재조직·경험으로 뇌가 변하는 능력 → <strong>신경 가소성</strong></li>\n<li>활동 전위가 역치를 넘으면 완전히, 아니면 전혀 발생하지 않는 성질 → <strong>실무율(all-or-none)</strong></li>\n<li>뉴런 안으로 양전하가 들어와 내외부 전위차가 사라지는 현상 → <strong>탈분극화</strong></li>\n<li>과도한 신경전달물질이 방출 뉴런으로 되돌아가는 과정 → <strong>재흡수</strong></li>\n<li>과잉 시 조현병, 부족 시 파킨슨병과 관련된 신경전달물질 → <strong>도파민</strong></li>\n<li>부족 시 우울증과 관련된 신경전달물질 → <strong>세로토닌</strong></li>\n<li>대표적 억제성 신경전달물질 → <strong>GABA</strong></li>\n<li>백질의 물 분자 확산을 이용해 신경 섬유 연결 구조를 촬영하는 기법 → <strong>확산 스펙트럼 영상(DSI)</strong></li>\n<li>혈중 산소 농도 신호로 기능적 활동을 촬영하는 기법 → <strong>fMRI(BOLD)</strong></li>\n<li>자극 시점을 기준으로 두피 전위 변화를 평균한 것 → <strong>사건 관련 전위(ERP)</strong></li>\n<li>후각을 제외한 모든 감각의 관문 → <strong>시상</strong></li>\n<li>감각·운동 영역을 제외한 나머지 대뇌 영역 → <strong>연합 영역</strong></li>\n<li>좌우 반구를 연결하는 다리 → <strong>뇌량</strong></li>\n<li>여러 말소리 중 하나에만 주의를 기울이는 현상 → <strong>칵테일 파티 효과</strong></li>\n<li>장면의 변화를 눈치채지 못하는 현상 → <strong>변화맹</strong></li>\n<li>REM 수면을 박탈한 뒤 더 빨리 REM으로 돌아가는 현상 → <strong>REM 반동</strong></li>\n</ol>\n<h3>출제 예상 (객관식 포인트)</h3>\n<ul>\n<li>EEG(시간 높음·공간 낮음) vs MEG(둘 다 높음) vs fMRI(공간 매우 높음) 조합 매칭.</li>\n<li>MRI는 <strong>구조</strong>만, 활동은 <strong>fMRI</strong>. fMRI = 회질, DSI = 백질.</li>\n<li><strong>변연계 구성원</strong>에 시상은 포함되지 않음(시상하부·뇌하수체·편도체·해마).</li>\n<li>시상은 <strong>후각을 제외</strong>한 감각을 중계(후각 예외).</li>\n<li>활동 전위의 <strong>크기</strong>는 자극 강도와 무관(발화율이 달라짐).</li>\n<li><strong>연합 영역</strong>의 특징 = 관찰 가능한 반응을 산출하지 않음(그래서 신경과학 기법 필요).</li>\n<li>분할 뇌: 우시야 단어를 <strong>말로</strong> 보고 → 좌뇌 언어 처리. 가리키기 → 우뇌.</li>\n<li>REM은 겉으로 이완(근육 신호 차단)·내적으로 각성. 노인은 N3 진입이 적음.</li>\n<li>알츠하이머 = ACh 뉴런 퇴화(도파민이 아님). 다발성 경화증 = 수초.</li>\n</ul>\n<h3>교수 강조</h3>\n<ul>\n<li>(9/8, 2부 19:52–22:48 요약 메모) 연합 영역의 <strong>가장 중요한 특징 = 관찰할 수 있는 반응을 산출하지 않는다</strong>; 신경과학 기법을 쓰는 이유(28번 노트: 반응이 없어도 심적 과정이 벌어짐).</li>\n<li>(9/8, 2부 05:52–08:29) <strong>후각은 시상을 거치지 않는다</strong>.</li>\n<li>(9/8, 1부 32:22–36:24) <strong>손상법은 가장 초기 방법이자 인과적 설명</strong>이 가능.</li>\n<li>(9/8, 1부 23:38–26:50) 뇌는 <strong>발화 횟수</strong>로 자극 강도를 표상.</li>\n<li>(9/8, 1부 40:19–46:00) EEG/ERP는 <strong>시간 해상도가 높은</strong> 접근. N400·P600.</li>\n<li>(9/8, 2부 15:08–18:59) 역행성(제이슨 본) / 순행성(메멘토). 순행성이 더 일반적.</li>\n<li>(9/8, 2부 44:19–47:07) 변화맹 = 사건에 집중해 세부를 놓침.</li>\n<li>(9/8, 2부 52:12–53:13) 노인은 N3에 거의 못 들어가고 수면 주기가 짧아짐.</li>\n<li>※ 2장은 전문이 없고 요약 메모만 있어 시험 관련 직접 발언은 확인되지 않음.</li>\n</ul>\n<hr>\n<h2>3장 일생에 걸친 발달</h2>\n<p><strong>요지: 발달심리학은 신체·인지·사회성이 일생 동안 어떻게 변하는지를 (선천/후천, 연속/단계, 안정/변화)의 세 논제와 횡단·종단 연구로 탐구하며, 피아제(인지)·콜버그(도덕)·에릭슨(사회성) 이론이 축을 이룬다.</strong></p>\n<h3>핵심 개념</h3>\n<ul>\n<li>⭐⭐⭐ <strong>연구 방법</strong>: <strong>횡단 연구</strong>(동일 시간대 상이한 집단; 다량 데이터 ↑, 변화 추적 ↓) vs <strong>종단 연구</strong>(동일 집단 추적; 변화 추적 ↑, <strong>중도 이탈</strong>). 종단은 며칠 단위 짧은 기간에도 가능(교수 강조).</li>\n<li><strong>출생 이전</strong>: 접합자 → 배아 → 태아. 6개월 태아가 어머니 목소리에 반응, 울음에 모국어 억양. <strong>테라토겐</strong>(알코올·니코틴·바이러스; 태아 알코올 증후군).</li>\n<li><strong>신생아</strong>: <strong>습관화</strong>(반복 자극에 반응 감소 = 자극 기억의 창), 어머니·사람 자극 선호.</li>\n<li>⭐⭐⭐ <strong>피아제 인지 발달 단계</strong><ul>\n<li>핵심: <strong>스키마</strong>(체제화 틀), <strong>동화</strong>(기존 스키마로 해석), <strong>조절</strong>(스키마 변화).</li>\n<li><strong>감각 운동(0~2세)</strong>: <strong>대상영속성</strong>, <strong>낯가림</strong>. <strong>전조작(2~6세)</strong>: 심적 조작 불가, <strong>보존 개념 결여</strong>, <strong>자기중심성</strong>, <strong>가상 놀이</strong>. <strong>구체적 조작(7~11세)</strong>: 구체적 물질의 보존, 수학적 변환. <strong>형식적 조작(12세~)</strong>: 추상·가설 추리, 성숙한 도덕 추리 잠재성.</li>\n<li>의의: 발달 <strong>이정표</strong> 제공, 아동은 <strong>능동적</strong> 존재. 한계: 발달은 더 연속적, 사고가 더 일찍 발현(<strong>유아 물리학·수학</strong>, <strong>가상 놀이</strong>).</li>\n</ul>\n</li>\n<li>⭐⭐⭐ <strong>비고츠키의 사회적 아동</strong>: <strong>사회적 환경</strong>, 부모·교사가 <strong>도약대</strong> 제공, 언어 내면화 = <strong>속내말</strong>. (피아제 = 물리적 환경)</li>\n<li>⭐⭐⭐ <strong>마음 이론</strong>: 타인·자신의 심적 상태 추론, <strong>4~5세</strong> 급발달, 타인의 <strong>잘못된 인식</strong>(false belief) 이해 → 공감의 시작. 젠킨스 &amp; 애스팅턴: 3세 연필 / 4~5세 반창고.</li>\n<li>⭐⭐⭐ <strong>애착</strong>: 정서적 유대. 원천 = <strong>신체 접촉</strong>(할로우 대리모: 천 대리모 선호) + <strong>친숙성</strong>(오리 <strong>각인</strong>), <strong>결정적 시기</strong>. <strong>안정 애착</strong>(적절한 부모 반응) / <strong>불안정 애착</strong>(<strong>불안</strong> 애착: 인정 갈망·배척 민감, <strong>회피</strong> 애착: 거리 유지). <strong>기본 신뢰감</strong>. <strong>감수성 훈련</strong>. <strong>애착 박탈</strong>(루마니아 아동, 지능·두뇌 저하, ADHD, 위협 탐지 과활성화), 적절한 역경 → <strong>회복 탄력성</strong>.</li>\n<li>⭐⭐⭐ <strong>양육 4유형</strong>: <strong>권위주의적</strong>(강압·복종) / <strong>허용적</strong>(무조건 허용) / <strong>방임적</strong>(무관심) / <strong>권위적</strong>(요구 + 타협 → 높은 자존감·자율성). <strong>상관관계이지 인과 아님</strong>.</li>\n<li>⭐⭐ <strong>자기 개념</strong>: 15~18개월, 코에 빨간 점 거울 실험(자기 코를 만짐).</li>\n<li>⭐⭐ <strong>청소년기 인지</strong>: 자기중심성 지속(나에게는 안 일어난다는 믿음) + 형식적 조작(이상 vs 현실 비교, 위선 발견).</li>\n<li>⭐⭐⭐ <strong>콜버그 도덕성 발달</strong>: <strong>전인습적</strong>(처벌·보상, 9세 이전) → <strong>인습적</strong>(사회적 인정·질서) → <strong>후인습적</strong>(보편적 권리·자신의 윤리 원칙; 개인 목표를 우선하는 문화권에서 발현 용이). <strong>도덕 직관</strong>(이성보다 정서·직관, 하이트, 트롤리 딜레마), <strong>도덕 행위</strong>(행동 → 태도 함양).</li>\n<li>⭐⭐⭐ <strong>정체성(에릭슨 1963)</strong>: 청소년기의 자기 통합, <strong>차별성</strong> 중심(교수 강조). 개인주의/집단주의 문화권 차이는 자기소개 방식에 드러남. 또래 영향 ↑(SNS 좋아요 → 보상 영역 활성화), 부모 관계가 또래 관계에 영향.</li>\n<li>⭐⭐⭐ <strong>에릭슨 심리사회적 발달 단계</strong>: 신뢰감 vs 불신감(0<del>1) → 자율성 vs 수치감·자기의심(1</del>2) → 선도성 vs 죄책감(3~6) → <strong>정체성 vs 역할 혼미</strong>(청소년) → <strong>친밀감 vs 소외감</strong>(성인 초기) → <strong>생산성 vs 침체감</strong>(중년) → <strong>통합감 vs 절망감</strong>(노년).</li>\n<li>⭐⭐⭐ <strong>성인기 인지</strong>: <strong>회상</strong>은 노화로 하락, <strong>재인</strong>은 변화 적음(교수 강조). <strong>설단 현상</strong> 증가. <strong>알츠하이머</strong>(아세틸콜린 저하, 단백질 조각, 심신 활동으로 지연).</li>\n<li>⭐⭐ <strong>성인기 사회성</strong>: <strong>사회적 시계</strong>(문화·시대에 따라 변함), <strong>중년기 전환 위기론은 지지되지 않음</strong>, 친밀감(결혼과 건강, <strong>긍정:부정 5:1</strong>, 혼전 동거 이혼율 ↑), 생산성(직무 만족 = 행복, 조직 심리학).</li>\n<li>⭐ <strong>노년기 웰빙</strong>: 애착 불안·스트레스·분노 감소, 좋은 일을 더 잘 기억. <strong>성공적 노화</strong>는 세 요인(낙관, 대인 관계, 생물학적)이 모두 필요(🎙).</li>\n</ul>\n<h3>헷갈리는 개념 대비</h3>\n<table>\n<thead>\n<tr>\n<th>쌍</th>\n<th>구분 포인트</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>횡단 vs 종단</td>\n<td>다른 집단 동시 비교 vs 같은 집단 장기 추적</td>\n</tr>\n<tr>\n<td>동화 vs 조절</td>\n<td>기존 스키마로 해석 vs 스키마를 바꿈</td>\n</tr>\n<tr>\n<td>피아제 vs 비고츠키</td>\n<td>물리적 환경 / 심적 조작 vs 사회적 환경 / 도약대·속내말</td>\n</tr>\n<tr>\n<td>권위주의적 vs 권위적</td>\n<td>복종 강요(자존감 ↓) vs 요구 + 타협(자존감 ↑)</td>\n</tr>\n<tr>\n<td>불안 애착 vs 회피 애착</td>\n<td>인정 갈망·배척 신호 민감 vs 긴밀한 관계 불편·거리 유지</td>\n</tr>\n<tr>\n<td>재인 vs 회상</td>\n<td>본 적 있는지 판단(노화 영향 적음) vs 직접 산출(하락)</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>콜버그 수준</th>\n<th>기제</th>\n<th>사례</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>전인습적</td>\n<td>처벌 회피/보상</td>\n<td>교도소 가니까 안 돼 / 안 잡히면 돼</td>\n</tr>\n<tr>\n<td>인습적</td>\n<td>사회적 인정/질서 유지</td>\n<td>딸 위해 훔칠 수 있다 / 법 어기면 나쁜 사람</td>\n</tr>\n<tr>\n<td>후인습적</td>\n<td>보편 권리/윤리 원칙</td>\n<td>생명권 보장을 위해 훔친다</td>\n</tr>\n</tbody></table>\n<h3>출제 예상 (단답형 명칭)</h3>\n<ol>\n<li>동일 시간대의 서로 다른 집단(예: 연령별)을 비교하는 연구 → <strong>횡단 연구</strong></li>\n<li>동일 집단을 오랜 시간 추적하는 연구 → <strong>종단 연구</strong></li>\n<li>태아에게 해를 끼칠 수 있는 모든 물질의 총칭 → <strong>테라토겐</strong></li>\n<li>반복 자극에 반응이 줄어드는 현상 → <strong>습관화</strong></li>\n<li>정보를 체제화하고 해석하는 틀 → <strong>스키마</strong></li>\n<li>새로운 경험을 기존 스키마로 해석하는 것 → <strong>동화</strong></li>\n<li>새 정보를 수용하려고 스키마를 바꾸는 것 → <strong>조절</strong></li>\n<li>대상이 지각되지 않아도 존재함을 아는 것 → <strong>대상영속성</strong></li>\n<li>눈에 보이는 형태가 바뀌어도 양은 같다는 이해가 없는 전조작기의 특징 → <strong>보존 개념 결여</strong></li>\n<li>타인도 자신과 같은 것을 보고 생각한다고 여기는 경향 → <strong>자기중심성</strong></li>\n<li>타인의 심적 상태를 추론하는 능력 (4~5세 급발달) → <strong>마음 이론</strong></li>\n<li>아동이 높은 수준으로 발달하도록 일시적 지지를 제공하는 것(비고츠키) → <strong>도약대(scaffolding)</strong></li>\n<li>언어를 내면화해 문제 해결에 쓰는 것 → <strong>속내말(inner speech)</strong></li>\n<li>새끼 오리가 처음 본 대상을 따르는 친숙성 기반 애착 → <strong>각인(imprinting)</strong></li>\n<li>세상은 예측할 수 있고 믿을 만하다는 느낌 → <strong>기본 신뢰감</strong></li>\n<li>자녀에게 요구하되 타협으로 자녀 의견도 수용하는 양육 방식 → <strong>권위적(authoritative) 부모</strong></li>\n<li>도덕 추리의 세 수준 중 처벌 회피·보상이 핵심인 수준 → <strong>전인습적 단계</strong></li>\n<li>청소년기의 심리사회적 위기 → <strong>정체성 vs 역할 혼미</strong></li>\n<li>결혼·은퇴 등 사회적 사건의 문화적으로 선호되는 타이밍 → <strong>사회적 시계</strong></li>\n<li>혀끝에서 단어가 맴도는 현상 → <strong>설단 현상</strong></li>\n</ol>\n<h3>출제 예상 (객관식 포인트)</h3>\n<ul>\n<li>피아제 단계별 <strong>연령</strong>과 <strong>현상</strong> 매칭(가상 놀이·자기중심성 = 전조작, 보존 = 구체적 조작).</li>\n<li><strong>낯가림·대상영속성 = 감각운동기</strong>, 보존 개념의 이해 시작 = 구체적 조작기.</li>\n<li><strong>피아제가 간과한 부분</strong>: 유아 물리학·유아 수학, 가상 놀이(더 일찍 발현) ↔ 피아제 이론 유지 부분(단계 순서)과 혼동 주의.</li>\n<li><strong>권위주의적 vs 권위적</strong>, 양육 방식-자녀 특성은 <strong>인과가 아닌 상관</strong>.</li>\n<li>불안정 애착도 <strong>위험 탐지에 도움</strong>이 될 수 있다는 예외. 진짜 위험은 <strong>애착 박탈</strong>.</li>\n<li><strong>콜버그</strong>: 인습적 = 사회적 인정·질서 vs 후인습 = 보편 원리. 후인습은 개인주의 문화권에서 발현 용이.</li>\n<li>도덕성의 상당 부분은 <strong>직관·정서</strong>(하이트); <strong>행동 → 태도</strong> 가능.</li>\n<li><strong>재인은 노화 영향 적음, 회상은 하락</strong>. 중년 위기론은 <strong>연구상 지지 안 됨</strong>. 성공적 결혼 5:1.</li>\n<li>에릭슨 위기 쌍 매칭(단계 ↔ 위기), 청소년 = 정체성, 성인 초기 = 친밀감, 중년 = 생산성.</li>\n</ul>\n<h3>교수 강조</h3>\n<ul>\n<li>(9/15 04:06–07:22 / 메모 05:26) 종단 연구는 <strong>며칠 단위 짧은 기간에도</strong> 적용 가능.</li>\n<li>(9/15 43:47) 피아제 이론의 <strong>두 가지 공헌</strong>: 발달 이정표 제공, 아동의 능동성.</li>\n<li>(9/15 47:37–48:32) 피아제 = 물리적 환경, 비고츠키 = 사회적 환경. 발달은 0/1 계단식이 아니라 점진적.</li>\n<li>(9/15 52:27, 메모 52:48) <strong>마음 이론이 발전해야 사회성(공감)이 시작</strong>.</li>\n<li>(9/15 1:17:54–1:19:59) 양육 방식 — <strong>권위주의적/권위적 용어 혼동 주의</strong>, <strong>상관 ≠ 인과</strong>.</li>\n<li>(9/15 1:20:46) 자기 개념: 15~18개월, 거울 실험.</li>\n<li>(9/15 1:38:57) 정체성 수립의 가장 중요한 요소 = <strong>차별성</strong>; 개인주의/집단주의 자기소개 방식.</li>\n<li>(9/15 1:36:20 전후) 도덕 직관·정서, <strong>행동 → 태도</strong>(행동 프로그램 이수 명령).</li>\n<li>(9/15 1:52:33–1:54:06) <strong>회상은 하락, 재인은 유지</strong>; 설단 현상.</li>\n<li>(9/15 2:10:27) <strong>성공적 노화는 세 요인이 모두 필요</strong>.</li>\n<li>※ 시험·평가에 대한 직접 발언은 0915 전문에서 확인되지 않음.</li>\n</ul>\n<hr>\n<h2>4장 감각과 지각</h2>\n<p><strong>한 줄 요지</strong>: 감각(수용·표상)에 지각(체제화·해석)이 더해지며, 지각은 상향 처리와 하향 처리(기대·맥락·동기·정서)의 영향을 함께 받는다. 시각 경로, 게슈탈트 조직화, 깊이 단서, 감각 상호작용까지가 범위.</p>\n<h3>핵심 개념</h3>\n<ul>\n<li>⭐⭐⭐ <strong>감각</strong> = 수용·표상 / <strong>지각</strong> = 체제화·해석(경험). <strong>상향 처리</strong>(감각 수용기→고차) vs <strong>하향 처리</strong>(경험·기대로 입력을 체계화). 지각은 둘 다 영향받음.</li>\n<li>⭐⭐⭐ <strong>절대 역치</strong> = 탐지율 0.5 지점, <strong>역치하 자극</strong> = 0.5 미만(그래도 영향 가능, <strong>점화</strong>로 확인; <strong>차폐 자극</strong>·<strong>SOA</strong>). 교수: 역치가 낮다고 항상 좋지 않음(정신적 자원 한계).</li>\n<li>⭐⭐⭐ <strong>신호 탐지 이론</strong>: 적중·놓침·오경보·정기각 → <strong>민감도(d′)</strong>(구별 능력, 두 분포 피크 거리)와 <strong>편향성</strong>(기준선: 우측=엄격, 좌측=관대).</li>\n<li>⭐⭐⭐ <strong>차이 역치(최소식별차이)</strong> + <strong>베버의 법칙</strong>(절대량이 아닌 일정 비율 변화). 예: 100→110→121kg.</li>\n<li>⭐⭐⭐ <strong>감각 순응</strong>: 반복 자극에 민감도 감소(후각이 가장 빠름), 뉴런은 <strong>발화율</strong>로 강도 표상.</li>\n<li>⭐⭐⭐ <strong>지각 갖춤새</strong> = 기대, 하향 처리의 대표 예. 감자튀김 봉투(미각), <strong>말 분절</strong>(청각), <strong>플라시보 효과</strong>·<strong>통증</strong>(부상병, 직접 경로 모형 반박, VR 화상), <strong>음소 복원 효과</strong>, 문화(동아프리카 vs 서구), <strong>장면 도식</strong>, 동기(갈증-물병, 배낭), 정서(슬픈 음악→Mourning/Pain).</li>\n<li>⭐⭐⭐ <strong>시각</strong>: 파장=색(장파장=붉은색), 진폭=밝기. 홍채(동공 조절), 수정체(근시=망막 앞, 원시=망막 뒤), <strong>중심와</strong>, <strong>맹점</strong>, 뒤집힌 상. <strong>원추체</strong>(색·세부, 중앙, 낮, 핫라인) vs <strong>간상체</strong>(밝기, 주변, 어두울 때, 암순응). 광수용기→<strong>양극세포</strong>→시신경→후두엽 시각 피질(좌시야→우반구).</li>\n<li>⭐⭐ <strong>자질 탐지기</strong>, <strong>FFA</strong>(얼굴 재인, 손상 시 얼굴실인증, TMS로 저하), <strong>PPA</strong>(장소), <strong>병렬 처리</strong>, <strong>분산 표상</strong>.</li>\n<li>⭐⭐⭐ <strong>게슈탈트</strong>: 전체는 부분의 합 이상(구조주의와 대비), <strong>네커 육면체</strong>, <strong>전경–배경</strong>(가역적), <strong>집단화 3원리</strong>(근접성·연속성·폐쇄). 게슈탈트는 타고난 <strong>상향</strong> 처리 중심(유아도 사용).</li>\n<li>⭐⭐⭐ <strong>역투사의 문제</strong>(2D 상 → 3D 근원 다수), <strong>시각 절벽</strong>(깁슨&amp;워크 1960, 6~14개월) → 깊이 지각의 선천성.</li>\n<li>⭐⭐⭐ <strong>양안 단서</strong>(망막 부등, 수렴) vs <strong>단안 단서</strong>(중첩, 상대적 운동, 상대적 높이, 선형 조망, 상대적 크기).</li>\n<li>⭐⭐ <strong>움직임 지각</strong>: <strong>달 착시</strong>, <strong>모양 항등성</strong>(컴퓨터 안면 인식은 각도 변화에 약함).</li>\n<li>⭐⭐⭐ <strong>감각 상호작용</strong>: 미각–후각, <strong>맥거크 효과</strong>(가+바→다), <strong>체화 인지</strong>(따뜻한 커피→우호, 단단한 의자→엄정), <strong>공감각</strong>. ⭐⭐ <strong>ESP</strong>(텔레파시·천리안·예지), <strong>린드버그 유괴사건</strong>(1300명, 5%, 4명 → 우연의 일치).</li>\n</ul>\n<h3>헷갈리는 개념 대비</h3>\n<table>\n<thead>\n<tr>\n<th>개념 A</th>\n<th>개념 B</th>\n<th>구분 포인트</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>절대 역치</td>\n<td>차이 역치(JND)</td>\n<td>자극 유무 탐지 0.5 / 두 자극 차이 탐지 0.5</td>\n</tr>\n<tr>\n<td>민감도(d′)</td>\n<td>편향성</td>\n<td>구별 능력(피크 거리) / 판단 기준선(엄격·관대)</td>\n</tr>\n<tr>\n<td>감각 순응</td>\n<td>암순응</td>\n<td>반복 자극에 민감도 감소 / 어둠에 적응해 형체 식별(간상체)</td>\n</tr>\n<tr>\n<td>원시</td>\n<td>근시</td>\n<td>굴절력 약함·망막 뒤·볼록렌즈 / 굴절력 강함·망막 앞·오목렌즈</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>양안 단서 (2)</th>\n<th>단안 단서 (5)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>망막 부등</strong>(두 망막 상의 차이, 클수록 가까움), <strong>수렴</strong>(내각)</td>\n<td><strong>중첩, 상대적 운동, 상대적 높이, 선형 조망, 상대적 크기</strong></td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>원추체</th>\n<th>간상체</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>600만, 중앙, 색·세부, 낮, 핫라인</td>\n<td>1.2억, 주변, 밝기·약한 빛, 석양, 합산, 암순응</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>구조주의(분트)</th>\n<th>게슈탈트</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>부분의 통합 = 전체</td>\n<td>전체 &gt; 부분의 합, 타고난 조직화 원리</td>\n</tr>\n</tbody></table>\n<h3>출제 예상 (단답형 명칭)</h3>\n<ol>\n<li>자극을 탐지할 확률이 0.5가 되는 강도 → <strong>절대 역치</strong></li>\n<li>탐지율 0.5 미만으로 제시되어 의식하지 못하는 자극 → <strong>역치하 자극</strong></li>\n<li>앞선 자극이 관련 개념을 미리 활성화해 뒤 자극 처리에 영향을 주는 현상 → <strong>점화</strong></li>\n<li>신호와 노이즈를 구별하는 능력(신호 탐지 이론) → <strong>민감도</strong></li>\n<li>자극 차이를 지각하려면 일정 비율의 변화가 필요하다는 법칙 → <strong>베버의 법칙</strong></li>\n<li>반복 노출로 감각 기관 민감도가 감소하는 현상 → <strong>감각 순응</strong></li>\n<li>경험에 근거해 특정 지각에 대해 형성되는 기대 → <strong>지각 갖춤새</strong></li>\n<li>연속된 말소리에서 단어의 시작과 끝을 구분하는 능력 → <strong>말 분절</strong></li>\n<li>누락된 소리를 문장 맥락으로 복원해 듣는 현상 → <strong>음소 복원 효과</strong></li>\n<li>얼굴 재인을 담당하는 방추상 영역 → <strong>FFA(방추상 얼굴 영역)</strong></li>\n<li>여러 하위 차원을 동시에 처리하는 방식 → <strong>병렬 처리</strong></li>\n<li>전체는 부분의 합 이상이라고 보는 접근 → <strong>게슈탈트 심리학</strong></li>\n<li>가까이 있는 사물을 묶어서 지각하는 원리 → <strong>근접성</strong></li>\n<li>끊어진 부분을 메워 완전한 형태로 지각하는 원리 → <strong>폐쇄</strong></li>\n<li>2차원 상을 만들어낸 3차원 근원이 여럿일 수 있는 문제 → <strong>역투사의 문제</strong></li>\n<li>두 망막 이미지의 차이로 깊이를 지각하는 양안 단서 → <strong>망막 부등</strong></li>\n<li>움직임에 따라 투영 모양이 바뀌어도 동일 사물로 지각하는 특성 → <strong>모양 항등성</strong></li>\n<li>입 모양과 소리가 다를 때 제3의 소리를 지각하는 현상 → <strong>맥거크 효과</strong></li>\n<li>신체 감각 회로와 인지 회로의 상호작용 → <strong>체화 인지</strong></li>\n<li>감각 입력 없이 지각이 일어난다는 주장 → <strong>초감각지각(ESP)</strong></li>\n</ol>\n<h3>출제 예상 (객관식 포인트)</h3>\n<ul>\n<li>게슈탈트의 집단화 원리는 경험(하향)이 아니라 <strong>타고난 상향</strong> 처리 중심이라는 점(교수 강조 함정).</li>\n<li>절대 역치가 낮은 것이 언제나 유리한 것은 아님 / 역치하 자극도 영향을 줄 수 있음.</li>\n<li>양안 단서(망막 부등·수렴)와 단안 단서(5가지)의 분류. 상대적 크기·높이·중첩은 <strong>단안</strong>.</li>\n<li>좌시야→우반구, 우시야→좌반구 (슬라이드 오타 주의).</li>\n<li>근시=굴절력 강함=망막 앞, 원시=굴절력 약함=망막 뒤.</li>\n<li>뉴런은 활동전위 크기가 아닌 <strong>발화율</strong>로 자극 강도를 표상.</li>\n<li>통증: 직접 경로 모형(상향 중심)은 부상병 관찰로 반박, 주의 분산(VR 게임)으로 통증 감소.</li>\n<li>플라시보 조건은 처치 &#39;인지&#39; 효과와 실제 처치 효과를 분리해서 비교하기 위한 조건.</li>\n<li>린드버그 사건: 5%, 4명 → 우연의 일치(ESP 증거 아님).</li>\n</ul>\n<h3>교수 강조</h3>\n<ul>\n<li>(9/22 12:07) 역치가 낮은 게 언제나 좋은 건 아님(정신적 자원 한계).</li>\n<li>(9/22 55:08~58:49) 풍경 사진 속 얼굴 13개 찾기 — 하향 처리가 강력하게 작동.</li>\n<li>(9/22 1:26:56~1:28:47) 게슈탈트는 상향 처리 중심, &quot;많이 헷갈리는 부분이라 깊게 설명&quot;.</li>\n<li>(9/22 1:47:42) &quot;양안 단서랑 단안 단서의 유형을 잘 구분해 두는 게 좋다.&quot;</li>\n<li>(9/22 2:09:48<del>2:13:47) 시험 공지: 10/13(화) 14:30</del>16:00, E1-101 컨벤션홀 A구역, 객관식 25+단답형 5, 서막~6장(1장 29번 슬라이드까지), 검은 펜(빨간 펜·샤프·연필 자제).</li>\n</ul>\n<hr>\n<h2>5장 학습</h2>\n<p><strong>한 줄 요지</strong>: 학습은 경험에 따른 행동의 영속적 변화이며, 비연합(민감화·둔감화) / 연합(고전적·조작적 조건형성) / 인지(관찰) 학습으로 나뉜다. 강화·처벌의 구분과 강화 계획, 관찰 학습과 거울 뉴런이 핵심.</p>\n<h3>핵심 개념</h3>\n<ul>\n<li>⭐⭐⭐ <strong>학습</strong> = 경험에 따른 유기체 행동의 영속적 변화(목표: 환경 적응). 세 양상: <strong>비연합 / 연합 / 인지(관찰)</strong>.</li>\n<li>⭐⭐ <strong>민감화</strong>(반응 빈도 증대) vs <strong>둔감화</strong>(반응 빈도 감소) = 비연합 학습. <strong>신경 가소성</strong>이 바탕. 습관 형성 약 2달(66일).</li>\n<li>⭐⭐⭐ <strong>고전적 조건화(파블로프)</strong>: <strong>중성 자극(NS)</strong> → <strong>조건 자극(CS)</strong>, <strong>무조건 자극(US)</strong>, <strong>무조건 반응(UR)</strong>, <strong>조건 반응(CR)</strong>. 순서: NS 먼저, US 나중(교수 강조). US가 NS보다 먼저면 조건형성 거의 안 됨.</li>\n<li>⭐⭐⭐ <strong>고차 조건형성</strong>(CS를 새 NS와 연합, 1차보다 약함), <strong>소거</strong>(CS만 반복 제시 → CR 감소; 제거가 아닌 <strong>억압</strong>) / <strong>자발적 회복</strong>(휴지기 후 부분 회복), <strong>일반화</strong>(유사 자극에 CR, 공포 일반화는 잘 안 사라짐) / <strong>변별</strong>(무관 자극 구분).</li>\n<li>⭐⭐ <strong>고전적 조건화의 의의</strong>: 객관적 연구 방법, 다양한 자극-반응, 진화적 관점(혐오·공포의 생존 가치), 신경회로. <strong>응용</strong>: 갈망 치료(단서 제거, 마운자로·위고비 예), 면역 반응(맛 첨가), 공포 치료(반복 노출 치료법=소거).</li>\n<li>⭐⭐⭐ <strong>조작적 조건화</strong>: 행동–결과 연합. <strong>효과의 법칙</strong>(손다이크, 고양이 문제상자, 1898) → <strong>스키너</strong>(스키너 상자, <strong>행동 조성</strong>, <strong>계기적 근사법</strong>).</li>\n<li>⭐⭐⭐ <strong>강화</strong>(행동 증가) vs <strong>처벌</strong>(행동 감소). <strong>정적</strong>(자극 부여) vs <strong>부적</strong>(자극 제거). <strong>부적 강화는 처벌이 아님</strong>(교수 강조). <strong>약물 중독 = 부적 강화</strong>(금단 증상 제거). 정적·부적 강화는 동시 가능.</li>\n<li>⭐⭐ <strong>강화물</strong>: <strong>1차</strong>(생득적, 생물학적 욕구) vs <strong>조건(2차)</strong>(1차와 연합). <strong>즉시 vs 지연</strong>(마시멜로 실험).</li>\n<li>⭐⭐⭐ <strong>강화 계획</strong>: <strong>연속</strong> vs <strong>부분(간헐)</strong>(학습 느리지만 소거 저항 높음). 부분 4유형: <strong>고정비율</strong>(커피 쿠폰), <strong>변동비율</strong>(슬롯머신, 소거 어려움), <strong>고정간격</strong>(정기 할인, 급격한 증가), <strong>변동간격</strong>(SNS 알림, 느리지만 꾸준).</li>\n<li>⭐⭐ <strong>처벌</strong>: <strong>정적 처벌</strong>(제1유형, 혐오 자극 부여) vs <strong>부적 처벌</strong>(제2유형, 보상 철회; <strong>타임아웃</strong>). 신속·확실한 처벌이 효과적(검거율). 체벌은 행동을 억제할 뿐, 공포·공격성 모델링(APA 2019).</li>\n<li>⭐⭐⭐ <strong>관찰 학습(사회학습)</strong>: 모델링, <strong>대리 강화/대리 처벌</strong>, <strong>Bandura 오뚝이 실험(1961)</strong>, 동물의 관찰 학습, <strong>거울 뉴런</strong>(리졸라티; 전두엽), <strong>마음 이론</strong>, <strong>과잉 모방</strong>, 친사회적/반사회적 영향, 폭력적 게임은 메타분석에서 상관 낮음(<strong>출간 편향</strong>).</li>\n</ul>\n<h3>헷갈리는 개념 대비</h3>\n<table>\n<thead>\n<tr>\n<th>고전적 조건화</th>\n<th>조작적 조건화</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>제어할 수 없는 사건(자극) 간 연합</td>\n<td>행동과 결과 간 연합</td>\n</tr>\n<tr>\n<td>비자발적·자동적 반응</td>\n<td>자발적, 환경에 조작을 가함</td>\n</tr>\n<tr>\n<td>획득: NS+US 연합</td>\n<td>획득: 반응을 강화물/처벌과 연합</td>\n</tr>\n<tr>\n<td>소거: CS만 제시</td>\n<td>소거: 강화 차단</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>자극 부여 (정적)</th>\n<th>자극 제거 (부적)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>행동 증가 (강화)</strong></td>\n<td>정적 강화</td>\n<td>부적 강화</td>\n</tr>\n<tr>\n<td><strong>행동 감소 (처벌)</strong></td>\n<td>정적 처벌</td>\n<td>부적 처벌</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>강화 계획</th>\n<th>정의</th>\n<th>특징·예</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>고정비율</td>\n<td>고정된 수의 반응 후</td>\n<td>커피 쿠폰</td>\n</tr>\n<tr>\n<td>변동비율</td>\n<td>랜덤한 수의 반응 후</td>\n<td>소거 안 됨, 슬롯머신</td>\n</tr>\n<tr>\n<td>고정간격</td>\n<td>고정된 시간 후</td>\n<td>시점 가까울수록 급증, 정기 할인</td>\n</tr>\n<tr>\n<td>변동간격</td>\n<td>가변적 시간 후</td>\n<td>느리지만 꾸준, SNS 알림</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>비연합</th>\n<th>연합</th>\n<th>인지(관찰)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>민감화·둔감화</td>\n<td>고전적·조작적 조건화</td>\n<td>관찰·모방, 언어</td>\n</tr>\n</tbody></table>\n<h3>출제 예상 (단답형 명칭)</h3>\n<ol>\n<li>경험에 따른 유기체 행동의 영속적 변화 → <strong>학습</strong></li>\n<li>자극에 대한 행동 반응 빈도가 증대되는 현상 → <strong>민감화</strong></li>\n<li>자극에 대한 반응 빈도가 낮아지는 현상 → <strong>둔감화</strong></li>\n<li>경험·학습에 따라 신경 회로가 유연하게 변하는 특성 → <strong>신경 가소성</strong></li>\n<li>조건형성 전에는 반응을 유발하지 않는 자극 → <strong>중성 자극</strong></li>\n<li>자연스럽고 자동적인 반응을 촉발하는 자극 → <strong>무조건자극</strong></li>\n<li>이미 형성된 조건 자극을 다른 중성 자극과 연합하여 조건화하는 것 → <strong>고차 조건형성</strong></li>\n<li>조건 자극만 반복 제시하여 조건 반응이 감소하는 현상 → <strong>소거</strong></li>\n<li>휴지 기간 후 소거된 조건 반응이 부분적으로 회복되는 현상 → <strong>자발적 회복</strong></li>\n<li>조건 자극과 유사한 자극에도 조건 반응을 보이는 현상 → <strong>일반화</strong></li>\n<li>조건 자극과 무관련 자극을 구분하는 능력 → <strong>변별</strong></li>\n<li>보상이 뒤따르는 행동은 증가하고 처벌이 뒤따르는 행동은 감소한다는 법칙 → <strong>효과의 법칙</strong></li>\n<li>보상·처벌로 행동을 원하는 방향으로 유도하는 것 → <strong>행동 조성</strong></li>\n<li>최종 목표 행동에 이르는 이전 단계 행동들에 순차적으로 보상하는 방법 → <strong>계기적 근사법</strong></li>\n<li>혐오 자극을 제거하여 행동 빈도를 증가시키는 것 → <strong>부적 강화</strong></li>\n<li>다른 강화물과 연합되어 강화력을 획득한 자극 → <strong>조건 강화물(이차 강화물)</strong></li>\n<li>반응의 일부에만 강화를 주는 강화 계획 → <strong>부분(간헐적) 강화계획</strong></li>\n<li>랜덤한 수의 반응 뒤 강화하며 소거가 잘 안 되는 계획(슬롯머신) → <strong>변동비율 계획</strong></li>\n<li>보상을 철회하여 행동을 감소시키는 처벌 → <strong>부적 처벌</strong></li>\n<li>행동 수행뿐 아니라 타인의 같은 행동 관찰 시에도 활성화되는 전두엽 뉴런 → <strong>거울 뉴런</strong></li>\n<li>타인의 심적 상태를 추론하는 능력 → <strong>마음 이론</strong></li>\n</ol>\n<h3>출제 예상 (객관식 포인트)</h3>\n<ul>\n<li><strong>부적 강화 ≠ 처벌</strong>: 혐오 자극을 제거해 행동이 증가하면 부적 강화(교수 강조 함정).</li>\n<li>UR과 CR은 행동은 같고 유발 자극이 다름 / <strong>US가 NS보다 먼저 오면</strong> 조건형성이 거의 안 됨.</li>\n<li>소거는 CR의 <strong>제거가 아니라 억압</strong>(자발적 회복이 증거).</li>\n<li>부분 강화는 연속 강화보다 학습은 <strong>느리지만</strong> 소거 저항도는 <strong>높다</strong>.</li>\n<li>약물 중독은 금단 증상 제거에 의한 <strong>부적 강화</strong>(교수 강조).</li>\n<li>비율 계획 &gt; 간격 계획 반응률, 변동 계획이 더 지속적.</li>\n<li>체벌: 행동을 억제할 뿐, 처벌 부모의 행동은 부적으로 강화됨(APA 2019).</li>\n<li>폭력적 게임: 출간 편향을 교정한 메타분석에서 폭력 행동과의 상관은 낮음.</li>\n</ul>\n<h3>교수 강조</h3>\n<ul>\n<li>(9/29 00:00) 단답형은 <strong>명칭 쓰기만</strong>, 장문 서술형은 나오지 않음 / 통계 제외 / 빨간 펜·연필·샤프 제한 / 시험 장소 컨벤션홀 A구역.</li>\n<li>(9/29 03:59~05:57) 학습의 세 양상: 비연합·연합·관찰(인지).</li>\n<li>(9/29 28:08~29:08) 조건형성은 <strong>중립 자극이 먼저, 무조건 자극이 나중</strong>.</li>\n<li>(9/29 33:12) 소거는 제거가 아니라 일시적 억압.</li>\n<li>(9/29 56:43~59:45) 부적 강화는 처벌과 헷갈리지 말 것: 행동이 증가하면 강화, 감소하면 처벌.</li>\n<li>(9/29 59:45~1:02:36) 약물 중독 = 부적 강화, 두 강화는 동시에 가능.</li>\n<li>녹음은 슬라이드 19번(강화의 유형)까지, 20번 이후는 슬라이드 기준.</li>\n</ul>\n<hr>\n<h2>6장 기억</h2>\n<p>기억은 <strong>부호화 → 저장 → 인출</strong>의 정보처리 과정이며(다중 저장고 모형), 공부법(청크·간격두기·검증 효과·깊은 처리)과 망각·왜곡의 원인(간섭·재응고화·오정보)이 함께 출제된다. (10/6 수업 예정 — 슬라이드 기준, 녹음 반영 전)</p>\n<h3>핵심 개념</h3>\n<ul>\n<li>⭐⭐ <strong>기억 측정</strong>: <strong>회상</strong>(직접 생성; 자유/단서 회상) / <strong>재인</strong>(확인; 신·구 반응) / <strong>재학습</strong>(습득 속도 절약). 에빙하우스 <strong>파지 곡선</strong> = 재학습 기반. (3장 녹음: 노인은 회상↓, 재인은 유지)</li>\n<li>⭐⭐⭐ <strong>다중 저장고 모형</strong>(앳킨슨 &amp; 시프린, 1968): 감각 → 단기/작업 → 장기. 부호화·저장·인출. 감각 기억 일부는 무의식적으로 장기 기억으로 직행.</li>\n<li>⭐⭐⭐ <strong>감각 기억</strong>(Sperling, 1960): 전체 보고(약 4개)·<strong>부분 보고</strong>(3개 전부)·<strong>지연 보고</strong>(저하). 용량 3<del>4개, 0.5</del>1초. 청각은 <strong>반향 기억</strong>.</li>\n<li>⭐⭐⭐ <strong>단기 기억</strong>: 유지 약 <strong>12초</strong>(Peterson &amp; Peterson, 1959; 암산으로 되뇌기 차단), 용량 <strong>7±2</strong>(조지 밀러 <strong>매직 넘버 7</strong>).</li>\n<li>⭐⭐⭐ <strong>작업 기억</strong>(Baddeley &amp; Hitch, 1974): <strong>중앙 집행기</strong>(주의 분배·조정·장기 기억 인출) + <strong>시공간 잡기장</strong>(시각 심상) + <strong>음운 루프</strong>(음운 저장소 + 조음 되뇌기). 측정: <strong>N-Back 과제</strong>(유지+조작). 젊은 성인 &gt; 아동·노인.</li>\n<li>⭐⭐ <strong>자동 처리 → 암묵 기억</strong>(절차 기억, 고전적 조건화, 점화) vs <strong>통제 처리 → 외현 기억</strong>(<strong>일화 기억</strong>·<strong>의미 기억</strong>).</li>\n<li>⭐⭐⭐ <strong>부호화 전략(공부법)</strong>: <strong>청크화</strong>(용량 확장), <strong>기억술</strong>(단어의 <strong>구체성 효과</strong>), <strong>위계 구성</strong>, <strong>간격두기 효과</strong>(응고화, 벼락치기 비효율), <strong>검증 효과</strong>(퀴즈·모의고사가 단순 반복보다 우수), <strong>깊은 처리</strong>(의미 &gt; 소리 &gt; 형태; Craik &amp; Tulving 1975), <strong>자기참조 효과</strong>(집단주의 문화권은 가족 관련 정보도).</li>\n<li>⭐⭐⭐ <strong>뇌</strong>: <strong>해마</strong>=외현 기억 형성·<strong>응고화</strong>(수면 지원; 저장 장소 아님), <strong>전전두엽</strong>=작업 기억 유지, <strong>소뇌</strong>=파블로프 조건형성, <strong>기저 신경절</strong>=절차 기억, <strong>편도체</strong>=정서 기억·<strong>섬광 기억</strong>. <strong>래슐리</strong>(1950): 분산 표상.</li>\n<li>⭐⭐⭐ <strong>인출 단서</strong>: 최선은 부호화 때의 연합. <strong>점화</strong>(무의식, 암묵). <strong>맥락 의존 / 상태 의존(기분 부합) 기억</strong>, <strong>부호화 명세성 원리</strong>.</li>\n<li>⭐⭐⭐ <strong>계열 위치 효과</strong>: <strong>초두 효과</strong>(되뇌기 여유, 장기) / <strong>최신 효과</strong>(단기·작업 기억, 곧 사라짐).</li>\n<li>⭐⭐⭐ <strong>망각의 원인</strong>: <strong>부호화 실패</strong>(노령층 저하와 연관), <strong>저장 소멸</strong>(에빙하우스·Bahrick; 급락 후 안정), <strong>인출 실패</strong>(<strong>순행/역행 간섭</strong>). <strong>Jenkins &amp; Dallenbach(1924)</strong>: 학습 직후 수면 → 역행 간섭 감소.</li>\n<li>⭐⭐⭐ <strong>기억 상실증</strong>: <strong>순행성</strong>(새 기억 못 만듦; <strong>H.M.</strong>, 해마 제거) / <strong>역행성</strong>(옛 기억 인출 불가). 외현 기억이 없어도 암묵 기억은 형성(Xu &amp; Corkin).</li>\n<li>⭐⭐⭐ <strong>기억 구성 오류</strong>: <strong>재응고화</strong>(인출 후 재저장 시 변형; 소문 와전·목격자 진술), <strong>오정보 효과</strong>(Loftus &amp; Palmer 1974: 접촉 vs 충돌), <strong>상상력 효과</strong>(상상·지각 뇌 영역 중첩), <strong>출처 기억상실</strong>(오귀인).</li>\n<li>⭐⭐⭐ <strong>기억 증진법</strong>: 간격+테스트, 의미 조직화, 기억술+청크, 간섭 최소화(비슷한 주제 병행 금지), 충분한 수면.</li>\n</ul>\n<h3>헷갈리는 개념 대비</h3>\n<table>\n<thead>\n<tr>\n<th>쌍</th>\n<th>A</th>\n<th>B</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>순행 vs 역행 간섭</td>\n<td>순행: <strong>옛 → 새</strong> 방해</td>\n<td>역행: <strong>새 → 옛</strong> 방해</td>\n</tr>\n<tr>\n<td>순행성 vs 역행성 기억상실</td>\n<td>순행성: 새 기억 형성 불가(H.M.)</td>\n<td>역행성: 저장된 옛 기억 인출 불가</td>\n</tr>\n<tr>\n<td>회상 vs 재인</td>\n<td>직접 생성, 어려움</td>\n<td>확인, 쉬움</td>\n</tr>\n<tr>\n<td>간격두기 vs 검증 효과</td>\n<td>학습 <strong>시점</strong>을 분산</td>\n<td><strong>인출 연습</strong>(퀴즈)이 핵심</td>\n</tr>\n<tr>\n<td>맥락 vs 상태 의존</td>\n<td>외부 <strong>환경</strong> 일치</td>\n<td>내적 <strong>기분</strong> 일치</td>\n</tr>\n<tr>\n<td>응고화 vs 재응고화</td>\n<td>최초 저장 안정화(해마, 수면)</td>\n<td>인출 후 다시 저장, 변형 위험</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>기억</th>\n<th>분류</th>\n<th>담당 뇌 영역</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>일화·의미 기억</td>\n<td>외현</td>\n<td>해마(형성), 전전두엽(작업 기억)</td>\n</tr>\n<tr>\n<td>절차 기억</td>\n<td>암묵</td>\n<td>기저 신경절</td>\n</tr>\n<tr>\n<td>고전적 조건화</td>\n<td>암묵</td>\n<td>소뇌</td>\n</tr>\n<tr>\n<td>정서 기억(섬광 기억)</td>\n<td>—</td>\n<td>편도체</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>단기 기억</th>\n<th>작업 기억</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>초점</td>\n<td>정보 <strong>저장</strong></td>\n<td>저장 + <strong>적극적 처리</strong>(출력)</td>\n</tr>\n<tr>\n<td>구성</td>\n<td>—</td>\n<td>중앙 집행기·시공간 잡기장·음운 루프</td>\n</tr>\n</tbody></table>\n<h3>출제 예상 (단답형 명칭)</h3>\n<ol>\n<li>이전에 학습한 항목을 단서 없이 직접 생성해 떠올리는 기억 측정법 → <strong>회상</strong></li>\n<li>같은 내용을 다시 학습할 때 습득이 얼마나 빨라지는지로 기억을 측정하는 방법 → <strong>재학습</strong></li>\n<li>감각 → 단기/작업 → 장기의 세 단계로 기억을 설명한 앳킨슨 &amp; 시프린의 모형 → <strong>다중 저장고 모형(정보처리 모형)</strong></li>\n<li>작업 기억에서 주의를 배분하고 하위 시스템을 조정하는 구성 요소 → <strong>중앙 집행기</strong></li>\n<li>작업 기억에서 조음 되뇌기로 소리 정보를 유지하는 구성 요소 → <strong>음운 루프</strong></li>\n<li>현재 자극이 N회 전 자극과 같은지 판단하게 하여 작업 기억을 측정하는 과제 → <strong>N-Back 과제</strong></li>\n<li>의식적 자각 없이 자동으로 일어나 암묵 기억 형성과 밀접한 부호화 → <strong>자동 처리</strong></li>\n<li>정보를 의미 있는 단위로 묶어 단기 기억 용량보다 많이 저장하는 전략 → <strong>청크화(chunking)</strong></li>\n<li>공부 시점을 나눠 하면 기억이 오래 유지되는 현상 → <strong>간격두기 효과</strong></li>\n<li>퀴즈·모의고사처럼 인출을 연습하면 단순 반복보다 기억이 오래 가는 현상 → <strong>검증 효과</strong></li>\n<li>단어를 형태·소리보다 의미 위주로 처리할수록 잘 기억한다는 이론적 틀 → <strong>처리 수준 (깊은 처리)</strong></li>\n<li>자신과 연관지어 정보를 처리할 때 회상이 향상되는 현상 → <strong>자기참조 효과</strong></li>\n<li>정서적으로 중대한 사건에 대한 선명하고 확신도 높은 기억 → <strong>섬광 기억</strong></li>\n<li>특정 기억에 국한된 단서·맥락이 회상에 가장 효과적이라는 원리 → <strong>부호화 명세성 원리</strong></li>\n<li>새로 학습한 내용이 이전에 학습한 정보의 회상을 방해하는 현상 → <strong>역행 간섭</strong></li>\n<li>인출 후 기억이 다시 저장되는 과정에서 변형되기 쉬운 현상 → <strong>재응고화</strong></li>\n<li>질문 방식 등으로 잘못된 정보가 주어질 때 자신이 본 것과 다르게 기억하는 현상 → <strong>오정보 효과</strong></li>\n<li>해마 제거 수술 후 새로운 의식적 기억을 형성하지 못하는 증상 → <strong>순행성 기억상실증</strong></li>\n<li>정보를 얻은 시점·출처를 잘못 기억하는 현상 → <strong>출처 기억상실</strong></li>\n</ol>\n<h3>출제 예상 (객관식 포인트)</h3>\n<ul>\n<li>함정: <strong>단기 기억의 12초 vs 감각 기억의 0.5~1초</strong>, <strong>7±2 vs 감각 기억 3~4개</strong> 수치 혼동.</li>\n<li>함정: 해마는 기억을 <strong>영구 저장</strong>하는 곳이 아니라 <strong>형성·응고화</strong>를 담당. 전두엽(전전두엽)은 <strong>작업 기억 유지</strong>. 절차 기억은 해마가 아니라 <strong>기저 신경절</strong>.</li>\n<li>함정: <strong>Sperling 부분 보고법</strong>은 감각 기억이 순간적으로 더 많이 저장됨을 보여줌(지연 시 저하). 전체 보고 약 4개.</li>\n<li>함정: <strong>Peterson &amp; Peterson</strong>의 암산 목적은 <strong>되뇌기(통제 처리) 방지</strong>.</li>\n<li>함정: <strong>최신 효과는 단기/작업 기억</strong>, 초두 효과는 되뇌기 여유(장기 기억) 때문.</li>\n<li>함정: 순행/역행 간섭 방향, 순행성/역행성 기억상실 방향.</li>\n<li>함정: 수면의 이점 — Jenkins &amp; Dallenbach는 <strong>역행 간섭 감소</strong>, 수면은 <strong>응고화 지원</strong>(Lo 등: 수면 부족은 응고화 방해).</li>\n<li>함정: <strong>오정보 효과</strong>(외부 정보) vs <strong>상상력 효과</strong>(반복 상상; 뇌 영역 중첩). 처리 수준 이론의 비판 = <strong>순환적 추론</strong>. 자기참조 효과는 <strong>집단주의 문화권에서 가족 정보에도</strong> 적용.</li>\n</ul>\n<h3>교수 강조</h3>\n<ul>\n<li>9/29(5장 도입): 공부 방법과 관련된 내용은 학습 장보다 <strong>6장 기억</strong>에 더 연결 — 부호화 전략·간격두기·검증 효과 ⭐ 가중. 서막~5장 중요 포인트 정리 시간 예고. (녹음 2026-09-29 초반)</li>\n<li>9/15(3장): 노인의 회상 vs 재인 차이, 알츠하이머(신경성 치매)·경도 인지 장애 — 6장 기억과 연결. (0915 녹음 3장 노화 파트)</li>\n<li>10/6 수업 후 녹음 반영 예정.</li>\n</ul>\n<hr>\n<hr>\n<h2>시험 전날 체크리스트</h2>\n<ol>\n<li>위 <strong>0-1 단답형 후보표</strong>를 가리고, 설명만 보고 명칭 쓰기 → 틀린 것만 해당 장 정리본의 「명칭 암기표」에서 다시 보기</li>\n<li>장별 「헷갈리는 개념 대비」 표를 한 번씩 소리 내어 설명하기</li>\n<li>모의고사 <code>중간고사/문제풀이/중간고사_모의/</code>에서 틀린 문항 다시 풀기</li>\n<li>준비물: <strong>검은 볼펜</strong>(빨간 펜·연필·샤프 금지), 학생증. 장소는 <strong>E1-101 컨벤션홀 A구역</strong></li>\n</ol>\n","len":32522},{"id":"w1_ch0","title":"1주차 — 서막 심리학 이야기 정리","desc":"심리학의 역사와 학파, 생물심리사회적 접근법","ch":"ch0","min":20,"html":"<h1>서막 — 심리학 이야기 페이지별 해설</h1>\n<p>심리학으로의 여행 (Prof. 이소영) · 마이어스 심리학 개론 13판</p>\n<p>서막의 핵심 질문은 &quot;<strong>눈에 보이지 않는 마음을 어떻게 과학으로 연구하게 되었는가</strong>&quot;이다. 분트의 실험실(1879)에서 시작해 구조주의 → 기능주의 → 행동주의·정신분석·인본주의 → 인지혁명으로 이어지는 역사를 훑고, 선천성-후천성 논제, 생물심리사회적 접근법, 이론적 조망, 하위 분야까지 심리학의 지도를 그린다. 시험에서는 <strong>&quot;설명 → 학파/이론/접근 이름&quot;</strong> 매칭이 가장 많이 나올 장이다.</p>\n<blockquote>\n<p>페이지 번호 = 슬라이드 번호. 총 28장. 슬라이드 1–5는 표지·강의 소개(시험 출제 대상 아님).</p>\n</blockquote>\n<h2>p.1–4 — 표지, 강의자와 강의 진행 방식, 평가 내역 (시험 범위 제외)</h2>\n<ul>\n<li>강의: PPT 강의 + 토론. 교재 마이어스 13판. 평가: 중간·기말 각 35점(객관식+단답형), 레포트 15점, 출석 15점(1/3 이상 결석 시 F).</li>\n</ul>\n<h2>p.5–6 — 심리학이란? ⭐</h2>\n<ul>\n<li><strong>심리학(psychology)</strong> = 마음이 어떻게 작동하고 행동으로 나타나는가를 연구하는 학문 = <strong>행동과 심적 과정의 과학</strong>.</li>\n<li>질문 1: 마음을 어떻게 정의하는가? / 질문 2: 보이지 않는 마음을 어떻게 관찰하는가?</li>\n<li>마음 = <strong>인지·정서·신경활동·성격</strong> 등 내면의 심적 과정과 행동을 총괄하는 시스템(노트).</li>\n<li>영역 예시: <strong>인지</strong>(기억, 주의…), <strong>정서</strong>(기쁨, 슬픔…), <strong>성격</strong>(우울, 불안…). 교수: 인지·정서·성격도 중간 단위 수준의 포괄적 표현.</li>\n</ul>\n<h2>p.7 — 심리학 = 심리과학 ⭐</h2>\n<ul>\n<li>보이지 않는 마음을 객관적·정량적으로 연구하기 위해 다양한 연구 방법을 쓰고, 사람 대상 데이터를 모아 정립된 통계 분석으로 결과를 도출한다.</li>\n<li>노트: 마음이 안 보인다고 탐구 방식까지 추상적인 것은 아님. 예: 우울 설문 점수가 내면의 우울 지표를 반영한다고 <strong>가정</strong>하고 분석.</li>\n</ul>\n<h2>p.8 — 심리과학의 태동: 분트 ⭐⭐</h2>\n<ul>\n<li>**빌헬름 분트(Wilhelm Wundt)**가 <strong>1879년 최초의 심리학 실험실</strong>(라이프치히 대학) 설립 → 과학으로서의 심리학의 태동.</li>\n<li>심적 과정 측정 실험(<strong>공이치기 실험</strong>): 공이가 플랫폼을 치는 소리를 듣고 전신기 버튼 누르기.<ul>\n<li>실험 1: 소리를 듣자마자 바로 누르기 → 약 <strong>0.1초</strong></li>\n<li>실험 2: 소리를 듣고 &quot;들었다고 자각&quot;할 때 누르기 → 약 <strong>0.2초</strong></li>\n<li>자각이라는 추가 과정이 더 걸릴 것이라는 가설을 계량적으로 검증. 분트의 최대 업적 = 심적 과정도 측정(계량화)할 수 있음을 보인 첫 사례.</li>\n</ul>\n</li>\n<li>교수: 물리적 속성(색, 획 등)은 0.1–0.2초 내에 자동 처리되므로 놀라운 일이 아니다(사람의 인지 체계는 매우 빠름).</li>\n</ul>\n<h2>p.9 — 구조주의(Structuralism) ⭐⭐⭐</h2>\n<ul>\n<li>주요 학자: <strong>빌헬름 분트, 에드워드 브래드퍼드 티치너</strong>(분트의 제자).</li>\n<li>마음은 <strong>여러 하위 구성 요소(감각 경험 요소)로 이루어진 복합체</strong>. 구성 요소를 하나씩 분리하면 더 나눌 수 없는 &quot;근본적인 원자&quot;가 나올 것이라 봄. 교수의 비유: 물 분자 = 수소 2 + 산소 1로 쪼갤 수 있듯 마음도 그렇다.</li>\n<li>연구 방법: <strong>내성법(introspection)</strong> — 자극 경험을 스스로 들여다보고 엄격하게 보고. 노트: 자유 기술이 아니라 <strong>지정된 내용만 보고하도록 훈련시킨 엄격하고 통제된 방식</strong>(소리를 듣고 정확한 화음 말하기, 소리 자각까지 걸린 시간 보고하기). 분트는 공이치기 실험 외에 <strong>화음 실험</strong>도 함.</li>\n<li><strong>한계</strong>: 사람마다 보고가 달라 <strong>신뢰도가 낮음</strong>(자기보고라 주관적) → 행동주의의 강한 비판을 받음.</li>\n<li>교수: 마음을 직접 볼 수 없으니 &quot;기술력과 과학성 사이의 현실적 타협안&quot;이 내성법.</li>\n</ul>\n<h2>p.10 — 기능주의(Functionalism) ⭐⭐⭐</h2>\n<ul>\n<li>주요 학자: <strong>윌리엄 제임스(William James)</strong>. <strong>다윈의 진화론</strong>의 영향.</li>\n<li>내적 사고와 감정의 <strong>기능 = 생존을 위한 적응적 기능</strong>. 마음이라는 능력도 조상의 생존에 기여한 적응적 기능.</li>\n<li><strong>의식의 기능</strong>: 과거를 회상, 현재에 적응, 미래를 계획. (의식 = 무언가를 자각할 수 있는 상태)</li>\n<li>구조주의는 마음의 <strong>구성 요소가 무엇인가</strong>, 기능주의는 마음이 <strong>무슨 일을 하는가(기능)</strong>.</li>\n</ul>\n<h2>p.11 — 행동주의(Behaviorism) ⭐⭐⭐</h2>\n<ul>\n<li>학자: <strong>존 B. 왓슨(John B. Watson), B.F. 스키너(B.F. Skinner)</strong>. 구조주의·기능주의는 공통적으로 **사람 안에서 작동하는 요소(내부 감각, 심상, 감정)**를 탐구했다고 비판.</li>\n<li>주장: 심리학은 <strong>&quot;관찰 가능한&quot; 행동의 과학</strong>이어야 한다. 심적 과정은 관찰 불가, 행동은 관찰 가능. 자극-반응 관계에 집중.</li>\n<li><strong>고전적 조건화(classical conditioning)</strong>: <strong>중립 자극</strong>을 <strong>무조건 자극</strong>과 연합하여 <strong>조건 자극</strong>으로 발전시킴(파블로프의 개 — 종소리만으로 침).</li>\n<li><strong>조작적 조건화(operant conditioning)</strong>: <strong>강화/처벌</strong>의 조작으로 행동의 빈도를 조절(스키너).</li>\n<li>교수 대비: 고전적 = 무관한 자극을 새 자극과 결부해 학습, 조작적 = <strong>자신의 행동을 그 결과와 결부</strong>해 학습.</li>\n<li>행동주의자에게는 학습조차 &quot;행동의 연장선&quot;(행동 변화로 관찰). 미국 심리학계 주류 이론(1940년대 말까지 번성), 내면 과정은 30–40년간 연구에서 배제.</li>\n</ul>\n<h2>p.12 — 정신분석과 인본주의 ⭐⭐</h2>\n<ul>\n<li><strong>정신분석(psychoanalysis, 프로이트)</strong>: <strong>아동기 경험에 대한 무의식적 사고</strong>가 행동에 영향. 다양한 <strong>방어 기제</strong> 제시(투사, 전이 등은 후속 장에서).</li>\n<li><strong>인본주의 심리학(humanistic psychology)</strong>: <strong>칼 로저스(Carl Rogers), 에이브러햄 매슬로우(Abraham Maslow)</strong>.<ul>\n<li>정신분석(무의식만 강조)과 행동주의(자극-반응만 강조)가 인간을 <strong>너무 제한적</strong>으로 본다고 비판.</li>\n<li>인간은 <strong>주체적이며 자아실현</strong>을 추구하는 존재. 현재 환경이 성장 잠재력을 어떻게 촉진하는가에 집중. 상담에서 말하는 &quot;무조건적 긍정&quot;의 기반(교수).</li>\n<li>매슬로우 = 욕구위계 피라미드(최상위 자아실현) → 8장 동기에서 다시.</li>\n</ul>\n</li>\n</ul>\n<h2>p.13–14 — 인지혁명과 컴퓨터 메타포 ⭐⭐⭐</h2>\n<ul>\n<li><p><strong>인지혁명(cognitive revolution, 1960년대)</strong>: 심적 과정에 대한 초기 관심을 되돌리고 <strong>과학적 방법론을 적용</strong>하자는 <strong>패러다임 전환</strong> = &quot;마음으로의 회귀&quot;.</p>\n</li>\n<li><p>계기: <strong>컴퓨터의 개발·도입</strong>(에니악 1946, 디지털 컴퓨터 1950년대 중반). 컴퓨터의 작동 메커니즘이 마음이 움직이는 방식과 유사 → <strong>정보 처리 접근(information processing approach)</strong>.</p>\n</li>\n<li><p><strong>컴퓨터 메타포(computer metaphor)</strong>: 입력 → 처리 → 산출.</p>\n<table>\n<thead>\n<tr>\n<th>컴퓨터</th>\n<th>사람</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>입력 장치(키보드)</td>\n<td>눈·귀·코 등 <strong>감각 기관</strong>(외부 정보 입력)</td>\n</tr>\n<tr>\n<td>CPU(연산)</td>\n<td>뇌 전반, 주의·계획</td>\n</tr>\n<tr>\n<td>SSD(저장)</td>\n<td><strong>장기 기억</strong></td>\n</tr>\n<tr>\n<td>RAM(작업 메모리)</td>\n<td><strong>단기/작업 기억</strong></td>\n</tr>\n<tr>\n<td>모니터·스피커(출력)</td>\n<td><strong>행동 반응</strong></td>\n</tr>\n</tbody></table>\n</li>\n<li><p>교수의 대학원 면접 질문 에피소드: &quot;컴퓨터 메타포는 앞으로도 주류일까?&quot; → 컴퓨터는 부품과 역할을 다 알지만 <strong>마음은 밝혀지지 않은 부분이 많다</strong>는 한계.</p>\n</li>\n<li><p>p.14의 &quot;Insight, 기술 제공&quot;·&quot;심리 데이터, 기제&quot;: 컴퓨터 ↔ 심리학이 서로 인사이트/데이터를 제공(AI 연구에 심리학 이론 활용).</p>\n</li>\n</ul>\n<h2>p.15 — 인지심리학과 인지신경과학 ⭐⭐</h2>\n<ul>\n<li><strong>인지심리학(cognitive psychology)</strong>: 지각, 정보 처리 등의 심적 과정을 과학적으로 탐구.</li>\n<li><strong>뇌과학·신경과학과 융합 → 인지신경과학(cognitive neuroscience)</strong>. 인지와 사고의 <strong>생물학적 접근</strong>. 방법: <strong>뇌전도(EEG), 뇌영상(fMRI), 신경 조절</strong> 등.</li>\n<li>현대 심리학 = 사람 마음에 대한 과학. 감각·사고 등 심적 과정을 <strong>행동으로부터 추론</strong>.</li>\n<li>교수: 인지신경과학의 두 질문 — (1) 어느 단계에서 어떤 정보 처리가 일어나는가 (2) 어느 뇌 영역이 특정 기능에 관여하는가.</li>\n</ul>\n<h2>p.16 — 선천성-후천성 논제 ⭐⭐⭐</h2>\n<ul>\n<li><strong>선천성-후천성 논제(nature-nurture issue)</strong>: 인간 심리의 기원이 <strong>타고난 것 vs 외부 환경으로부터의 학습</strong>인가. 생물학적 특성과 환경의 상대적 영향력.</li>\n<li><strong>다윈의 진화론</strong>: 『<strong>종의 기원</strong>』(1859)에서 <strong>자연 선택설</strong>. 우연한 변이 중 환경에 가장 잘 생존하는 특질이 선택됨 → 인간 심리에도 적용(기능주의).</li>\n<li>철학적 뿌리(노트): <strong>플라톤 = 생득론, 아리스토텔레스 = 학습된 것</strong>, <strong>데카르트 = 생득적(대륙 합리론), 존 로크 = 학습론(영국 경험론)</strong>. 교수: 심리학은 철학에서 파생된 비교적 젊은 학문.</li>\n</ul>\n<h2>p.17 — 생물학적 특성과 환경의 상호작용 ⭐⭐</h2>\n<ul>\n<li>결론: 타고난 것과 배운 것 <strong>둘 다 중요</strong>.</li>\n<li><strong>진화심리학(evolutionary psychology)</strong>: <strong>공통적인 생물학적 특성과 진화 과정</strong>이 사람들의 <strong>보편성</strong>에 미친 영향.</li>\n<li><strong>행동유전학(behavioral genetics)</strong>: <strong>상이한 유전자와 환경</strong>으로 발생하는 <strong>차이점</strong>.</li>\n</ul>\n<h2>p.18 — 일란성/이란성 쌍둥이 ⭐⭐</h2>\n<ul>\n<li><strong>일란성 쌍둥이(identical twins)</strong>: 유전 특성이 동일(하나의 수정란에서 분할) → 유전과 환경의 상호작용 탐구에 적합. 보편성(유전, 선천성)과 차이점(환경·경험, 후천성) 모두 시사.</li>\n<li><strong>이란성 쌍둥이(fraternal twins)</strong>: 유전적 동일성이 낮음 → 일란성과 비교하는 <strong>기준점</strong>(생득적 요인의 영향력 확인).</li>\n<li>쌍둥이 연구는 대부분 선천성·후천성 <strong>모두 중요</strong>하다고 결론.</li>\n</ul>\n<h2>p.19 — 비교문화심리학 ⭐⭐</h2>\n<ul>\n<li><strong>문화(culture)</strong> = 한 세대에서 다음 세대로 전달되는 <strong>공유된 생각과 행동</strong>.</li>\n<li>문화에 따라 사고·행동이 다르지만 그 기저에는 <strong>보편성</strong>이 존재. <strong>미소의 보편성</strong>. 외로움 감정은 문화권마다 정도가 다르나(Lykes &amp; Kemmelmeier, 2014), 수줍음·낮은 자존감·독신 생활이 외로움을 키운다는 것은 공통(Rokach et al., 2002).</li>\n<li>교수 예시(노트): 일본의 <strong>메이와쿠(迷惑) 문화</strong> = &quot;남에게 폐를 끼치면 안 된다&quot;의 일본 버전. <strong>다테마에</strong>(사회적 가면) vs <strong>혼네</strong>(본연의 모습). 외로움·힘듦을 표현하는 것조차 폐로 여겨 은폐 → 보편적 사고도 문화별로 다르게 표현.</li>\n</ul>\n<h2>p.20 — 선천성 심리 기제: 기본 감정 ⭐⭐⭐</h2>\n<ul>\n<li><strong>폴 에크만(Paul Ekman)의 기본 감정</strong>: 문화권과 상관없이 전 인류가 공유하는 <strong>6개 감정 — 기쁨, 슬픔, 분노, 공포, 혐오, 놀람</strong>. 감정 식별은 문화·인종과 무관 → <strong>선천성의 예시</strong>.</li>\n<li>노트: 감정 식별의 주요 단서는 <strong>눈</strong>. (교수: 그래서 모자이크 때 눈을 가리고, 대인관계에서 아이컨택을 하라고 함.)</li>\n</ul>\n<h2>p.21 — 후천성 심리 기제: 문화에 따른 색 지각 차이 ⭐⭐</h2>\n<ul>\n<li><strong>기본 색상 지각(삼원색 RGB)은 문화 무관</strong>. 그러나 동일 색상 내 채도 차이에 대한 표현은 문화권마다 다름.</li>\n<li><strong>몽골어</strong>: 녹색·파란색 계통이 <strong>세분화</strong> / <strong>중국어</strong>: 녹색·파란색 계통이 <strong>하나로 통일</strong>. 표현의 차이가 실제 색 지각·분류에 영향 (He et al., 2019). → <strong>후천성(환경, 언어) 예시</strong>, <strong>문화사회심리학</strong>의 주요 주제.</li>\n</ul>\n<h2>p.22 — 분석 수준: 생물심리사회적 접근법과 생물학적 수준 ⭐⭐⭐</h2>\n<ul>\n<li><strong>생물심리사회적 접근법(biopsychosocial approach)</strong>: 심적 과정·행동은 <strong>생물학적·심리적·사회문화적 수준의 통합된 결과물</strong>. 수준에 따라 접근이 달라짐.</li>\n<li><strong>생물학적 수준</strong>: 유전자, 자연선택, 적응적 특질 → 생물(진화)심리학, 신경과학.</li>\n</ul>\n<h2>p.23 — 심리적 수준과 사회문화적 수준 ⭐⭐⭐</h2>\n<ul>\n<li><strong>심리적 수준</strong>: 정서, 인지 처리·해석, 개인 내면의 기대 → <strong>개인 내면</strong>의 기제가 핵심.</li>\n<li><strong>사회문화적 수준</strong>: 타인의 기대, 소속 집단, 대중 매체의 모델 → <strong>개인 외부</strong>의 환경 요인.</li>\n<li>중점의 차이일 뿐, <strong>하나의 요인만으로는 설명 불가</strong>. 교수: &quot;가장 중요한 포인트&quot; — 예: 중동에서는 발바닥을 보이는 것이 큰 무례(같은 행동도 문화에 따라 인지적 해석이 달라짐).</li>\n</ul>\n<h2>p.24–25 — 다양한 이론적 조망 ⭐⭐⭐</h2>\n<ul>\n<li><p>같은 현상(예: <strong>분노</strong>)도 조망에 따라 연구·설명이 달라진다.</p>\n<table>\n<thead>\n<tr>\n<th>조망</th>\n<th>분노에 대한 접근</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>신경과학</strong></td>\n<td>흥분 상태를 유발하는 두뇌 회로 탐구</td>\n</tr>\n<tr>\n<td><strong>진화론</strong></td>\n<td>유전자가 분노를 어떻게 촉진했는가(<strong>Fight or Flight</strong> 반응)</td>\n</tr>\n<tr>\n<td><strong>정신역동</strong></td>\n<td>무의식적 적대감의 방출</td>\n</tr>\n<tr>\n<td><strong>인지</strong></td>\n<td>상황의 해석이 분노에 미치는 영향</td>\n</tr>\n<tr>\n<td><strong>사회문화</strong></td>\n<td>문화 맥락에 따른 분노 표현 차이</td>\n</tr>\n</tbody></table>\n</li>\n<li><p>p.25 표 (이론적 조망 → 주요 연구 질문 → 관련 하위 분야):</p>\n<table>\n<thead>\n<tr>\n<th>조망</th>\n<th>주요 연구 질문</th>\n<th>관련 하위 분야</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>신경과학</strong></td>\n<td>신체와 두뇌가 어떻게 정서·기억·감각 경험을 가능케 하는가</td>\n<td>생물, 인지, 임상</td>\n</tr>\n<tr>\n<td><strong>진화론</strong></td>\n<td>특질의 자연선택이 어떻게 유전자의 생존을 촉진하는가</td>\n<td>생물, 발달, 사회</td>\n</tr>\n<tr>\n<td><strong>행동유전학</strong></td>\n<td>유전자와 환경이 어떻게 개인차에 영향을 미치는가</td>\n<td>성격, 발달, 법</td>\n</tr>\n<tr>\n<td><strong>정신역동</strong></td>\n<td>무의식적 추동과 갈등이 어떻게 행동을 유도하는가</td>\n<td>임상, 상담, 성격</td>\n</tr>\n<tr>\n<td><strong>행동주의</strong></td>\n<td>관찰 가능한 반응을 어떻게 학습하는가</td>\n<td>임상, 상담, 산업조직</td>\n</tr>\n<tr>\n<td><strong>인지심리학</strong></td>\n<td>정보의 부호화·처리·저장·인출은 어떻게 이루어지는가</td>\n<td>인지신경과학, 임상, 상담, 산업조직</td>\n</tr>\n<tr>\n<td><strong>사회문화</strong></td>\n<td>행동·사고가 상황과 문화에 따라 어떻게 달라지는가</td>\n<td>발달, 사회, 임상, 상담</td>\n</tr>\n</tbody></table>\n</li>\n<li><p>노트: 각 조망은 하나의 관점일 뿐 모든 것을 설명하지 못함(인지에서도 문화 요인 고려 가능).</p>\n</li>\n</ul>\n<h2>p.26 — 심리학의 세부 하위 분야 ⭐⭐⭐</h2>\n<ul>\n<li><p><strong>기초 학문</strong>: 특정 현상·기제의 <strong>원리 탐구</strong>(지식 기반 형성). <strong>응용 학문</strong>: 기초 원리를 <strong>실생활에 적용</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>영역</th>\n<th>분야</th>\n<th>연구 목적</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>기초</td>\n<td><strong>생물심리학/신경과학</strong></td>\n<td>두뇌·신경 활동과 심적 과정의 연관성</td>\n</tr>\n<tr>\n<td>기초</td>\n<td><strong>발달심리학</strong></td>\n<td>탄생~노년기까지 능력 변화</td>\n</tr>\n<tr>\n<td>기초</td>\n<td><strong>인지심리학</strong></td>\n<td>지각·사고·정보 처리에 대한 실험적 접근</td>\n</tr>\n<tr>\n<td>기초</td>\n<td><strong>성격심리학</strong></td>\n<td>지속적인 특질·성격이 행동에 미치는 영향</td>\n</tr>\n<tr>\n<td>기초</td>\n<td><strong>사회심리학</strong></td>\n<td>문화·사회 등 환경이 개인에게 미치는 영향</td>\n</tr>\n<tr>\n<td>응용</td>\n<td><strong>산업조직심리학</strong></td>\n<td>조직-구성원 간 효율성 증대(검사 도구)</td>\n</tr>\n<tr>\n<td>응용</td>\n<td><strong>상담심리학</strong></td>\n<td>학업·직업·대인관계 등 개인의 위기 대처 지원</td>\n</tr>\n<tr>\n<td>응용</td>\n<td><strong>임상심리학</strong></td>\n<td>심리·정서·행동 장애의 평가와 치료</td>\n</tr>\n<tr>\n<td>응용</td>\n<td><strong>정신의학</strong></td>\n<td>심리 치료 + <strong>약물 치료</strong> 병행</td>\n</tr>\n</tbody></table>\n</li>\n<li><p>교수 추가: <strong>소비자 심리학</strong>(마케팅·구매 유도 연구, 슬라이드에는 없음). 산업조직심리학은 직장 만족도(대인관계·직무 특성)와 적성 검사 개발.</p>\n</li>\n</ul>\n<h2>p.27 — 심리학을 통한 성장 ⭐</h2>\n<ul>\n<li>심리학은 타인뿐 아니라 <strong>자신의 이해</strong>를 위한 학문. 임상·상담에서 자신의 감정·사고의 이해도를 높여 <strong>대안적 관점</strong>을 갖게 함(교수 예시: 인지행동치료 — 사건 → 감정 → 사고 → 지지/반박 근거 → 대안적 관점).</li>\n<li>일상 적용: 숙면(기억의 응고화에 영향), 운동(우울·불안 해소), <strong>매일의 목표 + 장기 목표</strong>, 대인관계 우선.</li>\n</ul>\n<h2>p.28 — 학습과 심리학 ⭐⭐</h2>\n<ul>\n<li><strong>검증 효과(testing effect)</strong>: 단순 반복보다 예시 문제를 <strong>직접 출제해 풀어보는 것</strong>이 오래 기억에 남음 → 능동적·적극적 처리 필요.</li>\n<li><strong>분산 학습(spacing effect)</strong>: 한 번에 몰아서 하지 않고 <strong>공부 시간을 분산</strong>시킬 때 더 오래 기억.</li>\n</ul>\n<h2>🎙 실제 수업 기록 (8/25 화, 녹음본 기준)</h2>\n<ul>\n<li>0825 녹음(135분): 1회차라 강의 소개·평가 안내(성적 35/35/15/15, 대면 지필, 1/3 결석 F)에 약 10분 사용. <strong>출석은 9/1부터 호명</strong>.</li>\n<li>정의 부분(0825 17:49–20:21): &quot;마음을 과학적으로 연구하는 학문&quot;, 마음은 눈에 보이지 않고 하나의 영역으로 설명하기 어려운 개념. 강의실에 오는 과정(회상 → 지각 → 계획·결정 → 행동)이 모두 마음의 작동이라는 예시(21:00 전후).</li>\n<li>분트(0825 27:35–32:47): 라이프치히 1879 실험실 → &quot;심리학이 과학으로 측정될 수 있음을 보인 첫 사례&quot;. 반응 0.1초/0.2초, 사람의 인지 체계는 매우 빠름. 구조주의는 물 분자 비유(32:47).</li>\n<li><strong>분석적 내성법</strong>(33:48–35:30): 자유 기술이 아니라 기준과 가이드라인으로 훈련시킨 엄격한 보고법. 그럼에도 주관적이라 비판(36:20).</li>\n<li>행동주의(40:35–47:49): 구조주의·기능주의가 둘 다 &quot;내면&quot;을 다뤘다고 강하게 반발. 고전적 조건화 = 파블로프(종 = 중립 자극 → 조건 자극), 조작적 = 스키너. <strong>&quot;중요한 거는 고전적·조작적 조건화 모두 자극과 행동 반응에만 중점을 둔다&quot;</strong>(45:11). 5장 학습에서 다시 다룸. 미국 심리학계 주류, 내면 과정 30–40년 배제(51:16).</li>\n<li>정신분석(48:52): 프로이트 — 아동기의 무의식적 경험이 성인 행동에 영향, 8장 동기에서 재론. 인본주의(49:41): 로저스·매슬로우, 욕구위계(5단계, 최상위 자아실현).</li>\n<li>인지혁명(52:19–55:13): 애니악 1946, 디지털 컴퓨터 1950년대 중반 → 정보 처리 접근법 → 인지혁명 = &quot;심적 과정에 대한 초기 관심사를 되돌리고 과학적 연구 방법론을 적용하는 패러다임의 전환&quot;(55:13). 컴퓨터 메타포 대응(56:28–58:18): 입력=감각 기관, 뇌 전체=CPU, SSD=장기 기억, RAM=단기(작업) 기억.</li>\n<li>선천성-후천성(1:27:37–1:29:33): 플라톤(생득)·아리스토텔레스(학습), 데카르트(대륙 합리론)·로크(경험론). 진화심리학 = 종 전체의 생물학적 보편성, 행동유전학 = 같은 유전자라도 환경에 따른 차이. <strong>&quot;결론은 타고난 것이든 배운 것이든 둘 다 중요하다&quot;</strong>(1:28:35). 일란성 쌍둥이는 하나의 수정란에서 분할되어 유전적 특성이 완전히 동일(1:29:33).</li>\n<li>문화(1:30:32–1:34:09): 메이와쿠, 다테마에/혼네. 에크만 기본 감정(1:34:30), 눈이 감정 식별에 가장 좋은 부위(1:35:34). 색 지각: 한국어·몽골어는 색 명칭이 세분화, 중국어는 통합(1:36:40–1:38:32).</li>\n<li>분석 수준(1:41:30–1:44:27): <strong>&quot;동일한 행동이라 하더라도 어느 하나의 요인만으로는 설명하지 않는다 — 이게 가장 중요한 포인트&quot;</strong>(1:44:27). 분노 예시(1:45:36–1:48:16): 신경과학(신경회로·생체 반응) / 진화론(Fight or Flight, 공포=도주·분노=맞서기) / 정신역동(무의식적 적대감) / 인지(상황 해석) / 사회문화(표현 방식).</li>\n<li>조망과 하위 분야(1:49:15): 행동유전학·진화론이 발달·법·사회 등에도 걸쳐 있음. 하위 분야는 세분화되었지만 결국 모든 관점을 아우르는 복합적 학문(1:50:15).</li>\n<li>기초 vs 응용(1:50:50–1:57:34): 기초 = 순수 지식 탐구, 응용 = 실생활 활용. 응용 학문은 기초 학문의 원리를 가져와 활용. 소비자 심리학 추가(1:55:43).</li>\n<li>마무리(2:09:58–2:12:44): &quot;시험에는 수업 내용이 나온다&quot;, 검증 효과(테스팅 임팩트)·분산 학습(스페이싱 이펙트).</li>\n<li>시험 힌트: 서막 관련 직접 언급은 없음. 다만 0922 공지(문항 유형: 명칭 쓰기)를 볼 때 학파·조망·분야 <strong>이름</strong>을 정확히 외워야 함.</li>\n</ul>\n<h2>명칭 암기표</h2>\n<table>\n<thead>\n<tr>\n<th>명칭 (영문)</th>\n<th>한 줄 정의/단서</th>\n<th>슬라이드</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>심리학 (psychology)</td>\n<td>행동과 심적 과정의 과학, 마음의 작동을 연구</td>\n<td>6</td>\n</tr>\n<tr>\n<td>마음 (mind)</td>\n<td>인지·정서·신경활동·성격 등을 총괄하는 시스템</td>\n<td>6</td>\n</tr>\n<tr>\n<td>인지 / 정서 / 성격</td>\n<td>기억·주의 / 기쁨·슬픔 / 우울·불안(특질)</td>\n<td>6</td>\n</tr>\n<tr>\n<td>심리과학</td>\n<td>과학적 연구방법을 추구하는 심리학</td>\n<td>7</td>\n</tr>\n<tr>\n<td>빌헬름 분트 (Wilhelm Wundt)</td>\n<td>1879 최초 실험실, 구조주의</td>\n<td>8</td>\n</tr>\n<tr>\n<td>공이치기 실험</td>\n<td>소리 듣고 버튼 누르기, 0.1초 vs 0.2초</td>\n<td>8</td>\n</tr>\n<tr>\n<td>구조주의 (Structuralism)</td>\n<td>마음 = 구성 요소의 복합체, 내성법</td>\n<td>9</td>\n</tr>\n<tr>\n<td>에드워드 티치너 (Titchener)</td>\n<td>분트의 제자, 구조주의</td>\n<td>9</td>\n</tr>\n<tr>\n<td>내성법 (introspection)</td>\n<td>자신의 내면을 엄격히 보고, 신뢰도 낮음</td>\n<td>9</td>\n</tr>\n<tr>\n<td>화음 실험</td>\n<td>분트의 경험 세부 요소 구분 실험</td>\n<td>9(노트)</td>\n</tr>\n<tr>\n<td>기능주의 (Functionalism)</td>\n<td>마음의 적응적 기능, 진화론 영향</td>\n<td>10</td>\n</tr>\n<tr>\n<td>윌리엄 제임스 (William James)</td>\n<td>기능주의 대표 학자</td>\n<td>10</td>\n</tr>\n<tr>\n<td>의식 (consciousness)</td>\n<td>무언가를 자각할 수 있는 상태</td>\n<td>10</td>\n</tr>\n<tr>\n<td>행동주의 (Behaviorism)</td>\n<td>관찰 가능한 행동만 연구</td>\n<td>11</td>\n</tr>\n<tr>\n<td>존 B. 왓슨 / B.F. 스키너</td>\n<td>행동주의 학자</td>\n<td>11</td>\n</tr>\n<tr>\n<td>고전적 조건화 (classical conditioning)</td>\n<td>중립 자극 + 무조건 자극 → 조건 자극</td>\n<td>11</td>\n</tr>\n<tr>\n<td>조작적 조건화 (operant conditioning)</td>\n<td>강화/처벌로 행동 빈도 조절</td>\n<td>11</td>\n</tr>\n<tr>\n<td>중립 자극 / 무조건 자극 / 조건 자극</td>\n<td>조건화 구성 요소</td>\n<td>11</td>\n</tr>\n<tr>\n<td>정신분석 (psychoanalysis, 프로이트)</td>\n<td>아동기 무의식이 행동에 영향, 방어 기제</td>\n<td>12</td>\n</tr>\n<tr>\n<td>방어 기제 (defense mechanism)</td>\n<td>프로이트가 제시(투사·전이 등)</td>\n<td>12</td>\n</tr>\n<tr>\n<td>인본주의 심리학 (humanistic psychology)</td>\n<td>주체적·자아실현 존재</td>\n<td>12</td>\n</tr>\n<tr>\n<td>칼 로저스 / 에이브러햄 매슬로우</td>\n<td>인본주의 학자</td>\n<td>12</td>\n</tr>\n<tr>\n<td>자아실현 (self-actualization)</td>\n<td>인본주의가 본 인간의 지향</td>\n<td>12</td>\n</tr>\n<tr>\n<td>인지혁명 (cognitive revolution)</td>\n<td>1960년대 마음으로의 회귀, 패러다임 전환</td>\n<td>13</td>\n</tr>\n<tr>\n<td>정보 처리 접근 (information processing approach)</td>\n<td>컴퓨터 작동과 마음의 유사성</td>\n<td>13</td>\n</tr>\n<tr>\n<td>컴퓨터 메타포 (computer metaphor)</td>\n<td>입력 → 처리 → 산출 비유</td>\n<td>14</td>\n</tr>\n<tr>\n<td>작업 기억 / 장기 기억</td>\n<td>RAM / SSD에 대응</td>\n<td>14</td>\n</tr>\n<tr>\n<td>인지심리학 (cognitive psychology)</td>\n<td>지각·정보 처리 등 심적 과정 탐구</td>\n<td>15</td>\n</tr>\n<tr>\n<td>인지신경과학 (cognitive neuroscience)</td>\n<td>인지 + 뇌과학, EEG·fMRI·신경 조절</td>\n<td>15</td>\n</tr>\n<tr>\n<td>선천성-후천성 논제 (nature-nurture issue)</td>\n<td>타고난 것 vs 환경 학습</td>\n<td>16</td>\n</tr>\n<tr>\n<td>다윈의 진화론 / 자연 선택설</td>\n<td>종의 기원(1859)</td>\n<td>16</td>\n</tr>\n<tr>\n<td>진화심리학 (evolutionary psychology)</td>\n<td>공통 생물학적 특성의 보편성</td>\n<td>17</td>\n</tr>\n<tr>\n<td>행동유전학 (behavioral genetics)</td>\n<td>유전자·환경 차이로 인한 개인차</td>\n<td>17</td>\n</tr>\n<tr>\n<td>일란성 / 이란성 쌍둥이</td>\n<td>유전 동일 / 기준점</td>\n<td>18</td>\n</tr>\n<tr>\n<td>비교문화심리학</td>\n<td>문화별 차이와 보편성</td>\n<td>19</td>\n</tr>\n<tr>\n<td>문화 (culture)</td>\n<td>세대 간 전달되는 공유된 생각·행동</td>\n<td>19</td>\n</tr>\n<tr>\n<td>메이와쿠 문화</td>\n<td>일본, 남에게 폐를 끼치지 않음</td>\n<td>19(노트)</td>\n</tr>\n<tr>\n<td>폴 에크만의 기본 감정 (Ekman)</td>\n<td>6개 보편 감정(기쁨·슬픔·분노·공포·혐오·놀람)</td>\n<td>20</td>\n</tr>\n<tr>\n<td>문화사회심리학</td>\n<td>문화에 따른 색 지각 차이 연구 주제</td>\n<td>21</td>\n</tr>\n<tr>\n<td>생물심리사회적 접근법 (biopsychosocial approach)</td>\n<td>생물·심리·사회문화 수준 통합</td>\n<td>22</td>\n</tr>\n<tr>\n<td>생물학적 / 심리적 / 사회문화적 수준</td>\n<td>유전자·자연선택 / 내면 기제 / 외부 환경</td>\n<td>22–23</td>\n</tr>\n<tr>\n<td>이론적 조망 7가지</td>\n<td>신경과학·진화론·행동유전학·정신역동·행동주의·인지심리학·사회문화</td>\n<td>24–25</td>\n</tr>\n<tr>\n<td>Fight or Flight 반응</td>\n<td>진화론적 접근의 분노·공포 반응</td>\n<td>24</td>\n</tr>\n<tr>\n<td>기초 학문 / 응용 학문</td>\n<td>원리 탐구 / 실생활 적용</td>\n<td>26</td>\n</tr>\n<tr>\n<td>생물심리학/신경과학, 발달, 인지, 성격, 사회심리학</td>\n<td>기초 분야 5개</td>\n<td>26</td>\n</tr>\n<tr>\n<td>산업조직, 상담, 임상심리학, 정신의학</td>\n<td>응용 분야 4개</td>\n<td>26</td>\n</tr>\n<tr>\n<td>검증 효과 (testing effect)</td>\n<td>문제 만들어 풀기</td>\n<td>28</td>\n</tr>\n<tr>\n<td>분산 학습 (spacing effect)</td>\n<td>학습 시간 분산</td>\n<td>28</td>\n</tr>\n</tbody></table>\n<h2>시험 대비 핵심 요약</h2>\n<ol>\n<li>심리학 = <strong>행동과 심적 과정의 과학</strong>. 과학 심리학의 출발 = <strong>분트, 1879, 최초 실험실</strong>.</li>\n<li>학파 순서·핵심어: <strong>구조주의</strong>(분트·티치너, 구성 요소, <strong>내성법</strong>) → <strong>기능주의</strong>(제임스, 진화론, 적응적 <strong>기능</strong>) → <strong>행동주의</strong>(왓슨·스키너, 관찰 가능한 행동, 조건화) / <strong>정신분석</strong>(프로이트, 무의식) / <strong>인본주의</strong>(로저스·매슬로우, 자아실현) → <strong>인지혁명</strong>(1960s, 컴퓨터, 정보 처리).</li>\n<li>헷갈리는 쌍: 구조주의(무엇으로 되어 있나) vs 기능주의(무슨 일을 하나), 고전적(자극-자극 연합) vs 조작적(행동-결과 연합), 정신분석(무의식) vs 행동주의(자극-반응) vs 인본주의(주체성) — 인본주의는 앞의 둘을 &quot;제한적&quot;이라 비판.</li>\n<li>컴퓨터 메타포 대응: 감각 기관=입력, 뇌=CPU, 장기 기억=SSD, 작업(단기) 기억=RAM, 행동=출력.</li>\n<li>인지심리학 + 뇌과학 → <strong>인지신경과학</strong>(EEG, fMRI, 신경 조절).</li>\n<li><strong>선천성-후천성</strong>: 결론은 둘 다 중요. 진화심리학=보편성, 행동유전학=차이. 일란성 쌍둥이=유전 동일.</li>\n<li>선천성 예시 = <strong>에크만 6개 기본 감정</strong>, 후천성 예시 = <strong>몽골어/중국어 색 지각</strong>, 문화 예시 = 메이와쿠.</li>\n<li><strong>생물심리사회적 접근법</strong>의 3수준: 생물학적 / 심리적 / 사회문화적 — 하나로는 설명 불가.</li>\n<li>이론적 조망 7가지와 분노 예시를 매칭할 수 있어야 함(신경회로 / Fight or Flight / 무의식적 적대감 / 상황 해석 / 문화별 표현).</li>\n<li>기초(생물·발달·인지·성격·사회) vs 응용(산업조직·상담·임상·정신의학, 약물 병행은 정신의학).</li>\n<li>학습법: 검증 효과(문제 출제), 분산 학습.</li>\n</ol>\n","len":13520},{"id":"w2_ch1","title":"2주차 — 1장 심리과학을 비판적으로 생각하기 정리","desc":"후견 편향·과신부터 연구 방법·연구 윤리(IRB)까지, 슬라이드 29번(1장 시험 범위 끝)","ch":"ch1","min":25,"html":"<h1>1장 — 심리과학을 비판적으로 생각하기 페이지별 해설</h1>\n<p>심리학으로의 여행 (Prof. 이소영) · 마이어스 심리학 개론 13판</p>\n<p>1장의 핵심 질문은 &quot;<strong>일상의 상식과 직관은 왜 믿을 수 없고, 심리학은 어떻게 마음에 대한 검증된 결론을 얻는가</strong>&quot;이다. 전반부(p.2–15)는 상식적 사고의 함정(후견 편향, 과신, 무선적 사건에서 질서 지각)과 탈진실 세상에서 오해를 낳는 취약성 요인(가짜뉴스, 반복, 강력한 사례의 가용성, 집단 정체성)을, 후반부(p.16–29)는 과학적 연구 과정, 세 가지 연구 방법(기술적 방법 / 상관 / 실험), 연구 윤리와 IRB를 다룬다.</p>\n<blockquote>\n<p>페이지 번호 = 슬라이드 번호. <strong>시험 범위는 슬라이드 29번(IRB 연구 승인 절차)까지.</strong> p.30–34(통계적 추리: 기술통계, 추론통계, 영가설, p-value)는 <strong>시험 제외</strong>(기말에서 연구 설계 주차와 함께 출제 예정, 교수 0922 2:12:52). 슬라이드 11은 데이터 그래프, 슬라이드 10은 SNS 사용 패턴 그림으로 별도 텍스트 없음.</p>\n</blockquote>\n<h2>p.1–2 — 심리과학의 필요성과 목표 ⭐⭐</h2>\n<ul>\n<li>심리과학의 목표 = 인간의 행동과 심적 과정에 대한 <strong>과학적이고 재현 가능한 설명</strong>을 제공하고, <strong>단순한 견해를 검증된 결론과 구분</strong>하는 것.</li>\n<li>핵심 질문: 어떤 심적 과정/행동(<strong>결과</strong>)이 나타나는 데 무엇(<strong>원인</strong>)이 영향을 주는가 → <strong>인과성 탐구</strong>의 이슈.</li>\n<li>교수: 결과가 모든 사람에게 적용되는 <strong>일반화 가능성</strong>이 있어야 하고, 경험 기반 데이터(실험·설문)로 결론을 낸다. 결과 쪽에 신경과학을 접목하면 인지신경과학으로 이어짐.</li>\n</ul>\n<h2>p.3 — 현상에 대한 과학적 검증의 필요성 ⭐</h2>\n<ul>\n<li>심리학은 일상 경험을 전문용어로 포장하는 것처럼 보일 수 있다. 예: &#39;기억력이 좋은 사람이 학업 성취도가 높다&#39;, &#39;시험에 대한 부담감을 느끼면 성적이 떨어진다&#39;.</li>\n<li>일상적 사고는 잘못된 결론에 이르게 할 수 있음. 노트: <strong>초킹 현상(choking)</strong> — 압박감 때문에 수행이 떨어지는 현상.</li>\n<li>교수 예시: 암산(나머지가 0인지 여부 판단)을 시키되 한 집단에는 &quot;과정을 기록해 남길 것&quot;이라는 추가 고지를 하여 압박감을 주었더니 정답률이 더 낮았다(Beilock의 연구로 소개). 「당연해 보이는 것을 진술로만 끝내지 않고 객관화된 형태로 검증하는 것이 심리학의 주요 목표」.</li>\n</ul>\n<h2>p.4 — 우연한 관찰의 진리화 ⭐⭐</h2>\n<ul>\n<li><strong>일상 경험에 대한 &#39;반복적&#39; 관찰 = 진실</strong>이라는 공식은 성립하지 않는다. 진술의 단순한 반복은 처리하고 기억하기 쉽게 만들어 <strong>더욱 참처럼 보이게</strong> 한다(Fazio et al., 2015).</li>\n<li>교수 예시: 4주 연속 일요일 날씨가 맑았다고 &quot;일요일은 항상 날씨가 좋다&quot;고 결론 내리는 것은 타당하지 않음. 목격자 식별·사후 검증 연구에서도 진위와 무관하게 반복된 진술이 더 믿어짐.</li>\n</ul>\n<h2>p.5 — 후견 편향(Hindsight Bias) ⭐⭐⭐</h2>\n<ul>\n<li><strong>후견 편향(hindsight bias)</strong>: 실제로는 결과를 예측할 수 없었으나, <strong>결과를 알고 난 후 자신이 그 결과를 예측할 수 있었다고 믿는 경향</strong>. (&quot;그럴 줄 알았어&quot;)</li>\n<li>연령·문화와 무관하게 발생하는 <strong>보편적 현상</strong>(Roese &amp; Vohs, 2012). 예측 자체는 굉장히 어려운 일.</li>\n<li>슬라이드 예시: 2026 월드컵 한국 vs 남아공/체코/멕시코 — &quot;확신을 갖고 예측했으며 맞았다고 말할 경기가 있었는가?&quot;</li>\n<li>노트: <strong>콜럼버스의 달걀</strong> — 달걀을 세워보라 했을 때 아무도 못 했으나 콜럼버스가 한쪽을 깨뜨려 세우자 &quot;누구나 할 수 있는 일&quot;이라 말함(결과를 보고 나면 당연해 보임).</li>\n<li>교수: 경기 후 &quot;역시 이렇게 될 줄 알았어&quot;라고 한 번이라도 생각했다면 후견 편향에 잡힌 것. 결과에 영향을 주는 요인이 너무 많아 예측이 어려운데, 모든 요인을 계산하는 것은 피곤한 일이라 사람의 사고 체계는 에너지 소모를 최소화하는 쪽으로 발전했다(→ 인지적 구두쇠).</li>\n</ul>\n<h2>p.6 — 과신(Overconfidence) ⭐⭐⭐</h2>\n<ul>\n<li><strong>과신(overconfidence)</strong>: 실제로 알고 있는 것보다 <strong>더 많이 안다고 생각하는 경향</strong>. 개인의 주관적 확신도와 실제 사실 간에 괴리가 발생(<strong>테틀록</strong>, 1998, 2005).</li>\n<li>테틀록(노트): 세계적 사건에 대한 전문가 예측(약 2만 7천–2만 8천 개)을 수집 → 평균 <strong>80% 확신도</strong>를 보인 사건들의 실제 예측 정확도는 <strong>40% 이하</strong>. 전문가도 과신에서 자유롭지 않음.</li>\n<li>정확하게 예측하는 **슈퍼 예측자(superforecaster)**는 극소수(테틀록 &amp; 가드너, 2016) — 교수: 약 <strong>2%</strong>. 요인을 하나하나 검증하고 상충되는 주장을 비교하는 이상적 접근은 시간과 정신 자원이 너무 많이 듦.</li>\n<li>과신은 후견 편향에 의해서도 생성될 수 있음.</li>\n<li><strong>단어 완성하기 과제(Goranson, 1978)</strong>: 무작위 철자 5개를 재배열해 단어 만들기(정답 CHAOS). 시작 전 걸릴 시간을 예상하고 실제와 비교. 교수 해석: 예상보다 오래 걸린 사람 = 과신 경향, 예상과 비슷 = 자기 능력을 정확히 인식, 예상보다 빨랐던 사람 = 보수적 기준.</li>\n</ul>\n<h2>p.7 — 번외: 메타인지(Metacognition) ⭐⭐</h2>\n<ul>\n<li><strong>메타인지(metacognition)</strong> = <strong>&#39;인지에 대한 인지&#39;</strong>(Flavell, 1979). 나의 인지 능력과 과정, 알고 있는 것과 모르는 것에 대한 인지 능력(Efklides, 2006). 자기 객관화에 필요한 능력.</li>\n<li>메타인지의 발전 → 내면 사고에 대한 인지 확장 → <strong>후견 편향/과신 감소</strong>.</li>\n<li>교수: 교재에는 없고 논문을 찾아 추가한 내용. 메타인지가 좋으면 학습 중 중간 점검을 통해 목표를 상향 조정하거나 현실적으로 하향 조정할 수 있다.</li>\n</ul>\n<h2>p.8 — 무선적 사건에서 질서 지각하기 ⭐⭐</h2>\n<ul>\n<li>사람은 세상을 의미 있는 것으로 이해하려 하므로 <strong>무선적인 현상을 매우 불편하게 여김</strong>(Tullet et al., 2015). <strong>무선 배열을 무선적이지 않은 것으로 인식</strong>하는 경향(Falk et al., 2009).</li>\n<li>그러나 무선적 연속에서 어떤 패턴이 반복되는 것은 충분히 발생 가능(Oskarsson et al., 2009). → 그 패턴은 정말 실존하는가? <strong>착각 상관</strong>, <strong>평균으로의 회귀</strong>와 연관.</li>\n<li>노트: <strong>지각의 체제화(집단화) 원리</strong>와 연관 — 자극을 단순 무선 자극으로 보지 않고 일정한 원리로 의미를 부여(그림: 가까운 선끼리 묶어 보기 = 근접성, C 모양 세 개 사이에 삼각형 보기).</li>\n<li>교수 예시: 동전 던지기에서 앞면이 6–7번 연속 나오면 &quot;이제 뒷면이 나올 차례&quot;라고 생각하지만 매 시행은 독립. 첫 수업 날짜가 교수의 졸업일(8/25)과 우연히 같은 것에 의미를 부여한 것도 예.</li>\n</ul>\n<h2>p.9 — 탈진실 세상에서의 심리과학: 예시 ⭐⭐</h2>\n<ul>\n<li><strong>탈진실(post-truth)</strong>: 2017년 <strong>옥스퍼드 영어 사전 올해의 단어</strong>. 정서와 개인의 신념이 객관적 사실에 대한 인정을 압도하는 현상/문화(노트).</li>\n<li><strong>범죄율에 대한 믿음</strong>: 갤럽 조사에서 10명 중 7명이 작년보다 범죄가 증가했다고 응답(Swift, 2016). 실제로는 재산·폭력 범죄가 꾸준히 감소(2015년 범죄율은 1990년의 절반, Statista, 2017).</li>\n<li><strong>이민자에 대한 편견</strong>: 많은 이들이 이민자가 범죄자라고 믿음(McCarthy, 2017). 실제로는 <strong>그 나라 사람보다 투옥될 가능성이 44% 낮음</strong>(Flagg, 2018, 2019).</li>\n</ul>\n<h2>p.10–11 — 정당 편향성과 국내 범죄율 ⭐</h2>\n<ul>\n<li><strong>정당 편향성에 의한 사고의 왜곡</strong>: 당파적 편향성은 정치 성향과 무관하게 발생(Ditto et al., 2019). 당파에 따라 실제 사실과 정반대의 인식(Gelman, 2009). 미국 정당별 지지자들의 SNS 사용 패턴에서 같은 정당 지지자끼리만 강하게 묶임(William et al., 2017) → 진영 논리, 확증 편향 가능성.</li>\n<li>p.11: 대한민국 최근 11년(2013–2024)간 형법범죄율(인구 10만 명당 건수) — <strong>큰 변동 없음</strong>(교수). 사실은 검색으로 30초 만에 찾을 수 있으나 사람들은 직접 확인하지 않아 인식과 데이터의 차이가 생긴다.</li>\n</ul>\n<h2>p.12 — 취약성 요인 ①: 거짓뉴스(가짜뉴스) ⭐⭐</h2>\n<ul>\n<li>탈진실 세상에서 개인의 취약성을 형성하는 요인(교수: 크게 <strong>네 가지</strong>)의 첫째. 2016년 미국 선거 기간 트위터의 <strong>6%가 거짓 뉴스</strong>(Grinberg et al., 2019).</li>\n<li>126,000개의 트위터 분석 결과 정치 관련 거짓 뉴스는 진실보다 <strong>더 멀리, 빠르게, 심층적으로 확산</strong>(Vosoughi et al., 2018). <strong>&#39;진실은 기어가지만, 거짓은 날아간다&#39;.</strong></li>\n<li>노트: 그러나 사람들은 정보 출처의 질을 구별할 능력이 어느 정도 있음(Pennycook &amp; Rand, 2019).</li>\n</ul>\n<h2>p.13 — 취약성 요인 ②: 반복 ⭐⭐</h2>\n<ul>\n<li>진술은 <strong>반복될수록 진실에 대한 확신도가 높아짐</strong>(De keersmaecker et al., 2019). 남에 대한 비방을 계속 들으면 진실로 받아들임(Fazio et al., 2019). <strong>&#39;삼인성호(三人成虎)&#39;</strong> — 세 사람이 말하면 없는 호랑이도 생김.</li>\n<li>노트: <strong>사회적 동조 실험</strong> — 교수 예시: 안드로이드 폰을 보여주며 앞 사람들이 모두 &q
